welcome_title=Konfiguracja DBeaver
welcome_description=Przejrzyj i dostosuj najważniejsze ustawienia programu
welcome_body_text=Ten kreator przeprowadzi Cię przez funkcje opcjonalne, wygląd, zbieranie danych i wskazówki.\n\nWprowadzone zmiany zostaną zastosowane dopiero po zakończeniu kreatora.
welcome_body_hint=Kreator można w każdej chwili otworzyć ponownie z menu Pomoc → Konfiguracja produktu.\nNiektóre zmiany wyglądu zaczną obowiązywać dopiero po ponownym uruchomieniu DBeaver. Jeśli będzie to wymagane, pojawi się odpowiedni komunikat.

appearance_title=Wygląd
appearance_description=Dostosuj wygląd DBeaver i sposób prezentowania obiektów bazy danych do swojego stylu pracy
appearance_theme_header=Wybierz motyw:
appearance_navigator_header=Wybierz preferowany widok struktury bazy danych w nawigatorze:
appearance_navigator_simple=Uproszczony
appearance_navigator_simple_hint=Pokazuje tylko schematy i tabele, pomijając dodatkowe foldery, ograniczenia i inne metadane bazy danych.\nTen tryb najlepiej sprawdza się dla analityków danych i wszystkich, którzy nie potrzebują szczegółów fizycznej struktury bazy danych.
appearance_navigator_advanced=Pełny
appearance_navigator_advanced_hint=Pokazuje pełną strukturę bazy danych, w tym wszystkie obiekty związane z jej fizyczną strukturą.\nNajlepiej sprawdza się dla administratorów baz danych i programistów.
appearance_navigator_custom=Własny
appearance_navigator_custom_hint=Widok własny. Możesz określić, które obiekty mają być widoczne, a które nie.
appearance_navigator_custom_configure=<a>Dostosuj...</a>
appearance_navigator_hint=<a href="{0}">Dowiedz się więcej o różnicach</a>

features_title=Funkcje
features_description=Wybierz narzędzia opcjonalne, które wspierają Twoją pracę
features_list_header=DBeaver zawiera funkcje opcjonalne do różnych zadań. Włącz te, których chcesz używać:
features_hint=Funkcje można później włączyć lub wyłączyć w menu Pomoc → Konfiguracja produktu.

final_steps_title=Ostatnie kroki
final_steps_description=Dopracuj kilka pozostałych ustawień
final_steps_header=Wszystko gotowe! Kliknij „Zastosuj”, aby zacząć korzystać z DBeaver.

confirm_exit_title=Zakończ konfigurację produktu
confirm_exit_message=Aby korzystać z {0}, musisz dokończyć konfigurację produktu.\n\nCzy na pewno chcesz zakończyć?
wizard_title = Konfiguracja produktu
wizard_apply = Zastosuj
preferences_features_hint = Wyłączenie funkcji ukrywa powiązane z nimi działania i strony preferencji. Zmiany zaczną obowiązywać po ponownym uruchomieniu DBeaver.
preferences_open_product_configuration = Otwórz konfigurację produktu...
preferences_restart_title = Uruchom ponownie {0}
preferences_restart_message = Aby zastosować niektóre zmiany, musisz ponownie uruchomić {0}.\nCzy chcesz uruchomić ponownie teraz?
features_update_title = Dostępne są nowe funkcje
features_update_description = Konfiguracja produktu została otwarta, ponieważ dostępne są nowe funkcje opcjonalne.
