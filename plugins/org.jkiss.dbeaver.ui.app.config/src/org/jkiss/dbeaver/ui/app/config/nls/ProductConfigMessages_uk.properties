welcome_title = Налаштування DBeaver
welcome_description = Перегляньте та змініть основні налаштування продукту
welcome_body_text = Цей майстер допоможе налаштувати додаткові функції, зовнішній вигляд, збирання даних і поради.\n\nЗміни буде застосовано лише після завершення роботи майстра.
welcome_body_hint = Цей майстер можна знову відкрити будь-коли через меню Довідка → Конфігурація продукту.\nДеякі зміни зовнішнього вигляду набувають чинності лише після перезапуску DBeaver. За потреби з’явиться відповідний запит.
appearance_title = Зовнішній вигляд
appearance_description = Налаштуйте вигляд DBeaver і відображення об’єктів баз даних відповідно до свого стилю роботи
appearance_theme_header = Виберіть тему:
appearance_navigator_header = Виберіть бажаний вигляд структури бази даних у навігаторі:
appearance_navigator_simple = Спрощений
appearance_navigator_simple_hint = Показує лише схеми та таблиці, приховуючи додаткові папки, обмеження й інші метадані бази даних.\nЦей режим найкраще підходить аналітикам даних і всім, кому не потрібні подробиці фізичної структури бази даних.
appearance_navigator_advanced = Повний
appearance_navigator_advanced_hint = Показує повну структуру бази даних. Містить усі об’єкти, пов’язані з її фізичною структурою.\nНайкраще підходить адміністраторам баз даних і програмістам.
appearance_navigator_custom = Власний
appearance_navigator_custom_hint = Власний вигляд. Можна вказати, які об’єкти показувати, а які приховувати.
appearance_navigator_custom_configure = <a>Налаштувати...</a>
