welcome_title = Configura DBeaver
welcome_description = Rivedi e modifica le impostazioni principali del prodotto
welcome_body_text = Questa procedura guidata illustra le funzionalità facoltative, l'aspetto, la raccolta dati e i suggerimenti.\n\nLe modifiche vengono applicate solo dopo il completamento della procedura guidata.
welcome_body_hint = È possibile riaprire questa procedura guidata in qualsiasi momento da Aiuto → Configurazione del prodotto.\nAlcune modifiche all'aspetto hanno effetto solo dopo il riavvio di DBeaver. Verrà richiesto di riavviare se necessario.
appearance_title = Aspetto
appearance_description = Personalizza l'aspetto di DBeaver e la presentazione degli oggetti del database in base al tuo modo di lavorare
appearance_theme_header = Scegli il tema da usare:
appearance_navigator_header = Scegli la vista preferita della struttura del database nel navigatore:
appearance_navigator_simple = Semplificata
appearance_navigator_simple_hint = Mostra solo schemi e tabelle, ignorando cartelle aggiuntive, vincoli e altri metadati del database.\nQuesta modalità è adatta agli analisti di dati e a chi non necessita di molti dettagli sulla struttura fisica del database.
appearance_navigator_advanced = Completa
appearance_navigator_advanced_hint = Mostra la struttura completa del database. Include tutti gli oggetti relativi alla struttura fisica del database.\nÈ particolarmente adatta agli amministratori di database o ai programmatori.
appearance_navigator_custom = Personalizzata
appearance_navigator_custom_hint = Vista personalizzata. È possibile specificare quali oggetti visualizzare e quali nascondere.
appearance_navigator_custom_configure = <a>Personalizza...</a>
appearance_navigator_hint = <a href="{0}">Scopri di più sulle differenze</a>
features_title = Funzionalità
features_description = Scegli gli strumenti facoltativi utili al tuo flusso di lavoro
features_list_header = DBeaver include funzionalità facoltative per attività diverse. Abilita quelle che desideri usare:
features_hint = Le funzionalità possono essere abilitate o disabilitate in seguito da Aiuto → Configurazione del prodotto.
features_update_title = Nuove funzionalità disponibili
features_update_description = La configurazione del prodotto è stata aperta perché sono disponibili nuove funzionalità facoltative.
features_update_header = Rivedi le funzionalità contrassegnate come Nuova e scegli quali abilitare. Fai clic su Applica per salvare le scelte.
features_new_label = {0} (Nuova)
final_steps_title = Passaggi finali
