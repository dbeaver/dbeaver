appearance_navigator_header = Wählen Sie die bevorzugte Ansicht der Datenbankstruktur im Navigator aus:
appearance_navigator_simple = Vereinfacht
appearance_navigator_simple_hint = Zeigt nur Schemata und Tabellen an und blendet zusätzliche Ordner, Constraints und andere Datenbankmetadaten aus.\nDieser Modus eignet sich besonders für Datenanalysten und alle, die wenige Details zur physischen Datenbankstruktur benötigen.
appearance_navigator_advanced = Vollständig
appearance_navigator_advanced_hint = Zeigt die vollständige Datenbankstruktur einschließlich aller Objekte der physischen Datenbankstruktur an.\nBesonders geeignet für Datenbankadministratoren und Programmierer.
