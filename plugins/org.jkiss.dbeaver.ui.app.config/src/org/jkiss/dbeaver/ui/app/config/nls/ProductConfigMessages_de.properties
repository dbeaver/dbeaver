welcome_body_text = Dieser Assistent führt Sie durch optionale Funktionen, Erscheinungsbild, Datenerfassung und Tipps.\n\nIhre Änderungen werden erst angewendet, wenn Sie den Assistenten abschließen.
welcome_body_hint = Sie können diesen Assistenten jederzeit über Hilfe → Produktkonfiguration erneut öffnen.\nEinige Änderungen am Erscheinungsbild werden erst nach einem Neustart von DBeaver wirksam. Sie werden darauf hingewiesen, falls ein Neustart erforderlich ist.
