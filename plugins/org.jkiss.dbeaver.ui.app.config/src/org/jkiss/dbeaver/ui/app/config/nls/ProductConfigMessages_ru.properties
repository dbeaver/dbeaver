welcome_body_text=Этот мастер поможет настроить дополнительные функции, внешний вид, сбор данных и советы.\n\nИзменения применяются только после завершения работы мастера.
welcome_body_hint=Этот мастер можно открыть в любое время через Справка → Конфигурация продукта.\nНекоторые изменения внешнего вида вступают в силу только после перезапуска DBeaver. При необходимости перезапуска появится запрос.
