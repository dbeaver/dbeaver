welcome_title = Configurar DBeaver
welcome_description = Revise y ajuste la configuración principal del producto
welcome_body_text = Este asistente le guiará por las funciones opcionales, la apariencia, la recopilación de datos y los consejos.\n\nLos cambios que realice solo se aplicarán cuando complete el asistente.
welcome_body_hint = Puede volver a abrir este asistente en cualquier momento desde Ayuda → Configuración del producto.\nAlgunos cambios de apariencia solo surtirán efecto tras reiniciar DBeaver. Se le avisará si es necesario reiniciar.
appearance_title = Apariencia
appearance_description = Personalice la apariencia de DBeaver y la presentación de los objetos de base de datos para adaptarlas a su forma de trabajar
appearance_theme_header = Elija el tema que desea utilizar:
appearance_navigator_header = Elija la vista de estructura de base de datos que prefiera en el navegador:
appearance_navigator_simple = Simplificada
appearance_navigator_simple_hint = Muestra solo los esquemas y las tablas, omitiendo carpetas adicionales, restricciones y otros metadatos de la base de datos.\nEste modo es ideal para analistas de datos y para quienes no necesitan muchos detalles de la estructura física de la base de datos.
appearance_navigator_advanced = Completa
appearance_navigator_advanced_hint = Muestra la estructura completa de la base de datos. Incluye todos los objetos relacionados con su estructura física.\nEs ideal para administradores de bases de datos y programadores.
appearance_navigator_custom = Personalizada
appearance_navigator_custom_hint = Vista personalizada. Puede especificar qué objetos desea ver y cuáles no.
