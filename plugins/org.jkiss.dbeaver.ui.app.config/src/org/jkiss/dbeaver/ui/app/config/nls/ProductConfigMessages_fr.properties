welcome_title=Configurer DBeaver
welcome_description=Vérifiez et ajustez les principaux paramètres du produit
welcome_body_text=Cet assistant vous guide dans le choix des fonctionnalités facultatives, de l'apparence, de la collecte de données et des astuces.\n\nLes modifications ne sont appliquées qu'une fois l'assistant terminé.
welcome_body_hint=Vous pouvez rouvrir cet assistant à tout moment depuis Aide → Configuration du produit.\nCertaines modifications d'apparence ne prennent effet qu'après le redémarrage de DBeaver. Vous serez averti si un redémarrage est nécessaire.
appearance_title=Apparence
appearance_description=Personnalisez l'apparence de DBeaver et la présentation des objets de base de données selon votre façon de travailler
appearance_theme_header=Choisissez le thème à utiliser :
appearance_navigator_header=Choisissez la vue de la structure des bases de données dans le navigateur :
appearance_navigator_simple=Simplifiée
appearance_navigator_simple_hint=Affiche uniquement les schémas et les tables, sans les dossiers supplémentaires, les contraintes et les autres métadonnées.\nCe mode convient aux analystes de données et aux personnes qui n'ont pas besoin de nombreux détails sur la structure physique des bases de données.
appearance_navigator_advanced=Complète
appearance_navigator_advanced_hint=Affiche la structure complète de la base de données, avec tous les objets liés à sa structure physique.\nCe mode convient aux administrateurs de bases de données et aux développeurs.
appearance_navigator_custom=Personnalisée
appearance_navigator_custom_hint=Vue personnalisée. Vous pouvez choisir les objets à afficher ou à masquer.
