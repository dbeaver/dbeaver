welcome_title=Configure DBeaver
welcome_description=Review and adjust key product settings
welcome_body_text=This wizard guides you through optional features, appearance, data collection, and tips.\n\nChanges you make are applied only after you complete the wizard.
welcome_body_hint=You can reopen this wizard at any time from Help → Product Configuration.\nSome appearance changes take effect only after restarting DBeaver. You’ll be prompted if a restart is required.

appearance_title=Appearance
appearance_description=Personalize how DBeaver looks and presents database objects to suit the way you work
appearance_theme_header=Choose which theme you want to use:
appearance_navigator_header=Choose preferred database structure view in navigator:
appearance_navigator_simple=Simplified
appearance_navigator_simple_hint=Shows only schemas and tables skipping extra folders, constraints and other database metadata.\nThis mode best fits for data analysts and everyone who don't need too many details about database physical structure.
appearance_navigator_advanced=Full
appearance_navigator_advanced_hint=Shows full database structure. Includes all objects related to physical database structure.\nFits best for database administrators or programmers.
appearance_navigator_custom=Custom
appearance_navigator_custom_hint=Custom view. You can specify what objects you want to view and which not.
appearance_navigator_custom_configure=<a>Customize...</a>
appearance_navigator_hint=<a href="http://dbeaver.com/docs/dbeaver/Simple-and-Advanced-View?utm_source=app&utm_medium=product-config&utm_campaign=docs">Learn more about the differences</a>

features_title=Features
features_description=Choose optional tools that support your workflow
features_list_header=DBeaver includes optional features for different tasks. Enable the ones you want to use:
features_hint=Features can be enabled or disabled later under Help → Product Configuration.

final_steps_title=Final steps
final_steps_description=Fine-tune a few remaining preferences
final_steps_header=You're all set! Click Apply to start using DBeaver.

confirm_exit_title=Exit Product Configuration
confirm_exit_message=You must complete the product configuration to use {0}.\n\nAre you sure you want to exit?
