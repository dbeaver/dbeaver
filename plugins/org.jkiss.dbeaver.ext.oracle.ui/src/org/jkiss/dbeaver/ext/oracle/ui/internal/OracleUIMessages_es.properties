connection_extra_page_checkbox_show_only_one_schema = Mostrar solo el esquema del usuario conectado
connection_extra_page_checkbox_show_only_one_schema_tip = Mostrar solo el esquema del usuario conectado en el navegador de bases de datos
edit_create_checkbox_hide_empty_schemas = Ocultar esquemas vacíos
edit_create_checkbox_hide_empty_schemas_tool_tip_text = Comprueba si existen objetos en los esquemas y no muestra los vacíos en el árbol.\nEstá activado de forma predeterminada, pero puede causar problemas de rendimiento en bases de datos con muchos objetos.
edit_create_checkbox_content_group_show = Mostrar siempre objetos de DBA
edit_create_checkbox_content_group_show_description = Muestra siempre en el árbol los objetos de metadatos relacionados con DBA, aunque el usuario no tenga el rol DBA.
edit_create_checkbox_content_group_use = Usar siempre vistas DBA_*
edit_create_checkbox_content_group_use_description = Usar vistas DBA_* en lugar de ALL_* siempre que sea posible
edit_create_checkbox_content_group_use_sys_schema = Usar el prefijo de esquema SYS
edit_create_checkbox_content_group_use_sys_schema_description = Usar el prefijo de esquema SYS en todas las consultas de metadatos. En caso contrario, se utilizan nombres de vistas sin esquema explícito.
edit_create_checkbox_content_group_use_simple_constraints = Consulta simple para leer restricciones
edit_create_checkbox_content_group_use_simple_constraints_description = Usar consultas de metadatos simples. Pueden ser más lentas, pero son más estables en todas las versiones de Oracle.
edit_create_checkbox_content_group_use_another_table_query = Usar UNION para leer metadatos de tablas
edit_create_checkbox_content_group_use_another_table_query_description = Usar la consulta heredada de metadatos de tablas, con UNION en lugar de JOIN. En algunos casos acelera la lectura de los datos de las tablas.
edit_create_checkbox_content_group_read_column_comments = Leer comentarios de columnas en los metadatos de consultas
edit_create_checkbox_content_group_read_column_comments_description = Cargar los comentarios de columnas de Oracle junto con los metadatos de las tablas para mostrarlos en la información emergente de las columnas de resultados. Puede ralentizar la lectura de metadatos.
edit_create_checkbox_content_group_search_metadata_in_synonyms = Buscar metadatos en sinónimos
edit_create_checkbox_content_group_search_metadata_in_synonyms_tooltip = Buscar metadatos también en los sinónimos. Puede ralentizar considerablemente la búsqueda de metadatos y el autocompletado.
edit_create_checkbox_content_group_search_metadata_in_sequences = Buscar metadatos en secuencias
edit_create_checkbox_content_group_search_metadata_in_sequences_tooltip = Buscar metadatos también en las secuencias. Puede ralentizar considerablemente la búsqueda de metadatos y el autocompletado.
dialog_controlgroup_performance = Rendimiento
edit_create_checkbox_group_use_rule = Usar la indicación RULE en consultas al catálogo del sistema
edit_create_checkbox_adds_rule_tool_tip_text = Añade la indicación RULE a algunas consultas al catálogo del sistema (como la lectura de columnas y restricciones).\nAumenta considerablemente el rendimiento en algunas bases de datos Oracle (y lo reduce en otras).
edit_create_checkbox_group_use_metadata_optimizer = Usar el optimizador de consultas de metadatos
edit_create_checkbox_group_use_metadata_optimizer_tip = Usar el optimizador de consultas de metadatos. Puede mejorar considerablemente el rendimiento de lectura de metadatos en algunos sistemas.
pref_page_oracle_checkbox_disable_escape_processing = Desactivar procesamiento de escapes en scripts SQL
pref_page_oracle_checkbox_enable_dbms_output = Activar salida de DBMS
pref_page_oracle_checkbox_use_rowid_to_identify_rows = Usar ROWID para identificar filas
pref_page_oracle_checkbox_read_all_synonyms = Leer todos los sinónimos
pref_page_oracle_label_by_default_plan_table = Se usará de forma predeterminada la tabla de planes del esquema actual o de SYS.\nAquí puede especificar el nombre completo de otra tabla de planes.
pref_page_oracle_label_disable_client_side_parser = Desactivar el analizador del cliente para las instrucciones del controlador entre llaves { }\u0020
pref_page_oracle_label_if_unchecked_java_classes = Si se desmarca, se omitirán las clases Java y los cuerpos de paquetes
