edit_create_checkbox_adds_rule_tool_tip_text = Adiciona a dica RULE em algumas consultas ao catálogo do sistema (como a leitura de colunas e restrições).\nAumenta significativamente o desempenho em alguns bancos de dados Oracle (e diminui em outros).

