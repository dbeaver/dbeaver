edit_create_checkbox_content_group_use_sys_schema_description = Usa prefixo de esquema SYS em todas as consultas de metadados. Caso contrário, usa nomes de view sem esquema explícito.

edit_create_checkbox_group_use_metadata_optimizer = Usar otimizador de consulta de metadados

edit_create_checkbox_group_use_metadata_optimizer_tip = Usa o otimizador de consultas de metadados. Pode melhorar significativamente o desempenho da leitura de metadados em alguns sistemas.

edit_create_checkbox_group_use_rule = Usar dica RULE para consultas no catálogo do sistema

