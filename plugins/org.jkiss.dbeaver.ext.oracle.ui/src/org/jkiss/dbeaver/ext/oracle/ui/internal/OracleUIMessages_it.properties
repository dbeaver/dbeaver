connection_extra_page_checkbox_show_only_one_schema = Mostra solo lo schema dell'utente connesso
connection_extra_page_checkbox_show_only_one_schema_tip = Mostra solo lo schema dell'utente connesso nel navigatore database
edit_create_checkbox_hide_empty_schemas = Nascondi schemi vuoti
edit_create_checkbox_hide_empty_schemas_tool_tip_text = Verifica la presenza di oggetti negli schemi e non mostra quelli vuoti nell'albero.\nAbilitato per impostazione predefinita, ma può causare problemi di prestazioni nei database con un numero molto elevato di oggetti.
edit_create_checkbox_content_group_show = Mostra sempre oggetti DBA
edit_create_checkbox_content_group_show_description = Mostra sempre nell'albero gli oggetti dei metadati relativi al DBA, anche se l'utente non ha il ruolo DBA.
edit_create_checkbox_content_group_use = Usa sempre viste DBA_*
edit_create_checkbox_content_group_use_description = Usa le viste DBA_* anziché ALL_* dove possibile
edit_create_checkbox_content_group_use_sys_schema = Usa prefisso dello schema SYS
edit_create_checkbox_content_group_use_sys_schema_description = Usa il prefisso dello schema SYS in tutte le query dei metadati. Altrimenti usa i nomi delle viste senza schema esplicito.
edit_create_checkbox_content_group_use_simple_constraints = Query semplice per la lettura dei vincoli
edit_create_checkbox_content_group_use_simple_constraints_description = Usa query semplici per i metadati. Possono essere più lente, ma sono più stabili con tutte le versioni di Oracle.
edit_create_checkbox_content_group_use_another_table_query = Usa UNION per leggere i metadati delle tabelle
edit_create_checkbox_content_group_use_another_table_query_description = Usa la query precedente per i metadati delle tabelle, con UNION anziché JOIN. In alcuni casi accelera la lettura dei dati delle tabelle.
edit_create_checkbox_content_group_read_column_comments = Leggi commenti delle colonne nei metadati delle query
edit_create_checkbox_content_group_read_column_comments_description = Carica i commenti delle colonne Oracle insieme ai metadati delle tabelle, per mostrarli nei suggerimenti delle colonne dei risultati. Può rallentare la lettura dei metadati.
edit_create_checkbox_content_group_search_metadata_in_synonyms = Cerca metadati nei sinonimi
edit_create_checkbox_content_group_search_metadata_in_synonyms_tooltip = Cerca i metadati anche nei sinonimi. Può rallentare notevolmente la ricerca dei metadati e il completamento automatico.
edit_create_checkbox_content_group_search_metadata_in_sequences = Cerca metadati nelle sequenze
edit_create_checkbox_content_group_search_metadata_in_sequences_tooltip = Cerca i metadati anche nelle sequenze. Può rallentare notevolmente la ricerca dei metadati e il completamento automatico.
dialog_controlgroup_performance = Prestazioni
edit_create_checkbox_group_use_rule = Usa suggerimento RULE per le query del catalogo di sistema
edit_create_checkbox_adds_rule_tool_tip_text = Aggiunge il suggerimento RULE ad alcune query del catalogo di sistema (come la lettura di colonne e vincoli).\nAumenta notevolmente le prestazioni in alcuni database Oracle e le riduce in altri.
edit_create_checkbox_group_use_metadata_optimizer = Usa ottimizzatore delle query dei metadati
edit_create_checkbox_group_use_metadata_optimizer_tip = Usa l'ottimizzatore delle query dei metadati. Può migliorare notevolmente le prestazioni di lettura dei metadati in alcuni sistemi.
pref_page_oracle_checkbox_disable_escape_processing = Disabilita elaborazione degli escape negli script SQL
pref_page_oracle_checkbox_enable_dbms_output = Abilita output DBMS
pref_page_oracle_checkbox_use_rowid_to_identify_rows = Usa ROWID per identificare le righe
pref_page_oracle_checkbox_read_all_synonyms = Leggi tutti i sinonimi
pref_page_oracle_label_by_default_plan_table = Per impostazione predefinita viene usata la tabella dei piani nello schema corrente o in SYS.\nQui è possibile specificare il nome completo di una tabella dei piani diversa.
pref_page_oracle_label_disable_client_side_parser = Disabilita analizzatore lato client delle istruzioni del driver tra parentesi { }\u0020
pref_page_oracle_label_if_unchecked_java_classes = Se non selezionato, le classi Java e i corpi dei pacchetti verranno ignorati
pref_page_oracle_label_plan_table = Tabella dei piani
pref_page_oracle_legend_execution_plan = Piano di esecuzione
pref_page_oracle_legend_misc = Varie
pref_page_oracle_legend_performance = Prestazioni
pref_page_oracle_group_data = Dati
pref_page_oracle_checkbox_show_date_as_date = Mostra valori DATE come DATE
pref_page_oracle_checkbox_show_date_as_date_tip = Mostra i valori del tipo di dati DATE come DATE anziché TIMESTAMP.\nQuesta impostazione non funziona se la formattazione di data e ora è disabilitata.
dialog_schema_edit_title = Imposta proprietà dello schema/utente
dialog_schema_edit_user_name = Nome dello schema/utente
dialog_schema_edit_user_password = Password dell'utente
dialog_schema_edit_label = Creare uno schema equivale a creare un utente.\nOccorre specificare una password.
