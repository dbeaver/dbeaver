edit_create_checkbox_hide_empty_schemas = Leere Schemas ausblenden
edit_create_checkbox_hide_empty_schemas_tool_tip_text = Überprüfen Sie das Vorhandensein von Objekten im Schema und zeigen Sie keine leeren Schemas im Baum an.\nStandardmäßig aktiviert, kann jedoch Leistungsprobleme bei Datenbanken mit sehr vielen Objekten verursachen.
edit_create_checkbox_content_group_show = Zeigen Sie immer DBA-Objekte an
edit_create_checkbox_content_group_show_description = Zeigt immer DBA-bezogene Metadatenobjekte im Baum an, auch wenn der Benutzer keine DBA-Rolle hat.
edit_create_checkbox_content_group_use = Verwenden Sie immer DBA_ * Ansichten
edit_create_checkbox_content_group_use_description = Verwenden Sie DBA_ * -Ansichten anstelle von ALL_ * -Ansichten, wo immer dies möglich ist
edit_create_checkbox_content_group_use_sys_schema = Verwenden Sie das SYS-Schema-Präfix
edit_create_checkbox_content_group_use_sys_schema_description = Verwenden Sie das SYS-Schema-Präfix in allen Metadatenabfragen. Verwenden Sie andernfalls Ansichtsnamen ohne explizites Schema.
edit_create_checkbox_content_group_use_simple_constraints = Einfache Abfrage zum Lesen von Einschränkungen
edit_create_checkbox_content_group_use_simple_constraints_description = Verwenden Sie einfache Metadatenabfragen. Funktioniert möglicherweise langsamer, ist jedoch für alle Oracle-Versionen stabiler.
edit_create_checkbox_content_group_use_another_table_query = Verwenden Sie UNION zum Lesen von Tabellenmetadaten
edit_create_checkbox_content_group_use_another_table_query_description = Verwenden Sie die Metadatenabfrage für Legacy-Tabellen. Mit UNION stattdessen beitreten. In einigen Fällen hilft es, das Lesen von Tabellendaten zu beschleunigen.

