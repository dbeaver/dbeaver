pref_page_oracle_checkbox_show_date_as_date = Pokazuj wartości DATE jako DATE
pref_page_oracle_checkbox_show_date_as_date_tip = Pokazuj wartości typu DATE jako DATE, a nie jako TIMESTAMP.\nTo ustawienie nie działa przy wyłączonym formatowaniu daty i czasu.
