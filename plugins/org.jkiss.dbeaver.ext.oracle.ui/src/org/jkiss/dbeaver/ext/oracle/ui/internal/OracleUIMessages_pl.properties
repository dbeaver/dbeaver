connection_extra_page_checkbox_show_only_one_schema = Pokaż tylko schemat połączonego użytkownika
connection_extra_page_checkbox_show_only_one_schema_tip = Pokazuj w Nawigatorze baz danych tylko schemat połączonego użytkownika
edit_create_checkbox_hide_empty_schemas = Ukryj puste schematy
edit_create_checkbox_hide_empty_schemas_tool_tip_text = Sprawdzaj, czy schemat zawiera obiekty, i nie pokazuj pustych schematów w drzewie.\nDomyślnie włączone, ale może powodować problemy z wydajnością w bazach z bardzo dużą liczbą obiektów.
edit_create_checkbox_content_group_show = Zawsze pokazuj obiekty DBA
edit_create_checkbox_content_group_show_description = Zawsze pokazuje w drzewie obiekty metadanych związane z DBA, nawet jeśli użytkownik nie ma roli DBA.
edit_create_checkbox_content_group_use = Zawsze używaj widoków DBA_*
edit_create_checkbox_content_group_use_description = Używaj widoków DBA_* zamiast ALL_* wszędzie, gdzie to możliwe
edit_create_checkbox_content_group_use_sys_schema = Używaj prefiksu schematu SYS
edit_create_checkbox_content_group_use_sys_schema_description = Używaj prefiksu schematu SYS we wszystkich zapytaniach o metadane. W przeciwnym razie używane są nazwy widoków bez jawnego schematu.
edit_create_checkbox_content_group_use_simple_constraints = Proste zapytanie odczytu ograniczeń
edit_create_checkbox_content_group_use_simple_constraints_description = Używaj prostych zapytań o metadane. Mogą działać wolniej, ale są stabilniejsze we wszystkich wersjach Oracle.
edit_create_checkbox_content_group_use_another_table_query = Używaj UNION do odczytu metadanych tabel
edit_create_checkbox_content_group_use_another_table_query_description = Używaj starszego zapytania o metadane tabel, z UNION zamiast JOIN. W niektórych przypadkach przyspiesza to odczyt danych tabel.
edit_create_checkbox_content_group_read_column_comments = Odczytuj komentarze kolumn w metadanych zapytania
edit_create_checkbox_content_group_read_column_comments_description = Wczytuj komentarze kolumn Oracle razem z metadanymi tabel, aby pokazywać je w podpowiedziach kolumn wyników. Może spowolnić odczyt metadanych.
edit_create_checkbox_content_group_search_metadata_in_synonyms = Szukaj metadanych w synonimach
edit_create_checkbox_content_group_search_metadata_in_synonyms_tooltip = Szukaj metadanych również w synonimach. Może znacznie spowolnić wyszukiwanie metadanych i autouzupełnianie.
edit_create_checkbox_content_group_search_metadata_in_sequences = Szukaj metadanych w sekwencjach
edit_create_checkbox_content_group_search_metadata_in_sequences_tooltip = Szukaj metadanych również w sekwencjach. Może znacznie spowolnić wyszukiwanie metadanych i autouzupełnianie.
dialog_controlgroup_performance = Wydajność
edit_create_checkbox_group_use_rule = Używaj wskazówki RULE w zapytaniach katalogu systemowego
edit_create_checkbox_adds_rule_tool_tip_text = Dodaje wskazówkę RULE do niektórych zapytań katalogu systemowego (np. odczytu kolumn i ograniczeń).\nW niektórych bazach Oracle znacznie zwiększa wydajność (a w innych ją obniża).
edit_create_checkbox_group_use_metadata_optimizer = Używaj optymalizatora zapytań o metadane
edit_create_checkbox_group_use_metadata_optimizer_tip = Używaj optymalizatora zapytań o metadane. W niektórych systemach może znacznie przyspieszyć odczyt metadanych.
pref_page_oracle_checkbox_disable_escape_processing = Wyłącz przetwarzanie sekwencji ucieczki w skryptach SQL
pref_page_oracle_checkbox_enable_dbms_output = Włącz wyjście DBMS
pref_page_oracle_checkbox_use_rowid_to_identify_rows = Używaj ROWID do identyfikacji wierszy
pref_page_oracle_checkbox_read_all_synonyms = Odczytuj wszystkie synonimy
pref_page_oracle_label_by_default_plan_table = Domyślnie używana jest tabela planów w bieżącym schemacie lub w schemacie SYS.\nMożesz tu podać pełną nazwę konkretnej tabeli planów.
pref_page_oracle_label_disable_client_side_parser = Wyłącz po stronie klienta analizę instrukcji sterownika w nawiasach { } 
pref_page_oracle_label_if_unchecked_java_classes = Jeśli odznaczone, klasy Java i treści pakietów zostaną pominięte
pref_page_oracle_label_plan_table = Tabela planów
pref_page_oracle_legend_execution_plan = Plan wykonania
pref_page_oracle_legend_misc = Różne
pref_page_oracle_legend_performance = Wydajność
