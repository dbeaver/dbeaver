edit_create_checkbox_hide_empty_schemas=空のスキーマを非表示にする
edit_create_checkbox_hide_empty_schemas_tool_tip_text=スキーマ内にオブジェクトがあるかを確認し、空のスキーマをツリーに表示しません。\n既定で有効ですが、オブジェクト数が非常に多いデータベースではパフォーマンスに影響する場合があります。
edit_create_checkbox_content_group_show=DBA オブジェクトを常に表示する
edit_create_checkbox_content_group_show_description=ユーザーに DBA ロールがなくても、DBA 関連のメタデータオブジェクトを常にツリーに表示します。
edit_create_checkbox_content_group_use=常に DBA_* ビューを使用する
edit_create_checkbox_content_group_use_description=可能な限り ALL_* ビューの代わりに DBA_* ビューを使用します
edit_create_checkbox_content_group_use_sys_schema=SYS スキーマ接頭辞を使用する
edit_create_checkbox_content_group_use_sys_schema_description=すべてのメタデータクエリーで SYS スキーマ接頭辞を使用します。無効にすると、スキーマを明示せずにビュー名を使用します。
edit_create_checkbox_content_group_use_simple_constraints=制約の読み取りに単純なクエリーを使用する
edit_create_checkbox_content_group_use_simple_constraints_description=単純なメタデータクエリーを使用します。遅くなる場合がありますが、すべての Oracle バージョンでより安定して動作します。
edit_create_checkbox_content_group_use_another_table_query=テーブルメタデータの読み取りに UNION を使用する
edit_create_checkbox_content_group_use_another_table_query_description=JOIN の代わりに UNION を使用する従来のテーブルメタデータクエリーを使用します。テーブルデータの読み取りが高速になる場合があります。
edit_create_checkbox_content_group_read_column_comments=クエリーのメタデータで列のコメントを読み込む
edit_create_checkbox_content_group_read_column_comments_description=結果セットの列のツールチップに表示できるよう、Oracle の列のコメントをテーブルメタデータと一緒に読み込みます。メタデータの読み取りが遅くなる場合があります。
edit_create_checkbox_content_group_search_metadata_in_synonyms=シノニム内のメタデータを検索する
edit_create_checkbox_content_group_search_metadata_in_synonyms_tooltip=他の場所に加え、シノニム内のメタデータも検索します。メタデータ検索や自動補完が大幅に遅くなる場合があります。
edit_create_checkbox_content_group_search_metadata_in_sequences=シーケンス内のメタデータを検索する
edit_create_checkbox_content_group_search_metadata_in_sequences_tooltip=他の場所に加え、シーケンス内のメタデータも検索します。メタデータ検索や自動補完が大幅に遅くなる場合があります。
