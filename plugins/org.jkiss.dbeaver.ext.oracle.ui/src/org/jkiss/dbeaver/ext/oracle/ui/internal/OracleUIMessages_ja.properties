edit_create_checkbox_group_use_rule=システムカタログクエリーに RULE ヒントを使用する
edit_create_checkbox_adds_rule_tool_tip_text=列や制約の読み取りなど、一部のシステムカタログクエリーに RULE ヒントを追加します。\n一部の Oracle データベースでは大幅に高速化しますが、他のデータベースでは低速になる場合があります。
edit_create_checkbox_group_use_metadata_optimizer=メタデータクエリーの最適化を使用する
edit_create_checkbox_group_use_metadata_optimizer_tip=メタデータクエリーを最適化します。一部のシステムではメタデータの読み取りが大幅に高速化する場合があります。
