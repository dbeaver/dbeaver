edit_create_checkbox_hide_empty_schemas = 빈 스키마 숨기기
edit_create_checkbox_hide_empty_schemas_tool_tip_text = 스키마에 객체가 있는지 확인하고 트리에 빈 스키마를 표시하지 않습니다.\n기본적으로 활성화되지만 객체 수가 매우 많은 데이터베이스에서는 성능 문제가 발생할 수 있습니다.
edit_create_checkbox_content_group_show = 항상 DBA 객체 표시
edit_create_checkbox_content_group_show_description = 사용자에게 DBA 역할이 없어도 트리에 DBA 관련 메타데이터 객체를 항상 표시합니다.
edit_create_checkbox_content_group_use = 항상 DBA_* 뷰 사용
edit_create_checkbox_content_group_use_description = 가능한 경우 ALL_* 뷰 대신 DBA_* 뷰를 사용합니다
edit_create_checkbox_content_group_use_sys_schema = SYS 스키마 접두사 사용
edit_create_checkbox_content_group_use_sys_schema_description = 모든 메타데이터 쿼리에 SYS 스키마 접두사를 사용합니다. 그렇지 않으면 명시적인 스키마 없이 뷰 이름을 사용합니다.
edit_create_checkbox_content_group_use_simple_constraints = 단순 제약 조건 조회 쿼리
edit_create_checkbox_content_group_use_simple_constraints_description = 단순한 메타데이터 쿼리를 사용합니다. 더 느릴 수 있지만 모든 Oracle 버전에서 더 안정적입니다.
edit_create_checkbox_content_group_use_another_table_query = 테이블 메타데이터 조회에 UNION 사용
edit_create_checkbox_content_group_use_another_table_query_description = JOIN 대신 UNION을 사용하는 기존 테이블 메타데이터 쿼리를 사용합니다. 경우에 따라 테이블 데이터 읽기 속도가 향상됩니다.
edit_create_checkbox_content_group_read_column_comments = 쿼리 메타데이터에서 열 설명 읽기
edit_create_checkbox_content_group_read_column_comments_description = Oracle 열 설명을 테이블 메타데이터와 함께 불러와 결과 집합 열의 도구 설명에 표시합니다. 메타데이터 읽기 속도가 느려질 수 있습니다.
edit_create_checkbox_content_group_search_metadata_in_synonyms = 동의어에서 메타데이터 검색
edit_create_checkbox_content_group_search_metadata_in_synonyms_tooltip = 다른 위치와 함께 동의어에서도 메타데이터를 검색합니다. 메타데이터 검색 및 자동 완성 속도가 크게 느려질 수 있습니다.
edit_create_checkbox_content_group_search_metadata_in_sequences = 시퀀스에서 메타데이터 검색
edit_create_checkbox_content_group_search_metadata_in_sequences_tooltip = 다른 위치와 함께 시퀀스에서도 메타데이터를 검색합니다. 메타데이터 검색 및 자동 완성 속도가 크게 느려질 수 있습니다.
dialog_controlgroup_performance = 성능
edit_create_checkbox_group_use_rule = 시스템 카탈로그 쿼리에 RULE 힌트 사용
edit_create_checkbox_adds_rule_tool_tip_text = 일부 시스템 카탈로그 쿼리 (열 및 제약 조건 조회 등)에 RULE 힌트를 추가합니다.\n일부 Oracle 데이터베이스에서 성능이 크게 향상되지만 다른 데이터베이스에서는 저하됩니다.
edit_create_checkbox_group_use_metadata_optimizer = 메타데이터 쿼리 최적화 사용
edit_create_checkbox_group_use_metadata_optimizer_tip = 메타데이터 쿼리를 최적화합니다. 일부 시스템에서 메타데이터 읽기 성능이 크게 향상될 수 있습니다.
pref_page_oracle_checkbox_disable_escape_processing = SQL 스크립트에서 이스케이프 처리 비활성화
pref_page_oracle_checkbox_enable_dbms_output = DBMS 출력 활성화
pref_page_oracle_checkbox_use_rowid_to_identify_rows = 행 식별에 ROWID 사용
pref_page_oracle_checkbox_read_all_synonyms = 모든 동의어 읽기
pref_page_oracle_label_by_default_plan_table = 기본적으로 현재 스키마 또는 SYS 스키마의 실행 계획 테이블을 사용합니다.\n여기서 특정 실행 계획 테이블의 정규화된 이름을 지정할 수 있습니다.
pref_page_oracle_label_disable_client_side_parser = 중괄호 { } 안의 드라이버 지시문에 대한 클라이언트 측 파서 비활성화\u0020
pref_page_oracle_label_if_unchecked_java_classes = 선택하지 않으면 Java 클래스와 패키지 본문을 건너뜁니다
