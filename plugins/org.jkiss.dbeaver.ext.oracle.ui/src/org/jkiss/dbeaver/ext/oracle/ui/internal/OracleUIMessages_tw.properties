pref_page_oracle_checkbox_show_date_as_date = 將 DATE 值明確顯示為 DATE
pref_page_oracle_checkbox_show_date_as_date_tip = 將 DATE 資料類型的值明確顯示為 DATE，而非 TIMESTAMP。\n此設定在停用日期/時間格式設定時將無效。

