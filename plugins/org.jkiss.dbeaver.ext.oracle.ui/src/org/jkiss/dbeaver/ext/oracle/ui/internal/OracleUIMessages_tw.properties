connection_extra_page_checkbox_show_only_one_schema = 僅顯示已連線使用者的結構描述
connection_extra_page_checkbox_show_only_one_schema_tip = 在資料庫導覽器中僅顯示已連線使用者的結構描述
edit_create_checkbox_hide_empty_schemas = 隱藏空白結構描述
edit_create_checkbox_hide_empty_schemas_tool_tip_text = 檢查結構描述內是否有物件，並在樹狀結構中隱藏空白結構描述。\n預設為啟用，但在物件數量非常龐大的資料庫上可能導致效能問題。
edit_create_checkbox_content_group_show = 一律顯示 DBA 物件
edit_create_checkbox_content_group_show_description = 即使使用者沒有 DBA 角色，也一律在樹狀結構中顯示 DBA 相關的中繼資料物件。
edit_create_checkbox_content_group_use = 一律使用 DBA_* 檢視表
edit_create_checkbox_content_group_use_description = 盡可能使用 DBA_* 檢視表取代 ALL_* 檢視表
edit_create_checkbox_content_group_use_sys_schema = 使用 SYS 結構描述前置詞
edit_create_checkbox_content_group_use_sys_schema_description = 在所有中繼資料查詢中使用 SYS 結構描述前置詞，否則使用不含明確結構描述的檢視表名稱。
edit_create_checkbox_content_group_use_simple_constraints = 使用簡易條件約束讀取查詢
edit_create_checkbox_content_group_use_simple_constraints_description = 使用簡易中繼資料查詢。速度可能較慢，但對所有 Oracle 版本更為穩定。
edit_create_checkbox_content_group_use_another_table_query = 使用 UNION 讀取資料表中繼資料
edit_create_checkbox_content_group_use_another_table_query_description = 使用舊版資料表中繼資料查詢（以 UNION 取代 JOIN），在某些情況下有助於加快資料表資料的讀取速度。
edit_create_checkbox_content_group_search_metadata_in_synonyms = 在同義字中搜尋中繼資料
edit_create_checkbox_content_group_search_metadata_in_synonyms_tooltip = 在同義字等位置搜尋中繼資料。可能會大幅降低中繼資料搜尋及自動完成的速度。
edit_create_checkbox_content_group_search_metadata_in_sequences = 在序列中搜尋中繼資料
edit_create_checkbox_content_group_search_metadata_in_sequences_tooltip = 在序列等位置搜尋中繼資料。可能會大幅降低中繼資料搜尋及自動完成的速度。
dialog_controlgroup_performance = 效能
edit_create_checkbox_group_use_rule = 在系統目錄查詢中使用 RULE 提示
edit_create_checkbox_adds_rule_tool_tip_text = 為部分系統目錄查詢（例如讀取資料行與條件約束）新增 RULE 提示。\n在某些 Oracle 資料庫上可大幅提升效能（在其他資料庫上則可能降低效能）。
edit_create_checkbox_group_use_metadata_optimizer = 使用中繼資料查詢最佳化工具
edit_create_checkbox_group_use_metadata_optimizer_tip = 使用中繼資料查詢最佳化工具，在某些系統上可大幅改善中繼資料讀取效能。
pref_page_oracle_checkbox_disable_escape_processing = 停用 SQL 指令碼中的逸出字元處理
pref_page_oracle_checkbox_enable_dbms_output = 啟用 DBMS Output
pref_page_oracle_checkbox_use_rowid_to_identify_rows = 使用 ROWID 識別資料列
pref_page_oracle_checkbox_read_all_synonyms = 讀取所有同義字
pref_page_oracle_label_by_default_plan_table = 預設將使用目前結構描述或 SYS 結構描述中的計畫資料表。\n您可以在此指定特定的完整計畫資料表名稱。
pref_page_oracle_label_disable_client_side_parser = 停用括號 { } 中驅動程式指令的客戶端剖析器
pref_page_oracle_label_if_unchecked_java_classes = 若未勾選，Java 類別與套件主體將被略過
pref_page_oracle_label_plan_table = 計畫資料表
pref_page_oracle_legend_execution_plan = 執行計畫
