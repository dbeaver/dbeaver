pref_page_oracle_label_by_default_plan_table=La table de plan du schéma actuel ou de SYS est utilisée par défaut.\nVous pouvez indiquer ici le nom pleinement qualifié d'une autre table de plan.
pref_page_oracle_label_disable_client_side_parser=Désactiver l'analyse côté client des instructions du pilote entre accolades { }\u0020
pref_page_oracle_label_if_unchecked_java_classes=Si cette option n'est pas cochée, les classes Java et les corps des paquets seront ignorés
