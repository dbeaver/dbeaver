connection_extra_page_checkbox_show_only_one_schema=Afficher uniquement le schéma de l'utilisateur connecté
connection_extra_page_checkbox_show_only_one_schema_tip=Afficher uniquement le schéma de l'utilisateur connecté dans le navigateur de bases de données
edit_create_checkbox_hide_empty_schemas=Masquer les schémas vides
edit_create_checkbox_hide_empty_schemas_tool_tip_text=Vérifier la présence d'objets dans les schémas et masquer les schémas vides dans l'arbre.\nActivé par défaut, mais peut réduire les performances sur les bases contenant un très grand nombre d'objets.
edit_create_checkbox_content_group_show=Toujours afficher les objets DBA
edit_create_checkbox_content_group_show_description=Toujours afficher les métadonnées DBA dans l'arbre, même si l'utilisateur ne possède pas le rôle DBA.
edit_create_checkbox_content_group_use=Toujours utiliser les vues DBA_*
edit_create_checkbox_content_group_use_description=Utiliser les vues DBA_* au lieu des vues ALL_* lorsque cela est possible
edit_create_checkbox_content_group_use_sys_schema=Utiliser le préfixe de schéma SYS
edit_create_checkbox_content_group_use_sys_schema_description=Utiliser le préfixe SYS dans toutes les requêtes de métadonnées. Sinon, utiliser les noms de vues sans schéma explicite.
edit_create_checkbox_content_group_use_simple_constraints=Requête simple de lecture des contraintes
edit_create_checkbox_content_group_use_simple_constraints_description=Utiliser des requêtes de métadonnées simples. Peut être plus lent, mais plus stable sur toutes les versions d'Oracle.
edit_create_checkbox_content_group_use_another_table_query=Utiliser UNION pour lire les métadonnées des tables
edit_create_checkbox_content_group_use_another_table_query_description=Utiliser l'ancienne requête de métadonnées des tables, avec UNION au lieu de JOIN. Peut accélérer la lecture des données des tables dans certains cas.
edit_create_checkbox_content_group_read_column_comments=Lire les commentaires des colonnes dans les métadonnées des requêtes
edit_create_checkbox_content_group_read_column_comments_description=Charger les commentaires des colonnes Oracle avec les métadonnées des tables pour les afficher dans les infobulles des colonnes de résultats. Peut ralentir la lecture des métadonnées.
edit_create_checkbox_content_group_search_metadata_in_synonyms=Rechercher les métadonnées dans les synonymes
edit_create_checkbox_content_group_search_metadata_in_synonyms_tooltip=Inclure les synonymes dans la recherche de métadonnées. Peut ralentir considérablement la recherche et l'autocomplétion.
edit_create_checkbox_content_group_search_metadata_in_sequences=Rechercher les métadonnées dans les séquences
edit_create_checkbox_content_group_search_metadata_in_sequences_tooltip=Inclure les séquences dans la recherche de métadonnées. Peut ralentir considérablement la recherche et l'autocomplétion.
dialog_controlgroup_performance=Performances
edit_create_checkbox_group_use_rule=Utiliser l'indication RULE pour les requêtes du catalogue système
edit_create_checkbox_adds_rule_tool_tip_text=Ajouter l'indication RULE à certaines requêtes du catalogue système, notamment la lecture des colonnes et des contraintes.\nAméliore considérablement les performances sur certaines bases Oracle, mais les réduit sur d'autres.
edit_create_checkbox_group_use_metadata_optimizer=Utiliser l'optimiseur de requêtes de métadonnées
edit_create_checkbox_group_use_metadata_optimizer_tip=Utiliser l'optimiseur de requêtes de métadonnées. Peut considérablement améliorer leurs performances de lecture sur certains systèmes.
