dataTransfer.producer.stream.processor.csv.property.timestampZone.name = ID del fuso orario
dataTransfer.producer.stream.processor.csv.property.timestampZone.description = ID del fuso orario. Per impostazione predefinita viene usato il fuso orario del computer locale.\n3 modi per specificarlo:\n\t-Scostamento locale (+3, -04:30)\n\t-Scostamento specifico (GMT+2, UTC+01:00)\n\t-Regione (UTC, ECT, PST, ecc.)
dataTransfer.producer.stream.processor.csv.property.lineFeedEscapeString.name = Carattere di interruzione di riga
dataTransfer.producer.stream.processor.csv.property.lineFeedEscapeString.description = Sostituisci le interruzioni di riga con il carattere o la stringa specificati. Un campo vuoto indica nessuna sostituzione
dataTransfer.producer.stream.processor.csv.propertyGroup.sampling.label = Campionamento
