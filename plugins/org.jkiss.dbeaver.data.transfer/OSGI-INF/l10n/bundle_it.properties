dataTransfer.producer.stream.processor.csv.property.columnTypeSamplesCount.description = Numero di righe da usare per dedurre lunghezza e tipo dei dati importati.
dataTransfer.producer.stream.processor.csv.property.columnTypeMinimalLength.name = Lunghezza predefinita delle colonne
dataTransfer.producer.stream.processor.csv.property.columnTypeMinimalLength.description = Dimensione predefinita delle colonne di tipo stringa.\nQuesto valore viene usato quando si crea una nuova colonna e viene specificato nel relativo tipo, se necessario.
dataTransfer.producer.stream.processor.csv.property.columnTypeUseByteLength.name = Calcola lunghezza in byte
dataTransfer.producer.stream.processor.csv.property.columnTypeUseByteLength.description = La lunghezza deve essere calcolata in byte anziché in punti di codice.\nA seconda della codifica usata, un singolo punto di codice può occupare più byte.\nAlcuni database calcolano la lunghezza in byte.
