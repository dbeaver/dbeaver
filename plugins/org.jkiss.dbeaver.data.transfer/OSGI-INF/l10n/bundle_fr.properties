dataTransfer.processor.csv.property.headerQuoting.description = Délimiter les en-têtes toujours, uniquement lorsque la syntaxe CSV l'exige, ou jamais. L'option jamais peut produire un CSV invalide si un en-tête contient un séparateur, un guillemet ou un saut de ligne
