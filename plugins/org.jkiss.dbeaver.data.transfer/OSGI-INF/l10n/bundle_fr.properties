dataTransfer.processor.csv.property.formatArray.description = Formater le préfixe et le suffixe du tableau
dataTransfer.processor.markdownTable.property.escapeCellContent.name = Échapper le contenu des cellules
dataTransfer.processor.markdownTable.property.escapeCellContent.description = Utile lorsque les cellules peuvent contenir du XML ou d'autres textes risquant d'invalider la syntaxe des tableaux Markdown.
dataTransfer.processor.sql.property.userTableName.description = Vous pouvez spécifier le nom de la table cible. Il sera utilisé tel quel pour générer une instruction INSERT.\nSi vous souhaitez inclure l'identifiant du schéma ou du catalogue dans le nom de table, vous pouvez le saisir vous-même dans ce champ.\nPar défaut, le nom de la table d'origine est utilisé.
dataTransfer.processor.sql.property.lineBeforeRows.description = Insérer un saut de ligne avant les valeurs (pour les insertions multilignes)
dataTransfer.processor.sql.property.keywordCase.name = Casse des mots-clés
dataTransfer.processor.sql.property.keywordCase.description = Vous pouvez choisir les minuscules ou les majuscules pour les mots-clés
dataTransfer.processor.sql.property.identifierCase.name = Casse des identifiants
dataTransfer.processor.sql.property.identifierCase.description = Vous pouvez choisir les minuscules ou les majuscules pour les noms de tables et de colonnes
dataTransfer.processor.sql.property.upsertKeyword.name = Mot-clé d'upsert
dataTransfer.processor.sql.property.upsertKeyword.description = Vous pouvez choisir différents mots-clés d'upsert
dataTransfer.processor.sql.property.insertOnConflict.name = Expression en cas de conflit
dataTransfer.processor.sql.property.insertOnConflict.description = Expression de fin d'instruction. Saisir la valeur souhaitée dans ce champ.\nCe paramètre dépend de la base de données
dataTransfer.processor.txt.name = TXT
dataTransfer.processor.txt.property.batchSize.label = Taille de lot
dataTransfer.processor.txt.property.minColumnLength.tip = Longueur minimale de colonne.\nSi la valeur de cellule est plus courte, des espaces seront ajoutées pour atteindre cette longueur.
dataTransfer.processor.txt.property.maxColumnLength.tip = Longueur maximale de colonne.\nSi la valeur de cellule dépasse ce paramètre, elle sera tronquée.
dataTransfer.processor.txt.property.showNulls.tip = Afficher NULL si ce paramètre est activé, sinon ne rien afficher
dataTransfer.processor.txt.property.delimLeading.tip = Ajoute une barre verticale au début de la ligne.
dataTransfer.processor.txt.property.delimHeader.tip = Ajoute des tirets dans la première ligne sans en-tête, ou entre l'en-tête et les données.
dataTransfer.processor.txt.property.delimTrailing.tip = Ajoute une barre verticale à la fin de la ligne.
dataTransfer.processor.txt.property.delimBetween.tip = Ajoute le caractère personnalisé choisi (par exemple une barre verticale, une espace ou rien) entre les valeurs de données.
dataTransfer.processor.txt.property.showHeader.tip = Afficher les noms de colonnes en haut.\nVous pouvez désactiver ce paramètre pour l'exportation multiple, ainsi que le séparateur d'en-tête
dataTransfer.processor.source.code.description = Exporter sous forme de tableau de code source
dataTransfer.processor.source.code.property.quoteChar.name = Caractère de délimitation
dataTransfer.processor.source.code.property.quoteChar.description = Caractère utilisé pour délimiter les chaînes
dataTransfer.processor.source.code.property.rowDelimiter.description = Séparateur de lignes. Par défaut, saut de ligne propre au système.\n Vous pouvez utiliser les caractères spéciaux \\ + t,n,r
dataTransfer.producer.stream.processor.csv.property.quoteChar.name = Caractère de délimitation
dataTransfer.producer.stream.processor.csv.property.quoteChar.description = Caractère de délimitation des valeurs
dataTransfer.producer.stream.processor.csv.property.strictQuotes.name = Ignorer les caractères hors délimiteurs
dataTransfer.producer.stream.processor.csv.property.strictQuotes.description = Si activé, les caractères hors des délimiteurs spécifiés sont ignorés.\nCette option est elle-même ignorée si le paramètre "caractère de délimitation" n'est pas spécifié.
dataTransfer.producer.stream.processor.csv.property.escapeChar.description = Caractère d'échappement des caractères spéciaux
dataTransfer.producer.stream.processor.csv.property.emptyStringNull.description = Les chaînes vides sont converties en valeurs NULL. Sinon, elles sont converties en chaînes de longueur nulle
dataTransfer.producer.stream.processor.csv.property.nullString.name = Marqueur de valeur NULL
dataTransfer.producer.stream.processor.csv.property.nullString.description = Chaîne littérale utilisée comme marqueur de valeur NULL.\nCes chaînes seront converties en NULL à l'importation des données
dataTransfer.producer.stream.processor.csv.property.trimWhitespaces.description = Les espaces seront supprimées aux extrémités pour éviter les erreurs d'analyse
dataTransfer.producer.stream.processor.csv.property.timestampFormat.description = Motif de format de date/heure. Permet de préciser le format de date du fichier CSV, sans modifier les données produites.\nRechercher 'java DateTimeFormatter' pour les détails du format.
dataTransfer.producer.stream.processor.csv.property.timestampZone.description = ID du fuseau horaire. Par défaut, celui de la machine locale est utilisé.\n3 façons de définir le fuseau :\n\t-Décalage local (+3, -04:30)\n\t-Décalage spécifique (GMT+2, UTC+01:00)\n\t-Région (UTC, ECT, PST, etc)
dataTransfer.producer.stream.processor.csv.property.lineFeedEscapeString.description = Remplacer les sauts de ligne par le caractère ou la chaîne spécifiés. Un champ vide signifie aucun remplacement
dataTransfer.producer.stream.processor.csv.property.columnTypeSamplesCount.name = Nombre de lignes échantillonnées
dataTransfer.producer.stream.processor.csv.property.columnTypeSamplesCount.description = Nombre de lignes à utiliser pour estimer la longueur et le type des données importées.
dataTransfer.producer.stream.processor.csv.property.columnTypeMinimalLength.description = Taille par défaut des colonnes de type chaîne.\nCette valeur sert à créer une colonne et figure dans son type si nécessaire.
dataTransfer.producer.stream.processor.csv.property.columnTypeUseByteLength.name = Compter la longueur en octets
dataTransfer.producer.stream.processor.csv.property.columnTypeUseByteLength.description = La longueur doit être comptée en octets plutôt qu'en points de code.\nSelon l'encodage utilisé, un point de code peut occuper plusieurs octets.\nCertaines bases de données comptent la longueur en octets.
