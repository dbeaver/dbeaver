confirm.org.jkiss.dbeaver.sql.resultset.serverSideOrderingUnavailable.message=Nie można wykonać sortowania po stronie serwera, ponieważ baza danych go nie obsługuje.\n\nZamiast tego zostanie wykonane sortowanie po stronie klienta.
confirm.org.jkiss.dbeaver.sql.resultset.serverSideOrderingUnavailable.toggleMessage=Nie pokazuj więcej tego komunikatu
confirm.org.jkiss.dbeaver.sql.resultset.serverSideOrderingUnavailable.tip = Ostrzega, że zostanie użyte sortowanie po stronie klienta, ponieważ sortowanie po stronie serwera jest niedostępne

confirm.resultSet.group.name = Edytor zbioru wyników
confirm.keep_statement_open.message = Domyślnie DBeaver zamyka zbiór wyników po wykonaniu zapytania SELECT. Aby zobaczyć wartość kolumny kursora, należy włączyć w ustawieniach opcję „Zachowuj otwarte kursory w edytorze SQL”. Utrzymywanie otwartych kursorów może na długo blokować zasoby bazy danych. Czy chcesz włączyć tę funkcję? (Zbiór wyników zostanie odświeżony)
confirm.keep_statement_open.title = Zachowaj otwarty kursor
confirm.keep_statement_open.tip = Ostrzega o specyfice pracy z otwartymi kursorami w zbiorze wyników
confirm.resultSet.toggleMessage = Nie pytaj ponownie

confirm.order_resultset.message = Sortowanie zbioru wyników może zająć dużo czasu w przypadku dużych tabel, gdy dla tej kolumny nie ma odpowiedniego indeksu.\n\nCzy na pewno chcesz posortować ten zbiór wyników według kolumny {0}?
confirm.order_resultset.title = Sortuj zbiór wyników
confirm.order_resultset.tip = Ostrzeżenie, że wczytanie wszystkich posortowanych wartości może zająć dużo czasu

confirm.filter_resultset.title = Filtruj zbiór wyników
confirm.filter_resultset.message = Wczytywanie unikalnych wartości z tabeli bazy danych może zająć dużo czasu w przypadku dużych tabel, gdy dla tej kolumny nie ma odpowiedniego indeksu.\n\nCzy na pewno chcesz wczytać możliwe wartości kolumny {0}?
confirm.filter_resultset.tip = Ostrzeżenie, że wczytanie wszystkich filtrowanych wartości może zająć dużo czasu

confirm.fetch_all_rows.message = Odczyt wszystkich wierszy zbioru wyników może zająć dużo czasu i pamięci.\n\nCzy na pewno chcesz pobrać wszystkie wiersze?
confirm.fetch_all_rows.title = Odczytaj wszystkie wiersze
confirm.fetch_all_rows.tip = Ostrzeżenie, że pobranie wszystkich wierszy może zająć dużo czasu i pamięci

confirm.reset_panels_content.message = Zawartość paneli zostanie utracona. Czy na pewno chcesz kontynuować?
confirm.reset_panels_content.title = Kontynuuj i zresetuj zawartość paneli
confirm.reset_panels_content.tip = Ostrzega o zamykaniu paneli z niezapisanymi zmianami

confirm.close_resultset_edit.message = Zbiór wyników został zmieniony. Czy chcesz zapisać zmiany w bazie danych?
confirm.close_resultset_edit.title = Zapisz zmiany zbioru wyników

confirm.save_zero_rows.title = Brak zmienionych wierszy
confirm.save_zero_rows.message = Baza danych zgłosiła 0 zmienionych wierszy dla co najmniej jednej zmiany danych.\n\nInstrukcje zostały wykonane, ale zmiany mogły nie zostać zapisane. Odśwież dane, aby sprawdzić wynik. Wyzwalacze lub inne działania po stronie bazy danych mogły mimo to zostać wykonane.
confirm.save_zero_rows.tip = Ostrzega, gdy baza danych zgłasza zero zmienionych wierszy dla zmiany w edytorze danych

