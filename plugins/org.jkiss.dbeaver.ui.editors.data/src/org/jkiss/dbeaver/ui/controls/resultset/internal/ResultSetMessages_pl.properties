pref_page_database_resultsets_label_order_policy_tip = Określa domyślną kolejność rekordów. Domyślnie kolejność nie jest\nzmieniana, a zbiór wyników jest wyświetlany w kolejności pobrania.\nOpcja nie ma wpływu, jeśli tabela nie ma klucza głównego.\n\nUstawienie tej opcji może spowodować dodatkowe zapytanie do bazy danych,\nponieważ informacje o ograniczeniach nie są wcześniej dostępne.
