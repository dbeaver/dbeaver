ssh_file_corrupted_dialog_title = Falló la verificación de la clave del servidor
ssh_file_corrupted_dialog_message = No se puede verificar la clave del servidor debido a registros dañados en el archivo de servidores conocidos.\nPuede solucionarlo manualmente (recomendado) u omitir la verificación.\n\n¿Desea omitir la verificación de la clave del servidor? \n¡Esto posibilita un ATAQUE DE INTERMEDIARIO!
