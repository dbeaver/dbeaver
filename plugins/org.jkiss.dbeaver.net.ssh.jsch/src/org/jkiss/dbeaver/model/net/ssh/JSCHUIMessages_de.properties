ssh_file_corrupted_dialog_title = Überprüfung des Hostschlüssels fehlgeschlagen
ssh_file_corrupted_dialog_message = Der Hostschlüssel kann aufgrund beschädigter Einträge in der Datei für bekannte Hosts nicht überprüft werden.\nSie können dies manuell beheben (empfohlen) oder die Überprüfung überspringen.\n\nMöchten Sie die Überprüfung des Hostschlüssels umgehen? \nDadurch werden MAN-IN-THE-MIDDLE-ANGRIFFE möglich!
