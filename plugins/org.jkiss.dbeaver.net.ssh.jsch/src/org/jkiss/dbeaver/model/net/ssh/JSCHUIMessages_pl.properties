ssh_file_corrupted_dialog_title = Weryfikacja klucza hosta nie powiodła się
ssh_file_corrupted_dialog_message = Nie można zweryfikować klucza hosta z powodu uszkodzonych wpisów w pliku znanych hostów.\nMożesz rozwiązać to ręcznie (zalecane) lub pominąć weryfikację.\n\nCzy chcesz pominąć weryfikację klucza hosta? \nUmożliwia to ATAK TYPU MAN-IN-THE-MIDDLE!
