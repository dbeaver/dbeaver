ssh_file_corrupted_dialog_message = Nu se poate verifica cheia gazdei din cauza înregistrărilor corupte din fişierul gazde cunoscute.\nPuteţi rezolva manual (recomandat) sau puteţi omite verificarea.\n\nDoriţi să ocoliţi verificarea cheii gazdei? \nSe deschide posibilitatea unui atac MAN-IN-THE-MIDDLE!

ssh_file_corrupted_dialog_title = Verificarea cheii gazdă nu a reuşit
