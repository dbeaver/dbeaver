ssh_file_corrupted_dialog_title = Verifica della chiave host non riuscita
ssh_file_corrupted_dialog_message = Impossibile verificare la chiave host a causa di voci danneggiate nel file degli host conosciuti.\nÈ possibile risolvere il problema manualmente (consigliato) oppure saltare la verifica.\n\nIgnorare la verifica della chiave host? \nQuesto espone al rischio di un ATTACCO MAN-IN-THE-MIDDLE!
