ssh_file_corrupted_dialog_title=Ошибка проверки ключа хоста
ssh_file_corrupted_dialog_message=Не удалось проверить ключ хоста из-за повреждённых записей в файле известных хостов.\nМожно исправить это вручную (рекомендуется) или пропустить проверку.\n\nПропустить проверку ключа хоста? \nЭто создаёт возможность АТАКИ ПОСРЕДНИКА!
