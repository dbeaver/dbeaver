ssh_file_corrupted_dialog_title=Échec de la vérification de la clé de l'hôte
ssh_file_corrupted_dialog_message=Impossible de vérifier la clé de l'hôte en raison d'enregistrements corrompus dans le fichier des hôtes connus.\nVous pouvez corriger ce problème manuellement (recommandé) ou ignorer la vérification.\n\nVoulez-vous ignorer la vérification de la clé de l'hôte ? \nCela rend possible une ATTAQUE DE L'HOMME DU MILIEU !
