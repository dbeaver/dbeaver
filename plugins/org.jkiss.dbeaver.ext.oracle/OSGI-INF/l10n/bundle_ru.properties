meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.description=Параметр CASCADE позволяет проверить объект и все зависимые объекты (например, индексы).\n По умолчанию CASCADE выполняет полную проверку. Она может требовать значительных ресурсов,\n поэтому предложение FAST позволяет выполнить более быструю проверку.\n Можно проверять структуру без отключения доступа, одновременно с операциями DML над проверяемым объектом.\n Такая проверка может немного снизить производительность DML,\n но позволяет выполнять ANALYZE без остановки работы.
meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.name=Параметры
