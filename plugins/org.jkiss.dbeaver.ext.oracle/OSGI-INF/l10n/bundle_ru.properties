meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableTruncateSettings.reusable.description=Укажите REUSE STORAGE, чтобы сохранить выделенное таблице место удалённых строк.\n Параметры хранения не сбрасываются к значениям на момент создания таблицы или кластера.\n Это место затем может использоваться только новыми данными таблицы или кластера, полученными при вставке или обновлении.\n Предложение сохраняет текущие параметры хранения.
