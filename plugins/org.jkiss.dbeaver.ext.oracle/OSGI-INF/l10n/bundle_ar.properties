meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableTruncateSettings.reusable.description = حدد REUSE STORAGE للاحتفاظ بمساحة الصفوف المحذوفة المخصصة للجدول.\n لا تُعاد قيم التخزين إلى قيم وقت إنشاء الجدول أو العنقود.\n ولا يمكن استخدام هذه المساحة لاحقًا إلا للبيانات الجديدة في الجدول أو العنقود الناتجة عن عمليات الإدراج أو التحديث.\n تُبقي هذه العبارة معلمات التخزين على إعداداتها الحالية.
meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableTruncateSettings.reusable.name = إعادة استخدام التخزين
meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.description = يمكنك التحقق من كائن وجميع الكائنات التابعة له (مثل الفهارس) بإضافة الخيار CASCADE.\n يُجري CASCADE افتراضيًا تحققًا كاملًا. ولأن هذه العملية قد تستهلك موارد كثيرة،\n يمكنك إجراء تحقق أسرع باستخدام العبارة FAST.\n يمكنك تحديد إجراء التحقق من البنية أثناء الاتصال، مع استمرار عمليات DML على الكائن الجاري التحقق منه.\n قد يتأثر الأداء قليلًا عند التحقق بالتزامن مع عمليات DML تؤثر في الكائن،\n لكن تعوّض ذلك مرونة تنفيذ ANALYZE أثناء الاتصال.
meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.name = الخيارات

