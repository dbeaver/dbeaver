meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableTruncateSettings.reusable.name                       = 重複使用儲存空間
meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.description         = 您可以透過加入 CASCADE 選項來驗證物件及其所有相依物件（例如索引）。\n 依預設，CASCADE 選項執行完整驗證。由於此作業可能耗用大量資源，\n 您可以使用 FAST 子句執行較快速的驗證。\n 您可以指定在對被驗證物件執行 DML 的同時線上執行結構驗證。\n 在有進行中的 DML 影響物件時進行驗證可能略有效能影響，\n 但可由能夠線上執行 ANALYZE 的靈活性來彌補。
meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.name                = 選項

