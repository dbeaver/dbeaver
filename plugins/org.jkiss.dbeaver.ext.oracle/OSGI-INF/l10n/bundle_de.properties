meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.description = Mit der Option CASCADE können Sie ein Objekt und alle abhängigen Objekte (z. B. Indizes) validieren.\n Standardmäßig führt CASCADE eine vollständige Validierung durch. Da dies viele Ressourcen beanspruchen kann,\n können Sie mit der Klausel FAST eine schnellere Validierung durchführen.\n Sie können die Strukturvalidierung online durchführen, während DML-Operationen auf dem zu prüfenden Objekt stattfinden.\n Die Validierung bei gleichzeitigem DML-Zugriff kann die Leistung geringfügig beeinträchtigen,\n ermöglicht jedoch die flexible Online-Ausführung von ANALYZE.
