meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.description = CASCADE 옵션을 포함하면 객체와 모든 종속 객체(예: 인덱스)를 검증할 수 있습니다.\n 기본적으로 CASCADE 옵션은 전체 검증을 수행합니다. 이 작업은 자원을 많이 사용할 수 있으므로\n FAST 절로 더 빠른 검증을 수행할 수 있습니다.\n 검증 대상 객체에 DML이 수행되는 동안 온라인으로 구조를 검증하도록 지정할 수 있습니다.\n 해당 객체를 변경하는 DML이 진행되는 동안 검증하면 성능에 약간의 영향이 있을 수 있지만\n ANALYZE를 온라인으로 수행할 수 있다는 유연성으로 이를 보완합니다.
