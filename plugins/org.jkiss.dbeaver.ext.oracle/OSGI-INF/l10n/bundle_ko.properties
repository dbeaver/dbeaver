meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableTruncateSettings.reusable.description = REUSE STORAGE를 지정하면 삭제된 행의 공간을 테이블에 할당된 상태로 유지합니다.\n 스토리지 값은 테이블이나 클러스터 생성 시의 값으로 초기화되지 않습니다.\n 이 공간은 이후 삽입이나 갱신 작업으로 생성되는 테이블 또는 클러스터의 새 데이터에만 사용할 수 있습니다.\n 이 절은 스토리지 매개변수의 현재 설정을 유지합니다.
