meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableTruncateSettings.reusable.description = REUSE STORAGEを指定し、削除した行の領域をテーブルへの割り当て状態で保持します。\n格納領域の値は、テーブルまたはクラスターの作成時の値に戻りません。\nこの領域は、その後の挿入または更新によるテーブルまたはクラスターの新しいデータにのみ使用できます。\nこの句は格納パラメーターの現在の設定を維持します。
meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableTruncateSettings.reusable.name = ストレージを再利用
meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.description = CASCADEオプションを指定すると、オブジェクトと、インデックスなどのすべての依存オブジェクトを検証できます。\n既定ではCASCADEは完全な検証を行います。この処理は多くのリソースを消費する場合があるため、\nFAST句で高速な検証を実行できます。\n検証対象のオブジェクトに対してDMLを実行しながら、オンラインで構造を検証することもできます。\nDMLの進行中に検証すると性能がわずかに低下する場合がありますが、\nオンラインでANALYZEを実行できる柔軟性が得られます。
meta.org.jkiss.dbeaver.ext.oracle.tasks.OracleToolTableValidateStructureSettings.option.name = オプション
