easy_config_welcome_title=Welcome
easy_config_welcome_description=Configure DBeaver for your needs
easy_config_welcome_body_text=Welcome to DBeaver, a universal database management tool.\n\nThis wizard will help you configure DBeaver for your needs; changes will be applied after completing the wizard. You can always change these settings later in the preferences.\n\nClick Next to continue.

easy_config_appearance_title=Appearance
easy_config_appearance_description=Configure the look and feel

easy_config_security_title=Security
easy_config_security_description=Configure the way your data and credentials are encrypted

easy_config_features_title=Features
easy_config_features_description=Toggle features you may want or not

easy_config_data_collection_title=Data collection
easy_config_data_collection_description=Help us improve DBeaver by sending anonymous data
easy_config_data_collection_agreement_text=To improve user experience and product performance, DBeaver can collect some anonymous statistical data about feature usage and product configuration.\n\nThis data doesn't include any personal or sensitive information, such as database connection configuration, executed queries, or database information. The data sent complies with the <a href="https://dbeaver.com/privacy/">DBeaver Corporation Privacy Policy ↗</a>.\n\nDBeaver sends statistics before shutting down or during startup. Information we collect includes:\n- Brief information about your OS and locale\n- List of UI actions you do to better understand users' workflow\n- Databases you use to improve support for popular ones
easy_config_data_collection_send_usage_statistics=Send anonymous usage statistics
