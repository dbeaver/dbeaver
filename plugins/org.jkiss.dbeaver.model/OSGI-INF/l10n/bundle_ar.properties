ComplexTypeTransformer.general.description = يعرض سمات النوع المركّب كأعمدة منفصلة
MapTransformer.general.description = يعرض البنية/الخريطة كمجموعة من الأعمدة المنفصلة
ArrayTransformer.general.description = يعرض عناصر المصفوفة المركّبة كمجموعة من الأعمدة المنفصلة
EpochTimeTransformer.general.description = يمثّل القيمة الرقمية كطابع زمني بنظام Epoch (في C وUnix وPOSIX وJava وغيرها) أو أحد بدائله المتوافقة مع Windows، أي عدد الثواني المنقضية منذ 1970/01/01 00:00:00 (UTC)، أو منذ نقطة مرجعية خاصة بالبديل المحدد.
EpochTimeTransformer.property.unit.description = وحدة القياس: ثوانٍ أو ملّي ثوانٍ وغيرها. لاحظ أن dotnet وما يشابهه يغيّر أيضًا النقطة المرجعية عن بداية Unix Epoch
EpochTimeTransformer.property.timezoneID.description = معرّف المنطقة الزمنية. تُستخدم افتراضيًا المنطقة الزمنية للجهاز المحلي.\nثلاث طرق لتحديد المنطقة:\n\t-إزاحة المنطقة المحلية (+3, -04:30)\n\t-إزاحة منطقة محددة (GMT+2, UTC+01:00)\n\t-حسب المنطقة (UTC, ECT, PST وغيرها)
RadixTransformer.general.description = يمثّل الأعداد باستخدام أساس عدّ محدد.
URLTransformer.general.description = يمثّل القيمة كعنوان URL. يوفّر لوحة معاينة تحتوي على متصفح ويب مضمّن.
URLTransformer.property.pattern.label = نمط عنوان URL
URLTransformer.property.pattern.description = نمط عنوان URL. يُستبدل المتغير ${value} بالقيمة الفعلية.
BooleanTransformer.general.description = يمثّل الأعداد كقيم منطقية.
UUIDTransformer.general.description = يمثّل القيمة الثنائية كمعرّف UUID.
UUIDTransformer.property.type.label = نوع UUID
UUIDTransformer.property.type.description = يمكنك اختيار UUID من نوع version1 (big endian) أو version2 (mixed-Endian)\n أو ordered (عند استخدام تخزين محسّن).
UUIDTransformer.property.case.label = حالة الأحرف
UUIDTransformer.property.case.description = أحرف صغيرة أو كبيرة.
