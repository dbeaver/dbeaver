EpochTimeTransformer.general.description = 以 Epoch（C、Unix、POSIX、Java 等）時間或其相容 Windows 的變體，將數值表示為時間戳記，即自 1970/01/01 00:00:00 (UTC) 起經過的秒數，或所選變體的特定參考點。
EpochTimeTransformer.property.unit.description = 計量單位 - 秒、毫秒等。請注意，dotnet 及其相關框架也會將參考點從 Unix Epoch 變更。
EpochTimeTransformer.property.timezoneID.description = 時區 ID。預設使用本機時區。\n指定時區的 3 種方式：\n\t- 本地時區偏移（+3、-04:30）\n\t- 特定時區偏移（GMT+2、UTC+01:00）\n\t- 地區型（UTC、ECT、PST 等）

RadixTransformer.general.description = 以指定進位制表示數字。

URLTransformer.general.description = 將值表示為 URL，並提供含內嵌網頁瀏覽器的預覽面板。
URLTransformer.property.pattern.label = URL 格式
URLTransformer.property.pattern.description = URL 格式。變數 ${value} 將被實際值取代。

BooleanTransformer.general.description = 將數字表示為布林值。

UUIDTransformer.general.description = 將二進位值表示為 UUID。
UUIDTransformer.property.type.label = UUID 型別
UUIDTransformer.property.type.description = 可選擇 version1（大端序）、version2（混合端序）\n 或 ordered（若使用最佳化儲存）版本的 UUID。
UUIDTransformer.property.case.label = 大小寫
UUIDTransformer.property.case.description = 小寫或大寫字元。

BinaryTransformer.general.description = 將字串值表示為二進位資料。
BinaryTransformer.property.format.label = 二進位格式
BinaryTransformer.property.format.description = 二進位值格式。
BinaryTransformer.property.encoding.label = 字元編碼
BinaryTransformer.property.encoding.description = 用於將字串值解碼為位元組的字元編碼。

