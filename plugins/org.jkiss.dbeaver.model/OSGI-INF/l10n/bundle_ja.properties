ComplexTypeTransformer.general.description = 複合型の属性を個別の列として表示します。
MapTransformer.general.description = 構造体またはマップを個別の列の集合として評価します。
ArrayTransformer.general.description = 複合配列の要素を個別の列の集合として評価します。
EpochTimeTransformer.general.description = 数値をエポック時刻（C、Unix、POSIX、Javaなど）、またはWindows向けの派生形式のタイムスタンプとして表示します。1970/01/01 00:00:00 (UTC)、または選択した形式固有の基準時点からの経過秒数を表します。
EpochTimeTransformer.property.unit.description = 測定単位（秒、ミリ秒など）。dotnetなどの形式では、基準時点もUnixエポックから変更されます。
EpochTimeTransformer.property.timezoneID.description = タイムゾーンID。既定ではローカルマシンのタイムゾーンを使用します。\n次の3つの方法で指定できます：\n\t-ローカル時差（+3、-04:30）\n\t-明示的な時差（GMT+2、UTC+01:00）\n\t-地域名（UTC、ECT、PSTなど）
RadixTransformer.general.description = 指定した基数で数値を表示します。
URLTransformer.general.description = 値をURLとして表示します。組み込みWebブラウザーによるプレビューパネルを提供します。
URLTransformer.property.pattern.label = URLパターン
URLTransformer.property.pattern.description = URLパターン。変数${value}は実際の値に置き換えられます。
BooleanTransformer.general.description = 数値を真偽値として表示します。
UUIDTransformer.general.description = バイナリ値をUUIDとして表示します。
UUIDTransformer.property.type.label = UUIDの種類
UUIDTransformer.property.type.description = UUIDのversion1（ビッグエンディアン）、version2（混合エンディアン）、\nまたはordered（最適化された格納形式を使用している場合）を選択できます。
UUIDTransformer.property.case.label = 大文字/小文字
UUIDTransformer.property.case.description = 小文字または大文字を使用します。
BinaryTransformer.general.description = 文字列の値をバイナリデータとして表示します。
BinaryTransformer.property.format.label = バイナリ形式
BinaryTransformer.property.format.description = バイナリ値の形式。
BinaryTransformer.property.encoding.label = 文字エンコーディング
BinaryTransformer.property.encoding.description = 文字列の値をバイト列に変換するときに使用する文字エンコーディング。
NumericTransformer.property.type.label = 種類
NumericTransformer.property.type.description = 文字列の変換先となる数値型
NumericTransformer.property.lenient.label = 寛容な変換
NumericTransformer.property.lenient.description = 変換エラーを無視し、エラーの代わりに元の値を表示するかどうかを指定します。
