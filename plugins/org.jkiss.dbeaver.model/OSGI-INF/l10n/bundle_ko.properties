ComplexTypeTransformer.general.description = 복합 유형의 속성을 별도 열로 표시합니다.
MapTransformer.general.description = 구조체/맵을 별도 열의 집합으로 평가합니다.
ArrayTransformer.general.description = 복합 배열 요소를 별도 열의 집합으로 평가합니다.
EpochTimeTransformer.general.description = 숫자 값을 에포크(C, Unix, POSIX, Java 등) 시간이나 Windows 호환 변형의 타임스탬프로 표시합니다. 1970/01/01 00:00:00 (UTC) 또는 선택한 변형의 기준 시점부터 경과한 초 수입니다.
EpochTimeTransformer.property.unit.description = 측정 단위(초, 밀리초 등)입니다. dotnet 및 관련 형식은 기준 시점도 Unix 에포크와 다르다는 점에 유의하세요.
EpochTimeTransformer.property.timezoneID.description = 시간대 ID입니다. 기본적으로 로컬 컴퓨터의 시간대를 사용합니다.\n시간대를 지정하는 세 가지 방법:\n\t-로컬 시간대 오프셋(+3, -04:30)\n\t-특정 시간대 오프셋(GMT+2, UTC+01:00)\n\t-지역 기반(UTC, ECT, PST 등)
RadixTransformer.general.description = 숫자를 지정한 진법으로 표시합니다.
URLTransformer.general.description = 값을 URL로 표시합니다. 내장 웹 브라우저가 포함된 미리 보기 패널을 제공합니다.
URLTransformer.property.pattern.label = URL 패턴
URLTransformer.property.pattern.description = URL 패턴입니다. ${value} 변수는 실제 값으로 대체됩니다.
BooleanTransformer.general.description = 숫자를 불리언으로 표시합니다.
UUIDTransformer.general.description = 바이너리 값을 UUID로 표시합니다.
UUIDTransformer.property.type.label = UUID 유형
UUIDTransformer.property.type.description = version1(빅 엔디언), version2(혼합 엔디언)\n 또는 ordered(최적화된 스토리지 사용 시) 버전의 UUID를 선택할 수 있습니다.
UUIDTransformer.property.case.label = 대소문자
UUIDTransformer.property.case.description = 소문자 또는 대문자입니다.
BinaryTransformer.general.description = 문자열 값을 바이너리 데이터로 표시합니다.
BinaryTransformer.property.format.label = 바이너리 형식
BinaryTransformer.property.format.description = 바이너리 값 형식입니다.
BinaryTransformer.property.encoding.label = 문자 인코딩
BinaryTransformer.property.encoding.description = 문자열 값을 바이트로 디코딩하는 데 사용되는 문자 인코딩입니다.
NumericTransformer.property.type.label = 유형
NumericTransformer.property.type.description = 문자열을 변환할 숫자 유형
