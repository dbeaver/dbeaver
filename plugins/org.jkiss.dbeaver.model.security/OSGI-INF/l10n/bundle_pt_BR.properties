macosKeychain.name = Chaves do macOS
macosKeychain.description = Armazena a senha de criptografia do armazenamento seguro nas Chaves do macOS. O macOS pode solicitar permissão para acessar as Chaves.
linuxKeyring.name = Chaveiro do Linux
linuxKeyring.description = Armazena a senha de criptografia do armazenamento seguro no chaveiro do ambiente de trabalho Linux. Exige libsecret e um Secret Service em execução.
