macosKeychain.name = Pęk kluczy macOS
macosKeychain.description = Przechowuje hasło szyfrujące bezpieczny magazyn w pęku kluczy macOS. System macOS może poprosić o zgodę na dostęp do pęku kluczy.
linuxKeyring.name = Brelok kluczy systemu Linux
linuxKeyring.description = Przechowuje hasło szyfrujące bezpieczny magazyn w breloku kluczy środowiska graficznego Linux. Wymaga biblioteki libsecret i uruchomionej usługi Secret Service.
