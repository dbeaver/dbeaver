macosKeychain.name = macOS-Schlüsselbund
macosKeychain.description = Speichert das Verschlüsselungspasswort des sicheren Speichers im macOS-Schlüsselbund. macOS fordert möglicherweise eine Zugriffsberechtigung für den Schlüsselbund an.
linuxKeyring.name = Linux-Schlüsselbund
linuxKeyring.description = Speichert das Verschlüsselungspasswort des sicheren Speichers im Schlüsselbund der Linux-Desktopumgebung. Erfordert libsecret und einen laufenden Secret Service.
