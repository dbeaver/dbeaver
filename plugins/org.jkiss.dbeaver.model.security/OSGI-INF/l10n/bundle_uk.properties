macosKeychain.name = В’язка ключів macOS
macosKeychain.description = Зберігає пароль шифрування захищеного сховища у в’язці ключів macOS. macOS може запитати дозвіл на доступ до в’язки ключів.
linuxKeyring.name = В’язка ключів Linux
linuxKeyring.description = Зберігає пароль шифрування захищеного сховища у в’язці ключів робочого середовища Linux. Потрібні libsecret і запущена служба Secret Service.
