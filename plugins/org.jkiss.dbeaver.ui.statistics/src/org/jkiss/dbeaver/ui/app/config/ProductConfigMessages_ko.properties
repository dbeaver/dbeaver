data_collection_title = 데이터 수집
data_collection_description = 익명 사용 통계를 전송하여 DBeaver 개선에 참여하세요
data_collection_agreement_text = 공유되는 통계는 다음과 같습니다:\n - 운영 체제 및 로캘\n - 사용하는 기능 및 인터페이스 작업\n - 사용하는 데이터베이스 유형\n\nDBeaver는 개인 정보, 연결 설정, 쿼리 텍스트 또는 데이터베이스 내용을 수집하지 않습니다. 통계는 DBeaver가 시작되거나 종료될 때 안전하게 전송됩니다.
data_collection_send_usage_statistics = 익명 사용 통계 공유
data_collection_do_not_send_usage_statistics = 익명 사용 통계 공유 안 함
data_collection_cannot_opt_out_notice = 환경 설정 → 일반 → 사용 통계에서 언제든지 이 설정을 변경할 수 있습니다.
