data_collection_title = Colectarea datelor
data_collection_description = Ajutați-ne să îmbunătățim DBeaver trimițând statistici anonime de utilizare
data_collection_agreement_text = Statisticile partajate includ:\n - Sistemul de operare și setările regionale\n - Funcționalitățile și acțiunile din interfață pe care le utilizați\n - Tipurile de baze de date cu care lucrați\n\nDBeaver nu colectează informații personale, setări de conexiune, textul interogărilor sau conținutul bazelor de date. Statisticile sunt trimise în siguranță la pornirea sau închiderea DBeaver.
data_collection_send_usage_statistics = Partajați statistici anonime de utilizare
data_collection_do_not_send_usage_statistics = Nu partajați statistici anonime de utilizare
data_collection_cannot_opt_out_notice = Puteți modifica oricând această setare în Preferințe → General → Statistici de utilizare.
