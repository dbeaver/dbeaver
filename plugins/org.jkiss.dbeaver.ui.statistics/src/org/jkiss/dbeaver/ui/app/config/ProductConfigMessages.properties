data_collection_title=Data collection
data_collection_description=Help us improve DBeaver by sending anonymous usage statistics
data_collection_agreement_text=Shared statistics include:\n - Your operating system and locale\n - Features and interface actions you use\n - Types of databases you work with\n\nDBeaver does not collect personal information, connection settings, query text, or database contents. Statistics are sent securely when DBeaver starts or closes.
data_collection_send_usage_statistics=Share anonymous usage statistics
data_collection_do_not_send_usage_statistics=Do not share anonymous usage statistics
data_collection_cannot_opt_out_notice=You can change this setting at any time in Preferences → General → Usage Statistics.
