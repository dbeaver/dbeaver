data_collection_title = 資料收集
data_collection_description = 傳送匿名使用統計資料，協助我們改善 DBeaver
data_collection_agreement_text = 共用的統計資料包括：\n - 您的作業系統及地區設定\n - 您使用的功能及介面動作\n - 您使用的資料庫類型\n\nDBeaver 不會收集個人資訊、連線設定、查詢文字或資料庫內容。統計資料會在 DBeaver 啟動或關閉時安全傳送。
data_collection_send_usage_statistics = 共用匿名使用統計資料
data_collection_do_not_send_usage_statistics = 不共用匿名使用統計資料
data_collection_cannot_opt_out_notice = 您可隨時在「偏好設定 → 一般 → 使用統計資料」中變更此設定。
