data_collection_title=Сбор данных
data_collection_description=Помогите нам улучшить DBeaver, отправляя анонимную статистику использования
data_collection_agreement_text=Передаваемая статистика включает:\n - Операционную систему и региональные настройки\n - Используемые функции и действия в интерфейсе\n - Типы баз данных, с которыми вы работаете\n\nDBeaver не собирает персональную информацию, настройки соединений, тексты запросов или содержимое баз данных. Статистика передаётся по защищённому соединению при запуске или закрытии DBeaver.
data_collection_send_usage_statistics=Отправлять анонимную статистику использования
data_collection_do_not_send_usage_statistics=Не отправлять анонимную статистику использования
data_collection_cannot_opt_out_notice=Вы можете изменить этот параметр в любое время: Настройки → Общие → Статистика использования.
