data_collection_title=Collecte de données
data_collection_description=Aidez-nous à améliorer DBeaver en envoyant des statistiques d'utilisation anonymes
data_collection_agreement_text=Les statistiques partagées comprennent :\n - Votre système d'exploitation et vos paramètres régionaux\n - Les fonctionnalités et les actions de l'interface que vous utilisez\n - Les types de bases de données avec lesquels vous travaillez\n\nDBeaver ne collecte aucune information personnelle, aucun paramètre de connexion, aucun texte de requête ni aucun contenu de base de données. Les statistiques sont envoyées de manière sécurisée au démarrage ou à la fermeture de DBeaver.
data_collection_send_usage_statistics=Partager des statistiques d'utilisation anonymes
data_collection_do_not_send_usage_statistics=Ne pas partager de statistiques d'utilisation anonymes
data_collection_cannot_opt_out_notice=Vous pouvez modifier ce paramètre à tout moment dans Préférences → Général → Statistiques d'utilisation.
