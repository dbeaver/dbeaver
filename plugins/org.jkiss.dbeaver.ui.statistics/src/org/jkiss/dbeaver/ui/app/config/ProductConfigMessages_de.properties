data_collection_title = Datenerfassung
data_collection_description = Helfen Sie uns, DBeaver durch die Übermittlung anonymer Nutzungsstatistiken zu verbessern
data_collection_agreement_text = Die übermittelten Statistiken umfassen:\n - Ihr Betriebssystem und Ihre Gebietsschemaeinstellungen\n - Die von Ihnen verwendeten Funktionen und Aktionen der Benutzeroberfläche\n - Die Datenbanktypen, mit denen Sie arbeiten\n\nDBeaver erfasst keine personenbezogenen Informationen, Verbindungseinstellungen, Abfragetexte oder Datenbankinhalte. Statistiken werden beim Starten oder Beenden von DBeaver sicher übertragen.
data_collection_send_usage_statistics = Anonyme Nutzungsstatistiken übermitteln
data_collection_do_not_send_usage_statistics = Keine anonymen Nutzungsstatistiken übermitteln
data_collection_cannot_opt_out_notice = Sie können diese Einstellung jederzeit unter Einstellungen → Allgemein → Nutzungsstatistik ändern.
