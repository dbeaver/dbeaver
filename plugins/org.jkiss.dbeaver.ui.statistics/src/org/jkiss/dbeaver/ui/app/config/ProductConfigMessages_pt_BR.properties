data_collection_title = Coleta de dados
data_collection_description = Ajude-nos a melhorar o DBeaver enviando estatísticas de uso anônimas
data_collection_agreement_text = As estatísticas compartilhadas incluem:\n - Seu sistema operacional e localidade\n - Recursos e ações da interface que você usa\n - Tipos de bancos de dados com os quais trabalha\n\nO DBeaver não coleta informações pessoais, configurações de conexão, texto de consultas nem conteúdo de bancos de dados. As estatísticas são enviadas com segurança quando o DBeaver inicia ou fecha.
data_collection_send_usage_statistics = Compartilhar estatísticas de uso anônimas
data_collection_do_not_send_usage_statistics = Não compartilhar estatísticas de uso anônimas
data_collection_cannot_opt_out_notice = Você pode alterar esta configuração a qualquer momento em Preferências → Geral → Estatísticas de uso.
