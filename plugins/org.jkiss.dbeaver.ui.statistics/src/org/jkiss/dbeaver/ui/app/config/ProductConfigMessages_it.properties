data_collection_title = Raccolta dati
data_collection_description = Aiutaci a migliorare DBeaver inviando statistiche anonime di utilizzo
data_collection_agreement_text = Le statistiche condivise includono:\n - Il sistema operativo e le impostazioni locali\n - Le funzionalità e le azioni dell'interfaccia usate\n - I tipi di database utilizzati\n\nDBeaver non raccoglie informazioni personali, impostazioni di connessione, testo delle query o contenuti dei database. Le statistiche vengono inviate in modo sicuro all'avvio o alla chiusura di DBeaver.
data_collection_send_usage_statistics = Condividi statistiche anonime di utilizzo
data_collection_do_not_send_usage_statistics = Non condividere statistiche anonime di utilizzo
data_collection_cannot_opt_out_notice = È possibile modificare questa impostazione in qualsiasi momento in Preferenze → Generale → Statistiche di utilizzo.
