data_collection_title=Zbieranie danych
data_collection_description=Pomóż nam ulepszać DBeaver, wysyłając anonimowe statystyki użycia
data_collection_agreement_text=Udostępniane statystyki obejmują:\n - system operacyjny i ustawienia regionalne\n - używane funkcje i akcje w interfejsie\n - typy baz danych, z którymi pracujesz\n\nDBeaver nie zbiera danych osobowych, ustawień połączeń, tekstu zapytań ani zawartości baz danych. Statystyki są wysyłane w bezpieczny sposób przy uruchamianiu lub zamykaniu DBeaver.
data_collection_send_usage_statistics=Udostępniaj anonimowe statystyki użycia
data_collection_do_not_send_usage_statistics=Nie udostępniaj anonimowych statystyk użycia
data_collection_cannot_opt_out_notice=To ustawienie możesz zmienić w dowolnej chwili w Ustawienia → Ogólne → Statystyki użycia.
