data_collection_title = Recopilación de datos
data_collection_description = Ayúdenos a mejorar DBeaver enviando estadísticas de uso anónimas
data_collection_agreement_text = Las estadísticas compartidas incluyen:\n - Su sistema operativo y configuración regional\n - Las funciones y acciones de la interfaz que utiliza\n - Los tipos de bases de datos con los que trabaja\n\nDBeaver no recopila información personal, configuraciones de conexión, texto de consultas ni contenido de las bases de datos. Las estadísticas se envían de forma segura al iniciar o cerrar DBeaver.
data_collection_send_usage_statistics = Compartir estadísticas de uso anónimas
data_collection_do_not_send_usage_statistics = No compartir estadísticas de uso anónimas
data_collection_cannot_opt_out_notice = Puede cambiar esta configuración en cualquier momento en Preferencias → General → Estadísticas de uso.
