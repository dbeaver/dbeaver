data_collection_title = データ収集
data_collection_description = 匿名の使用統計を送信して DBeaver の改善にご協力ください
data_collection_agreement_text = 共有される統計には次の情報が含まれます:\n - オペレーティングシステムとロケール\n - 使用する機能とインターフェース上の操作\n - 使用するデータベースの種類\n\nDBeaver は個人情報、接続設定、クエリーテキスト、データベースの内容を収集しません。統計は DBeaver の起動時または終了時に安全に送信されます。
data_collection_send_usage_statistics = 匿名の使用統計を共有する
data_collection_do_not_send_usage_statistics = 匿名の使用統計を共有しない
data_collection_cannot_opt_out_notice = この設定は「設定」→「一般」→「使用統計」でいつでも変更できます。
