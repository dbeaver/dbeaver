statistic_collection_pref_content_datashare_msg = Para melhorar a experiência do usuário e o desempenho do produto, o DBeaver pode coletar algumas estatísticas anônimas\nsobre o uso de recursos e a configuração do produto.\n\nEsses dados não incluem informações pessoais ou confidenciais, como configurações de conexão de banco de dados,\nconsultas executadas, informações de bancos de dados etc. Os dados enviados estão em conformidade com a <a>Política de Privacidade da DBeaver Corporation</a>.
