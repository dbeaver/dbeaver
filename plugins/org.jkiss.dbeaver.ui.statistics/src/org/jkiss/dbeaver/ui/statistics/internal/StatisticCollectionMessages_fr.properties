statistic_collection_dialog_title=Collecte de statistiques
statistic_collection_pref_link=Vous pouvez modifier ce comportement à tout moment dans les <a>Préférences</a>.
statistic_collection_dont_share_lbl=Ne pas partager de données.
statistic_collection_confirm_lbl=Confirmer
statistic_collection_pref_group_label=Partage de données
statistic_collection_pref_send_btn_label=Envoyer des statistiques d'utilisation
statistic_collection_pref_content_main_msg=Nous envoyons les statistiques avant la fermeture ou au démarrage de l'application.\nLes informations envoyées sont les suivantes :\n - Des informations succinctes sur votre système d'exploitation et vos paramètres régionaux\n - La liste des actions que vous effectuez dans l'interface, pour mieux comprendre les méthodes de travail des utilisateurs\n - Les types de bases de données que vous utilisez, pour améliorer la prise en charge des plus populaires
statistic_collection_pref_content_documentation_link=Pour en savoir plus sur la collecte de statistiques, consultez la <a>documentation</a>.
statistic_collection_pref_content_opensource_link=DBeaver est open source et vous pouvez vérifier exactement ce que nous envoyons\n dans notre code source <a>{0}</a>\n
statistic_collection_pref_content_datashare_msg=Pour améliorer l'expérience utilisateur et les performances du produit, DBeaver peut collecter des statistiques anonymes\nsur l'utilisation des fonctionnalités et la configuration du produit.\n\nCes données ne comprennent aucune information personnelle ou sensible, telle que la configuration des connexions aux bases de données,\nles requêtes exécutées, les informations des bases de données, etc. Les données envoyées respectent la <a>politique de confidentialité de DBeaver Corporation</a>.
