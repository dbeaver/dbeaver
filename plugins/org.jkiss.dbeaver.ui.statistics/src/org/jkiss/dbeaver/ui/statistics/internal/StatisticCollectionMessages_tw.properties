statistic_collection_pref_group_label = 資料共用
statistic_collection_pref_send_btn_label = 傳送使用統計資料
statistic_collection_pref_content_main_msg = 我們會在應用程式關閉前或啟動期間傳送統計資料。\n我們傳送的資訊包括：\n  - 您的作業系統與地區設定的簡要資訊\n  - 您在 UI 中執行的操作清單，以便更了解使用者工作流程\n  - 您使用的資料庫類型，以改善對熱門資料庫的支援
statistic_collection_pref_content_documentation_link = 您可以在<a>說明文件</a>中深入了解統計資料收集。
statistic_collection_pref_content_opensource_link = DBeaver 為開放原始碼，您隨時可以在原始碼 <a>{0}</a> 中驗證我們確切傳送的內容\n
statistic_collection_pref_content_datashare_msg = 為改善使用者體驗與產品效能，DBeaver 可收集部分匿名統計\n資料，涵蓋功能使用情況與產品設定。\n\n此資料不包含任何個人或敏感資訊，例如資料庫連線設定、\n已執行的查詢、資料庫資訊等。所傳送的資料遵循 <a>DBeaver Corporation 隱私權政策</a>。
