statistic_collection_dialog_title = Recopilación de estadísticas
statistic_collection_pref_link = Puede cambiar este comportamiento en cualquier momento en <a>Preferencias</a>.
statistic_collection_dont_share_lbl = No compartir datos.
statistic_collection_confirm_lbl = Confirmar
statistic_collection_pref_group_label = Uso compartido de datos
statistic_collection_pref_send_btn_label = Enviar estadísticas de uso
statistic_collection_pref_content_main_msg = Enviamos estadísticas antes de cerrar la aplicación o durante el inicio.\nLa información que enviamos es:\n - Información breve sobre su sistema operativo y configuración regional\n - Lista de acciones que realiza en la interfaz para comprender mejor el flujo de trabajo de los usuarios\n - Tipos de bases de datos que utiliza para mejorar la compatibilidad con las más populares
statistic_collection_pref_content_documentation_link = Puede obtener más información sobre la recopilación de estadísticas en la <a>documentación</a>.
statistic_collection_pref_content_opensource_link = DBeaver es de código abierto y siempre puede comprobar qué enviamos exactamente\n en nuestro código fuente <a>{0}</a>\n
statistic_collection_pref_content_datashare_msg = Para mejorar la experiencia de usuario y el rendimiento del producto, DBeaver puede recopilar datos estadísticos anónimos\nsobre el uso de las funciones y la configuración del producto.\n\nEstos datos no incluyen información personal ni confidencial, como la configuración de conexión a bases de datos,\nlas consultas ejecutadas, información de las bases de datos, etc. Los datos enviados cumplen la <a>Política de privacidad de DBeaver Corporation</a>.
