statistic_collection_pref_content_datashare_msg=Для улучшения удобства использования и производительности DBeaver может собирать анонимную статистику\nоб использовании функций и конфигурации продукта.\n\nЭти данные не содержат персональную или конфиденциальную информацию, например настройки соединений с базами данных,\nвыполняемые запросы, сведения о базах данных и т. д. Передаваемые данные соответствуют <a>Политике конфиденциальности DBeaver Corporation</a>.
