statistic_collection_dialog_title = Raccolta delle statistiche
statistic_collection_pref_link = È sempre possibile modificare questo comportamento nelle <a>Preferenze</a>.
statistic_collection_dont_share_lbl = Non condividere dati.
statistic_collection_confirm_lbl = Conferma
statistic_collection_pref_group_label = Condivisione dati
statistic_collection_pref_send_btn_label = Invia statistiche di utilizzo
statistic_collection_pref_content_main_msg = Inviamo statistiche prima della chiusura dell'applicazione o durante l'avvio.\nLe informazioni inviate sono:\n - Informazioni sintetiche sul sistema operativo e sulle impostazioni locali\n - Elenco delle azioni eseguite nell'interfaccia per comprendere meglio il flusso di lavoro degli utenti\n - Tipi di database usati per migliorare il supporto di quelli più diffusi
statistic_collection_pref_content_documentation_link = Ulteriori informazioni sulla raccolta delle statistiche sono disponibili nella <a>documentazione</a>.
statistic_collection_pref_content_opensource_link = DBeaver è open source ed è sempre possibile verificare esattamente quali dati vengono inviati\n nel codice sorgente <a>{0}</a>\n
statistic_collection_pref_content_datashare_msg = Per migliorare l'esperienza utente e le prestazioni del prodotto, DBeaver può raccogliere alcuni dati statistici anonimi\nsull'utilizzo delle funzionalità e sulla configurazione del prodotto.\n\nQuesti dati non includono informazioni personali o sensibili, come la configurazione delle connessioni ai database,\nle query eseguite, le informazioni sui database, ecc. I dati inviati rispettano l'<a>Informativa sulla privacy di DBeaver Corporation</a>.
