statistic_collection_dialog_title = Statistikerfassung
statistic_collection_pref_link = Sie können dieses Verhalten jederzeit in den <a>Einstellungen</a> ändern.
statistic_collection_dont_share_lbl = Keine Daten übermitteln.
statistic_collection_confirm_lbl = Bestätigen
statistic_collection_pref_group_label = Datenübermittlung
statistic_collection_pref_send_btn_label = Nutzungsstatistiken senden
statistic_collection_pref_content_main_msg = Wir senden Statistiken vor dem Beenden oder beim Starten der Anwendung.\nFolgende Informationen werden gesendet:\n - Kurze Angaben zu Ihrem Betriebssystem und Ihren Gebietsschemaeinstellungen\n - Eine Liste der in der Benutzeroberfläche ausgeführten Aktionen, um die Arbeitsabläufe besser zu verstehen\n - Die verwendeten Datenbanktypen, um die Unterstützung häufig verwendeter Datenbanken zu verbessern
statistic_collection_pref_content_documentation_link = Weitere Informationen zur Statistikerfassung finden Sie in der <a>Dokumentation</a>.
statistic_collection_pref_content_opensource_link = DBeaver ist quelloffen. Sie können jederzeit in unserem Quellcode prüfen, welche Daten wir genau senden:\n <a>{0}</a>\n
statistic_collection_pref_content_datashare_msg = Zur Verbesserung der Benutzerfreundlichkeit und Produktleistung kann DBeaver anonyme statistische\nDaten über die Nutzung von Funktionen und die Produktkonfiguration erfassen.\n\nDiese Daten enthalten keine personenbezogenen oder vertraulichen Informationen wie Datenbank-Verbindungseinstellungen,\nausgeführte Abfragen, Datenbankinformationen usw. Die Datenübermittlung entspricht der <a>Datenschutzrichtlinie der DBeaver Corporation</a>.
