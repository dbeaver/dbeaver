statistic_collection_pref_content_main_msg=نرسل الإحصاءات قبل إغلاق التطبيق أو أثناء بدء تشغيله.\nتتضمن المعلومات التي نرسلها:\n - معلومات موجزة عن نظام التشغيل والإعدادات المحلية\n - قائمة بالإجراءات التي تنفذها في الواجهة لفهم سير عمل المستخدمين بصورة أفضل\n - أنواع قواعد البيانات التي تستخدمها لتحسين دعم الأنواع الشائعة
statistic_collection_pref_content_documentation_link=يمكنك معرفة المزيد عن جمع الإحصاءات في <a>الوثائق</a>.
statistic_collection_pref_content_opensource_link=برنامج DBeaver مفتوح المصدر، ويمكنك دائمًا التحقق مما نرسله تحديدًا\n في تعليماتنا البرمجية المصدرية <a>{0}</a>\n
statistic_collection_pref_content_datashare_msg=لتحسين تجربة المستخدم وأداء المنتج، يمكن لـ DBeaver جمع بعض البيانات الإحصائية المجهولة\nعن استخدام الميزات وتكوين المنتج.\n\nلا تتضمن هذه البيانات أي معلومات شخصية أو حساسة، مثل تكوين الاتصال بقاعدة البيانات،\nأو الاستعلامات المنفّذة، أو معلومات قاعدة البيانات، وغيرها. تتوافق البيانات المرسلة مع <a>سياسة خصوصية DBeaver Corporation</a>.
