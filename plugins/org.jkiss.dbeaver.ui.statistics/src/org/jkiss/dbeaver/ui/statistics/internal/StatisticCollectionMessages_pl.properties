statistic_collection_pref_group_label=Udostępnianie danych
statistic_collection_pref_send_btn_label=Wysyłaj statystyki użycia
statistic_collection_pref_content_main_msg = Statystyki wysyłamy przed zamknięciem aplikacji lub podczas jej uruchamiania.\nWysyłamy następujące informacje:\n  - krótkie informacje o systemie operacyjnym i ustawieniach regionalnych\n  - listę akcji wykonywanych w interfejsie, aby lepiej zrozumieć sposób pracy użytkowników\n  - typy używanych baz danych, aby lepiej wspierać te popularne
statistic_collection_pref_content_documentation_link = Więcej o zbieraniu statystyk znajdziesz w <a>dokumentacji</a>.
statistic_collection_pref_content_opensource_link = DBeaver ma otwarty kod źródłowy, więc zawsze możesz sprawdzić, co dokładnie wysyłamy,\n w naszym kodzie źródłowym <a>{0}</a>\n
statistic_collection_pref_content_datashare_msg = Aby poprawić wygodę użytkowania i wydajność produktu, DBeaver może zbierać anonimowe dane statystyczne\no używaniu funkcji i konfiguracji produktu.\n\nDane te nie zawierają żadnych informacji osobistych ani poufnych, takich jak konfiguracja połączeń z bazami danych,\nwykonywane zapytania, informacje o bazach danych itp. Wysyłane dane są zgodne z <a>Polityką prywatności DBeaver Corporation</a>.
