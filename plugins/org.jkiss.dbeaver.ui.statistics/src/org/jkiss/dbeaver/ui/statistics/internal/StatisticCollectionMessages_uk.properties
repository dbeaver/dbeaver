statistic_collection_pref_group_label = Надсилання даних
statistic_collection_pref_send_btn_label = Надсилати статистику використання
statistic_collection_pref_content_main_msg = Ми надсилаємо статистику перед закриттям застосунку або під час його запуску.\nНадсилається така інформація:\n - Стислі відомості про ОС і локаль\n - Перелік дій в інтерфейсі для кращого розуміння робочих процесів користувачів\n - Типи використовуваних баз даних для покращення підтримки популярних систем
statistic_collection_pref_content_documentation_link = Докладніше про збирання статистики можна дізнатися в <a>документації</a>.
statistic_collection_pref_content_opensource_link = DBeaver має відкритий код, і ви завжди можете перевірити, що саме ми надсилаємо,\n у вихідному коді <a>{0}</a>\n
statistic_collection_pref_content_datashare_msg = Щоб покращити зручність використання та продуктивність продукту, DBeaver може збирати анонімні статистичні\nдані про використання функцій і конфігурацію продукту.\n\nЦі дані не містять особистої чи конфіденційної інформації, зокрема налаштувань з’єднань із базами даних,\nвиконаних запитів, інформації баз даних тощо. Надсилання даних відповідає <a>Політиці конфіденційності DBeaver Corporation</a>.
