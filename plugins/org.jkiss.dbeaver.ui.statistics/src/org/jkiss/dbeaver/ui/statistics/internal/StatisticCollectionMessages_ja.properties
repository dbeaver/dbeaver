statistic_collection_dialog_title = 統計の収集
statistic_collection_pref_link = この動作は<a>設定</a>でいつでも変更できます。
statistic_collection_dont_share_lbl = データを共有しない。
statistic_collection_confirm_lbl = 確認
statistic_collection_pref_group_label = データ共有
statistic_collection_pref_send_btn_label = 使用統計を送信する
statistic_collection_pref_content_main_msg = アプリケーションの終了前または起動時に統計を送信します。\n送信する情報は次のとおりです:\n - OS とロケールの概要\n - ユーザーの作業手順を把握するための UI 操作の一覧\n - よく使用されるデータベースへの対応を改善するための、使用するデータベースの種類
statistic_collection_pref_content_documentation_link = 統計の収集について詳しくは、<a>ドキュメント</a>をご覧ください。
statistic_collection_pref_content_opensource_link = DBeaver はオープンソースです。送信される情報の詳細は、いつでも\nソースコード <a>{0}</a> で確認できます。\n
statistic_collection_pref_content_datashare_msg = ユーザーエクスペリエンスと製品のパフォーマンスを改善するため、DBeaver は機能の使用状況と\n製品構成について匿名の統計データを収集することがあります。\n\nこのデータには、データベース接続設定、実行したクエリー、データベース情報などの\n個人情報や機密情報は含まれません。送信するデータは<a>DBeaver Corporation プライバシーポリシー</a>に準拠しています。
