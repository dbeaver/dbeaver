statistic_collection_dialog_title = Colectarea statisticilor
statistic_collection_pref_link = Puteți modifica oricând acest comportament în <a>Preferințe</a>.
statistic_collection_dont_share_lbl = Nu partajați date.
statistic_collection_confirm_lbl = Confirmați
statistic_collection_pref_group_label = Partajarea datelor
statistic_collection_pref_send_btn_label = Trimiteți statistici de utilizare
statistic_collection_pref_content_main_msg = Trimitem statistici înainte de închiderea aplicației sau în timpul pornirii.\nInformațiile trimise sunt:\n - Informații sumare despre sistemul de operare și setările regionale\n - Lista acțiunilor efectuate în interfață, pentru a înțelege mai bine modul de lucru al utilizatorilor\n - Tipurile de baze de date utilizate, pentru a îmbunătăți suportul pentru cele populare
statistic_collection_pref_content_documentation_link = Puteți afla mai multe despre colectarea statisticilor în <a>documentație</a>.
statistic_collection_pref_content_opensource_link = DBeaver are sursă deschisă și puteți verifica oricând ce anume trimitem\n în codul nostru sursă <a>{0}</a>\n
statistic_collection_pref_content_datashare_msg = Pentru a îmbunătăți experiența utilizatorilor și performanța produsului, DBeaver poate colecta unele date statistice anonime\ndespre utilizarea funcționalităților și configurarea produsului.\n\nAceste date nu includ informații personale sau sensibile, precum configurația conexiunilor la baze de date,\ninterogările executate, informații din bazele de date etc. Datele trimise respectă <a>Politica de confidențialitate DBeaver Corporation</a>.
