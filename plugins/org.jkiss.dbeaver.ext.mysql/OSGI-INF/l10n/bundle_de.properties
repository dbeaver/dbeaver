meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.name = Datenlänge
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.description = Bei MyISAM ist Data_length die Länge der Datendatei in Bytes.\nBei InnoDB ist Data_length der ungefähr für den Clustered-Index zugewiesene Speicherplatz in Bytes.\nEr entspricht der Größe des Clustered-Index in Seiten, multipliziert mit der InnoDB-Seitengröße.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.name = Maximale Datenlänge
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.description = Bei MyISAM ist Max_data_length die maximale Länge der Datendatei.\nDies ist die Gesamtzahl der Datenbytes, die bei der verwendeten Datenzeigergröße in der Tabelle gespeichert werden können.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataFree.name = Freier Datenspeicher
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.name = Indexlänge
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.description = Bei MyISAM ist Index_length die Länge der Indexdatei in Bytes.\nBei InnoDB ist Index_length der ungefähr für Nicht-Clustered-Indizes zugewiesene Speicherplatz in Bytes.\nEr entspricht der Summe der Größen dieser Indizes in Seiten, multipliziert mit der InnoDB-Seitengröße.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.rowFormat.name = Zeilenformat
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.rowFormat.description = Das Speicherformat der Zeilen (Fixed, Dynamic, Compressed, Redundant, Compact).\nBei MyISAM-Tabellen entspricht Dynamic dem von myisamchk -dvv als Packed gemeldeten Format.
