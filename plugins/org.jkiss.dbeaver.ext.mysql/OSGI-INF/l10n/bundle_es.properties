meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.name = Longitud de datos
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.description = En MyISAM, Data_length es la longitud del archivo de datos, en bytes.\nEn InnoDB, Data_length es el espacio aproximado asignado al índice agrupado, en bytes.\nEn concreto, es el tamaño del índice agrupado, en páginas, multiplicado por el tamaño de página de InnoDB.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.name = Longitud máxima de datos
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.description = En MyISAM, Max_data_length es la longitud máxima del archivo de datos.\nEs el número total de bytes de datos que pueden almacenarse en la tabla según el tamaño del puntero de datos utilizado.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataFree.name = Espacio de datos libre
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.name = Longitud del índice
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.description = En MyISAM, Index_length es la longitud del archivo de índices, en bytes.\nEn InnoDB, Index_length es el espacio aproximado asignado a los índices no agrupados, en bytes.\nEn concreto, es la suma de los tamaños de los índices no agrupados, en páginas, multiplicada por el tamaño de página de InnoDB.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.rowFormat.name = Formato de fila
