meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.createTime.description = 테이블이 생성된 시각입니다.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.updateTime.name = 갱신 시각
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.updateTime.description = 데이터 파일이 마지막으로 갱신된 시각입니다. 일부 스토리지 엔진에서는 이 값이 NULL입니다.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.checkTime.name = 검사 시각
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.checkTime.description = 테이블을 마지막으로 검사한 시각입니다.\n일부 스토리지 엔진은 이 시각을 갱신하지 않으며, 이 경우 값은 항상 NULL입니다.\n파티션된 InnoDB 테이블의 Check_time은 항상 NULL입니다.
