meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.avgRowLength.description = 평균 행 길이입니다.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.name = 데이터 길이
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.description = MyISAM에서 Data_length는 데이터 파일의 바이트 단위 길이입니다.\nInnoDB에서 Data_length는 클러스터형 인덱스에 할당된 대략적인 공간의 바이트 수입니다.\n구체적으로는 클러스터형 인덱스의 페이지 수에 InnoDB 페이지 크기를 곱한 값입니다.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.name = 최대 데이터 길이
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.description = MyISAM에서 Max_data_length는 데이터 파일의 최대 길이입니다.\n이는 사용하는 데이터 포인터 크기를 기준으로 테이블에 저장할 수 있는 데이터의 총 바이트 수입니다.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataFree.name = 여유 데이터 공간
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.name = 인덱스 길이
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.description = MyISAM에서 Index_length는 인덱스 파일의 바이트 단위 길이입니다.\nInnoDB에서 Index_length는 비클러스터형 인덱스에 할당된 대략적인 공간의 바이트 수입니다.\n구체적으로는 비클러스터형 인덱스의 페이지 수 합계에 InnoDB 페이지 크기를 곱한 값입니다.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.rowFormat.name = 행 형식
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.rowFormat.description = 행 저장 형식(Fixed, Dynamic, Compressed, Redundant, Compact)입니다.\nMyISAM 테이블에서 Dynamic은 myisamchk -dvv가 보고하는 Packed에 해당합니다.
