meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.engine.description=Moteur de stockage de la table.\nPour les tables partitionnées, Engine indique le moteur de stockage utilisé par toutes les partitions.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.autoIncrement.description=Prochaine valeur AUTO_INCREMENT de cette table.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.collation.description=Collation par défaut de la table.\nLe résultat ne donne pas explicitement le jeu de caractères par défaut, mais le nom de la collation commence par celui du jeu de caractères.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.avgRowLength.description=Longueur moyenne des lignes.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.description=Pour MyISAM, Data_length est la longueur du fichier de données, en octets.\nPour InnoDB, Data_length est l'espace approximatif alloué à l'index regroupé, en octets.\nIl s'agit précisément de la taille de l'index regroupé, en pages, multipliée par la taille de page InnoDB.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.description=Pour MyISAM, Max_data_length est la longueur maximale du fichier de données.\nIl s'agit du nombre total d'octets de données pouvant être stockés dans la table, compte tenu de la taille du pointeur de données utilisé.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.description=Pour MyISAM, Index_length est la longueur du fichier d'index, en octets.\nPour InnoDB, Index_length est l'espace approximatif alloué aux index non regroupés, en octets.\nIl s'agit précisément de la somme des tailles des index non regroupés, en pages, multipliée par la taille de page InnoDB.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.rowFormat.description=Format de stockage des lignes (Fixed, Dynamic, Compressed, Redundant, Compact).\nPour les tables MyISAM, Dynamic correspond à Packed dans le résultat de myisamchk -dvv.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.createTime.description=Date de création de la table.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.updateTime.description=Date de dernière mise à jour du fichier de données. Pour certains moteurs de stockage, cette valeur est NULL.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.checkTime.description=Date de dernière vérification de la table.\nCertains moteurs de stockage ne mettent pas cette date à jour ; la valeur est alors toujours NULL.\nPour les tables InnoDB partitionnées, Check_time est toujours NULL.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.partitioned.name=Partitionné
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.partitioned.description=La table possède des partitions
