meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.name = Lunghezza dei dati
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.description = Per MyISAM, Data_length è la lunghezza del file dei dati in byte.\nPer InnoDB, Data_length è la quantità approssimativa di spazio allocato per l'indice clusterizzato in byte.\nPrecisamente, è la dimensione dell'indice clusterizzato in pagine moltiplicata per la dimensione di pagina InnoDB.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.name = Lunghezza massima dei dati
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.description = Per MyISAM, Max_data_length è la lunghezza massima del file dei dati.\nÈ il numero totale di byte di dati archiviabili nella tabella, data la dimensione del puntatore ai dati utilizzata.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataFree.name = Spazio dati libero
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.name = Lunghezza degli indici
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.description = Per MyISAM, Index_length è la lunghezza del file degli indici in byte.\nPer InnoDB, Index_length è la quantità approssimativa di spazio allocato per gli indici non clusterizzati in byte.\nPrecisamente, è la somma delle dimensioni degli indici non clusterizzati in pagine moltiplicata per la dimensione di pagina InnoDB.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.rowFormat.name = Formato delle righe
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.rowFormat.description = Formato di archiviazione delle righe (Fixed, Dynamic, Compressed, Redundant, Compact).\nPer le tabelle MyISAM, Dynamic corrisponde al valore Packed riportato da myisamchk -dvv.
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.createTime.name = Data di creazione
