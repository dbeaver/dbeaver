meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.name=طول البيانات
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.description=في MyISAM، تكون Data_length طول ملف البيانات بالبايت.\nفي InnoDB، تكون Data_length مقدار المساحة المخصصة للفهرس العنقودي تقريبًا بالبايت.\nوتحديدًا، هي حجم الفهرس العنقودي بالصفحات مضروبًا في حجم صفحة InnoDB.
