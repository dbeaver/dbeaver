meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.name=طول الفهرس
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.description=في MyISAM، تكون Index_length طول ملف الفهرس بالبايت.\nفي InnoDB، تكون Index_length مقدار المساحة المخصصة للفهارس غير العنقودية تقريبًا بالبايت.\nوتحديدًا، هي مجموع أحجام الفهارس غير العنقودية بالصفحات مضروبًا في حجم صفحة InnoDB.
