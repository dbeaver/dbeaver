meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.rowFormat.description=تنسيق تخزين الصفوف (Fixed, Dynamic, Compressed, Redundant, Compact).\nلجداول MyISAM، تقابل Dynamic القيمة Packed التي يعرضها myisamchk -dvv.
