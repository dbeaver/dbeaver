meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.description=في MyISAM، تكون Max_data_length أقصى طول لملف البيانات.\nوهو إجمالي عدد بايتات البيانات التي يمكن تخزينها في الجدول وفقًا لحجم مؤشر البيانات المستخدم.
