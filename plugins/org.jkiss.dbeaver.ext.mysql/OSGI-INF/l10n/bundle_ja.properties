meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.dataLength.description = MyISAMでは、Data_lengthはデータファイルの長さ（バイト）です。\nInnoDBでは、クラスター化インデックスに割り当てられた領域のおおよそのサイズ（バイト）です。\n具体的には、インデックスのページ数にInnoDBのページサイズを掛けた値です。
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.maxDataLength.description = MyISAMでは、Max_data_lengthはデータファイルの最大長です。\n使用するデータポインターのサイズに基づき、テーブルに格納できるデータの合計バイト数を表します。
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.indexLength.description = MyISAMでは、Index_lengthはインデックスファイルの長さ（バイト）です。\nInnoDBでは、非クラスター化インデックスに割り当てられた領域のおおよそのサイズ（バイト）です。\n具体的には、非クラスター化インデックスのページ数の合計にInnoDBのページサイズを掛けた値です。
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.rowFormat.description = 行の格納形式（Fixed、Dynamic、Compressed、Redundant、Compact）。\nMyISAMテーブルでは、Dynamicはmyisamchk -dvvがPackedとして報告する形式に相当します。
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.createTime.description = テーブルの作成日時。
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.updateTime.description = データファイルの最終更新日時。一部のストレージエンジンではNULLです。
meta.org.jkiss.dbeaver.ext.mysql.model.MySQLTable$AdditionalInfo.checkTime.description = テーブルの最終チェック日時。\nこの時刻を更新しないストレージエンジンでは、常にNULLです。\nパーティション化されたInnoDBテーブルでは、Check_timeは常にNULLです。
