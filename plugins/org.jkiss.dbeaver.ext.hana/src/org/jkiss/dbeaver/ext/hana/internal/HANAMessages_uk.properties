dialog_invalid_license_input_label = Ліцензійний ключ недійсний або строк його дії завершився. У цьому діалозі можна встановити новий ліцензійний ключ.\nПотрібно надати ліцензійний ключ для ID системи <{0}> та апаратного ключа <{1}>.
dialog_invalid_license_input_label_systemdb = \n\nВи встановлюєте ліцензійний ключ на рекомендованому рівні системної бази даних.\nЯкщо ключ було встановлено на рівні бази даних орендаря, слід видалити старий\nліцензійний ключ із бази даних орендаря або встановити новий ключ також і там.
dialog_invalid_license_input_label_tenantdb = \n\nВи встановлюєте ліцензійний ключ на рівні бази даних орендаря. Це слід робити, лише якщо ви хочете,\nщоб ключ застосовувався тільки до бази даних орендаря, або якщо його було встановлено тут раніше.\nІнакше слід установити ліцензійний ключ на рекомендованому рівні системної бази даних.
