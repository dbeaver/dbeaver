dialog_invalid_license_input_label_systemdb = \n\nSie installieren den Lizenzschlüssel auf der empfohlenen Systemdatenbankebene.\nFalls er auf Mandantendatenbankebene installiert war, sollten Sie entweder den alten\nLizenzschlüssel in der Mandantendatenbank entfernen oder diesen neuen Lizenzschlüssel auch dort installieren.
dialog_invalid_license_input_label_tenantdb = \n\nSie installieren den Lizenzschlüssel auf Mandantendatenbankebene. Dies sollten Sie nur tun, wenn\nder Lizenzschlüssel ausschließlich für die Mandantendatenbank gelten soll oder zuvor hier installiert war.\nAndernfalls sollten Sie den Lizenzschlüssel auf der empfohlenen Systemdatenbankebene installieren.
