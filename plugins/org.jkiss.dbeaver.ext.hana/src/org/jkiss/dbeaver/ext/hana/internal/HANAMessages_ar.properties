dialog_invalid_license_input_label_systemdb=\n\nأنت تثبّت مفتاح الترخيص على مستوى قاعدة بيانات النظام الموصى به.\nإذا كان مثبّتًا على مستوى قاعدة بيانات المستأجر، فيجب إما إزالة مفتاح الترخيص القديم\nمن قاعدة بيانات المستأجر أو تثبيت مفتاح الترخيص الجديد فيها أيضًا.
dialog_invalid_license_input_label_tenantdb=\n\nأنت تثبّت مفتاح الترخيص على مستوى قاعدة بيانات المستأجر. لا تفعل ذلك إلا إذا أردت\nأن يسري المفتاح على قاعدة بيانات المستأجر وحدها، أو إذا كان مثبّتًا هنا من قبل.\nوإلا، فينبغي تثبيت مفتاح الترخيص على مستوى قاعدة بيانات النظام الموصى به.
