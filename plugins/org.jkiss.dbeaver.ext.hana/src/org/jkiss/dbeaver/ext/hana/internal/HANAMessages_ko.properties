dialog_invalid_license_input_label = 라이선스 키가 유효하지 않거나 만료되었습니다. 이 대화 상자에서 새 라이선스 키를 설정할 수 있습니다.\n시스템 ID <{0}> 및 하드웨어 키 <{1}>에 해당하는 라이선스 키를 제공해야 합니다.
dialog_invalid_license_input_label_systemdb = \n\n권장되는 시스템 데이터베이스 수준에서 라이선스 키를 설치하고 있습니다.\n이전에 테넌트 데이터베이스 수준에서 설치했다면 테넌트 데이터베이스의 기존\n라이선스 키를 제거하거나 해당 위치에도 새 라이선스 키를 설치해야 합니다.
dialog_invalid_license_input_label_tenantdb = \n\n테넌트 데이터베이스 수준에서 라이선스 키를 설치하고 있습니다. 라이선스 키를\n테넌트 데이터베이스에만 적용하려는 경우나 이전에도 이 위치에 설치한 경우에만 이렇게 하세요.\n그렇지 않으면 권장되는 시스템 데이터베이스 수준에서 라이선스 키를 설치해야 합니다.
