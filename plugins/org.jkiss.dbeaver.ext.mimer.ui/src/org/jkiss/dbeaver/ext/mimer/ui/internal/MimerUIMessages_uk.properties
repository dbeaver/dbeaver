page_connection_settings_protocol_tooltip = TCP/IP забезпечує з’єднання через мережу (за замовчуванням; так само, як без зазначення протоколу).\nLocal використовує IPC зі спільною пам’яттю та працює лише тоді, коли сервер запущено на цьому комп’ютері; хост і порт ігноруються.
page_connection_settings_program_tooltip = Рівень безпеки PROGRAM у Mimer SQL ("ENTER <program> USING <password>"). Залиште обидва поля порожніми, якщо банк даних його не використовує.
tooltip_grantee_ident_public_program = Виберіть наявного користувача чи групу або введіть інше ім’я ідентифікатора (наприклад, PUBLIC або ідентифікатор PROGRAM).
tooltip_grantee_ident = Виберіть наявного користувача чи групу або введіть інше ім’я ідентифікатора.
tooltip_data_type = Будь-який вбудований або користувацький тип даних
page_create_group_member_ident_tooltip = Виберіть наявного користувача, групу чи програму або введіть інше ім’я ідентифікатора.
page_create_synonym_target_name_tooltip = Таблиця або подання, на яке вказує цей синонім
page_create_statement_cursor_tooltip = Scroll дозволяє доступ через курсор із прокручуванням; No Scroll обмежує рух напрямком уперед; Default дозволяє обидва варіанти
page_create_group_membership_group_tooltip = Виберіть наявну групу або введіть іншу назву групи.
page_create_collation_source_tooltip = Наявний порядок зіставлення, на якому базується новий; кожен порядок зіставлення Mimer SQL походить від іншого
action_shadow_add_pages_title = Додати сторінки до тіньової копії
action_shadow_add_pages_message = Кількість сторінок розміром 2K, які потрібно додати до {0}:
action_shadow_to_master_title = Зробити тіньову копію основною
action_shadow_to_master_message = Зробити тіньову копію "{0}" основним банком даних, а поточний основний банк "{1}" — тіньовою копією?\n\nЦе поміняє їхні ролі. Спочатку переконайтеся, що тіньову копію повністю оновлено.
action_shadow_restore_title = Відновити тіньову копію з журналу
action_shadow_restore_message = Відновити {0} з журналу?\n\nЗаписи LOGDB буде відтворено в тіньовій копії, щоб привести її у відповідність до основного банку даних.
action_shadow_behind_master_title = Тіньова копія відстає від основного банку
action_shadow_behind_master_message = Тіньова копія містить старішу версію, ніж основний банк даних, тому її неможливо безпосередньо перевести в активний режим.\n\nСпочатку виконайте дію «Відновити тіньову копію з журналу», а потім спробуйте знову.
action_job_failed = Не вдалося виконати: {0}
action_open_target_title = Не вдалося відкрити цільовий об’єкт
action_open_target_message = Mimer SQL не вдалося визначити об’єкт для цього рядка: цей тип об’єкта тут не підтримується або об’єкт більше не існує.
action_set_online_state_title = Установити стан доступності
action_set_online_state_mixed_types_message = Виберіть лише банки даних або лише тіньові копії з одного з’єднання, не змішуючи типи чи з’єднання. Інструкція SET не може стосуватися кількох таких груп одночасно.
action_set_online_state_mixed_status_message = Не всі вибрані об’єкти типу {0} мають однаковий стан. Виберіть лише активні або лише автономні об’єкти.
