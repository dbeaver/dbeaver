dialog_create_subscription_connect=Connect to publisher during creation
dialog_create_subscription_connect_tip=Check publications during creation. Disable to defer connecting, replication, slot creation, and data copying; finish setup with ALTER SUBSCRIPTION.
dialog_create_subscription_enabled=Start replication after creation
dialog_create_subscription_enabled_tip=Start replication after creation. Requires connecting to the publisher; disable to start replication later.
dialog_create_subscription_copy_data=Copy existing data from the publisher
dialog_create_subscription_copy_data_tip=Subscriber tables must already exist with matching columns.\nTable definitions are not copied. Disable if rows are already present\nto avoid duplicates.
dialog_create_subscription_advanced=Advanced options
dialog_create_subscription_create_slot=Create a replication slot on the publisher
dialog_create_subscription_create_slot_tip=Slots retain WAL while replication is stopped.\nFor same-cluster replication, create the slot separately and disable this option.\nSet the existing slot name under Advanced options.
dialog_create_subscription_slot=Replication slot
dialog_create_subscription_slot_tip=Leave empty to use the subscription name. When slot creation is disabled, enter the name of an existing logical replication slot on the publisher. Slot names use lowercase letters, digits, and underscores.
dialog_create_subscription_binary=Request binary data
dialog_create_subscription_binary_tip=Request binary transfer rather than text for replicated values. Publisher and subscriber data types must have compatible binary formats. Leave disabled for better compatibility across PostgreSQL versions or differing column types.
dialog_create_subscription_streaming=Stream in-progress transactions
dialog_create_subscription_streaming_tip=Stream changes from large transactions before they commit, rather than waiting for the complete transaction on the publisher. Changes are still applied transactionally on the subscriber.
dialog_create_subscription_commit=Synchronous commit
dialog_create_subscription_commit_tip=Durability setting for the subscription's replication worker, not for the publisher connection. The default off improves apply performance; on waits for local WAL flush. Stronger settings can reduce performance and may wait for the subscriber's synchronous standbys.
dialog_create_subscription_disconnected_tip=Created without connecting? Create or associate a publisher slot,\nthen enable the subscription and refresh publications.
