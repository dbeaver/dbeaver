dialog_create_subscription_enabled = Porniți replicarea imediat după creare
dialog_create_subscription_enabled_tip = Porniți replicarea după creare. Necesită conectarea la editor; dezactivați pentru a porni replicarea ulterior.
dialog_create_subscription_copy_data = Copiați datele existente de pe editor
