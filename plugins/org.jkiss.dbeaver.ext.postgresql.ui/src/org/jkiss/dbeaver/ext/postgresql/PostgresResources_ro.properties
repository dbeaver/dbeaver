dialog_create_subscription_slot = Numele slotului
dialog_create_subscription_slot_tip = Lăsați gol pentru a utiliza numele abonamentului. Când crearea slotului este dezactivată, introduceți numele unui slot de replicare logică existent pe editor. Numele sloturilor folosesc litere mici, cifre și caractere de subliniere.
dialog_create_subscription_slot_description = Lăsați gol pentru a utiliza numele abonamentului. Pentru a utiliza un slot existent, debifați Creați un slot de replicare și introduceți numele acestuia.
dialog_create_subscription_binary = Solicitați date binare
dialog_create_subscription_binary_tip = Solicitați transfer binar în loc de text pentru valorile replicate. Tipurile de date ale editorului și abonatului trebuie să aibă formate binare compatibile. Lăsați dezactivat pentru compatibilitate mai bună între versiuni PostgreSQL sau tipuri de coloane diferite.
dialog_create_subscription_streaming = Transmiteți în flux tranzacțiile în desfășurare
dialog_create_subscription_streaming_tip = Transmiteți în flux modificările tranzacțiilor mari înainte de confirmare, în loc să așteptați tranzacția completă pe editor. Modificările sunt aplicate în continuare tranzacțional pe abonat.
dialog_create_subscription_commit = Confirmare sincronă
dialog_create_subscription_commit_tip = Setarea de durabilitate pentru procesul de replicare al abonamentului, nu pentru conexiunea la editor. Valoarea implicită off îmbunătățește performanța aplicării; on așteaptă scrierea WAL local pe disc. Setările mai stricte pot reduce performanța și pot aștepta replicile sincrone de rezervă ale abonatului.
dialog_create_subscription_error_name = Introduceți un nume de abonament.
dialog_create_subscription_error_publisher = Configurați conexiunea la editor.
dialog_create_subscription_error_publications = Selectați cel puțin o publicație sau adăugați un nume de publicație.
dialog_create_subscription_publisher_description = Configurați conexiunea pe care o va utiliza serverul receptor.
dialog_create_subscription_publications_description = Alegeți ce să primiți de la editorul selectat.
dialog_create_subscription_settings_description = Verificați abonamentul și alegeți cum pornește.
dialog_create_subscription_connection_not_tested = Netestat
dialog_create_subscription_custom_publication_name = Introduceți un nume de publicație
dialog_create_subscription_add_publication = Adăugați o publicație personalizată
dialog_create_subscription_slot_placeholder = Implicit, numele abonamentului
dialog_create_subscription_host_mode = Gazdă
dialog_create_subscription_url_tip = URI de conexiune PostgreSQL (postgresql://host:port/database). Parametrii URL au prioritate față de câmpurile nume de utilizator, parolă și SSL.
dialog_create_subscription_connect_by = Conectare prin
dialog_create_subscription_url_placeholder = postgresql://host:5432/database
dialog_create_subscription_error_slot = Numele sloturilor trebuie să conțină 1-63 de litere mici, cifre sau caractere de subliniere. Modificați-l în Opțiuni avansate.
dialog_refresh_subscription_title = Reîmprospătați publicațiile abonamentului
dialog_refresh_subscription_description = Preluați lista curentă de tabele de pe editor pentru abonamentele selectate. Salvați mai întâi modificările abonamentelor și activați-le. Tabelele abonatului trebuie să existe deja și să aibă coloane corespunzătoare.
dialog_refresh_subscription_copy_data = Copiați datele existente pentru tabelele nou abonate
dialog_refresh_subscription_two_phase = Copierea datelor existente nu este disponibilă deoarece un abonament selectat are activată confirmarea în două faze.
dialog_create_subscription_publisher_setup = Configurarea editorului
dialog_create_subscription_publisher_setup_tip = Replicarea logică este dezactivată pe conexiunea utilizată pentru încărcarea publicațiilor. Faceți clic pentru instrucțiunile de configurare a editorului.
dialog_create_subscription_publisher_setup_instructions = Conexiunea utilizată pentru încărcarea publicațiilor are wal_level sub logical. Aceasta poate diferi de adresa editorului utilizată de abonat.\n\nDacă acesta este serverul editorului, solicitați unui administrator PostgreSQL să execute:\n\nALTER SYSTEM SET wal_level = 'logical';\n\nReporniți acel server PostgreSQL, apoi reîncărcați publicațiile în acest expert.\n\nPentru a amâna configurarea editorului, debifați Conectați-vă la editor.
