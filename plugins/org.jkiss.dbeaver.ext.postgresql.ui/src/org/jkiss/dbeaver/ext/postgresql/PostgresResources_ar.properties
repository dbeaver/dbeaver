dialog_create_subscription_publisher_setup=إعداد الناشر
dialog_create_subscription_publisher_setup_tip=النسخ المتماثل المنطقي معطّل في الاتصال المستخدم لتحميل المنشورات. انقر لعرض تعليمات إعداد الناشر.
dialog_create_subscription_publisher_setup_instructions=قيمة wal_level في الاتصال المستخدم لتحميل المنشورات أقل من logical. قد يختلف عن عنوان الناشر الذي يستخدمه المشترك.\n\nإذا كان هذا خادم الناشر، فاطلب من مسؤول PostgreSQL تنفيذ:\n\nALTER SYSTEM SET wal_level = 'logical';\n\nأعد تشغيل خادم PostgreSQL ذلك، ثم أعد تحميل المنشورات في هذا المعالج.\n\nلتأجيل إعداد الناشر، ألغِ الاتصال بالناشر.
