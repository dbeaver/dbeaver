dialog_create_subscription_name=Имя подписки
dialog_create_subscription_name_tip=Имя подписки, создаваемой на подписчике. Должно быть уникальным в базе данных и также служит именем слота репликации по умолчанию.
dialog_create_subscription_subscriber=База данных подписчика
dialog_create_subscription_subscriber_tip=Подписка создаётся в этой базе данных. Открывайте создание подписки из целевой базы данных, а не из издателя.
dialog_create_subscription_publisher=Соединение с издателем
dialog_create_subscription_existing_connection=Скопировать из соединения...
dialog_create_subscription_existing_connection_tip=Скопируйте соединение PostgreSQL с нативной аутентификацией и используйте его для загрузки публикаций. Скорректируйте адрес издателя для сервера подписчика; сохранённые настройки соединения не изменяются.
dialog_create_subscription_manual_connection=Ручная настройка
dialog_create_subscription_endpoint_tip=Хост и порт издателя, доступные с сервера подписчика.
dialog_create_subscription_test_connection=Проверить соединение с подписчика
dialog_create_subscription_test_connection_tip=Проверяет репликационное соединение с сервера подписчика с помощью пробы без слота, которая затем откатывается. Требуются права создания подписки. Данные не копируются; публикации и совместимость таблиц не проверяются.
dialog_create_subscription_test_connection_success=Сервер подписчика успешно подключился к издателю через репликационное соединение. Подписка и слот репликации не сохранены. Публикации и совместимость таблиц не проверялись.
dialog_create_subscription_ssl_tab=SSL
dialog_create_subscription_ssl_paths_tip=Пути сертификатов должны существовать на сервере подписчика.
dialog_create_subscription_publications=Публикации
dialog_create_subscription_connect=Подключиться к издателю при создании
dialog_create_subscription_connect_tip=Проверять публикации при создании. Отключите, чтобы отложить подключение, репликацию, создание слота и копирование данных; завершите настройку с помощью ALTER SUBSCRIPTION.
dialog_create_subscription_enabled=Запустить репликацию сразу после создания
dialog_create_subscription_enabled_tip=Запустить репликацию после создания. Требует подключения к издателю; отключите, чтобы запустить репликацию позднее.
dialog_create_subscription_copy_data=Копировать существующие данные издателя
dialog_create_subscription_copy_data_tip=Таблицы подписчика уже должны существовать с соответствующими столбцами.\nОпределения таблиц не копируются. Отключите, если строки уже присутствуют,\nчтобы избежать дубликатов.
dialog_create_subscription_copy_data_description=Требуются существующие таблицы подписчика. Снимите флажок, если данные уже синхронизированы.
dialog_create_subscription_advanced=Дополнительные параметры
dialog_create_subscription_create_slot=Создать слот репликации на издателе
dialog_create_subscription_create_slot_tip=Слоты удерживают WAL, пока репликация остановлена.\nДля репликации внутри одного кластера создайте слот отдельно и отключите этот параметр.\nУкажите имя существующего слота в дополнительных параметрах.
dialog_create_subscription_create_slot_description=Для репликации внутри одного кластера создайте слот отдельно, снимите этот флажок и укажите имя слота в дополнительных параметрах.
dialog_create_subscription_slot=Имя слота
dialog_create_subscription_slot_tip=Оставьте пустым, чтобы использовать имя подписки. Если создание слота отключено, введите имя существующего слота логической репликации на издателе. Имена слотов состоят из строчных букв, цифр и подчёркиваний.
dialog_create_subscription_slot_description=Оставьте пустым, чтобы использовать имя подписки. Для использования существующего слота снимите флажок создания слота репликации и введите его имя.
dialog_create_subscription_binary=Запрашивать двоичные данные
dialog_create_subscription_binary_tip=Запрашивать двоичный формат реплицируемых значений вместо текстового. Типы данных издателя и подписчика должны иметь совместимые двоичные форматы. Оставьте отключённым для лучшей совместимости разных версий PostgreSQL или типов столбцов.
dialog_create_subscription_streaming=Передавать незавершённые транзакции потоком
dialog_create_subscription_streaming_tip=Передавать изменения больших транзакций до фиксации, не ожидая завершения транзакции на издателе. На подписчике изменения по-прежнему применяются транзакционно.
dialog_create_subscription_commit=Синхронная фиксация
dialog_create_subscription_commit_tip=Настройка надёжности записи рабочего процесса репликации подписки, а не соединения с издателем. Значение off по умолчанию ускоряет применение; on ожидает сброса локального WAL. Более строгие режимы могут снизить производительность и ожидать синхронные резервные серверы подписчика.
dialog_create_subscription_error_name=Введите имя подписки.
dialog_create_subscription_error_publisher=Настройте соединение с издателем.
dialog_create_subscription_error_publications=Выберите хотя бы одну публикацию или добавьте её имя.
dialog_create_subscription_publisher_description=Настройте соединение для сервера-получателя.
dialog_create_subscription_publications_description=Выберите, что получать от выбранного издателя.
dialog_create_subscription_settings_description=Проверьте подписку и выберите способ её запуска.
dialog_create_subscription_connection_not_tested=Не проверено
dialog_create_subscription_custom_publication_name=Введите имя публикации
dialog_create_subscription_add_publication=Добавить публикацию вручную
dialog_create_subscription_slot_placeholder=По умолчанию используется имя подписки
dialog_create_subscription_host_mode=Хост
dialog_create_subscription_url_tip=URI соединения PostgreSQL (postgresql://host:port/database). Параметры URL имеют приоритет над полями имени пользователя, пароля и SSL.
dialog_create_subscription_connect_by=Способ подключения
dialog_create_subscription_url_placeholder=postgresql://host:5432/database
dialog_create_subscription_error_slot=Имена слотов должны содержать от 1 до 63 строчных букв, цифр или подчёркиваний. Измените имя в дополнительных параметрах.
dialog_refresh_subscription_title=Обновить публикации подписки
dialog_refresh_subscription_description=Получить актуальный список таблиц издателя для выбранных подписок. Сначала сохраните изменения и включите подписки. Таблицы подписчика уже должны существовать с соответствующими столбцами.
dialog_refresh_subscription_copy_data=Копировать существующие данные новых таблиц подписки
dialog_refresh_subscription_two_phase=Копирование существующих данных недоступно: у одной из выбранных подписок включена двухфазная фиксация.
dialog_create_subscription_publisher_setup=Настройка издателя
dialog_create_subscription_publisher_setup_tip=Логическая репликация отключена в соединении загрузки публикаций. Нажмите для просмотра инструкций по настройке издателя.
dialog_create_subscription_publisher_setup_instructions=В соединении загрузки публикаций wal_level ниже logical. Оно может отличаться от адреса издателя, используемого подписчиком.\n\nЕсли это сервер издателя, попросите администратора PostgreSQL выполнить:\n\nALTER SYSTEM SET wal_level = 'logical';\n\nПерезапустите этот сервер PostgreSQL и перезагрузите публикации в мастере.\n\nЧтобы отложить настройку издателя, отключите подключение к издателю.
