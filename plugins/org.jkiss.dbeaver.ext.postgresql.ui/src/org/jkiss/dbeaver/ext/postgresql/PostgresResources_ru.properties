wizard_backup_all_page_global_backup_tip=Базы данных для экспорта
wizard_backup_all_page_setting_title=Настройки глобальной резервной копии
wizard_backup_all_page_setting_title_setting=Настройки
wizard_backup_all_page_setting_label_encoding=Кодировка
wizard_backup_all_page_setting_checkbox_only_metadata=Выгружать только определения объектов без данных
wizard_backup_all_page_setting_checkbox_only_metadata_tip=Выгружать только определения объектов (схему), без данных.
wizard_backup_all_page_setting_checkbox_only_global=Выгружать только глобальные объекты, без баз данных
wizard_backup_all_page_setting_checkbox_only_global_tip=Выгружать только глобальные объекты (роли и табличные пространства), без баз данных.\nРаботает только при выборе всех баз данных.
wizard_backup_all_page_setting_checkbox_only_roles=Выгружать только роли
wizard_backup_all_page_setting_checkbox_only_roles_tip=Выгружать только роли, без баз данных и табличных пространств.\nРаботает только при выборе всех баз данных.
wizard_backup_all_page_setting_checkbox_only_tablespaces=Выгружать только табличные пространства
wizard_backup_all_page_setting_checkbox_only_tablespaces_tip=Выгружать только табличные пространства, без баз данных и ролей.\nРаботает только при выборе всех баз данных.
wizard_backup_all_page_setting_checkbox_no_privileges=Не сохранять привилегии (GRANT/REVOKE)
wizard_backup_all_page_setting_checkbox_no_privileges_tip=Не выгружать привилегии доступа (команды GRANT/REVOKE).
wizard_backup_all_page_setting_checkbox_no_owner=Не сохранять владельцев объектов
wizard_backup_all_page_setting_checkbox_no_owner_tip=Не выводить команды установки владельцев объектов в соответствии с исходной базой данных.\nПо умолчанию pg_dumpall использует ALTER OWNER или SET SESSION AUTHORIZATION для назначения владельцев создаваемых элементов схемы.\nЭти операторы завершатся ошибкой, если скрипт запущен не суперпользователем (или не тем пользователем, которому принадлежат все объекты скрипта).\nЧтобы скрипт мог восстановить любой пользователь, получив владение всеми объектами, укажите -O.
wizard_backup_all_page_setting_checkbox_add_passwords=Выгружать пароли ролей
wizard_backup_all_page_setting_checkbox_add_passwords_tip=Выгружать пароли ролей в виде хешей MD5.
wizard_restore_page_setting_btn_clean_first_tip=Удалять восстанавливаемые объекты базы данных перед повторным созданием.\n(Если некоторые объекты отсутствуют в целевой базе данных, возможны безвредные сообщения об ошибках)
wizard_restore_page_setting_confirm_dialog_title=Внимание: восстановление данных
wizard_restore_page_setting_confirm_dialog_message=Перед восстановлением для всех восстанавливаемых объектов будет выполнена команда DROP. Если объекты отсутствуют в целевой базе данных, появятся допустимые для игнорирования ошибки, если в дополнительных аргументах не указан --if-exists.\nПараметр полезен для перезаписи существующей базы данных.\n\nПродолжить?
wizard_backup_page_setting_checkbox_restore_create_database=Создать базу данных
wizard_backup_page_setting_checkbox_restore_create_database_tip=Начинать вывод с команды создания самой базы данных и переподключения к ней.
