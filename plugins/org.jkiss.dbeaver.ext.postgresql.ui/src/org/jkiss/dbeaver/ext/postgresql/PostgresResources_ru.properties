dialog_setting_connection_replace_legacy_timezone=Заменять устаревший часовой пояс
dialog_setting_connection_replace_legacy_timezone_tip=Заменять устаревший часовой пояс. Включайте только при необходимости подключения с устаревшим поясом, например Europe/Kyiv или Asia/Calcutta
