dialog_query_planner_settings_control_label=Дополнительные настройки EXPLAIN
dialog_query_planner_settings_analyze=ANALYSE
dialog_query_planner_settings_analyze_tip=Выполнить EXPLAIN ANALYSE. Иначе выполняется обычный EXPLAIN.\nПримечание: ANALYSE может занимать много времени для больших таблиц
dialog_query_planner_settings_verbose=VERBOSE
dialog_query_planner_settings_verbose_tip=Показывать дополнительные сведения о плане. По умолчанию FALSE.
dialog_query_planner_settings_costs=COSTS
dialog_query_planner_settings_costs_tip=Включать оценку начальной и общей стоимости каждого узла плана,\nа также оценочное число строк и ширину каждой строки. По умолчанию TRUE.
dialog_query_planner_settings=SETTINGS
dialog_query_planner_settings_tip=Включать сведения о параметрах конфигурации.\nВ частности, параметры, влияющие на планирование запроса и отличающиеся от встроенных значений по умолчанию. По умолчанию FALSE.
dialog_query_planner_settings_buffers=BUFFERS
dialog_query_planner_settings_buffers_tip=Включать сведения об использовании буферов. По умолчанию FALSE.
dialog_query_planner_settings_wal=WAL
dialog_query_planner_settings_wal_tip=Включать сведения о создании записей WAL.\nВ частности, число записей, число полных образов страниц (fpi) и объём созданного WAL в байтах.\nВ текстовом формате выводятся только ненулевые значения.\nПараметр доступен только при включённом ANALYZE. По умолчанию FALSE.
dialog_query_planner_settings_timing=TIMING
dialog_query_planner_settings_timing_tip=Включать в вывод фактическое время запуска и время, затраченное на каждый узел. По умолчанию TRUE.
dialog_query_planner_settings_summary=SUMMARY
dialog_query_planner_settings_summary_tip=Включать сводные сведения (например, суммарное время) после плана запроса.\nПри использовании ANALYZE сводка включена по умолчанию, в остальных случаях отключена,\nно её можно включить этим параметром.
