dialog_create_subscription_load_publications_error=Не удалось загрузить публикации. Проверьте соединение или введите имена ниже.
dialog_create_subscription_load_publications_configuration_error=Невозможно загрузить публикации по этому адресу. Введите имена публикаций ниже.
