wizard_backup_page_object_checkbox_complete_backup=Полная резервная копия
wizard_backup_page_setting_checkbox_use_insert_tip=Выгружать данные командами INSERT вместо COPY. Это значительно замедляет восстановление;\nв основном полезно для дампов, загружаемых в базы данных, отличные от PostgreSQL.
wizard_backup_page_setting_checkbox_no_privileges_tip=Не выгружать привилегии доступа (команды GRANT/REVOKE).
wizard_backup_page_setting_checkbox_no_owner_tip=Не выводить команды установки владельцев объектов в соответствии с исходной базой данных.\nПараметр игнорируется при выводе в архивный (нетекстовый) файл.\nДля архивных форматов его можно указать при вызове команды восстановления.
wizard_backup_page_setting_checkbox_restore_no_owner_tip=Не выводить команды установки владельцев объектов в соответствии с исходной базой данных.
wizard_backup_page_setting_checkbox_drop_objects=Добавить оператор удаления базы данных
wizard_backup_page_setting_checkbox_drop_objects_tip=Выводить команды очистки (удаления) объектов базы данных перед командами их создания.\nПараметр игнорируется при выводе в архивный (нетекстовый) файл.\nДля архивных форматов его можно указать при вызове команды восстановления.
wizard_backup_page_setting_checkbox_create_database=Добавить оператор создания базы данных
wizard_backup_page_setting_checkbox_create_database_tip=Начинать вывод с команды создания самой базы данных и переподключения к ней.\nПараметр игнорируется при выводе в архивный (нетекстовый) файл.\nДля архивных форматов его можно указать при вызове команды восстановления.
