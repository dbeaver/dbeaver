dialog_create_subscription_advanced = 高级选项
dialog_create_subscription_create_slot = 在发布端创建复制槽
dialog_create_subscription_create_slot_tip = 复制停止时，复制槽会保留 WAL。\n在同一集群内复制时，请单独创建复制槽并禁用此选项。\n在“高级选项”下设置现有复制槽名称。
dialog_create_subscription_create_slot_description = 在同一集群内复制时，请单独创建复制槽，取消选中此选项，并在“高级选项”下输入其名称。
dialog_create_subscription_slot = 复制槽名称
