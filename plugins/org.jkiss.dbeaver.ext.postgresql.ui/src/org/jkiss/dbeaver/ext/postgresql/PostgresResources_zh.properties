dialog_create_subscription_slot_description = 留空可使用订阅名称。要使用现有复制槽，请取消选中“创建复制槽”并输入其名称。
dialog_create_subscription_binary = 请求二进制数据
dialog_create_subscription_binary_tip = 请求以二进制而非文本传输复制的值。发布端和订阅端的数据类型必须具有兼容的二进制格式。跨 PostgreSQL 版本或列类型不同时，保持禁用可获得更好的兼容性。
dialog_create_subscription_streaming = 流式传输正在进行的事务
dialog_create_subscription_streaming_tip = 在大型事务提交前就流式传输其更改，而不是等待发布端上的整个事务完成。订阅端仍会以事务方式应用更改。
dialog_create_subscription_commit = 同步提交
dialog_create_subscription_commit_tip = 此设置控制订阅复制工作进程的持久性，而非发布端连接。默认值 off 可提高应用性能；on 会等待本地 WAL 刷盘。更强的设置可能降低性能，并可能等待订阅端的同步备用服务器。
dialog_create_subscription_error_name = 请输入订阅名称。
dialog_create_subscription_error_publisher = 请配置发布端连接。
dialog_create_subscription_error_publications = 请至少选择一个发布，或添加发布名称。
dialog_create_subscription_publisher_description = 配置接收端服务器将使用的连接。
dialog_create_subscription_publications_description = 选择要从所选发布端接收的内容。
dialog_create_subscription_settings_description = 检查订阅并选择启动方式。
dialog_create_subscription_connection_not_tested = 未测试
dialog_create_subscription_custom_publication_name = 输入发布名称
dialog_create_subscription_add_publication = 添加自定义发布
dialog_create_subscription_slot_placeholder = 默认为订阅名称
dialog_create_subscription_host_mode = 主机
dialog_create_subscription_url_tip = PostgreSQL 连接 URI（postgresql://host:port/database）。URL 参数优先于用户名、密码和 SSL 字段。
dialog_create_subscription_connect_by = 连接方式
dialog_create_subscription_url_placeholder = postgresql://host:5432/database
dialog_create_subscription_error_slot = 复制槽名称必须由 1–63 个小写字母、数字或下划线组成。请在“高级选项”中修改。
dialog_refresh_subscription_title = 刷新订阅的发布
dialog_refresh_subscription_description = 从发布端获取所选订阅的当前表列表。请先保存订阅更改并启用订阅。订阅端必须已存在具有匹配列的表。
dialog_refresh_subscription_copy_data = 复制新订阅表的现有数据
dialog_refresh_subscription_two_phase = 所选订阅中有订阅启用了两阶段提交，因此无法复制现有数据。
dialog_create_subscription_publisher_setup = 发布端设置
dialog_create_subscription_publisher_setup_tip = 用于加载发布的连接未启用逻辑复制。单击查看发布端设置说明。
dialog_create_subscription_publisher_setup_instructions = 用于加载发布的连接的 wal_level 低于 logical。它可能与订阅端使用的发布端地址不同。\n\n如果这是发布端服务器，请让 PostgreSQL 管理员执行：\n\nALTER SYSTEM SET wal_level = 'logical';\n\n重启该 PostgreSQL 服务器，然后在此向导中重新加载发布。\n\n要推迟发布端设置，请取消选中“连接到发布端”。
