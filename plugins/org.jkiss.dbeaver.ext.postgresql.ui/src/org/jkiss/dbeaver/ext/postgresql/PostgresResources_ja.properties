dialog_create_subscription_test_connection=サブスクライバーから接続をテスト
dialog_create_subscription_test_connection_tip=サブスクライバーサーバーから、スロットを使用せずロールバックされる検査でレプリケーション接続をテストします。サブスクリプション作成権限が必要です。データはコピーされません。パブリケーションとテーブルの互換性は確認しません。
dialog_create_subscription_test_connection_success=サブスクライバーサーバーからパブリッシャーへのレプリケーション接続に成功しました。サブスクリプションやレプリケーションスロットは残していません。パブリケーションとテーブルの互換性は確認していません。
dialog_create_subscription_ssl_tab=SSL
dialog_create_subscription_ssl_paths_tip=証明書のパスはサブスクライバーサーバー上に存在する必要があります。
dialog_create_subscription_publications=パブリケーション
dialog_create_subscription_connect=作成時にパブリッシャーに接続する
dialog_create_subscription_connect_tip=作成時にパブリケーションを確認します。無効にすると、接続、レプリケーション、スロットの作成、データのコピーを延期します。ALTER SUBSCRIPTION で設定を完了してください。
dialog_create_subscription_enabled=作成直後にレプリケーションを開始する
dialog_create_subscription_enabled_tip=作成後にレプリケーションを開始します。パブリッシャーへの接続が必要です。後で開始する場合は無効にしてください。
dialog_create_subscription_copy_data=パブリッシャーから既存のデータをコピーする
dialog_create_subscription_copy_data_tip=サブスクライバーのテーブルは、列が一致する状態であらかじめ存在する必要があります。\nテーブル定義はコピーされません。行がすでに存在する場合は、\n重複を避けるために無効にしてください。
dialog_create_subscription_copy_data_description=サブスクライバーのテーブルが存在する必要があります。データがすでに同期されている場合は、このオプションをオフにしてください。
dialog_create_subscription_advanced=詳細オプション
dialog_create_subscription_create_slot=パブリッシャーにレプリケーションスロットを作成する
dialog_create_subscription_create_slot_tip=スロットはレプリケーションの停止中も WAL を保持します。\n同一クラスター内のレプリケーションでは、スロットを別途作成し、このオプションを無効にしてください。\n「詳細オプション」に既存のスロット名を指定してください。
dialog_create_subscription_create_slot_description=同一クラスター内のレプリケーションでは、スロットを別途作成してこのオプションをオフにし、「詳細オプション」にその名前を入力してください。
dialog_create_subscription_slot=スロット名
dialog_create_subscription_slot_tip=空欄にするとサブスクリプション名を使用します。スロットの作成が無効な場合は、パブリッシャーに存在する論理レプリケーションスロット名を入力してください。使用できるのは小文字、数字、アンダースコアです。
dialog_create_subscription_slot_description=サブスクリプション名を使用する場合は空欄にしてください。既存のスロットを使用するには、「レプリケーションスロットを作成する」をオフにして名前を入力してください。
dialog_create_subscription_binary=バイナリーデータを要求する
dialog_create_subscription_binary_tip=複製する値をテキストではなくバイナリーで転送するよう要求します。パブリッシャーとサブスクライバーのデータ型のバイナリー形式に互換性が必要です。PostgreSQL のバージョンや列の型が異なる場合は、互換性のために無効のままにしてください。
dialog_create_subscription_streaming=実行中のトランザクションをストリーミングする
dialog_create_subscription_streaming_tip=パブリッシャーのトランザクション完了を待たずに、大きなトランザクションの変更をコミット前から送信します。サブスクライバーでは引き続きトランザクション単位で適用されます。
dialog_create_subscription_commit=同期コミット
dialog_create_subscription_commit_tip=パブリッシャー接続ではなく、サブスクリプションのレプリケーションワーカーの永続性設定です。既定の off は適用性能を高め、on はローカルの WAL フラッシュを待ちます。より強い設定は性能を低下させ、サブスクライバーの同期スタンバイを待つ場合があります。
dialog_create_subscription_error_name=サブスクリプション名を入力してください。
dialog_create_subscription_error_publisher=パブリッシャー接続を設定してください。
dialog_create_subscription_error_publications=パブリケーションを 1 つ以上選択するか、パブリケーション名を追加してください。
dialog_create_subscription_publisher_description=受信側のサーバーが使用する接続を設定してください。
dialog_create_subscription_publications_description=選択したパブリッシャーから受信する内容を選択してください。
dialog_create_subscription_settings_description=サブスクリプションを確認し、開始方法を選択してください。
dialog_create_subscription_connection_not_tested=未テスト
dialog_create_subscription_custom_publication_name=パブリケーション名を入力
dialog_create_subscription_add_publication=カスタムパブリケーションを追加
dialog_create_subscription_slot_placeholder=既定値はサブスクリプション名
dialog_create_subscription_host_mode=ホスト
dialog_create_subscription_url_tip=PostgreSQL 接続 URI (postgresql://host:port/database)。URL パラメーターは、ユーザー名、パスワード、SSL の各欄より優先されます。
dialog_create_subscription_connect_by=接続方法
dialog_create_subscription_url_placeholder=postgresql://host:5432/database
dialog_create_subscription_error_slot=スロット名には、小文字、数字、アンダースコアを 1 ～ 63 文字で指定してください。「詳細オプション」で変更できます。
dialog_refresh_subscription_title=サブスクリプションのパブリケーションを更新
dialog_refresh_subscription_description=選択したサブスクリプションについて、パブリッシャーから最新のテーブル一覧を取得します。先にサブスクリプションの変更を保存し、有効にしてください。サブスクライバーのテーブルは、列が一致する状態で存在する必要があります。
dialog_refresh_subscription_copy_data=新たに購読するテーブルの既存データをコピーする
dialog_refresh_subscription_two_phase=選択したサブスクリプションで 2 フェーズコミットが有効なため、既存データはコピーできません。
dialog_create_subscription_publisher_setup=パブリッシャーの設定
dialog_create_subscription_publisher_setup_tip=パブリケーションの読み込みに使用する接続で論理レプリケーションが無効です。クリックすると、パブリッシャーの設定手順を表示します。
dialog_create_subscription_publisher_setup_instructions=パブリケーションの読み込みに使用する接続の wal_level が logical 未満です。この接続は、サブスクライバーが使用するパブリッシャーアドレスとは異なる場合があります。\n\nこれがパブリッシャーサーバーの場合は、PostgreSQL 管理者に次の実行を依頼してください:\n\nALTER SYSTEM SET wal_level = 'logical';\n\nその PostgreSQL サーバーを再起動し、このウィザードでパブリケーションを再読み込みしてください。\n\nパブリッシャーの設定を後回しにする場合は、「パブリッシャーに接続する」をオフにしてください。
