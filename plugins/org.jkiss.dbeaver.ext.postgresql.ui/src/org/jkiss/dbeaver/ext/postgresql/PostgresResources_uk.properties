wizard_restore_page_setting_confirm_dialog_message=Перед відновленням об’єктів бази даних для кожного з них буде виконано команду DROP. Якщо об’єкт не існує в цільовій базі даних, з’явиться повідомлення про помилку, яке можна ігнорувати, якщо в додаткових аргументах команди також не вказано --if-exists.\nЦей параметр корисний для перезапису наявної бази даних.\n\nПродовжити?
