dialog_create_subscription_settings_tab = Налаштування реплікації
dialog_create_subscription_publications_tab = Публікації
dialog_create_subscription_filter_publications = Фільтрувати доступні публікації
dialog_create_subscription_publications_empty = Публікації не завантажено. Оновіть список або введіть назву нижче.
dialog_create_subscription_publications_no_matches = Немає публікацій, що відповідають фільтру.
dialog_create_subscription_testing_connection = Перевірка з боку підписника...
dialog_create_subscription_connection_verified = Підключено
dialog_create_subscription_load_publications = Оновити список публікацій
dialog_create_subscription_load_publications_tip = Прочитати назви публікацій через вибране з’єднання.
dialog_create_subscription_publications_source = Видавець: {0}
dialog_create_subscription_publications_datasource = Завантажувати публікації з
dialog_create_subscription_publications_datasource_tip = Після копіювання з’єднання DBeaver за замовчуванням читає публікації через нього. Інакше використовується адреса видавця з попереднього кроку. Зміна цього вибору повторно завантажує публікації та не змінює з’єднання підписника.
dialog_create_subscription_loading_publications = Завантаження публікацій...
dialog_create_subscription_load_publications_error = Не вдалося завантажити публікації. Перевірте з’єднання або введіть назви нижче.
dialog_create_subscription_load_publications_configuration_error = Неможливо завантажити публікації за цією адресою. Введіть назви публікацій нижче.
dialog_create_subscription_no_publications = Публікацій не знайдено. Можна ввести назву нижче.
dialog_create_subscription_name = Назва підписки
dialog_create_subscription_name_tip = Назва підписки, яка створюється на підписнику. Має бути унікальною в цій базі даних і також є назвою слота реплікації за замовчуванням.
dialog_create_subscription_subscriber = База даних підписника
dialog_create_subscription_subscriber_tip = Підписка створюється в цій базі даних. Відкривайте створення підписки з цільової бази даних, а не з видавця.
dialog_create_subscription_publisher = З’єднання з видавцем
dialog_create_subscription_existing_connection = Копіювати зі з’єднання...
dialog_create_subscription_existing_connection_tip = Скопіювати з’єднання PostgreSQL із власною автентифікацією та використати його для завантаження публікацій. Уточніть адресу видавця для сервера підписника; збережені налаштування з’єднання не зміняться.
dialog_create_subscription_manual_connection = Ручне налаштування
dialog_create_subscription_endpoint_tip = Хост і порт видавця, доступні із сервера підписника.
dialog_create_subscription_test_connection = Перевірити з’єднання з боку підписника
dialog_create_subscription_test_connection_tip = Перевіряє з’єднання реплікації із сервера підписника за допомогою проби без слота, яка відкочується. Потрібні права на створення підписки. Дані не копіюються; публікації та сумісність таблиць не перевіряються.
dialog_create_subscription_test_connection_success = Сервер підписника успішно підключився до видавця через з’єднання реплікації. Підписка та слот реплікації не збереглися. Публікації та сумісність таблиць не перевірялися.
dialog_create_subscription_ssl_tab = SSL
dialog_create_subscription_ssl_paths_tip = Шляхи до сертифікатів повинні існувати на сервері підписника.
dialog_create_subscription_publications = Публікації
dialog_create_subscription_connect = Підключатися до видавця під час створення
dialog_create_subscription_connect_tip = Перевіряти публікації під час створення. Вимкніть, щоб відкласти підключення, реплікацію, створення слота та копіювання даних; завершіть налаштування за допомогою ALTER SUBSCRIPTION.
dialog_create_subscription_enabled = Запустити реплікацію відразу після створення
dialog_create_subscription_enabled_tip = Запустити реплікацію після створення. Потрібне підключення до видавця; вимкніть, щоб запустити реплікацію пізніше.
dialog_create_subscription_copy_data = Копіювати наявні дані з видавця
dialog_create_subscription_copy_data_tip = Таблиці підписника вже мають існувати та мати відповідні стовпці.\nВизначення таблиць не копіюються. Вимкніть, якщо рядки вже існують,\nщоб уникнути дублікатів.
dialog_create_subscription_copy_data_description = Потрібні наявні таблиці підписника. Зніміть позначку, якщо дані вже синхронізовано.
dialog_create_subscription_advanced = Додаткові параметри
dialog_create_subscription_create_slot = Створити слот реплікації на видавці
dialog_create_subscription_create_slot_tip = Слоти утримують WAL, поки реплікацію зупинено.\nДля реплікації в одному кластері створіть слот окремо та вимкніть цей параметр.\nУкажіть назву наявного слота в додаткових параметрах.
dialog_create_subscription_create_slot_description = Для реплікації в одному кластері створіть слот окремо, зніміть цю позначку та введіть його назву в додаткових параметрах.
dialog_create_subscription_slot = Назва слота
dialog_create_subscription_slot_tip = Залиште порожнім, щоб використати назву підписки. Якщо створення слота вимкнено, введіть назву наявного слота логічної реплікації на видавці. Назви слотів містять малі латинські літери, цифри та підкреслення.
dialog_create_subscription_slot_description = Залиште порожнім, щоб використати назву підписки. Для використання наявного слота зніміть позначку «Створити слот реплікації» та введіть його назву.
dialog_create_subscription_binary = Запитувати двійкові дані
dialog_create_subscription_binary_tip = Запитувати двійкове передавання реплікованих значень замість текстового. Типи даних видавця та підписника повинні мати сумісні двійкові формати. Залиште вимкненим для кращої сумісності між версіями PostgreSQL або різними типами стовпців.
dialog_create_subscription_streaming = Передавати незавершені транзакції потоком
dialog_create_subscription_streaming_tip = Передавати зміни великих транзакцій до їх фіксації, не чекаючи завершення всієї транзакції на видавці. На підписнику зміни все одно застосовуються транзакційно.
dialog_create_subscription_commit = Синхронна фіксація
dialog_create_subscription_commit_tip = Налаштування надійності збереження для процесу реплікації підписки, а не з’єднання з видавцем. Значення off за замовчуванням прискорює застосування; on очікує запису локального WAL. Суворіші налаштування можуть знизити продуктивність і спричинити очікування синхронних резервних серверів підписника.
dialog_create_subscription_error_name = Введіть назву підписки.
dialog_create_subscription_error_publisher = Налаштуйте з’єднання з видавцем.
dialog_create_subscription_error_publications = Виберіть принаймні одну публікацію або додайте назву публікації.
dialog_create_subscription_publisher_description = Налаштуйте з’єднання, яке використовуватиме сервер-отримувач.
dialog_create_subscription_publications_description = Виберіть, що отримувати від вибраного видавця.
dialog_create_subscription_settings_description = Перегляньте підписку та виберіть спосіб її запуску.
dialog_create_subscription_connection_not_tested = Не перевірено
dialog_create_subscription_custom_publication_name = Введіть назву публікації
dialog_create_subscription_add_publication = Додати власну публікацію
dialog_create_subscription_slot_placeholder = За замовчуванням — назва підписки
dialog_create_subscription_host_mode = Хост
dialog_create_subscription_url_tip = URI з’єднання PostgreSQL (postgresql://host:port/database). Параметри URL мають пріоритет над полями імені користувача, пароля та SSL.
dialog_create_subscription_connect_by = Підключатися через
dialog_create_subscription_url_placeholder = postgresql://host:5432/database
dialog_create_subscription_error_slot = Назва слота повинна містити від 1 до 63 малих латинських літер, цифр або підкреслень. Змініть її в додаткових параметрах.
dialog_refresh_subscription_title = Оновити публікації підписки
dialog_refresh_subscription_description = Отримати поточний список таблиць із видавця для вибраних підписок. Спочатку збережіть зміни та ввімкніть підписки. Таблиці підписника вже мають існувати та мати відповідні стовпці.
dialog_refresh_subscription_copy_data = Копіювати наявні дані для нових таблиць підписки
dialog_refresh_subscription_two_phase = Копіювання наявних даних недоступне, оскільки у вибраній підписці ввімкнено двофазну фіксацію.
dialog_create_subscription_publisher_setup = Налаштування видавця
dialog_create_subscription_publisher_setup_tip = Логічну реплікацію вимкнено в з’єднанні для завантаження публікацій. Натисніть, щоб переглянути інструкції налаштування видавця.
dialog_create_subscription_publisher_setup_instructions = У з’єднанні для завантаження публікацій wal_level нижчий за logical. Воно може відрізнятися від адреси видавця, яку використовує підписник.\n\nЯкщо це сервер видавця, попросіть адміністратора PostgreSQL виконати:\n\nALTER SYSTEM SET wal_level = 'logical';\n\nПерезапустіть цей сервер PostgreSQL, а потім оновіть публікації в майстрі.\n\nЩоб відкласти налаштування видавця, зніміть позначку «Підключатися до видавця».
