wizard_backup_page_setting_checkbox_drop_objects = 加入刪除資料庫物件的陳述式
wizard_backup_page_setting_checkbox_drop_objects_tip = 在輸出建立資料庫物件的命令前，先輸出清除（刪除）這些物件的命令。\n輸出封存（非文字）檔案時會忽略此選項。\n使用封存格式時，可在呼叫還原命令時指定此選項。
