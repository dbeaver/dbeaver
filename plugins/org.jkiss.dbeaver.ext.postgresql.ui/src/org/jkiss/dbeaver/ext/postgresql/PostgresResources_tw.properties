wizard_backup_all_page_setting_checkbox_only_global = 僅傾印全域物件，不含資料庫
wizard_backup_all_page_setting_checkbox_only_global_tip = 僅傾印全域物件（角色及資料表空間），不含資料庫。\n僅在勾選所有資料庫時生效。
wizard_backup_all_page_setting_checkbox_only_roles = 僅傾印角色
wizard_backup_all_page_setting_checkbox_only_roles_tip = 僅傾印角色，不含資料庫或資料表空間。\n僅在勾選所有資料庫時生效。
