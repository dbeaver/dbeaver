wizard_restore_page_setting_btn_clean_first_tip = 重新建立前先清除（刪除）將要還原的資料庫物件。\n（若目的地資料庫中不存在某些物件，可能會產生一些無害的錯誤訊息）
wizard_restore_page_setting_confirm_dialog_title = 資料還原注意事項
wizard_restore_page_setting_confirm_dialog_message = 還原資料庫物件前，會對所有要還原的物件執行 DROP 命令。若目的地資料庫中不存在某些物件，便會回報可忽略的錯誤訊息，除非同時在額外命令引數中指定 --if-exists。\n此選項適用於覆寫現有資料庫。\n\n確定要繼續嗎？
