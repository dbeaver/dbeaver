dialog_query_planner_settings_wal = WAL
dialog_query_planner_settings_wal_tip = 包含 WAL 記錄產生資訊。\n具體而言，包含記錄數、完整頁面映像數 (fpi)，以及產生的 WAL 位元組數。\n使用文字格式時，僅列出非零值。\n此參數僅可在同時啟用 ANALYZE 時使用。預設為 FALSE。
dialog_query_planner_settings_timing = TIMING
dialog_query_planner_settings_timing_tip = 在輸出中包含實際啟動時間，以及每個節點花費的時間。預設為 TRUE。
dialog_query_planner_settings_summary = SUMMARY
