dialog_create_subscription_publications = 發行集
dialog_create_subscription_connect = 建立時連線至發行端
dialog_create_subscription_connect_tip = 建立時檢查發行集。停用可延後連線、複寫、建立插槽及複製資料；之後請使用 ALTER SUBSCRIPTION 完成設定。
dialog_create_subscription_enabled = 建立後立即開始複寫
dialog_create_subscription_enabled_tip = 建立後開始複寫。需要連線至發行端；若要稍後開始複寫，請停用此選項。
dialog_create_subscription_copy_data = 從發行端複製現有資料
dialog_create_subscription_copy_data_tip = 訂閱端的資料表必須已存在，且欄位必須相符。\n不會複製資料表定義。若已有資料列，請停用此選項\n以避免重複。
dialog_create_subscription_copy_data_description = 需要訂閱端已有資料表。若資料已同步，請取消勾選此選項。
dialog_create_subscription_advanced = 進階選項
dialog_create_subscription_create_slot = 在發行端建立複寫插槽
dialog_create_subscription_create_slot_tip = 複寫停止時，插槽會保留 WAL。\n在同一叢集中複寫時，請另行建立插槽並停用此選項。\n請在進階選項中設定現有的插槽名稱。
dialog_create_subscription_create_slot_description = 在同一叢集中複寫時，請另行建立插槽、取消勾選此選項，並在進階選項中輸入插槽名稱。
dialog_create_subscription_slot = 插槽名稱
dialog_create_subscription_slot_tip = 保留空白以使用訂閱名稱。停用建立插槽時，請輸入發行端上現有的邏輯複寫插槽名稱。插槽名稱使用小寫字母、數字及底線。
dialog_create_subscription_slot_description = 保留空白以使用訂閱名稱。若要使用現有插槽，請取消勾選「建立複寫插槽」並輸入其名稱。
dialog_create_subscription_binary = 要求二進位資料
dialog_create_subscription_binary_tip = 要求以二進位而非文字格式傳輸複寫的值。發行端與訂閱端的資料類型必須具有相容的二進位格式。停用可提高不同 PostgreSQL 版本或不同欄位類型之間的相容性。
dialog_create_subscription_streaming = 串流傳輸進行中的交易
dialog_create_subscription_streaming_tip = 在大型交易提交前串流傳輸其變更，而非等待發行端完成整個交易。訂閱端仍會以交易方式套用變更。
dialog_create_subscription_commit = 同步提交
dialog_create_subscription_commit_tip = 訂閱複寫工作程序的持久性設定，並非發行端連線的設定。預設值 off 可提升套用效能；on 會等待本機 WAL 寫入磁碟。更嚴格的設定可能降低效能，並可能等待訂閱端的同步待命伺服器。
dialog_create_subscription_error_name = 請輸入訂閱名稱。
dialog_create_subscription_error_publisher = 請設定發行端連線。
dialog_create_subscription_error_publications = 請至少選取一個發行集，或新增發行集名稱。
dialog_create_subscription_publisher_description = 設定接收端伺服器將使用的連線。
dialog_create_subscription_publications_description = 選取要從所選發行端接收的內容。
dialog_create_subscription_settings_description = 檢閱訂閱並選取啟動方式。
dialog_create_subscription_connection_not_tested = 尚未測試
dialog_create_subscription_custom_publication_name = 輸入發行集名稱
dialog_create_subscription_add_publication = 新增自訂發行集
dialog_create_subscription_slot_placeholder = 預設為訂閱名稱
dialog_create_subscription_host_mode = 主機
dialog_create_subscription_url_tip = PostgreSQL 連線 URI (postgresql://host:port/database)。URL 參數的優先順序高於使用者名稱、密碼及 SSL 欄位。
dialog_create_subscription_connect_by = 連線方式
dialog_create_subscription_url_placeholder = postgresql://host:5432/database
dialog_create_subscription_error_slot = 插槽名稱必須由 1-63 個小寫字母、數字或底線組成。請在進階選項中變更。
dialog_refresh_subscription_title = 重新整理訂閱發行集
dialog_refresh_subscription_description = 為選取的訂閱從發行端擷取目前的資料表清單。請先儲存訂閱變更並啟用訂閱。訂閱端的資料表必須已存在，且欄位必須相符。
dialog_refresh_subscription_copy_data = 複製新訂閱資料表的現有資料
dialog_refresh_subscription_two_phase = 選取的訂閱已啟用兩階段提交，因此無法複製現有資料。
dialog_create_subscription_publisher_setup = 發行端設定
dialog_create_subscription_publisher_setup_tip = 用來載入發行集的連線已停用邏輯複寫。按一下以查看發行端設定說明。
dialog_create_subscription_publisher_setup_instructions = 用來載入發行集的連線，其 wal_level 低於 logical。此連線可能不同於訂閱端使用的發行端位址。\n\n若這是發行端伺服器，請要求 PostgreSQL 管理員執行：\n\nALTER SYSTEM SET wal_level = 'logical';\n\n重新啟動該 PostgreSQL 伺服器，然後在此精靈中重新載入發行集。\n\n若要延後設定發行端，請取消勾選「連線至發行端」。
