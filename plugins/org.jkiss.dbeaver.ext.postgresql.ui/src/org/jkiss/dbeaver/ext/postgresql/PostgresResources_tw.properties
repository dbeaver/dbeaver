wizard_backup_page_setting_checkbox_no_owner_tip = 不輸出將物件擁有權設為與原始資料庫相同的命令。\n輸出封存（非文字）檔案時會忽略此選項。\n使用封存格式時，可在呼叫還原命令時指定此選項。
