wizard_backup_all_page_setting_checkbox_only_tablespaces_tip = 僅傾印資料表空間，不含資料庫或角色。\n僅在勾選所有資料庫時生效。
wizard_backup_all_page_setting_checkbox_no_privileges = 不備份權限 (GRANT/REVOKE)
wizard_backup_all_page_setting_checkbox_no_privileges_tip = 不傾印存取權限（grant/revoke 命令）。
wizard_backup_all_page_setting_checkbox_no_owner = 捨棄物件擁有者
wizard_backup_all_page_setting_checkbox_no_owner_tip = 不輸出將物件擁有權設為與原始資料庫相同的命令。\n依預設，pg_dumpall 會發出 ALTER OWNER 或 SET SESSION AUTHORIZATION 陳述式，以設定所建立之結構描述元素的擁有權。\n除非由超級使用者（或擁有指令碼中所有物件的同一使用者）啟動指令碼，否則這些陳述式會在執行時失敗。\n若要建立任何使用者皆可還原，且還原者會取得所有物件擁有權的指令碼，請指定 -O。
wizard_backup_all_page_setting_checkbox_add_passwords = 傾印角色密碼
wizard_backup_all_page_setting_checkbox_add_passwords_tip = 以 MD5 雜湊格式傾印角色密碼。
