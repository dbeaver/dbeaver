dialog_create_subscription_connect_by = Conectar por
dialog_create_subscription_url_placeholder = postgresql://host:5432/database
dialog_create_subscription_error_slot = Nomes de slots devem usar de 1 a 63 letras minúsculas, dígitos ou sublinhados. Altere o nome em Opções avançadas.
dialog_refresh_subscription_title = Atualizar publicações da assinatura
dialog_refresh_subscription_description = Obter a lista atual de tabelas do publicador para as assinaturas selecionadas. Primeiro, salve as alterações e habilite as assinaturas. As tabelas do assinante já devem existir com colunas correspondentes.
dialog_refresh_subscription_copy_data = Copiar dados existentes das tabelas recém-assinadas
dialog_refresh_subscription_two_phase = A cópia de dados existentes está indisponível porque uma assinatura selecionada tem commit de duas fases habilitado.
dialog_create_subscription_publisher_setup = Configuração do publicador
dialog_create_subscription_publisher_setup_tip = A replicação lógica está desabilitada na conexão usada para carregar publicações. Clique para ver as instruções de configuração do publicador.
dialog_create_subscription_publisher_setup_instructions = A conexão usada para carregar publicações tem wal_level abaixo de logical. Ela pode ser diferente do endereço do publicador usado pelo assinante.\n\nSe este for o servidor publicador, peça a um administrador do PostgreSQL para executar:\n\nALTER SYSTEM SET wal_level = 'logical';\n\nReinicie esse servidor PostgreSQL e recarregue as publicações neste assistente.\n\nPara adiar a configuração do publicador, desmarque Conectar ao publicador.
