dialog_create_subscription_enabled = Iniciar replicação imediatamente após a criação
dialog_create_subscription_enabled_tip = Iniciar replicação após a criação. Exige conexão com o publicador; desabilite para iniciar a replicação depois.
dialog_create_subscription_copy_data = Copiar dados existentes do publicador
dialog_create_subscription_copy_data_tip = As tabelas do assinante já devem existir com colunas correspondentes.\nAs definições das tabelas não são copiadas. Desabilite se as linhas já estiverem presentes\npara evitar duplicatas.
dialog_create_subscription_copy_data_description = Exige tabelas existentes no assinante. Desmarque esta opção se os dados já estiverem sincronizados.
dialog_create_subscription_advanced = Opções avançadas
dialog_create_subscription_create_slot = Criar um slot de replicação no publicador
dialog_create_subscription_create_slot_tip = Os slots retêm WAL enquanto a replicação está parada.\nPara replicação no mesmo cluster, crie o slot separadamente e desabilite esta opção.\nDefina o nome do slot existente em Opções avançadas.
dialog_create_subscription_create_slot_description = Para replicação no mesmo cluster, crie o slot separadamente, desmarque esta opção e informe seu nome em Opções avançadas.
dialog_create_subscription_slot = Nome do slot
dialog_create_subscription_slot_tip = Deixe em branco para usar o nome da assinatura. Quando a criação de slot estiver desabilitada, informe o nome de um slot de replicação lógica existente no publicador. Nomes de slots usam letras minúsculas, dígitos e sublinhados.
dialog_create_subscription_slot_description = Deixe em branco para usar o nome da assinatura. Para usar um slot existente, desmarque Criar um slot de replicação e informe seu nome.
dialog_create_subscription_binary = Solicitar dados binários
dialog_create_subscription_binary_tip = Solicitar transferência binária em vez de texto para valores replicados. Os tipos de dados do publicador e do assinante devem ter formatos binários compatíveis. Deixe desabilitado para maior compatibilidade entre versões do PostgreSQL ou tipos de colunas diferentes.
dialog_create_subscription_streaming = Transmitir transações em andamento
dialog_create_subscription_streaming_tip = Transmitir alterações de grandes transações antes do commit, em vez de aguardar a transação completa no publicador. As alterações continuam sendo aplicadas de forma transacional no assinante.
dialog_create_subscription_commit = Commit síncrono
dialog_create_subscription_commit_tip = Configuração de durabilidade do processo de replicação da assinatura, não da conexão com o publicador. O padrão off melhora o desempenho da aplicação; on aguarda a gravação do WAL local. Configurações mais fortes podem reduzir o desempenho e aguardar réplicas síncronas do assinante.
