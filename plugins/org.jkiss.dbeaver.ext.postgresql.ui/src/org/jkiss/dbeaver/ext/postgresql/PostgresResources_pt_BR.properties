dialog_create_subscription_publications_datasource_tip = Após copiar uma conexão, o DBeaver lê as publicações por essa conexão por padrão. Caso contrário, usa o endereço do publicador da etapa anterior. Alterar esta seleção recarrega as publicações; não altera a conexão do assinante.
