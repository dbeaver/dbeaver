wizard_backup_page_object_description = Scegli schemi, tabelle e viste da esportare.
wizard_backup_page_setting_checkbox_use_insert = Usa SQL INSERT anziché COPY per le righe
wizard_backup_page_setting_checkbox_use_insert_tip = Esporta i dati come comandi INSERT anziché COPY. Il ripristino sarà molto lento;\nquesta opzione serve principalmente a creare dump caricabili in database diversi da PostgreSQL.
wizard_backup_page_setting_checkbox_no_privileges = Non includere i privilegi nel backup (GRANT/REVOKE)
wizard_backup_page_setting_checkbox_no_privileges_tip = Esclude i privilegi di accesso dal dump (comandi GRANT/REVOKE).
wizard_backup_page_setting_checkbox_no_owner = Ignora proprietario degli oggetti
wizard_backup_page_setting_checkbox_no_owner_tip = Non genera comandi per impostare il proprietario degli oggetti come nel database originale.\nQuesta opzione viene ignorata se il file di output è un archivio non testuale.\nPer i formati di archivio è possibile specificarla quando si esegue il comando di ripristino.
wizard_backup_page_setting_checkbox_restore_no_owner_tip = Non genera comandi per impostare il proprietario degli oggetti come nel database originale.
wizard_backup_page_setting_checkbox_drop_objects = Aggiungi istruzione di eliminazione del database
wizard_backup_page_setting_checkbox_drop_objects_tip = Genera comandi per eliminare gli oggetti del database prima dei comandi per crearli.\nQuesta opzione viene ignorata se il file di output è un archivio non testuale.\nPer i formati di archivio è possibile specificarla quando si esegue il comando di ripristino.
wizard_backup_page_setting_checkbox_create_database = Aggiungi istruzione di creazione del database
wizard_backup_page_setting_checkbox_create_database_tip = Inizia l'output con un comando per creare il database e riconnettersi al database creato.\nQuesta opzione viene ignorata se il file di output è un archivio non testuale.\nPer i formati di archivio è possibile specificarla quando si esegue il comando di ripristino.
wizard_backup_page_setting_group_output = Output
wizard_backup_all_page_global_backup_name = Backup globale
wizard_backup_all_page_global_backup_tip = Database da esportare
wizard_backup_all_page_setting_title = Impostazioni del backup globale
wizard_backup_all_page_setting_title_setting = Impostazioni
wizard_backup_all_page_setting_label_encoding = Codifica
wizard_backup_all_page_setting_checkbox_only_metadata = Esporta solo le definizioni degli oggetti, senza dati
wizard_backup_all_page_setting_checkbox_only_metadata_tip = Esporta solo le definizioni degli oggetti (schema), senza dati.
wizard_backup_all_page_setting_checkbox_only_global = Esporta solo gli oggetti globali, senza database
wizard_backup_all_page_setting_checkbox_only_global_tip = Esporta solo gli oggetti globali (ruoli e tablespace), senza database.\nFunziona solo se tutti i database sono selezionati.
wizard_backup_all_page_setting_checkbox_only_roles = Esporta solo ruoli
wizard_backup_all_page_setting_checkbox_only_roles_tip = Esporta solo i ruoli, senza database o tablespace.\nFunziona solo se tutti i database sono selezionati.
wizard_backup_all_page_setting_checkbox_only_tablespaces = Esporta solo tablespace
wizard_backup_all_page_setting_checkbox_only_tablespaces_tip = Esporta solo i tablespace, senza database o ruoli.\nFunziona solo se tutti i database sono selezionati.
wizard_backup_all_page_setting_checkbox_no_privileges = Non includere i privilegi nel backup (GRANT/REVOKE)
wizard_backup_all_page_setting_checkbox_no_privileges_tip = Esclude i privilegi di accesso dal dump (comandi GRANT/REVOKE).
wizard_backup_all_page_setting_checkbox_no_owner = Ignora proprietario degli oggetti
wizard_backup_all_page_setting_checkbox_no_owner_tip = Non genera comandi per impostare il proprietario degli oggetti come nel database originale.\nPer impostazione predefinita, pg_dumpall genera istruzioni ALTER OWNER o SET SESSION AUTHORIZATION per impostare il proprietario degli elementi dello schema creati.\nQueste istruzioni non riusciranno se lo script non viene avviato da un superutente o dall'utente proprietario di tutti gli oggetti nello script.\nPer creare uno script ripristinabile da qualsiasi utente, che assegni a tale utente la proprietà di tutti gli oggetti, specificare -O.
wizard_backup_all_page_setting_checkbox_add_passwords = Esporta password dei ruoli
wizard_backup_all_page_setting_checkbox_add_passwords_tip = Esporta le password dei ruoli come hash MD5.
wizard_backup_page_setting_group_security_label_info = Sostituisce le credenziali utente ("{0}") per gli oggetti "{1}".\nStrumenti esterni come ''psql e pg_dump'' possono richiedere autorizzazioni diverse.
wizard_backup_page_setting_group_security_btn_reset_default = Ripristina valori predefiniti
wizard_backup_page_setting_authentication_save_password = Salva password per l'attività
wizard_backup_page_setting_authentication_save_password_tip = Durante l'esportazione, la password verrà salvata nell'attività.
wizard_restore_page_setting_btn_clean_first = Elimina gli oggetti del database prima di ricrearli
wizard_restore_page_setting_btn_clean_first_tip = Elimina gli oggetti del database da ripristinare prima di ricrearli.\nPuò generare messaggi di errore innocui se alcuni oggetti non sono presenti nel database di destinazione.
wizard_restore_page_setting_confirm_dialog_title = Attenzione: ripristino dei dati
wizard_restore_page_setting_confirm_dialog_message = Prima di ripristinare gli oggetti del database verrà eseguito il comando DROP per tutti gli oggetti da ripristinare. Se alcuni non esistono nel database di destinazione, verranno segnalati errori ignorabili, a meno che non sia specificato anche --if-exists negli argomenti aggiuntivi del comando.\nQuesta opzione è utile per sovrascrivere un database esistente.\n\nContinuare?
wizard_backup_page_setting_checkbox_restore_create_database_tip = Inizia l'output con un comando per creare il database e riconnettersi al database creato.
wizard_restore_page_setting_label_choose_backup_file = Scegli file di backup
