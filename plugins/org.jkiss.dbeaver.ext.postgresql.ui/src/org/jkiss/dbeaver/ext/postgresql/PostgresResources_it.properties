dialog_setting_connection_nondefaultDatabase_tip = Mostra tutti i database nel navigatore database.\nSe non impostato, sarà visibile un solo database.\nQuesta opzione funziona solo con la configurazione manuale della connessione.\nLe opzioni per mostrare i database modello o non disponibili non funzionano se questa opzione è disabilitata.
dialog_setting_connection_show_templates = Mostra database modello
dialog_setting_connection_show_templates_tip = Mostra i database modello nell'elenco dei database.\nAbilitato solo se sono visibili i database non predefiniti
dialog_setting_connection_show_not_available_for_conn = Mostra database non disponibili per la connessione
dialog_setting_connection_show_not_available_for_conn_tip = Mostra nell'elenco dei database quelli non disponibili per la connessione.\nAbilitato solo se sono visibili i database non predefiniti
dialog_setting_connection_database_statistics_tip = Mostra le statistiche di interi database. Può essere lento se il numero di database è elevato.
dialog_setting_connection_advanced_group_label = Avanzate
dialog_setting_connection_read_all_data_types = Leggi tutti i tipi di dati
dialog_setting_connection_read_all_data_types_tip = Legge tutti i tipi di dati del database, inclusi i tipi array
dialog_setting_connection_read_keys_with_columns = Leggi chiavi delle tabelle insieme alle colonne
dialog_setting_connection_read_keys_with_columns_tip = Legge i vincoli delle tabelle durante la lettura delle colonne per riconoscere correttamente le chiavi.\nQuesta impostazione può ridurre le prestazioni di caricamento dei metadati.
dialog_setting_connection_replace_legacy_timezone = Sostituisci fuso orario precedente
dialog_setting_connection_replace_legacy_timezone_tip = Sostituisce il fuso orario precedente. Abilitare solo se occorre connettersi con un fuso orario precedente come Europe/Kyiv o Asia/Calcutta
