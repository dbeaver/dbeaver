dialog_query_planner_settings_title = Configurazione del piano di esecuzione PostgreSQL
dialog_query_planner_settings_control_label = Impostazioni EXPLAIN aggiuntive
dialog_query_planner_settings_analyze = ANALYSE
dialog_query_planner_settings_analyze_tip = Esegue EXPLAIN ANALYSE. Altrimenti esegue un semplice EXPLAIN.\nNota: ANALYSE può richiedere molto tempo per tabelle grandi
dialog_query_planner_settings_verbose = VERBOSE
dialog_query_planner_settings_verbose_tip = Mostra informazioni aggiuntive sul piano. Il valore predefinito di questo parametro è FALSE.
dialog_query_planner_settings_costs = COSTS
dialog_query_planner_settings_costs_tip = Include informazioni sul costo iniziale e totale stimato di ciascun nodo del piano,\nnonché sul numero stimato di righe e sulla larghezza stimata di ogni riga. Il valore predefinito di questo parametro è TRUE.
dialog_query_planner_settings = SETTINGS
dialog_query_planner_settings_tip = Include informazioni sui parametri di configurazione.\nIn particolare, include le opzioni che influenzano la pianificazione delle query con valori diversi da quelli predefiniti incorporati. Il valore predefinito è FALSE.
dialog_query_planner_settings_buffers = BUFFERS
dialog_query_planner_settings_buffers_tip = Include informazioni sull'uso dei buffer. Il valore predefinito è FALSE.
dialog_query_planner_settings_wal = WAL
dialog_query_planner_settings_wal_tip = Include informazioni sulla generazione dei record WAL.\nIn particolare, include il numero di record, il numero di immagini di pagine complete (fpi) e la quantità di WAL generato in byte.\nNel formato testuale vengono stampati solo i valori diversi da zero.\nQuesto parametro può essere usato solo se è abilitato anche ANALYZE. Il valore predefinito è FALSE.
dialog_query_planner_settings_timing = TIMING
dialog_query_planner_settings_timing_tip = Include nell'output il tempo iniziale effettivo e il tempo trascorso in ciascun nodo. Il valore predefinito è TRUE.
dialog_query_planner_settings_summary = SUMMARY
dialog_query_planner_settings_summary_tip = Include informazioni riepilogative (ad es. i tempi complessivi) dopo il piano della query.\nLe informazioni riepilogative sono incluse per impostazione predefinita quando si usa ANALYZE, ma negli altri casi non sono incluse,\ne possono essere abilitate con questa opzione.
dialog_connection_pgpass_hostname_override = Sostituisci host
dialog_connection_pgpass_hostname_override_tip = Usa un nome host diverso per un file pgPass
wizard_info_label_incompatible_tool = Questo strumento potrebbe non essere completamente compatibile con il database.
dialog_create_publication_tables = Scegli le tabelle da pubblicare. Lasciare vuoto per una pubblicazione vuota oppure selezionare Tutte le tabelle qui sopra.
dialog_create_publication_filter_tables = Filtra tabelle per nome o schema
