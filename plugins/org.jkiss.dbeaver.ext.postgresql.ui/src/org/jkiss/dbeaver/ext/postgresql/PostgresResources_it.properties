dialog_setting_session_role = Ruolo della sessione
dialog_setting_session_role_tip = Imposta l'identificatore dell'utente corrente della sessione corrente
dialog_setting_connection_use_prepared_statements_tip = Abilitare questa impostazione può migliorare le prestazioni, ma può anche causare problemi se il server PostgreSQL si trova dietro PGBouncer.
