dialog_create_subscription_title = Crea sottoscrizione
dialog_create_subscription_settings_tab = Impostazioni di replica
dialog_create_subscription_publications_tab = Pubblicazioni
dialog_create_subscription_filter_publications = Filtra pubblicazioni disponibili
dialog_create_subscription_publications_empty = Nessuna pubblicazione caricata. Ricaricare oppure inserire un nome di seguito.
dialog_create_subscription_publications_no_matches = Nessuna pubblicazione corrisponde al filtro.
dialog_create_subscription_testing_connection = Verifica dal server sottoscrittore...
dialog_create_subscription_connection_verified = Connesso
dialog_create_subscription_load_publications = Ricarica elenco delle pubblicazioni
dialog_create_subscription_load_publications_tip = Legge i nomi delle pubblicazioni usando la connessione selezionata.
dialog_create_subscription_publications_source = Server di pubblicazione: {0}
dialog_create_subscription_publications_datasource = Carica pubblicazioni da
dialog_create_subscription_publications_datasource_tip = Dopo aver copiato una connessione, DBeaver legge le pubblicazioni tramite tale connessione per impostazione predefinita. Altrimenti usa l'indirizzo del server di pubblicazione del passaggio precedente. Modificare questa selezione ricarica le pubblicazioni, ma non modifica la connessione del sottoscrittore.
dialog_create_subscription_loading_publications = Caricamento delle pubblicazioni...
dialog_create_subscription_load_publications_error = Impossibile caricare le pubblicazioni. Verificare la connessione oppure inserire i nomi di seguito.
dialog_create_subscription_load_publications_configuration_error = Impossibile caricare le pubblicazioni usando questo indirizzo. Inserire i nomi delle pubblicazioni di seguito.
dialog_create_subscription_no_publications = Nessuna pubblicazione trovata. È possibile inserire un nome di seguito.
dialog_create_subscription_name = Nome della sottoscrizione
dialog_create_subscription_name_tip = Nome della sottoscrizione da creare sul server sottoscrittore. Deve essere univoco in questo database ed è anche il nome predefinito dello slot di replica.
dialog_create_subscription_subscriber = Database sottoscrittore
dialog_create_subscription_subscriber_tip = La sottoscrizione viene creata in questo database. Avviare la creazione della sottoscrizione dal database di destinazione, non dal server di pubblicazione.
dialog_create_subscription_publisher = Connessione al server di pubblicazione
dialog_create_subscription_existing_connection = Copia da connessione...
dialog_create_subscription_existing_connection_tip = Copia una connessione PostgreSQL con autenticazione nativa e la usa per caricare le pubblicazioni. Adattare l'indirizzo del server di pubblicazione affinché sia raggiungibile dal sottoscrittore; le impostazioni di connessione salvate rimangono invariate.
dialog_create_subscription_manual_connection = Configurazione manuale
dialog_create_subscription_endpoint_tip = Host e porta del server di pubblicazione raggiungibili dal server sottoscrittore.
dialog_create_subscription_test_connection = Verifica connessione dal sottoscrittore
dialog_create_subscription_test_connection_tip = Verifica una connessione di replica dal server sottoscrittore tramite una prova senza slot, annullata con rollback. Richiede i privilegi di creazione delle sottoscrizioni. Non vengono copiati dati né verificate le pubblicazioni o la compatibilità delle tabelle.
dialog_create_subscription_test_connection_success = Il server sottoscrittore si è connesso correttamente al server di pubblicazione tramite una connessione di replica. Non sono stati conservati sottoscrizioni o slot di replica. Le pubblicazioni e la compatibilità delle tabelle non sono state verificate.
dialog_create_subscription_ssl_tab = SSL
dialog_create_subscription_ssl_paths_tip = I percorsi dei certificati devono esistere sul server sottoscrittore.
dialog_create_subscription_publications = Pubblicazioni
dialog_create_subscription_connect = Connetti al server di pubblicazione durante la creazione
dialog_create_subscription_connect_tip = Verifica le pubblicazioni durante la creazione. Disabilitare per rimandare connessione, replica, creazione dello slot e copia dei dati; completare la configurazione con ALTER SUBSCRIPTION.
dialog_create_subscription_enabled = Avvia replica subito dopo la creazione
dialog_create_subscription_enabled_tip = Avvia la replica dopo la creazione. Richiede la connessione al server di pubblicazione; disabilitare per avviare la replica in seguito.
dialog_create_subscription_copy_data = Copia dati esistenti dal server di pubblicazione
dialog_create_subscription_copy_data_tip = Le tabelle del sottoscrittore devono già esistere con colonne corrispondenti.\nLe definizioni delle tabelle non vengono copiate. Disabilitare se le righe sono già presenti\nper evitare duplicati.
dialog_create_subscription_copy_data_description = Richiede tabelle già esistenti sul sottoscrittore. Deselezionare questa opzione se i dati sono già sincronizzati.
dialog_create_subscription_advanced = Opzioni avanzate
dialog_create_subscription_create_slot = Crea slot di replica sul server di pubblicazione
dialog_create_subscription_create_slot_tip = Gli slot conservano i WAL mentre la replica è arrestata.\nPer la replica nello stesso cluster, creare lo slot separatamente e disabilitare questa opzione.\nImpostare il nome dello slot esistente nelle Opzioni avanzate.
dialog_create_subscription_create_slot_description = Per la replica nello stesso cluster, creare lo slot separatamente, deselezionare questa opzione e inserirne il nome nelle Opzioni avanzate.
dialog_create_subscription_slot = Nome dello slot
dialog_create_subscription_slot_tip = Lasciare vuoto per usare il nome della sottoscrizione. Se la creazione dello slot è disabilitata, inserire il nome di uno slot di replica logica esistente sul server di pubblicazione. I nomi degli slot usano lettere minuscole, cifre e trattini bassi.
dialog_create_subscription_slot_description = Lasciare vuoto per usare il nome della sottoscrizione. Per usare uno slot esistente, deselezionare Crea slot di replica e inserirne il nome.
dialog_create_subscription_binary = Richiedi dati binari
dialog_create_subscription_binary_tip = Richiede il trasferimento binario anziché testuale dei valori replicati. I tipi di dati del server di pubblicazione e del sottoscrittore devono avere formati binari compatibili. Lasciare disabilitato per una maggiore compatibilità tra versioni PostgreSQL o tipi di colonna diversi.
dialog_create_subscription_streaming = Trasmetti transazioni in corso
dialog_create_subscription_streaming_tip = Trasmette le modifiche delle transazioni grandi prima del commit, anziché attendere la transazione completa sul server di pubblicazione. Le modifiche vengono comunque applicate in modo transazionale sul sottoscrittore.
dialog_create_subscription_commit = Commit sincrono
dialog_create_subscription_commit_tip = Impostazione di durabilità per il processo di replica della sottoscrizione, non per la connessione al server di pubblicazione. Il valore predefinito off migliora le prestazioni di applicazione; on attende la scrittura del WAL locale. Impostazioni più rigorose possono ridurre le prestazioni e attendere i server standby sincroni del sottoscrittore.
dialog_create_subscription_error_name = Inserire un nome per la sottoscrizione.
dialog_create_subscription_error_publisher = Configurare la connessione al server di pubblicazione.
dialog_create_subscription_error_publications = Selezionare almeno una pubblicazione o aggiungere un nome di pubblicazione.
dialog_create_subscription_publisher_description = Configura la connessione che verrà usata dal server ricevente.
dialog_create_subscription_publications_description = Scegli cosa ricevere dal server di pubblicazione selezionato.
dialog_create_subscription_settings_description = Rivedi la sottoscrizione e scegli come avviarla.
dialog_create_subscription_connection_not_tested = Non verificata
dialog_create_subscription_custom_publication_name = Inserisci nome della pubblicazione
dialog_create_subscription_add_publication = Aggiungi pubblicazione personalizzata
dialog_create_subscription_slot_placeholder = Predefinito: nome della sottoscrizione
dialog_create_subscription_host_mode = Host
dialog_create_subscription_url_tip = URI di connessione PostgreSQL (postgresql://host:port/database). I parametri dell'URL prevalgono sui campi nome utente, password e SSL.
dialog_create_subscription_connect_by = Connetti tramite
dialog_create_subscription_url_placeholder = postgresql://host:5432/database
dialog_create_subscription_error_slot = I nomi degli slot devono contenere da 1 a 63 lettere minuscole, cifre o trattini bassi. Modificarlo nelle Opzioni avanzate.
dialog_refresh_subscription_title = Aggiorna pubblicazioni della sottoscrizione
dialog_refresh_subscription_description = Recupera l'elenco corrente delle tabelle dal server di pubblicazione per le sottoscrizioni selezionate. Salvare prima le modifiche alle sottoscrizioni e abilitarle. Le tabelle del sottoscrittore devono già esistere con colonne corrispondenti.
dialog_refresh_subscription_copy_data = Copia dati esistenti per le tabelle appena sottoscritte
dialog_refresh_subscription_two_phase = La copia dei dati esistenti non è disponibile perché una sottoscrizione selezionata ha il commit a due fasi abilitato.
dialog_create_subscription_publisher_setup = Configurazione del server di pubblicazione
dialog_create_subscription_publisher_setup_tip = La replica logica è disabilitata nella connessione usata per caricare le pubblicazioni. Fare clic per le istruzioni di configurazione del server di pubblicazione.
dialog_create_subscription_publisher_setup_instructions = La connessione usata per caricare le pubblicazioni ha wal_level inferiore a logical. Potrebbe differire dall'indirizzo del server di pubblicazione usato dal sottoscrittore.\n\nSe questo è il server di pubblicazione, chiedere a un amministratore PostgreSQL di eseguire:\n\nALTER SYSTEM SET wal_level = 'logical';\n\nRiavviare quel server PostgreSQL, quindi ricaricare le pubblicazioni in questa procedura guidata.\n\nPer rimandare la configurazione del server di pubblicazione, deselezionare Connetti al server di pubblicazione.
