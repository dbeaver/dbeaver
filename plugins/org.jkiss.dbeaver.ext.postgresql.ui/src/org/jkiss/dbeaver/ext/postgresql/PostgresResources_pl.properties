dialog_create_subscription_publications_empty = Nie wczytano publikacji. Wczytaj ponownie lub wprowadź nazwę poniżej.
dialog_create_subscription_publications_no_matches = Żadna publikacja nie pasuje do filtru.
dialog_create_subscription_testing_connection = Testowanie z serwera subskrybenta...
dialog_create_subscription_connection_verified = Połączono
dialog_create_subscription_load_publications = Wczytaj ponownie listę publikacji
dialog_create_subscription_load_publications_tip = Odczytaj nazwy publikacji przy użyciu wybranego połączenia.
dialog_create_subscription_publications_source = Wydawca: {0}
dialog_create_subscription_publications_datasource = Wczytaj publikacje z
dialog_create_subscription_publications_datasource_tip = Po skopiowaniu połączenia DBeaver domyślnie odczytuje publikacje przez to połączenie. W przeciwnym razie używa adresu wydawcy z poprzedniego kroku. Zmiana tego wyboru ponownie wczytuje publikacje; nie zmienia połączenia subskrybenta.
dialog_create_subscription_loading_publications = Wczytywanie publikacji...
dialog_create_subscription_load_publications_error = Nie udało się wczytać publikacji. Sprawdź połączenie lub wprowadź nazwy poniżej.
dialog_create_subscription_load_publications_configuration_error = Nie można wczytać publikacji przy użyciu tego adresu. Wprowadź nazwy publikacji poniżej.
dialog_create_subscription_no_publications = Nie znaleziono publikacji. Możesz wprowadzić nazwę poniżej.
dialog_create_subscription_name = Nazwa subskrypcji
dialog_create_subscription_name_tip = Nazwa subskrypcji tworzonej u subskrybenta. Musi być unikatowa w tej bazie danych i jest też domyślną nazwą slotu replikacji.
dialog_create_subscription_subscriber = Baza danych subskrybenta
dialog_create_subscription_subscriber_tip = Subskrypcja jest tworzona w tej bazie danych. Rozpocznij tworzenie subskrypcji z poziomu docelowej bazy danych, a nie wydawcy.
dialog_create_subscription_publisher = Połączenie z wydawcą
dialog_create_subscription_existing_connection = Skopiuj z połączenia...
dialog_create_subscription_existing_connection_tip = Skopiuj połączenie PostgreSQL z uwierzytelnianiem natywnym i użyj go do wczytania publikacji. Dostosuj adres wydawcy do serwera subskrybenta; zapisane ustawienia połączenia pozostaną bez zmian.
dialog_create_subscription_manual_connection = Konfiguracja ręczna
dialog_create_subscription_endpoint_tip = Host i port wydawcy dostępne z serwera subskrybenta.
dialog_create_subscription_test_connection = Przetestuj połączenie z serwera subskrybenta
dialog_create_subscription_test_connection_tip = Testuje połączenie replikacji z serwera subskrybenta za pomocą wycofywanej próby niewymagającej slotu. Wymaga uprawnień do tworzenia subskrypcji. Dane nie są kopiowane; publikacje i zgodność tabel nie są sprawdzane.
dialog_create_subscription_test_connection_success = Serwer subskrybenta pomyślnie połączył się z wydawcą przez połączenie replikacji. Nie zachowano subskrypcji ani slotu replikacji. Nie sprawdzano publikacji ani zgodności tabel.
dialog_create_subscription_ssl_tab = SSL
dialog_create_subscription_ssl_paths_tip = Ścieżki certyfikatów muszą istnieć na serwerze subskrybenta.
dialog_create_subscription_publications = Publikacje
dialog_create_subscription_connect = Połącz z wydawcą podczas tworzenia
dialog_create_subscription_connect_tip = Sprawdź publikacje podczas tworzenia. Wyłącz, aby odroczyć połączenie, replikację, tworzenie slotu i kopiowanie danych; dokończ konfigurację za pomocą ALTER SUBSCRIPTION.
dialog_create_subscription_enabled = Uruchom replikację natychmiast po utworzeniu
dialog_create_subscription_enabled_tip = Uruchom replikację po utworzeniu. Wymaga połączenia z wydawcą; wyłącz, aby uruchomić replikację później.
dialog_create_subscription_copy_data = Kopiuj istniejące dane od wydawcy
dialog_create_subscription_copy_data_tip = Tabele subskrybenta muszą już istnieć i mieć zgodne kolumny.\nDefinicje tabel nie są kopiowane. Wyłącz, jeśli wiersze już istnieją,\naby uniknąć duplikatów.
dialog_create_subscription_copy_data_description = Wymaga istniejących tabel subskrybenta. Wyczyść tę opcję, jeśli dane są już zsynchronizowane.
dialog_create_subscription_advanced = Opcje zaawansowane
dialog_create_subscription_create_slot = Utwórz slot replikacji u wydawcy
dialog_create_subscription_create_slot_tip = Sloty zatrzymują dane WAL, gdy replikacja jest zatrzymana.\nW przypadku replikacji w tym samym klastrze utwórz slot osobno i wyłącz tę opcję.\nUstaw nazwę istniejącego slotu w Opcjach zaawansowanych.
dialog_create_subscription_create_slot_description = W przypadku replikacji w tym samym klastrze utwórz slot osobno, wyczyść tę opcję i wprowadź jego nazwę w Opcjach zaawansowanych.
dialog_create_subscription_slot = Nazwa slotu
dialog_create_subscription_slot_tip = Pozostaw puste, aby użyć nazwy subskrypcji. Gdy tworzenie slotu jest wyłączone, wprowadź nazwę istniejącego slotu replikacji logicznej u wydawcy. Nazwy slotów składają się z małych liter, cyfr i podkreśleń.
dialog_create_subscription_slot_description = Pozostaw puste, aby użyć nazwy subskrypcji. Aby użyć istniejącego slotu, wyczyść opcję Utwórz slot replikacji i wprowadź jego nazwę.
dialog_create_subscription_binary = Żądaj danych binarnych
dialog_create_subscription_binary_tip = Żądaj przesyłania replikowanych wartości w formacie binarnym zamiast tekstowego. Typy danych wydawcy i subskrybenta muszą mieć zgodne formaty binarne. Pozostaw wyłączone, aby zapewnić lepszą zgodność między wersjami PostgreSQL lub różnymi typami kolumn.
dialog_create_subscription_streaming = Przesyłaj strumieniowo trwające transakcje
dialog_create_subscription_streaming_tip = Przesyłaj strumieniowo zmiany z dużych transakcji przed ich zatwierdzeniem, zamiast czekać na całą transakcję u wydawcy. Zmiany nadal są stosowane transakcyjnie u subskrybenta.
dialog_create_subscription_commit = Zatwierdzanie synchroniczne
dialog_create_subscription_commit_tip = Ustawienie trwałości dla procesu replikacji subskrypcji, a nie dla połączenia z wydawcą. Domyślna wartość off poprawia wydajność stosowania zmian; on wymaga oczekiwania na lokalny zapis WAL. Silniejsze ustawienia mogą obniżyć wydajność i wymagać oczekiwania na synchroniczne serwery zapasowe subskrybenta.
dialog_create_subscription_error_name = Wprowadź nazwę subskrypcji.
dialog_create_subscription_error_publisher = Skonfiguruj połączenie z wydawcą.
dialog_create_subscription_error_publications = Wybierz co najmniej jedną publikację lub dodaj nazwę publikacji.
dialog_create_subscription_publisher_description = Skonfiguruj połączenie używane przez serwer odbierający.
dialog_create_subscription_publications_description = Wybierz dane do odbierania od wybranego wydawcy.
dialog_create_subscription_settings_description = Sprawdź subskrypcję i wybierz sposób jej uruchomienia.
dialog_create_subscription_connection_not_tested = Nie przetestowano
dialog_create_subscription_custom_publication_name = Wprowadź nazwę publikacji
dialog_create_subscription_add_publication = Dodaj własną publikację
dialog_create_subscription_slot_placeholder = Domyślnie nazwa subskrypcji
dialog_create_subscription_host_mode = Host
dialog_create_subscription_url_tip = URI połączenia PostgreSQL (postgresql://host:port/database). Parametry URL mają pierwszeństwo przed polami nazwy użytkownika, hasła i SSL.
dialog_create_subscription_connect_by = Sposób połączenia
dialog_create_subscription_url_placeholder = postgresql://host:5432/database
dialog_create_subscription_error_slot = Nazwy slotów muszą zawierać od 1 do 63 małych liter, cyfr lub podkreśleń. Zmień nazwę w Opcjach zaawansowanych.
dialog_refresh_subscription_title = Odśwież publikacje subskrypcji
dialog_refresh_subscription_description = Pobierz bieżącą listę tabel od wydawcy dla wybranych subskrypcji. Najpierw zapisz zmiany w subskrypcjach i włącz je. Tabele subskrybenta muszą już istnieć i mieć zgodne kolumny.
dialog_refresh_subscription_copy_data = Kopiuj istniejące dane nowo subskrybowanych tabel
dialog_refresh_subscription_two_phase = Kopiowanie istniejących danych jest niedostępne, ponieważ wybrana subskrypcja ma włączone zatwierdzanie dwufazowe.
dialog_create_subscription_publisher_setup = Konfiguracja wydawcy
dialog_create_subscription_publisher_setup_tip = Replikacja logiczna jest wyłączona dla połączenia używanego do wczytywania publikacji. Kliknij, aby wyświetlić instrukcje konfiguracji wydawcy.
dialog_create_subscription_publisher_setup_instructions = Połączenie używane do wczytywania publikacji ma wal_level niższy niż logical. Może ono różnić się od adresu wydawcy używanego przez subskrybenta.\n\nJeśli jest to serwer wydawcy, poproś administratora PostgreSQL o wykonanie:\n\nALTER SYSTEM SET wal_level = 'logical';\n\nUruchom ponownie ten serwer PostgreSQL, a następnie ponownie wczytaj publikacje w tym kreatorze.\n\nAby odroczyć konfigurację wydawcy, wyczyść opcję Połącz z wydawcą.
