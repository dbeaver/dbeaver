wizard_backup_all_page_setting_checkbox_only_metadata_tip = Zapisz tylko definicje obiektów (schemat), bez danych.
wizard_backup_all_page_setting_checkbox_only_global = Zapisz tylko obiekty globalne, bez baz danych
wizard_backup_all_page_setting_checkbox_only_global_tip = Zapisz tylko obiekty globalne (role i przestrzenie tabel), bez baz danych.\nDziała tylko, gdy zaznaczono wszystkie bazy danych.
wizard_backup_all_page_setting_checkbox_only_roles = Zapisz tylko role
wizard_backup_all_page_setting_checkbox_only_roles_tip = Zapisz tylko role, bez baz danych i przestrzeni tabel.\nDziała tylko, gdy zaznaczono wszystkie bazy danych.
wizard_backup_all_page_setting_checkbox_only_tablespaces = Zapisz tylko przestrzenie tabel
wizard_backup_all_page_setting_checkbox_only_tablespaces_tip = Zapisz tylko przestrzenie tabel, bez baz danych i ról.\nDziała tylko, gdy zaznaczono wszystkie bazy danych.
wizard_backup_all_page_setting_checkbox_no_privileges = Nie zapisuj uprawnień (GRANT/REVOKE)
wizard_backup_all_page_setting_checkbox_no_privileges_tip = Nie zapisuj uprawnień dostępu (poleceń grant/revoke).
wizard_backup_all_page_setting_checkbox_no_owner = Pomiń właściciela obiektów
wizard_backup_all_page_setting_checkbox_no_owner_tip = Nie zapisuj poleceń ustawiających właściciela obiektów zgodnie z oryginalną bazą danych.\nDomyślnie pg_dumpall generuje instrukcje ALTER OWNER lub SET SESSION AUTHORIZATION ustawiające właściciela tworzonych elementów schematu.\nTe instrukcje zakończą się błędem, jeśli skrypt nie zostanie uruchomiony przez superużytkownika (lub właściciela wszystkich obiektów w skrypcie).\nAby utworzyć skrypt, który może przywrócić dowolny użytkownik, stając się właścicielem wszystkich obiektów, podaj -O.
wizard_backup_all_page_setting_checkbox_add_passwords = Zapisz hasła ról
wizard_backup_all_page_setting_checkbox_add_passwords_tip = Zapisz hasła ról w formacie skrótu MD5.
wizard_backup_page_setting_group_security = Bezpieczeństwo
wizard_backup_page_setting_group_security_label_info = Nadpisz dane uwierzytelniające użytkownika („{0}”) dla obiektów „{1}”.\nNarzędzia zewnętrzne, takie jak „psql i pg_dump”, mogą wymagać innego zestawu uprawnień.
