wizard_restore_page_setting_btn_clean_first_tip = Wyczyść (usuń) przywracane obiekty bazy danych przed ich odtworzeniem.\n(Może to spowodować nieszkodliwe komunikaty o błędach, jeśli niektórych obiektów nie było w docelowej bazie danych)
wizard_restore_page_setting_confirm_dialog_title = Uwaga: przywracanie danych
wizard_restore_page_setting_confirm_dialog_message = Przed przywróceniem obiektów bazy danych dla wszystkich przywracanych obiektów zostanie wykonane polecenie DROP. Jeśli któregoś obiektu nie ma w docelowej bazie danych, zostaną zgłoszone błędy, które można zignorować, chyba że w dodatkowych argumentach polecenia podano też --if-exists.\nTa opcja jest przydatna do nadpisania istniejącej bazy danych.\n\nCzy na pewno chcesz kontynuować?
