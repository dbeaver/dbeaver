wizard_backup_page_setting_checkbox_use_insert_tip = Zapisuj dane jako polecenia INSERT (zamiast COPY). Spowoduje to bardzo wolne przywracanie;\nprzydaje się głównie do tworzenia zrzutów, które można wczytać do baz innych niż PostgreSQL.
wizard_backup_page_setting_checkbox_no_privileges = Nie zapisuj uprawnień (GRANT/REVOKE)
