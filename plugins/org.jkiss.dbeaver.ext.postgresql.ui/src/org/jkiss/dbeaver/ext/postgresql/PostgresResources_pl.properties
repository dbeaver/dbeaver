dialog_query_planner_settings_analyze = ANALYSE
dialog_query_planner_settings_analyze_tip = Wykonaj EXPLAIN ANALYSE. W przeciwnym razie zostanie wykonany zwykły EXPLAIN.\nUwaga: ANALYSE może trwać długo dla dużych tabel
dialog_query_planner_settings_verbose = VERBOSE
dialog_query_planner_settings_verbose_tip = Wyświetlaj dodatkowe informacje o planie. Domyślnie FALSE.
dialog_query_planner_settings_costs = COSTS
dialog_query_planner_settings_costs_tip = Uwzględnij szacowany koszt początkowy i całkowity każdego węzła planu,\na także szacowaną liczbę wierszy i szacowaną szerokość wiersza. Domyślnie TRUE.
dialog_query_planner_settings = SETTINGS
dialog_query_planner_settings_tip = Uwzględnij informacje o parametrach konfiguracji.\nDokładnie: opcje wpływające na planowanie zapytań o wartościach innych niż wbudowane domyślne. Domyślnie FALSE.
dialog_query_planner_settings_buffers = BUFFERS
dialog_query_planner_settings_buffers_tip = Uwzględnij informacje o użyciu buforów. Domyślnie FALSE.
dialog_query_planner_settings_wal = WAL
dialog_query_planner_settings_wal_tip = Uwzględnij informacje o generowaniu rekordów WAL.\nDokładnie: liczbę rekordów, liczbę pełnych obrazów stron (fpi) i ilość wygenerowanego WAL w bajtach.\nW formacie tekstowym wypisywane są tylko wartości niezerowe.\nTego parametru można używać tylko z włączonym ANALYZE. Domyślnie FALSE.
dialog_query_planner_settings_timing = TIMING
dialog_query_planner_settings_timing_tip = Uwzględnij w wyniku rzeczywisty czas startu i czas spędzony w każdym węźle. Domyślnie TRUE.
dialog_query_planner_settings_summary = SUMMARY
dialog_query_planner_settings_summary_tip = Uwzględnij podsumowanie (np. łączne czasy) po planie zapytania.\nPodsumowanie jest domyślnie dołączane przy ANALYZE, w przeciwnym razie nie jest dołączane,\nale można je włączyć tą opcją.
