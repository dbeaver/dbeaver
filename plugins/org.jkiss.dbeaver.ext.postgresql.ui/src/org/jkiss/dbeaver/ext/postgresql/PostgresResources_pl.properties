wizard_backup_page_setting_checkbox_no_owner = Pomiń właściciela obiektów
wizard_backup_page_setting_checkbox_no_owner_tip = Nie zapisuj poleceń ustawiających właściciela obiektów zgodnie z oryginalną bazą danych.\nOpcja jest ignorowana przy zapisie do pliku archiwum (nie tekstowego).\nDla formatów archiwum można ją podać przy wywołaniu polecenia przywracania.
wizard_backup_page_setting_checkbox_restore_no_owner_tip = Nie zapisuj poleceń ustawiających właściciela obiektów zgodnie z oryginalną bazą danych.
wizard_backup_page_setting_checkbox_drop_objects = Dodaj instrukcję usunięcia bazy danych
wizard_backup_page_setting_checkbox_drop_objects_tip = Zapisuj polecenia czyszczące (usuwające) obiekty bazy danych przed poleceniami ich tworzenia.\nOpcja jest ignorowana przy zapisie do pliku archiwum (nie tekstowego).\nDla formatów archiwum można ją podać przy wywołaniu polecenia przywracania.
wizard_backup_page_setting_checkbox_create_database = Dodaj instrukcję utworzenia bazy danych
wizard_backup_page_setting_checkbox_create_database_tip = Rozpocznij wynik poleceniem tworzącym samą bazę danych i ponownym połączeniem z utworzoną bazą.\nOpcja jest ignorowana przy zapisie do pliku archiwum (nie tekstowego).\nDla formatów archiwum można ją podać przy wywołaniu polecenia przywracania.
