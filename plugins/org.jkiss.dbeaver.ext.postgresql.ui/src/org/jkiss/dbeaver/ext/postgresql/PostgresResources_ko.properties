dialog_create_subscription_streaming = 진행 중인 트랜잭션 스트리밍
dialog_create_subscription_streaming_tip = 발행자에서 전체 트랜잭션이 완료될 때까지 기다리지 않고 대규모 트랜잭션이 커밋되기 전에 변경 사항을 스트리밍합니다. 구독자에는 여전히 트랜잭션 단위로 적용됩니다.
dialog_create_subscription_commit = 동기 커밋
dialog_create_subscription_commit_tip = 발행자 연결이 아닌 구독 복제 작업자의 내구성 설정입니다. 기본값인 off는 적용 성능을 높이고 on은 로컬 WAL 기록을 기다립니다. 더 강한 설정은 성능을 저하시키고 구독자의 동기 대기 서버를 기다릴 수 있습니다.
dialog_create_subscription_error_name = 구독 이름을 입력하세요.
dialog_create_subscription_error_publisher = 발행자 연결을 구성하세요.
dialog_create_subscription_error_publications = 발행을 하나 이상 선택하거나 발행 이름을 추가하세요.
dialog_create_subscription_publisher_description = 수신자 서버에서 사용할 연결을 구성하세요.
dialog_create_subscription_publications_description = 선택한 발행자로부터 수신할 항목을 선택하세요.
dialog_create_subscription_settings_description = 구독을 검토하고 시작 방식을 선택하세요.
dialog_create_subscription_connection_not_tested = 테스트하지 않음
dialog_create_subscription_custom_publication_name = 발행 이름 입력
dialog_create_subscription_add_publication = 사용자 지정 발행 추가
dialog_create_subscription_slot_placeholder = 기본값은 구독 이름
dialog_create_subscription_host_mode = 호스트
dialog_create_subscription_url_tip = PostgreSQL 연결 URI (postgresql://host:port/database)입니다. URL 매개변수가 사용자 이름, 비밀번호 및 SSL 필드보다 우선합니다.
dialog_create_subscription_connect_by = 연결 방식
dialog_create_subscription_url_placeholder = postgresql://host:5432/database
dialog_create_subscription_error_slot = 슬롯 이름은 소문자, 숫자 또는 밑줄 1~63자로 구성되어야 합니다. 고급 옵션에서 변경하세요.
dialog_refresh_subscription_title = 구독 발행 목록 새로 고침
dialog_refresh_subscription_description = 선택한 구독의 현재 테이블 목록을 발행자에서 가져옵니다. 먼저 구독 변경 사항을 저장하고 구독을 활성화하세요. 구독자에 열이 일치하는 테이블이 이미 존재해야 합니다.
dialog_refresh_subscription_copy_data = 새로 구독한 테이블의 기존 데이터 복사
dialog_refresh_subscription_two_phase = 선택한 구독 중 2단계 커밋이 활성화된 항목이 있어 기존 데이터를 복사할 수 없습니다.
dialog_create_subscription_publisher_setup = 발행자 설정
dialog_create_subscription_publisher_setup_tip = 발행을 불러오는 데 사용한 연결에서 논리적 복제가 비활성화되어 있습니다. 클릭하여 발행자 설정 방법을 확인하세요.
dialog_create_subscription_publisher_setup_instructions = 발행을 불러오는 데 사용한 연결의 wal_level이 logical보다 낮습니다. 구독자가 사용하는 발행자 주소와 다를 수 있습니다.\n\n이 서버가 발행자라면 PostgreSQL 관리자에게 다음 명령의 실행을 요청하세요:\n\nALTER SYSTEM SET wal_level = 'logical';\n\n해당 PostgreSQL 서버를 다시 시작한 후 이 마법사에서 발행을 다시 불러오세요.\n\n발행자 설정을 미루려면 발행자에 연결 옵션을 해제하세요.
