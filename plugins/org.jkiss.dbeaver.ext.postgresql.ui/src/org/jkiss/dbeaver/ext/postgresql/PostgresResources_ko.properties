dialog_create_subscription_existing_connection_tip = 기본 인증 방식의 PostgreSQL 연결을 복사하고 발행 불러오기에 사용합니다. 구독자 서버에서 접근할 수 있도록 발행자 주소를 조정하세요. 저장된 연결 설정은 변경되지 않습니다.
dialog_create_subscription_manual_connection = 수동 구성
