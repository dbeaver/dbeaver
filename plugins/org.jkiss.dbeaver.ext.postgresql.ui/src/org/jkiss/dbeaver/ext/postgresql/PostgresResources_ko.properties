dialog_create_subscription_publications = 발행
dialog_create_subscription_connect = 생성 중 발행자에 연결
dialog_create_subscription_connect_tip = 생성 중 발행을 확인합니다. 연결, 복제, 슬롯 생성 및 데이터 복사를 미루려면 비활성화한 후 ALTER SUBSCRIPTION으로 설정을 완료하세요.
dialog_create_subscription_enabled = 생성 직후 복제 시작
dialog_create_subscription_enabled_tip = 생성 후 복제를 시작합니다. 발행자에 연결해야 합니다. 나중에 복제를 시작하려면 비활성화하세요.
dialog_create_subscription_copy_data = 발행자의 기존 데이터 복사
dialog_create_subscription_copy_data_tip = 구독자에 열이 일치하는 테이블이 이미 존재해야 합니다.\n테이블 정의는 복사되지 않습니다. 행이 이미 존재하면 중복을 방지하기 위해\n비활성화하세요.
dialog_create_subscription_copy_data_description = 구독자에 테이블이 이미 존재해야 합니다. 데이터가 이미 동기화되어 있으면 이 옵션을 해제하세요.
dialog_create_subscription_advanced = 고급 옵션
dialog_create_subscription_create_slot = 발행자에 복제 슬롯 생성
dialog_create_subscription_create_slot_tip = 복제가 중지된 동안 슬롯은 WAL을 유지합니다.\n동일 클러스터 내 복제에서는 슬롯을 별도로 생성하고 이 옵션을 비활성화하세요.\n고급 옵션에 기존 슬롯 이름을 입력하세요.
dialog_create_subscription_create_slot_description = 동일 클러스터 내 복제에서는 슬롯을 별도로 생성하고 이 옵션을 해제한 후 고급 옵션에 슬롯 이름을 입력하세요.
dialog_create_subscription_slot = 슬롯 이름
dialog_create_subscription_slot_tip = 비워 두면 구독 이름을 사용합니다. 슬롯 생성을 비활성화한 경우 발행자의 기존 논리적 복제 슬롯 이름을 입력하세요. 슬롯 이름에는 소문자, 숫자 및 밑줄을 사용합니다.
dialog_create_subscription_slot_description = 비워 두면 구독 이름을 사용합니다. 기존 슬롯을 사용하려면 복제 슬롯 생성을 해제하고 이름을 입력하세요.
dialog_create_subscription_binary = 바이너리 데이터 요청
