dialog_create_subscription_test_connection = 구독자에서 연결 테스트
dialog_create_subscription_test_connection_tip = 슬롯을 생성하지 않고 롤백되는 검사로 구독자 서버에서 복제 연결을 테스트합니다. 구독 생성 권한이 필요합니다. 데이터는 복사하지 않으며 발행 및 테이블 호환성은 검사하지 않습니다.
dialog_create_subscription_test_connection_success = 구독자 서버가 복제 연결을 통해 발행자에 연결했습니다. 구독이나 복제 슬롯은 유지되지 않았습니다. 발행 및 테이블 호환성은 검사하지 않았습니다.
dialog_create_subscription_ssl_tab = SSL
