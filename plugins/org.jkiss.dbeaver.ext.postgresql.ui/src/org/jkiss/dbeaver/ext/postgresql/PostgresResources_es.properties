dialog_create_subscription_load_publications_configuration_error = No se pueden cargar publicaciones desde esta dirección. Introduzca los nombres de las publicaciones abajo.
dialog_create_subscription_no_publications = No se encontraron publicaciones. Puede introducir un nombre abajo.
dialog_create_subscription_name = Nombre de la suscripción
dialog_create_subscription_name_tip = Nombre de la suscripción que se creará en el suscriptor. Debe ser único en esta base de datos y es también el nombre predeterminado de la ranura de replicación.
dialog_create_subscription_subscriber = Base de datos suscriptora
dialog_create_subscription_subscriber_tip = La suscripción se crea en esta base de datos. Abra la creación de suscripciones desde la base de datos de destino, no desde el publicador.
dialog_create_subscription_publisher = Conexión del publicador
dialog_create_subscription_existing_connection = Copiar desde una conexión...
dialog_create_subscription_existing_connection_tip = Copiar una conexión PostgreSQL con autenticación nativa y usarla para cargar publicaciones. Ajuste la dirección del publicador para el servidor suscriptor; la configuración guardada de la conexión no cambia.
dialog_create_subscription_manual_connection = Configuración manual
dialog_create_subscription_endpoint_tip = Servidor y puerto del publicador accesibles desde el servidor suscriptor.
dialog_create_subscription_test_connection = Probar conexión desde el suscriptor
dialog_create_subscription_test_connection_tip = Prueba una conexión de replicación desde el servidor suscriptor mediante una prueba sin ranura que se revierte. Requiere privilegios de creación de suscripciones. No se copian datos ni se comprueban las publicaciones o la compatibilidad de las tablas.
dialog_create_subscription_test_connection_success = El servidor suscriptor se ha conectado correctamente al publicador mediante una conexión de replicación. No se ha conservado ninguna suscripción ni ranura de replicación. No se han comprobado las publicaciones ni la compatibilidad de las tablas.
dialog_create_subscription_ssl_tab = SSL
dialog_create_subscription_ssl_paths_tip = Las rutas de los certificados deben existir en el servidor suscriptor.
dialog_create_subscription_publications = Publicaciones
dialog_create_subscription_connect = Conectar con el publicador durante la creación
dialog_create_subscription_connect_tip = Comprobar las publicaciones durante la creación. Desactívelo para aplazar la conexión, la replicación, la creación de ranuras y la copia de datos; complete la configuración con ALTER SUBSCRIPTION.
dialog_create_subscription_enabled = Iniciar la replicación inmediatamente después de crear la suscripción
dialog_create_subscription_enabled_tip = Iniciar la replicación después de la creación. Requiere conectarse al publicador; desactívelo para iniciar la replicación más adelante.
dialog_create_subscription_copy_data = Copiar los datos existentes del publicador
dialog_create_subscription_copy_data_tip = Las tablas del suscriptor deben existir con columnas coincidentes.\nNo se copian las definiciones de las tablas. Desactívelo si ya hay filas\npara evitar duplicados.
dialog_create_subscription_copy_data_description = Requiere que las tablas del suscriptor existan. Desmarque esta opción si los datos ya están sincronizados.
dialog_create_subscription_advanced = Opciones avanzadas
dialog_create_subscription_create_slot = Crear una ranura de replicación en el publicador
dialog_create_subscription_create_slot_tip = Las ranuras retienen WAL mientras la replicación está detenida.\nPara replicar dentro del mismo clúster, cree la ranura por separado y desactive esta opción.\nEstablezca el nombre de la ranura existente en Opciones avanzadas.
dialog_create_subscription_create_slot_description = Para replicar dentro del mismo clúster, cree la ranura por separado, desmarque esta opción e introduzca su nombre en Opciones avanzadas.
dialog_create_subscription_slot = Nombre de la ranura
dialog_create_subscription_slot_tip = Déjelo vacío para usar el nombre de la suscripción. Si la creación de ranuras está desactivada, introduzca el nombre de una ranura de replicación lógica existente en el publicador. Los nombres de ranura usan letras minúsculas, dígitos y guiones bajos.
dialog_create_subscription_slot_description = Déjelo vacío para usar el nombre de la suscripción. Para usar una ranura existente, desmarque Crear una ranura de replicación e introduzca su nombre.
dialog_create_subscription_binary = Solicitar datos binarios
dialog_create_subscription_binary_tip = Solicitar la transferencia binaria de los valores replicados en lugar de texto. Los tipos de datos del publicador y del suscriptor deben tener formatos binarios compatibles. Déjelo desactivado para mejorar la compatibilidad entre versiones de PostgreSQL o tipos de columna diferentes.
dialog_create_subscription_streaming = Transmitir transacciones en curso
dialog_create_subscription_streaming_tip = Transmitir los cambios de transacciones grandes antes de que se confirmen, en lugar de esperar a que termine la transacción en el publicador. Los cambios siguen aplicándose de forma transaccional en el suscriptor.
dialog_create_subscription_commit = Confirmación síncrona
dialog_create_subscription_commit_tip = Opción de durabilidad del proceso de replicación de la suscripción, no de la conexión del publicador. El valor predeterminado off mejora el rendimiento de aplicación; on espera a que se escriba el WAL local en disco. Las opciones más estrictas pueden reducir el rendimiento y esperar a las réplicas síncronas del suscriptor.
dialog_create_subscription_error_name = Introduzca un nombre para la suscripción.
dialog_create_subscription_error_publisher = Configure la conexión del publicador.
dialog_create_subscription_error_publications = Seleccione al menos una publicación o añada un nombre de publicación.
dialog_create_subscription_publisher_description = Configure la conexión que utilizará el servidor receptor.
dialog_create_subscription_publications_description = Elija qué desea recibir del publicador seleccionado.
dialog_create_subscription_settings_description = Revise la suscripción y elija cómo se iniciará.
dialog_create_subscription_connection_not_tested = Sin probar
