dialog_create_subscription_add_publication = Añadir publicación personalizada
dialog_create_subscription_slot_placeholder = De forma predeterminada, el nombre de la suscripción
dialog_create_subscription_host_mode = Servidor
dialog_create_subscription_url_tip = URI de conexión de PostgreSQL (postgresql://host:port/database). Los parámetros de la URL tienen prioridad sobre los campos de nombre de usuario, contraseña y SSL.
dialog_create_subscription_connect_by = Conectar mediante
dialog_create_subscription_url_placeholder = postgresql://host:5432/database
dialog_create_subscription_error_slot = Los nombres de ranura deben tener entre 1 y 63 caracteres y usar letras minúsculas, dígitos o guiones bajos. Cámbielo en Opciones avanzadas.
dialog_refresh_subscription_title = Actualizar publicaciones de la suscripción
dialog_refresh_subscription_description = Obtener del publicador la lista actual de tablas para las suscripciones seleccionadas. Guarde primero los cambios y active las suscripciones. Las tablas del suscriptor deben existir con columnas coincidentes.
dialog_refresh_subscription_copy_data = Copiar los datos existentes de las nuevas tablas suscritas
dialog_refresh_subscription_two_phase = No se pueden copiar los datos existentes porque una de las suscripciones seleccionadas tiene activada la confirmación en dos fases.
dialog_create_subscription_publisher_setup = Configuración del publicador
dialog_create_subscription_publisher_setup_tip = La replicación lógica está desactivada en la conexión utilizada para cargar publicaciones. Haga clic para ver las instrucciones de configuración del publicador.
dialog_create_subscription_publisher_setup_instructions = La conexión utilizada para cargar publicaciones tiene wal_level por debajo de logical. Puede ser distinta de la dirección del publicador utilizada por el suscriptor.\n\nSi se trata del servidor publicador, pida a un administrador de PostgreSQL que ejecute:\n\nALTER SYSTEM SET wal_level = 'logical';\n\nReinicie ese servidor PostgreSQL y vuelva a cargar las publicaciones en este asistente.\n\nPara aplazar la configuración del publicador, desmarque Conectar con el publicador.
