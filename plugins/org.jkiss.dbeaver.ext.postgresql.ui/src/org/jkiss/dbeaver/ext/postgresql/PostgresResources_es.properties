dialog_create_subscription_publications_datasource_tip = Al copiar una conexión, DBeaver lee las publicaciones a través de ella de forma predeterminada. En caso contrario, usa la dirección del publicador del paso anterior. Cambiar esta selección vuelve a cargar las publicaciones, pero no modifica la conexión del suscriptor.
