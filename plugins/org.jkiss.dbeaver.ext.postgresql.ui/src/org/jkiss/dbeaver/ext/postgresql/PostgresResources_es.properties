wizard_backup_all_page_setting_checkbox_no_owner_tip = No generar comandos que establezcan la propiedad de los objetos según la base de datos original.\nDe forma predeterminada, pg_dumpall genera sentencias ALTER OWNER o SET SESSION AUTHORIZATION para establecer la propiedad de los elementos de esquema creados.\nEstas sentencias fallarán al ejecutar el script, salvo que lo ejecute un superusuario (o el mismo usuario propietario de todos los objetos del script).\nPara crear un script que pueda restaurar cualquier usuario y que asigne a ese usuario la propiedad de todos los objetos, especifique -O.
