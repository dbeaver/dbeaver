dialog_query_planner_settings_buffers_tip = Incluir información sobre el uso de búferes. Es FALSE de forma predeterminada.
dialog_query_planner_settings_wal = WAL
dialog_query_planner_settings_wal_tip = Incluir información sobre la generación de registros WAL.\nEn concreto, incluir el número de registros, el número de imágenes de páginas completas (fpi) y la cantidad de WAL generado en bytes.\nEn formato de texto, solo se imprimen los valores distintos de cero.\nEste parámetro solo puede utilizarse si también se activa ANALYZE. Es FALSE de forma predeterminada.
dialog_query_planner_settings_timing = TIMING
dialog_query_planner_settings_timing_tip = Incluir en la salida el tiempo inicial real y el tiempo empleado en cada nodo. Es TRUE de forma predeterminada.
dialog_query_planner_settings_summary = SUMMARY
dialog_query_planner_settings_summary_tip = Incluir información de resumen (p. ej., tiempos totales) después del plan de consulta.\nEl resumen se incluye de forma predeterminada al usar ANALYZE; en otros casos no se incluye,\npero puede activarse con esta opción.
