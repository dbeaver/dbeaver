dialog_query_planner_settings_costs_tip = Incluir información sobre el coste inicial y total estimado de cada nodo del plan,\nasí como el número estimado de filas y la anchura estimada de cada fila. Este parámetro es TRUE de forma predeterminada.
dialog_query_planner_settings = SETTINGS
dialog_query_planner_settings_tip = Incluir información sobre los parámetros de configuración.\nEn concreto, incluir las opciones que afectan a la planificación de consultas cuyo valor difiera del predeterminado integrado. Este parámetro es FALSE de forma predeterminada.
