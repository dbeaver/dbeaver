dialog_create_subscription_name=Nom de l'abonnement
dialog_create_subscription_name_tip=Nom de l'abonnement à créer sur l'abonné. Doit être unique dans cette base et sert aussi de nom par défaut du slot de réplication.
dialog_create_subscription_subscriber=Base de données abonnée
dialog_create_subscription_subscriber_tip=L'abonnement est créé dans cette base. Lancez sa création depuis la base de destination, pas depuis l'éditeur.
