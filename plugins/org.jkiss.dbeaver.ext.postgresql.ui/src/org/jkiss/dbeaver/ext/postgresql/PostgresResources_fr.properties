dialog_create_subscription_publications_datasource_tip=Après copie d'une connexion, DBeaver l'utilise par défaut pour lire les publications. Sinon, il utilise l'adresse de l'éditeur de l'étape précédente. Modifier ce choix recharge les publications sans modifier la connexion de l'abonné.
