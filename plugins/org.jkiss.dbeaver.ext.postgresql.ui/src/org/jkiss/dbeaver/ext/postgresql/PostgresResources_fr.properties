wizard_restore_page_setting_confirm_dialog_message=Avant la restauration, une commande DROP sera exécutée pour chaque objet à restaurer. Les objets absents de la base cible produiront des erreurs sans conséquence, sauf si --if-exists figure aussi dans les arguments de commande supplémentaires.\nCette option permet de remplacer une base existante.\n\nVoulez-vous vraiment continuer ?
