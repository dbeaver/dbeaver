dialog_create_subscription_existing_connection=Copier depuis une connexion...
dialog_create_subscription_existing_connection_tip=Copier une connexion PostgreSQL à authentification native pour charger les publications. Adaptez l'adresse de l'éditeur pour le serveur abonné ; les paramètres de connexion enregistrés restent inchangés.
dialog_create_subscription_manual_connection=Configuration manuelle
dialog_create_subscription_endpoint_tip=Hôte et port de l'éditeur accessibles depuis le serveur abonné.
dialog_create_subscription_test_connection=Tester la connexion depuis l'abonné
dialog_create_subscription_test_connection_tip=Tester une connexion de réplication depuis le serveur abonné par une sonde sans slot, annulée ensuite. Nécessite les droits de création d'abonnement. Aucune donnée copiée ; les publications et la compatibilité des tables ne sont pas vérifiées.
dialog_create_subscription_test_connection_success=Le serveur abonné s'est connecté à l'éditeur par une connexion de réplication. Aucun abonnement ni slot n'a été conservé. Les publications et la compatibilité des tables n'ont pas été vérifiées.
