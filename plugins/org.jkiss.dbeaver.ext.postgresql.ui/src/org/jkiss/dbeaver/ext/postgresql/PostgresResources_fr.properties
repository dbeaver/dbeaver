dialog_create_subscription_connect=Se connecter à l'éditeur lors de la création
dialog_create_subscription_connect_tip=Vérifier les publications lors de la création. Désactivez pour différer la connexion, la réplication, la création du slot et la copie des données ; terminez la configuration avec ALTER SUBSCRIPTION.
dialog_create_subscription_enabled=Démarrer la réplication immédiatement après la création
dialog_create_subscription_enabled_tip=Démarrer la réplication après création. Nécessite la connexion à l'éditeur ; désactivez pour démarrer plus tard.
dialog_create_subscription_copy_data=Copier les données existantes de l'éditeur
dialog_create_subscription_copy_data_tip=Les tables doivent déjà exister chez l'abonné avec des colonnes correspondantes.\nLes définitions de tables ne sont pas copiées. Désactivez si les lignes existent déjà\npour éviter les doublons.
dialog_create_subscription_copy_data_description=Nécessite des tables existantes chez l'abonné. Décochez si les données sont déjà synchronisées.
dialog_create_subscription_advanced=Options avancées
dialog_create_subscription_create_slot=Créer un slot de réplication sur l'éditeur
dialog_create_subscription_create_slot_tip=Les slots conservent le WAL pendant l'arrêt de la réplication.\nPour une réplication dans le même cluster, créez le slot séparément et désactivez cette option.\nIndiquez le nom du slot existant dans les options avancées.
dialog_create_subscription_create_slot_description=Pour une réplication dans le même cluster, créez le slot séparément, décochez cette option et indiquez son nom dans les options avancées.
dialog_create_subscription_slot=Nom du slot
dialog_create_subscription_slot_tip=Laissez vide pour utiliser le nom de l'abonnement. Si la création du slot est désactivée, indiquez un slot de réplication logique existant sur l'éditeur. Les noms utilisent des lettres minuscules, chiffres et traits de soulignement.
dialog_create_subscription_slot_description=Laissez vide pour utiliser le nom de l'abonnement. Pour un slot existant, décochez Créer un slot de réplication et indiquez son nom.
dialog_create_subscription_binary=Demander des données binaires
dialog_create_subscription_binary_tip=Demander le transfert binaire plutôt que textuel des valeurs répliquées. Les types de données de l'éditeur et de l'abonné doivent avoir des formats binaires compatibles. Laissez désactivé pour une meilleure compatibilité entre versions PostgreSQL ou types de colonnes différents.
dialog_create_subscription_streaming=Transmettre les transactions en cours
dialog_create_subscription_streaming_tip=Transmettre les modifications des grandes transactions avant leur validation, plutôt que d'attendre la transaction complète sur l'éditeur. Elles restent appliquées de manière transactionnelle chez l'abonné.
dialog_create_subscription_commit=Validation synchrone
dialog_create_subscription_commit_tip=Paramètre de durabilité du processus de réplication de l'abonnement, pas de la connexion à l'éditeur. La valeur par défaut off accélère l'application ; on attend l'écriture locale du WAL. Des réglages plus stricts peuvent ralentir le traitement et attendre les serveurs de secours synchrones de l'abonné.
dialog_create_subscription_error_name=Saisissez un nom d'abonnement.
dialog_create_subscription_error_publisher=Configurez la connexion à l'éditeur.
dialog_create_subscription_error_publications=Sélectionnez au moins une publication ou ajoutez un nom de publication.
dialog_create_subscription_publisher_description=Configurez la connexion utilisée par le serveur récepteur.
dialog_create_subscription_publications_description=Choisissez les données à recevoir de l'éditeur sélectionné.
dialog_create_subscription_settings_description=Vérifiez l'abonnement et choisissez son mode de démarrage.
