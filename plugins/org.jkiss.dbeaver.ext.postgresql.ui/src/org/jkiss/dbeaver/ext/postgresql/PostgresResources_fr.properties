wizard_backup_all_page_setting_checkbox_no_owner=Ignorer le propriétaire des objets
wizard_backup_all_page_setting_checkbox_no_owner_tip=Ne pas générer les commandes rétablissant les propriétaires des objets de la base d'origine.\nPar défaut, pg_dumpall utilise ALTER OWNER ou SET SESSION AUTHORIZATION pour définir les propriétaires des éléments de schéma créés.\nCes instructions échouent si le script n'est pas exécuté par un superutilisateur ou par le propriétaire de tous les objets du script.\nSpécifiez -O pour permettre une restauration par tout utilisateur, qui deviendra alors propriétaire de tous les objets.
