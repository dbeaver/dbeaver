dialog_create_subscription_error_slot=Le nom du slot doit contenir de 1 à 63 lettres minuscules, chiffres ou traits de soulignement. Modifiez-le dans les options avancées.
dialog_refresh_subscription_title=Actualiser les publications de l'abonnement
dialog_refresh_subscription_description=Récupérer la liste actuelle des tables auprès de l'éditeur pour les abonnements sélectionnés. Enregistrez leurs modifications et activez-les d'abord. Les tables doivent déjà exister chez l'abonné avec des colonnes correspondantes.
dialog_refresh_subscription_copy_data=Copier les données existantes des nouvelles tables abonnées
dialog_refresh_subscription_two_phase=La copie des données existantes est indisponible, car un abonnement sélectionné utilise la validation en deux phases.
dialog_create_subscription_publisher_setup=Configuration de l'éditeur
dialog_create_subscription_publisher_setup_tip=La réplication logique est désactivée sur la connexion utilisée pour charger les publications. Cliquez pour consulter les instructions de configuration de l'éditeur.
dialog_create_subscription_publisher_setup_instructions=La connexion utilisée pour charger les publications a un wal_level inférieur à logical. Elle peut différer de l'adresse d'éditeur utilisée par l'abonné.\n\nS'il s'agit du serveur éditeur, demandez à un administrateur PostgreSQL d'exécuter :\n\nALTER SYSTEM SET wal_level = 'logical';\n\nRedémarrez ce serveur PostgreSQL, puis rechargez les publications dans cet assistant.\n\nPour différer la configuration de l'éditeur, décochez Se connecter à l'éditeur.
