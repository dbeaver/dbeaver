dialog_create_subscription_custom_publication_name=Saisir un nom de publication
dialog_create_subscription_add_publication=Ajouter une publication personnalisée
dialog_create_subscription_slot_placeholder=Nom de l'abonnement par défaut
dialog_create_subscription_host_mode=Hôte
dialog_create_subscription_url_tip=URI de connexion PostgreSQL (postgresql://host:port/database). Les paramètres de l'URL sont prioritaires sur les champs utilisateur, mot de passe et SSL.
dialog_create_subscription_connect_by=Connexion par
