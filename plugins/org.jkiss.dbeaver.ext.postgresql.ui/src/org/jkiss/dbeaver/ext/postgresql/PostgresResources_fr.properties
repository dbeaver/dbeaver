dialog_query_planner_settings_wal=WAL
dialog_query_planner_settings_wal_tip=Inclure les informations de génération des enregistrements WAL.\nInclure le nombre d'enregistrements, d'images de pages complètes (fpi) et la quantité de WAL produite en octets.\nAu format texte, seules les valeurs non nulles sont affichées.\nNécessite aussi ANALYZE. FALSE par défaut.
dialog_query_planner_settings_timing=TIMING
dialog_query_planner_settings_timing_tip=Inclure le temps réel de démarrage et le temps passé dans chaque nœud. TRUE par défaut.
dialog_query_planner_settings_summary=SUMMARY
dialog_query_planner_settings_summary_tip=Inclure un récapitulatif, par exemple les temps cumulés, après le plan.\nInclus par défaut avec ANALYZE ; sinon, il ne l'est pas,\nmais cette option permet de l'activer.
