wizard_restore_page_setting_btn_clean_first_tip = Wiederherzustellende Datenbankobjekte vor ihrer Neuerstellung löschen (DROP).\n(Dies kann harmlose Fehlermeldungen erzeugen, wenn Objekte in der Zieldatenbank nicht vorhanden waren)
wizard_restore_page_setting_confirm_dialog_title = Achtung: Datenwiederherstellung
wizard_restore_page_setting_confirm_dialog_message = Vor der Wiederherstellung wird für alle wiederherzustellenden Objekte ein DROP-Befehl ausgeführt. Falls Objekte in der Zieldatenbank nicht existieren, werden ignorierbare Fehlermeldungen ausgegeben, sofern --if-exists nicht zusätzlich unter „Zusätzliche Befehlsargumente“ angegeben ist.\nDiese Option ist zum Überschreiben einer vorhandenen Datenbank nützlich.\n\nMöchten Sie wirklich fortfahren?
