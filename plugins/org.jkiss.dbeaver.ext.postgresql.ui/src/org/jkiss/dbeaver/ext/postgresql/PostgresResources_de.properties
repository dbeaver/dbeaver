dialog_create_subscription_no_publications = Keine Publikationen gefunden. Sie können unten einen Namen eingeben.
dialog_create_subscription_name = Abonnementname
dialog_create_subscription_name_tip = Name des auf dem Abonnenten zu erstellenden Abonnements. Er muss in dieser Datenbank eindeutig sein und ist zugleich der Standardname des Replikationsslots.
dialog_create_subscription_subscriber = Abonnentendatenbank
dialog_create_subscription_subscriber_tip = Das Abonnement wird in dieser Datenbank erstellt. Öffnen Sie die Abonnementerstellung von der Zieldatenbank aus, nicht vom Herausgeber.
dialog_create_subscription_publisher = Herausgeberverbindung
dialog_create_subscription_existing_connection = Aus Verbindung kopieren...
dialog_create_subscription_existing_connection_tip = PostgreSQL-Verbindung mit nativer Authentifizierung kopieren und zum Laden von Publikationen verwenden. Passen Sie die Herausgeberadresse für den Abonnentenserver an; gespeicherte Verbindungseinstellungen bleiben unverändert.
dialog_create_subscription_manual_connection = Manuelle Konfiguration
dialog_create_subscription_endpoint_tip = Host und Port des Herausgebers, wie sie vom Abonnentenserver aus erreichbar sind.
dialog_create_subscription_test_connection = Verbindung vom Abonnenten aus testen
dialog_create_subscription_test_connection_tip = Testet eine Replikationsverbindung vom Abonnentenserver aus mit einer Prüfung ohne Slot, die zurückgerollt wird. Erfordert Berechtigungen zum Erstellen von Abonnements. Es werden keine Daten kopiert; Publikationen und Tabellenkompatibilität werden nicht geprüft.
dialog_create_subscription_test_connection_success = Der Abonnentenserver hat über eine Replikationsverbindung erfolgreich eine Verbindung zum Herausgeber hergestellt. Es wurden weder ein Abonnement noch ein Replikationsslot beibehalten. Publikationen und Tabellenkompatibilität wurden nicht geprüft.
dialog_create_subscription_ssl_tab = SSL
