wizard_backup_all_page_setting_checkbox_only_global = Nur globale Objekte sichern, keine Datenbanken
wizard_backup_all_page_setting_checkbox_only_global_tip = Nur globale Objekte (Rollen und Tablespaces) sichern, keine Datenbanken.\nFunktioniert nur, wenn alle Datenbanken ausgewählt sind.
wizard_backup_all_page_setting_checkbox_only_roles = Nur Rollen sichern
