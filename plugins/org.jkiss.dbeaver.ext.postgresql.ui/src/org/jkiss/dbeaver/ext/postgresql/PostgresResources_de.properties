dialog_create_subscription_connect_tip = Publikationen beim Erstellen prüfen. Deaktivieren Sie diese Option, um Verbindung, Replikation, Sloterstellung und Datenkopie aufzuschieben; schließen Sie die Einrichtung mit ALTER SUBSCRIPTION ab.
dialog_create_subscription_enabled = Replikation unmittelbar nach der Erstellung starten
dialog_create_subscription_enabled_tip = Replikation nach der Erstellung starten. Erfordert eine Verbindung zum Herausgeber; deaktivieren Sie die Option, um die Replikation später zu starten.
dialog_create_subscription_copy_data = Vorhandene Daten vom Herausgeber kopieren
dialog_create_subscription_copy_data_tip = Tabellen auf dem Abonnenten müssen bereits mit übereinstimmenden Spalten existieren.\nTabellendefinitionen werden nicht kopiert. Deaktivieren Sie die Option bei bereits vorhandenen Zeilen,\num Duplikate zu vermeiden.
dialog_create_subscription_copy_data_description = Erfordert vorhandene Tabellen auf dem Abonnenten. Deaktivieren Sie diese Option, wenn die Daten bereits synchronisiert sind.
dialog_create_subscription_advanced = Erweiterte Optionen
dialog_create_subscription_create_slot = Replikationsslot auf dem Herausgeber erstellen
dialog_create_subscription_create_slot_tip = Slots bewahren WAL auf, während die Replikation angehalten ist.\nErstellen Sie bei Replikation innerhalb desselben Clusters den Slot separat und deaktivieren Sie diese Option.\nGeben Sie den vorhandenen Slotnamen unter „Erweiterte Optionen“ ein.
dialog_create_subscription_create_slot_description = Erstellen Sie bei Replikation innerhalb desselben Clusters den Slot separat, deaktivieren Sie diese Option und geben Sie seinen Namen unter „Erweiterte Optionen“ ein.
dialog_create_subscription_slot = Slotname
dialog_create_subscription_slot_tip = Leer lassen, um den Abonnementnamen zu verwenden. Bei deaktivierter Sloterstellung den Namen eines vorhandenen logischen Replikationsslots auf dem Herausgeber eingeben. Slotnamen bestehen aus Kleinbuchstaben, Ziffern und Unterstrichen.
dialog_create_subscription_slot_description = Leer lassen, um den Abonnementnamen zu verwenden. Zum Verwenden eines vorhandenen Slots „Replikationsslot erstellen“ deaktivieren und seinen Namen eingeben.
dialog_create_subscription_binary = Binärdaten anfordern
dialog_create_subscription_binary_tip = Replizierte Werte binär statt als Text übertragen. Die Datentypen auf Herausgeber und Abonnent müssen kompatible Binärformate besitzen. Für bessere Kompatibilität zwischen PostgreSQL-Versionen oder unterschiedlichen Spaltentypen deaktiviert lassen.
dialog_create_subscription_streaming = Laufende Transaktionen streamen
dialog_create_subscription_streaming_tip = Änderungen großer Transaktionen vor deren Commit streamen, anstatt auf die vollständige Transaktion auf dem Herausgeber zu warten. Auf dem Abonnenten werden die Änderungen weiterhin transaktional angewendet.
dialog_create_subscription_commit = Synchroner Commit
dialog_create_subscription_commit_tip = Dauerhaftigkeitseinstellung für den Replikationsprozess des Abonnements, nicht für die Herausgeberverbindung. Der Standardwert off verbessert die Anwendungsgeschwindigkeit; on wartet auf das Schreiben des lokalen WAL auf den Datenträger. Strengere Einstellungen können die Leistung verringern und auf synchrone Standby-Server des Abonnenten warten.
dialog_create_subscription_error_name = Geben Sie einen Abonnementnamen ein.
dialog_create_subscription_error_publisher = Konfigurieren Sie die Herausgeberverbindung.
