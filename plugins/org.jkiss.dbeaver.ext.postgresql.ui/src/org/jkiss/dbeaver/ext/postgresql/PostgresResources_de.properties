dialog_create_subscription_publications_datasource_tip = Nach dem Kopieren einer Verbindung liest DBeaver Publikationen standardmäßig über diese Verbindung. Andernfalls verwendet es die Herausgeberadresse aus dem vorherigen Schritt. Eine Änderung dieser Auswahl lädt die Publikationen erneut, ändert aber nicht die Verbindung des Abonnenten.
dialog_create_subscription_loading_publications = Publikationen werden geladen...
