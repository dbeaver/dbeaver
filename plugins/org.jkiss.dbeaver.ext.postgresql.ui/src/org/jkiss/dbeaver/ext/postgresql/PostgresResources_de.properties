wizard_backup_all_page_setting_checkbox_only_tablespaces = Nur Tablespaces sichern
wizard_backup_all_page_setting_checkbox_only_tablespaces_tip = Nur Tablespaces sichern, keine Datenbanken oder Rollen.\nFunktioniert nur, wenn alle Datenbanken ausgewählt sind.
wizard_backup_all_page_setting_checkbox_no_privileges = Berechtigungen nicht sichern (GRANT/REVOKE)
wizard_backup_all_page_setting_checkbox_no_privileges_tip = Zugriffsberechtigungen nicht sichern (GRANT-/REVOKE-Befehle).
wizard_backup_all_page_setting_checkbox_no_owner = Objekteigentümer nicht übernehmen
wizard_backup_all_page_setting_checkbox_no_owner_tip = Keine Befehle ausgeben, die die Eigentümer von Objekten entsprechend der ursprünglichen Datenbank setzen.\nStandardmäßig gibt pg_dumpall ALTER OWNER- oder SET SESSION AUTHORIZATION-Anweisungen aus, um die Eigentümer erstellter Schemaelemente zu setzen.\nDiese Anweisungen schlagen beim Ausführen des Skripts fehl, wenn es nicht von einem Superuser gestartet wird (oder demselben Benutzer, dem alle Objekte im Skript gehören).\nGeben Sie -O an, um ein von jedem Benutzer wiederherstellbares Skript zu erstellen, bei dem dieser Benutzer Eigentümer aller Objekte wird.
wizard_backup_all_page_setting_checkbox_add_passwords = Passwörter für Rollen sichern
wizard_backup_all_page_setting_checkbox_add_passwords_tip = Passwörter für Rollen als MD5-Hash sichern.
