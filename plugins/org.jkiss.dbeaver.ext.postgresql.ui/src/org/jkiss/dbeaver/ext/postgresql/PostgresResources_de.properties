dialog_query_planner_settings_tip = Informationen zu Konfigurationsparametern einschließen.\nInsbesondere Optionen, die die Abfrageplanung beeinflussen und vom integrierten Standardwert abweichen. Standardwert dieses Parameters ist FALSE.
