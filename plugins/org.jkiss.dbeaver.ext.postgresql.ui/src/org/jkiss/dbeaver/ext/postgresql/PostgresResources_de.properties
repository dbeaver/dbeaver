wizard_backup_page_setting_checkbox_use_insert_tip = Daten als INSERT-Befehle statt mit COPY sichern. Dies verlangsamt die Wiederherstellung erheblich;\ndie Option ist vor allem für Sicherungen nützlich, die in andere Datenbanksysteme geladen werden sollen.
wizard_backup_page_setting_checkbox_no_privileges_tip = Zugriffsberechtigungen nicht sichern (GRANT-/REVOKE-Befehle).
wizard_backup_page_setting_checkbox_no_owner_tip = Keine Befehle ausgeben, die die Eigentümer von Objekten entsprechend der ursprünglichen Datenbank setzen.\nDiese Option wird bei einer Archivdatei (kein Textformat) ignoriert.\nBei Archivformaten können Sie die Option beim Aufruf des Wiederherstellungsbefehls angeben.
wizard_backup_page_setting_checkbox_restore_no_owner_tip = Keine Befehle ausgeben, die die Eigentümer von Objekten entsprechend der ursprünglichen Datenbank setzen.
wizard_backup_page_setting_checkbox_drop_objects = Anweisung zum Löschen der Datenbank hinzufügen
wizard_backup_page_setting_checkbox_drop_objects_tip = Befehle zum Löschen (DROP) von Datenbankobjekten vor den Befehlen zu deren Erstellung ausgeben.\nDiese Option wird bei einer Archivdatei (kein Textformat) ignoriert.\nBei Archivformaten können Sie die Option beim Aufruf des Wiederherstellungsbefehls angeben.
wizard_backup_page_setting_checkbox_create_database = Anweisung zum Erstellen der Datenbank hinzufügen
wizard_backup_page_setting_checkbox_create_database_tip = Die Ausgabe mit einem Befehl zum Erstellen der Datenbank und zum erneuten Verbinden mit dieser Datenbank beginnen.\nDiese Option wird bei einer Archivdatei (kein Textformat) ignoriert.\nBei Archivformaten können Sie die Option beim Aufruf des Wiederherstellungsbefehls angeben.
