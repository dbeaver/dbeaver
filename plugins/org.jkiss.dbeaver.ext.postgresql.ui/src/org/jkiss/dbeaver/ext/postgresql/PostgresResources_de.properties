dialog_create_subscription_publisher_setup_tip = Für die zum Laden von Publikationen verwendete Verbindung ist die logische Replikation deaktiviert. Klicken Sie hier, um die Einrichtungsanleitung für den Herausgeber anzuzeigen.
dialog_create_subscription_publisher_setup_instructions = Die zum Laden von Publikationen verwendete Verbindung hat einen wal_level unterhalb von logical. Sie kann von der vom Abonnenten verwendeten Herausgeberadresse abweichen.\n\nFalls dies der Herausgeberserver ist, bitten Sie eine PostgreSQL-Administration, Folgendes auszuführen:\n\nALTER SYSTEM SET wal_level = 'logical';\n\nStarten Sie diesen PostgreSQL-Server neu und laden Sie dann die Publikationen in diesem Assistenten erneut.\n\nDeaktivieren Sie „Mit dem Herausgeber verbinden“, um dessen Einrichtung aufzuschieben.
