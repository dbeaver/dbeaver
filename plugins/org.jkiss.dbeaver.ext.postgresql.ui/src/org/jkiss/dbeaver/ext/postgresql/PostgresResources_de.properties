dialog_query_planner_settings_wal = WAL
dialog_query_planner_settings_wal_tip = Informationen zur Erzeugung von WAL-Einträgen einschließen.\nInsbesondere die Anzahl der Einträge und vollständigen Seitenabbilder (fpi) sowie die erzeugte WAL-Menge in Bytes.\nIm Textformat werden nur Werte ungleich null ausgegeben.\nDieser Parameter darf nur verwendet werden, wenn auch ANALYZE aktiviert ist. Standardwert ist FALSE.
dialog_query_planner_settings_timing = TIMING
dialog_query_planner_settings_timing_tip = Tatsächliche Anlaufzeit und die in jedem Knoten verbrachte Zeit ausgeben. Standardwert ist TRUE.
dialog_query_planner_settings_summary = SUMMARY
dialog_query_planner_settings_summary_tip = Zusammenfassende Informationen (z. B. Gesamtzeit) nach dem Abfrageplan einschließen.\nBei Verwendung von ANALYZE werden diese standardmäßig ausgegeben, andernfalls nicht.\nMit dieser Option können sie aktiviert werden.
