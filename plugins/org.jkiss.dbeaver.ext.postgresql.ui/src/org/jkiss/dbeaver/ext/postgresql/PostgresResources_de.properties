dialog_refresh_subscription_description = Aktuelle Tabellenliste für die ausgewählten Abonnements vom Herausgeber abrufen. Speichern Sie zunächst die Abonnementänderungen und aktivieren Sie die Abonnements. Tabellen auf dem Abonnenten müssen bereits mit übereinstimmenden Spalten existieren.
