dialog_setting_trust_server_certificate = Considera attendibile il certificato del server
dialog_setting_trust_server_certificate_tip = Se "true", il certificato SSL di SQL Server viene considerato automaticamente attendibile quando il livello di comunicazione è cifrato tramite SSL.\nSe "false", Microsoft JDBC Driver for SQL Server convalida il certificato SSL del server.\nSe la convalida del certificato del server non riesce, il driver genera un errore e termina la connessione.\u0020
