dialog_setting_trust_server_certificate = 서버 인증서 신뢰
dialog_setting_trust_server_certificate_tip = "true"이면 통신 계층이 SSL로 암호화될 때 SQL Server SSL 인증서를 자동으로 신뢰합니다.\n"false"이면 Microsoft JDBC Driver for SQL Server가 서버 SSL 인증서를 검증합니다.\n서버 인증서 검증에 실패하면 드라이버에서 오류가 발생하고 연결이 종료됩니다.\u0020
