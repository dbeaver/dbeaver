dialog_setting_show_all_databases = 모든 데이터베이스 표시
dialog_setting_show_all_databases_tip = 연결의 모든 데이터베이스를 표시합니다.\n참고: 이 연결 유형은 데이터베이스 간 요청을 지원하지 않을 수 있습니다.\n서버의 다른 데이터베이스에는 별도의 연결을 여세요.
