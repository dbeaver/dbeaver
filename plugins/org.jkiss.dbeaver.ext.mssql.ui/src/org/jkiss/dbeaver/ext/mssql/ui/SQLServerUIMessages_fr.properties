dialog_setting_show_all_databases=Afficher toutes les bases de données
dialog_setting_show_all_databases_tip=Afficher toutes les bases de données dans la connexion.\nRemarque : ce type de connexion peut ne pas prendre en charge les requêtes entre bases de données.\nOuvrez des connexions supplémentaires pour les autres bases de données du serveur.
dialog_setting_show_all_schemas=Afficher tous les schémas
dialog_setting_show_all_schemas_tip=Afficher tous les schémas de base de données. Si cette option est désactivée, seuls les schémas non vides sont affichés.
dialog_setting_encrypt_password=Chiffrer le mot de passe
dialog_setting_encrypt_password_tip=L'activation de cette option définit le paramètre « ENCRYPT_PASSWORD » sur « true ».
dialog_setting_trust_server_certificate=Faire confiance au certificat du serveur
dialog_setting_trust_server_certificate_tip=Si « true », le certificat SSL de SQL Server est automatiquement approuvé lorsque la couche de communication est chiffrée avec SSL.\nSi « false », le pilote JDBC Microsoft pour SQL Server valide le certificat SSL du serveur.\nSi la validation du certificat du serveur échoue, le pilote signale une erreur et ferme la connexion.\u0020
dialog_setting_ssl_advanced_hostname_label=Nom d'hôte du certificat
dialog_setting_ssl_advanced_hostname_tip=Nom d'hôte à utiliser pour valider le certificat TLS/SSL de SQL Server.
