dialog_setting_show_all_databases = すべてのデータベースを表示する
dialog_setting_show_all_databases_tip = 接続内のすべてのデータベースを表示します。\n注意: この接続の種類では、データベースをまたぐリクエストがサポートされない場合があります。\nサーバー上の他のデータベースには、別の接続を開いてください。
dialog_setting_show_all_schemas = すべてのスキーマを表示する
dialog_setting_show_all_schemas_tip = すべてのデータベーススキーマを表示します。無効にすると、空でないスキーマのみを表示します。
dialog_setting_encrypt_password = パスワードを暗号化する
dialog_setting_encrypt_password_tip = この設定を有効にすると、"ENCRYPT_PASSWORD" 設定が "true" に変更されます。
dialog_setting_trust_server_certificate = サーバー証明書を信頼する
dialog_setting_trust_server_certificate_tip = "true" の場合、通信層が SSL で暗号化されていると SQL Server の SSL 証明書を自動的に信頼します。\n"false" の場合、Microsoft JDBC Driver for SQL Server がサーバーの SSL 証明書を検証します。\nサーバー証明書の検証に失敗すると、ドライバーはエラーを発生させて接続を終了します。\u0020
dialog_setting_ssl_advanced_hostname_label = 証明書のホスト名
dialog_setting_ssl_advanced_hostname_tip = SQL Server の TLS/SSL 証明書の検証に使用するホスト名。
