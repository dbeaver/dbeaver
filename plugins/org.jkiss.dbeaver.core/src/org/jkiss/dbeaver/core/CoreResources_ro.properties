pref_page_connection_label_close_connection_on_sleep = Închideți conexiunile la bazele de date în modul repaus
pref_page_connection_label_close_connection_on_sleep_tip = Când sistemul de operare intră în repaus, conexiunea la rețea se poate bloca.\nAceastă opțiune obligă DBeaver să reinițializeze automat conexiunile la bazele de date după ieșirea sistemului din repaus.
pref_page_connection_label_enable_shell_auth_model = Activați obținerea parolelor prin CLI
pref_page_connection_label_enable_shell_auth_model_tip = Activează modelul de autentificare „Parolă din comandă shell” pentru conexiuni. Acesta\npoate fi utilizat pentru a obține parole din administratoare externe de parole sau din alte\ndepozite securizate.
pref_page_connection_label_sanitize_driver_properties = Filtrați parametrii periculoși ai driverelor JDBC
pref_page_connection_label_sanitize_driver_properties_tip = Respinge numele de parametri interzise din URL-urile JDBC și proprietățile conexiunii, indiferent de driver.\nNumele sunt verificate fără a ține cont de majuscule, inclusiv în interiorul valorilor și când sunt setate la false. Poate împiedica importurile din fișiere locale.\nDezactivarea acestei opțiuni poate permite deserializarea nesigură sau accesul la fișiere locale. Setările de conexiune salvate nu sunt modificate.
pref_page_network_expert_label = Modificați aceste opțiuni numai dacă știți ce faceți.
pref_page_network_expert_preferred_ip_addresses_label = Adrese IP preferate
pref_page_network_expert_preferred_ip_addresses_tip = Când se lucrează cu o gazdă care are atât adrese IPv4, cât și IPv6, iar IPv6\neste disponibil în sistemul de operare, comportamentul implicit este preferarea\nadreselor IPv4 în locul celor IPv6. Aceasta asigură compatibilitatea cu versiunile anterioare, de\nexemplu pentru aplicațiile care depind de reprezentarea unei adrese IPv4.
pref_page_network_expert_preferred_ip_stack_label = Stivă IP preferată
pref_page_network_expert_preferred_ip_stack_tip = Dacă IPv6 este disponibil în sistemul de operare, socketul nativ de bază va fi\nimplicit un socket IPv6, care permite aplicațiilor să se conecteze la gazde IPv4 și IPv6\nși să accepte conexiuni de la acestea. Totuși, dacă o aplicație\nar prefera exclusiv socketuri IPv4, această opțiune poate fi modificată.
pref_page_network_expert_debug_net_label = Scrieți informațiile de depanare SSL/TLS
pref_page_network_expert_debug_net_tip = Scrie informațiile de depanare SSL/TLS în fișierul jurnal.\nRețineți că volumul de informații este foarte mare și poate duce la scăderea performanței generale a aplicației.
