pref_page_network_expert_preferred_ip_stack_label = Stack IP preferito
pref_page_network_expert_preferred_ip_stack_tip = Se IPv6 è disponibile nel sistema operativo, il socket nativo sottostante è\nper impostazione predefinita un socket IPv6 che consente alle applicazioni di connettersi e accettare\nconnessioni da host sia IPv4 sia IPv6. Tuttavia, se un'applicazione\npreferisce usare solo socket IPv4, è possibile modificare questa opzione.
