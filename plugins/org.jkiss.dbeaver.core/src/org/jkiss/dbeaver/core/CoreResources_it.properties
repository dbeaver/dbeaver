pref_page_connection_label_sanitize_driver_properties = Filtra parametri JDBC pericolosi del driver
pref_page_connection_label_sanitize_driver_properties_tip = Rifiuta i nomi di parametri vietati negli URL JDBC e nelle proprietà di connessione, indipendentemente dal driver.\nI nomi vengono controllati senza distinzione tra maiuscole e minuscole, anche all'interno dei valori e se impostati su false. Può impedire l'importazione di file locali.\nDisabilitando questa opzione si possono consentire la deserializzazione non sicura o l'accesso ai file locali. Le impostazioni di connessione salvate non vengono modificate.
