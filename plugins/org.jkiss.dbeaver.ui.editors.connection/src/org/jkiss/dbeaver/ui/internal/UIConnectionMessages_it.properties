pref_page_error_handle_connection_close_timeout_label_tip = Timeout di chiusura della connessione.\nÈ un timeout dell'interfaccia; il timeout effettivo del socket può essere configurato nelle impostazioni del driver della connessione.
pref_page_error_handle_connection_open_timeout_label_tip = Timeout di apertura della connessione.\nÈ un timeout dell'interfaccia; il timeout effettivo del socket può essere configurato nelle impostazioni del driver della connessione. Zero disabilita il timeout (attende il timeout del socket).
pref_page_error_handle_connection_validate_timeout_label_tip = Timeout di convalida della connessione.\nUsato per invalidare lo stato della connessione.\nÈ un timeout dell'interfaccia; il timeout effettivo del socket può essere configurato nelle impostazioni del driver della connessione.
