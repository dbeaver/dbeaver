pref_page_database_general_server_side_object_filters_tip = Supportato solo da alcune origini dati.\nModifica le query dei metadati in modo che dal database vengano letti solo gli oggetti necessari.\nAltrimenti il filtro viene applicato sul client.\nDisabilitare questa opzione per visualizzare gli oggetti collegati (ad es. tramite chiavi esterne).
