pref_page_database_client_name_group_description = O nome da aplicação cliente é enviado ao servidor de banco de dados durante a conexão para identificar conexões de cliente.\nPor padrão é usado o nome do produto + versão do produto.\nVocê pode definí-lo para qualquer valor personalizado. Você pode usar variáveis no nome do cliente (veja a dica no campo de texto abaixo).
pref_page_database_general_checkbox_add_special_DDL_info = Gerar DDLs com informações adicionais
pref_page_database_general_checkbox_add_special_DDL_info_tip = Adiciona informações especiais para definições de objetos gerados automaticamente.\nTais como um comentário de código fonte ou uma instrução de DROP.
