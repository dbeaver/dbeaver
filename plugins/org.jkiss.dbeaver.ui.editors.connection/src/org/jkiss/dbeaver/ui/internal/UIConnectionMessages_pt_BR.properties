pref_page_error_handle_connection_close_timeout_label = Fechamento de conexão
pref_page_error_handle_connection_close_timeout_label_tip = Tempo limite para encerramento da conexão.\nEste é um timeout da interface, o timeout real de socket pode ser configurado nas opções do driver de conexão.
pref_page_error_handle_connection_open_timeout_label = Abertura de conexão
