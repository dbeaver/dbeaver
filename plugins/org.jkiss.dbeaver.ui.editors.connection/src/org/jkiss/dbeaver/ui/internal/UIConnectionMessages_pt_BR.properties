pref_page_database_general_group_performance = Performance
pref_page_database_general_separate_meta_connection = Abrir uma conexão separada para leitura de metadados
pref_page_database_general_separate_meta_connection_tip = Abrir uma conexão separada para metadados pode aumentar a performance pois não haverão bloqueios na interface durante a execução da consulta.\nPor padrão o DBeaver cria conexões separadas para o Editor SQL e leitura de metadados para a maioria dos bancos de dados, exceto:\n{0}
pref_page_database_general_server_side_object_filters = Filtros de objeto feitos do lado do servidor
pref_page_database_general_server_side_object_filters_tip = Suportado apenas por algumas fontes de dados.\nModifique consultas de metadados para que apenas os objetos necessários sejam lidos no banco de dados.\nCaso contrário, a filtragem será aplicada do lado do cliente.\nDesabilite esta opção se você quiser visualizar objetos associados (como chaves estrangeiras).
