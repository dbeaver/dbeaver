pref_page_database_general_checkbox_disable_extra_metadata = Não ler informações de tabelas em SQL e editores de dados
pref_page_database_general_checkbox_disable_extra_metadata_tip = Não ler os metadados do banco de dados (tabelas e colunas) para auto-preenchimento SQL e recursos adicionais de editores de dados.\nAumenta a performance consideravelmente mas reduz a funcionalidade.\nNa maioria dos casos o auto-preenchimento não funcionará e resultados de consultas são somente-leitura.
pref_page_database_general_checkbox_rollback_on_error = Efetuar rollback em caso de erro
