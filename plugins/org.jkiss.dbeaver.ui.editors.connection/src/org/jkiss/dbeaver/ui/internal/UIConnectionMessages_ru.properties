pref_page_database_client_name_group_description = Имя клиентского приложения передается на сервер базы данных при подключении для идентификации клиентских подключений.\nПо умолчанию для него установлено имя продукта + версия продукта.\nВы можете установить любое другое пользовательское значение. Вы можете использовать переменные в имени клиента (см. подсказку).
