pref_page_database_general_server_side_object_filters = Filtry obiektów po stronie serwera
pref_page_database_general_server_side_object_filters_tip = Obsługiwane tylko przez niektóre źródła danych.\nModyfikuje zapytania o metadane tak, aby z bazy danych były odczytywane tylko potrzebne obiekty.\nW przeciwnym razie filtrowanie jest wykonywane po stronie klienta.\nWyłącz tę opcję, jeśli chcesz widzieć obiekty powiązane (np. przez klucze obce).
