pref_page_error_handle_connection_close_timeout_label = Zamykanie połączenia
pref_page_error_handle_connection_close_timeout_label_tip = Limit czasu zamykania połączenia.\nTo limit czasu interfejsu; rzeczywisty limit czasu gniazda można skonfigurować w ustawieniach sterownika połączenia.
