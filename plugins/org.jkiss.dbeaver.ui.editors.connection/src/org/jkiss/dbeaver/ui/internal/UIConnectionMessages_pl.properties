pref_page_database_general_checkbox_disable_extra_metadata = Nie odczytuj informacji o tabelach w edytorach SQL i danych
pref_page_database_general_checkbox_disable_extra_metadata_tip = Nie odczytuj metadanych bazy danych (tabel i kolumn) na potrzeby autouzupełniania SQL i dodatkowych funkcji edytora danych.\nZnacznie zwiększa to wydajność, ale ogranicza funkcjonalność.\nW większości przypadków autouzupełnianie nie zadziała, a wyniki zapytań będą tylko do odczytu.
