meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description=Sélectionne le nettoyage "full", qui peut récupérer davantage d'espace, mais prend beaucoup plus de temps et verrouille la table de manière exclusive.\nCette méthode exige aussi de l'espace disque supplémentaire, car elle écrit une nouvelle copie de la table sans libérer l'ancienne avant la fin de l'opération.\nÀ utiliser uniquement lorsqu'une quantité importante d'espace doit être récupérée dans la table.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description=Sélectionne le gel agressif des tuples. Spécifier FREEZE équivaut à exécuter VACUUM avec vacuum_freeze_min_age et vacuum_freeze_table_age à zéro.\nLe gel agressif est toujours effectué lors de la réécriture de la table ; cette option est donc redondante avec FULL.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description=Met à jour les statistiques utilisées par le planificateur pour déterminer la méthode d'exécution la plus efficace d'une requête.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name=Désactiver le saut de pages
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description=Normalement, VACUUM ignore des pages selon la carte de visibilité.\nLes pages dont tous les tuples sont gelés peuvent toujours être ignorées ; celles dont tous les tuples sont visibles par toutes les transactions peuvent l'être sauf lors d'un nettoyage agressif.\nEn outre, sauf lors d'un nettoyage agressif, certaines pages peuvent être ignorées pour éviter d'attendre la fin d'autres sessions.\nCette option désactive tout saut de page et ne doit être utilisée que si le contenu de la carte de visibilité est suspect, ce qui ne devrait arriver qu'en cas de problème matériel ou logiciel entraînant une corruption de la base de données.\nDisponible depuis PostgreSQL 9.6.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name=Nettoyage des index
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description=Indique que VACUUM doit tenter de supprimer les entrées d'index pointant vers des tuples morts.\n Ce comportement est normalement souhaité et s'applique par défaut, sauf si l'option vacuum_index_cleanup\n a été définie à false\n pour la table à nettoyer. Définir cette option à false peut être utile pour\n accélérer au maximum le nettoyage, par exemple pour éviter un bouclage imminent des identifiants de transaction.\n Toutefois, sans nettoyage régulier des index, les performances peuvent se dégrader : les modifications de la table\n entraînent l'accumulation de tuples morts dans les index et de pointeurs de lignes morts\n dans la table, qui ne peuvent être supprimés avant la fin du nettoyage des index.\n Cette option n'a aucun effet pour les tables sans index et est ignorée avec FULL.\nDisponible depuis PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description=Indique que VACUUM doit tenter de supprimer les pages vides à la fin de la table\n pour restituer l'espace disque correspondant au système d'exploitation.\n Ce comportement est normalement souhaité et s'applique par défaut, sauf si l'option vacuum_truncate\n a été définie à false pour la table à nettoyer. La valeur false\n peut être utile pour éviter le verrou ACCESS EXCLUSIVE requis par la troncature.\n Cette option est ignorée avec FULL.\nDisponible depuis PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name=Ignorer les relations verrouillées
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description=Indique que VACUUM ne doit pas attendre la libération de verrous incompatibles au début du traitement d'une relation :\n si la relation ne peut pas être verrouillée immédiatement, elle est ignorée.\n Même avec cette option, VACUUM peut encore se bloquer à l'ouverture des index de la relation.\n De plus, VACUUM ANALYZE peut se bloquer lors de l'acquisition d'échantillons de lignes dans les partitions, les tables filles et certains types de tables distantes.\n Alors que VACUUM traite normalement toutes les partitions des tables partitionnées spécifiées,\n cette option lui fait ignorer toutes les partitions en cas de verrou incompatible sur la table partitionnée.\nDisponible depuis PostgreSQL 12.
