meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.name=Remplacer la connexion au publieur (facultatif)
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.description=Ce champ est volontairement vide : la chaîne de connexion actuelle peut contenir un mot de passe et n'est pas chargée. Laisser inchangé pour conserver la connexion actuelle. Pour la remplacer, saisir une chaîne de connexion PostgreSQL libpq complète et enregistrer l'abonnement. L'enregistrement exécute ALTER SUBSCRIPTION ... CONNECTION. Les identifiants sont masqués ici et omis du visualiseur DDL.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.name=Publications
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.description=Noms des publications sur le publieur, un par ligne, sans délimitation SQL. Après l'enregistrement des modifications d'un abonnement existant, utiliser Outils > Actualiser les publications pour synchroniser l'appartenance des tables lorsque les tables de l'abonné sont prêtes.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.name=Emplacement de réplication
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.description=Emplacement de réplication sur le publieur. Laisser vide à la création pour utiliser le nom de l'abonnement. Modifier un abonnement existant ne crée ni ne supprime d'emplacement distant. Effacer uniquement lorsque l'abonnement est désactivé pour supprimer l'association à l'emplacement.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.name=Activé
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.description=Activer ou désactiver le processus de réplication de l'abonnement. La désactivation conserve l'abonnement et l'emplacement distant ; le WAL conservé peut augmenter pendant l'arrêt de la réplication.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.name=Format binaire
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.description=Demander un transfert binaire plutôt que textuel. Les types de données du publieur et de l'abonné doivent avoir des formats binaires compatibles.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.name=Transmission en continu
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.description=Transmettre les modifications des grandes transactions en cours. Modifier cette valeur sélectionne la transmission ordinaire ou la désactive ; un paramètre parallèle existant est conservé si ce champ reste inchangé.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.name=Validation synchrone
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.description=Paramètre de durabilité du processus d'application de la réplication. La désactivation améliore les performances ; des paramètres plus stricts peuvent les réduire et attendre les serveurs de secours synchrones sur l'abonné.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.twoPhaseState.name=État biphasé
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.name=Se connecter au publieur
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.description=Se connecter lors de la création. Si cette option est désactivée, les options Activé, Créer un emplacement et Copier les données doivent aussi être désactivées. Pour terminer la configuration, créer ou associer un emplacement sur le publieur, activer l'abonnement, puis actualiser les publications.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.name=Créer un emplacement
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.description=Créer un emplacement de réplication distant. Désactiver en cas d'utilisation d'un emplacement existant ou de réplication dans le même cluster PostgreSQL.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.copyData.name=Copier les données
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.copyData.description=Copier les données existantes du publieur au démarrage de la réplication.
