meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.description=Si WITH DATA est spécifié (ou utilisé par défaut), la requête sous-jacente est exécutée pour fournir les nouvelles données et la vue matérialisée reste consultable.\nSi WITH NO DATA est spécifié, aucune donnée n'est générée et la vue matérialisée n'est plus consultable.
