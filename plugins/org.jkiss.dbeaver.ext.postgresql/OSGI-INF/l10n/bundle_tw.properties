meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.name = 含資料
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.description = 若指定 WITH DATA（或預設），則執行備用查詢以提供新資料，且具體化檢視表保持可掃描狀態。\n若指定 WITH NO DATA，則不產生新資料，且具體化檢視表保持不可掃描狀態。

