meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.name = 在獨立交易中執行
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.description = 在獨立交易中執行工具。在執行工具前提交作用中的交易，成功執行後再提交
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.name = 重新啟動識別
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.description = 自動重新啟動被截斷資料表欄位所擁有的序列。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.name = 串聯
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.description = 自動截斷所有具有外部索引鍵參考至指定資料表\n 或因 CASCADE 而加入群組的資料表。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.name = 僅限
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.description = 若未指定 ONLY，則截斷資料表及其所有子代資料表（若有）。

tasks.vacuum.table.node.name = 清理資料表
tasks.vacuum.table.node.description = 清理資料表
tasks.vacuum.database.node.name = 清理資料庫
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = 完整
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = 選擇「完整」清理，可回收更多空間，但耗時較長且獨佔鎖定資料表。\n此方法也需要額外磁碟空間，因為它會寫入資料表的新副本，且在作業完成前不釋放舊副本。\n僅當需要從資料表內回收大量空間時才應使用此方式。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = 凍結
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = 選擇積極「凍結」Tuple。指定 FREEZE 相當於以 vacuum_freeze_min_age 和 vacuum_freeze_table_age 參數設為零執行 VACUUM。\n重寫資料表時一律執行積極凍結，因此指定 FULL 時此選項是多餘的。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = 已分析
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = 更新規劃器所用的統計資料，以決定執行查詢最有效率的方式。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = 停用頁面略過
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = 一般情況下，VACUUM 會依據可見性對應略過頁面。\n所有 Tuple 已知為凍結的頁面可一律略過，而所有 Tuple 已知對所有交易可見的頁面，除積極清理外可略過。\n此外，在非積極清理時，某些頁面可略過以避免等待其他工作階段。\n此選項停用所有頁面略過行為，僅用於可見性對應內容疑似有誤的情況，通常只在硬體或軟體問題造成資料庫損毀時發生。\n自 PostgreSQL 9.6 起有效。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = 索引清理
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = 指定 VACUUM 應嘗試移除指向死亡 Tuple 的索引項目。\n 這通常是所需行為，也是預設值，除非資料表的 vacuum_index_cleanup 選項\n 已設為 false。設定此選項為 false 在需要盡快執行 VACUUM 時可能有用，\n 例如避免即將發生的交易 ID 回繞。\n 但若不定期執行索引清理，效能可能降低，因為當資料表被修改時，\n 索引會累積死亡 Tuple，且資料表本身會累積\n 無法移除的死亡行指標，直到索引清理完成。\n 對沒有索引的資料表此選項無效，使用 FULL 選項時也會忽略。\n自 PostgreSQL 12 起有效。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = 截斷
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = 指定 VACUUM 應嘗試截去資料表末尾的空白頁面\n 並允許作業系統回收截斷頁面的磁碟空間。\n 這通常是所需行為，也是預設值，除非資料表的 vacuum_truncate 選項\n 已設為 false。設定此選項為 false\n 可用於避免截斷所需的 ACCESS EXCLUSIVE 鎖定。\n 使用 FULL 選項時忽略此選項。\n自 PostgreSQL 12 起有效。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = 略過已鎖定
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = 指定 VACUUM 在開始處理關聯時不等待任何衝突鎖定被釋放：\n 若無法立即鎖定關聯，則略過該關聯。\n 請注意，即使使用此選項，VACUUM 在開啟關聯索引時仍可能阻塞。\n 此外，VACUUM ANALYZE 在從資料分割、資料表繼承子項及某些外部資料表類型取得樣本列時仍可能阻塞。\n 此外，雖然 VACUUM 通常處理指定資料分割資料表的所有資料分割，\n 若資料分割資料表上有衝突鎖定，此選項會導致 VACUUM 略過所有資料分割。\n自 PostgreSQL 12 起有效。
