meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.description = Si no se especifica ONLY, se truncan la tabla y todas sus tablas descendientes, si las hay.
tasks.vacuum.table.node.name = Limpiar tabla con VACUUM
tasks.vacuum.table.node.description = Vacuum en tabla(s)
tasks.vacuum.database.node.name = Limpiar base de datos con VACUUM
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = Completa
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = Selecciona una limpieza completa con VACUUM, que puede recuperar más espacio, pero tarda mucho más y bloquea la tabla de forma exclusiva.\nEste método también necesita espacio de disco adicional, ya que escribe una copia nueva de la tabla y no libera la antigua hasta que termina la operación.\nSolo debe utilizarse cuando sea necesario recuperar una cantidad significativa de espacio de la tabla.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = Congelar
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = Selecciona la congelación agresiva de tuplas. Especificar FREEZE equivale a ejecutar VACUUM con los parámetros vacuum_freeze_min_age y vacuum_freeze_table_age establecidos en cero.\nLa congelación agresiva siempre se realiza al reescribir la tabla, por lo que esta opción es redundante si se especifica FULL.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = Analizada
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = Actualiza las estadísticas que utiliza el planificador para determinar la forma más eficiente de ejecutar una consulta.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = Desactivar la omisión de páginas
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = Normalmente, VACUUM omite páginas según el mapa de visibilidad.\nSiempre pueden omitirse las páginas cuyas tuplas se sabe que están todas congeladas, y pueden omitirse las páginas cuyas tuplas se sabe que son visibles para todas las transacciones, salvo al realizar una limpieza agresiva.\nAdemás, salvo en una limpieza agresiva, pueden omitirse algunas páginas para evitar esperar a que otras sesiones dejen de utilizarlas.\nEsta opción desactiva toda omisión de páginas y solo está pensada para cuando se sospecha que el contenido del mapa de visibilidad es incorrecto, algo que solo debería ocurrir si un problema de hardware o software está dañando la base de datos.\nDisponible desde PostgreSQL 9.6.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = Limpieza de índices
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = Indica que VACUUM debe intentar eliminar las entradas de índices que apuntan a tuplas muertas.\n Normalmente, este comportamiento es el deseado y se aplica de forma predeterminada, salvo que la opción vacuum_index_cleanup\n se haya establecido en false\n para la tabla que se va a limpiar. Establecer esta opción en false puede resultar útil cuando sea necesario\n ejecutar VACUUM lo más rápido posible, por ejemplo, para evitar un desbordamiento inminente de los ID de transacción.\n Sin embargo, si los índices no se limpian con regularidad, el rendimiento puede empeorar porque, al modificarse la tabla,\n los índices acumularán tuplas muertas y la propia tabla\n acumulará punteros de línea muertos que no pueden eliminarse hasta que termine la limpieza de índices.\n Esta opción no tiene efecto en tablas sin índices y se ignora si se utiliza FULL.\nDisponible desde PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = Truncar
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = Indica que VACUUM debe intentar truncar las páginas vacías al final de la tabla\n y permitir que el espacio de disco de las páginas truncadas se devuelva al sistema operativo.\n Normalmente, este comportamiento es el deseado y se aplica de forma predeterminada, salvo que la opción vacuum_truncate\n se haya establecido en false para la tabla que se va a limpiar. Establecer esta opción en false\n puede ser útil para evitar el bloqueo ACCESS EXCLUSIVE que requiere el truncado.\n Esta opción se ignora si se utiliza FULL.\nDisponible desde PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = Omitir objetos bloqueados
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = Indica que VACUUM no debe esperar a que se liberen los bloqueos incompatibles al comenzar a procesar una relación:\n si no puede bloquear una relación inmediatamente, la omite.\n Tenga en cuenta que, incluso con esta opción, VACUUM puede bloquearse al abrir los índices de la relación.\n Además, VACUUM ANALYZE puede bloquearse al obtener filas de muestra de particiones, tablas hijas por herencia y algunos tipos de tablas externas.\n Aunque VACUUM normalmente procesa todas las particiones de las tablas particionadas indicadas,\n esta opción hará que omita todas las particiones si existe un bloqueo incompatible en la tabla particionada.\nDisponible desde PostgreSQL 12.
