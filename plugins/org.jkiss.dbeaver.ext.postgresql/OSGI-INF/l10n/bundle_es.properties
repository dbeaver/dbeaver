meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.description = Truncar automáticamente todas las tablas que tengan referencias de clave foránea a cualquiera\n de las tablas indicadas o a las tablas añadidas al grupo por CASCADE.
