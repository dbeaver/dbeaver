meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.description = Si se especifica WITH DATA (o se aplica de forma predeterminada), se ejecuta la consulta subyacente para proporcionar los datos nuevos y la vista materializada queda disponible para su lectura.\nSi se especifica WITH NO DATA, no se generan datos nuevos y la vista materializada no queda disponible para su lectura.
