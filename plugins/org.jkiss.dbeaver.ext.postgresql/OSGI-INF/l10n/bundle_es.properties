meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.name = Sustituir conexión al publicador (opcional)
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.description = Este campo está vacío intencionadamente: la cadena de conexión actual puede contener una contraseña y no se carga. Déjelo sin modificar para conservar la conexión actual. Para sustituirla, introduzca una cadena de conexión completa de PostgreSQL libpq y guarde la suscripción. Al guardar se ejecuta ALTER SUBSCRIPTION ... CONNECTION. Las credenciales se ocultan aquí y se omiten del visor DDL.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.name = Publicaciones
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.description = Nombres de publicaciones en el publicador, uno por línea, sin comillas SQL. Tras guardar los cambios de una suscripción existente, utilice Herramientas > Actualizar publicaciones para sincronizar las tablas incluidas cuando las tablas del suscriptor estén listas.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.name = Ranura de replicación
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.description = Ranura de replicación en el publicador. Déjelo vacío al crear la suscripción para utilizar su nombre. Cambiar una suscripción existente no crea ni elimina ranuras remotas. Vacíelo solo mientras esté desactivada para quitar la asociación con la ranura.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.name = Habilitado
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.description = Activar o desactivar el proceso de replicación de la suscripción. Al desactivarlo, se conservan la suscripción y la ranura remota; el WAL retenido puede crecer mientras la replicación esté detenida.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.name = Formato binario
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.description = Solicitar transferencia binaria en lugar de texto. Los tipos de datos del publicador y del suscriptor deben tener formatos binarios compatibles.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.name = Transmisión en continuo
