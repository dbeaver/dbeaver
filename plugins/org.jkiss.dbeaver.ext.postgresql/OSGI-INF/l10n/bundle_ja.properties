meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAttribute.intervalTypeField.description = 時間間隔の型のフィールド。フィールドとスケールの両方を指定する場合、\nスケールは秒にのみ適用されるため、フィールドにSECONDを含める必要があります。
