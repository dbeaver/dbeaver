meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.description = 指定したテーブル、またはCASCADEによってグループに追加されたテーブルを\n外部キーで参照するすべてのテーブルも自動的に切り詰めます。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.name = 指定テーブルのみ
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.description = ONLYを指定しない場合、テーブルと、そのすべての子孫テーブル（ある場合）を切り詰めます。
