meta.org.jkiss.dbeaver.ext.postgresql.model.PostgrePublication.tables.name = テーブル
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgrePublication.tables.description = 公開するテーブル。空のパブリケーションを作成するには空欄にします。
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.name = パブリッシャー接続の置き換え（任意）
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.description = この欄は意図的に空欄です。現在の接続文字列にはパスワードが含まれる可能性があるため、読み込まれません。現在の接続を維持するには変更しないでください。置き換えるには、完全なPostgreSQL libpq接続文字列を入力し、サブスクリプションを保存します。保存時にALTER SUBSCRIPTION ... CONNECTIONを実行します。認証情報はこの欄ではマスクされ、DDLビューアーには表示されません。
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.name = パブリケーション
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.description = パブリッシャー上のパブリケーション名をSQL引用符なしで1行に1つずつ指定します。既存のサブスクリプションの変更を保存した後、サブスクライバーのテーブルの準備ができたら「ツール > パブリケーションを更新」で対象テーブルを同期します。
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.name = レプリケーションスロット
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.description = パブリッシャー上のレプリケーションスロット。作成時に空欄にするとサブスクリプション名を使用します。既存のサブスクリプションを変更しても、リモートスロットは作成、削除されません。スロットの関連付けを解除するには、無効な状態でのみ空欄にしてください。
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.name = 有効
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.description = サブスクリプションのレプリケーションワーカーを有効または無効にします。無効にしてもサブスクリプションとリモートスロットは保持されます。停止中は保持されるWALが増大する可能性があります。
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.name = バイナリ形式
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.description = テキストではなくバイナリでの転送を要求します。パブリッシャーとサブスクライバーのデータ型のバイナリ形式に互換性が必要です。
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.name = ストリーミング
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.description = 実行中の大規模トランザクションの変更をストリーミングします。編集すると通常のストリーミングを選択するか無効にします。変更しない場合、既存のparallel設定を保持します。
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.name = 同期コミット
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.description = レプリケーション適用ワーカーの永続性設定。offでは適用性能が向上します。より強い設定では性能が低下する可能性があり、サブスクライバーの同期スタンバイを待機する場合があります。
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.twoPhaseState.name = 2相コミットの状態
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.name = パブリッシャーに接続
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.description = 作成時に接続します。無効にする場合、「有効」「スロットを作成」「データをコピー」も無効にしてください。設定を完了するには、パブリッシャーのスロットを作成または関連付けし、サブスクリプションを有効にしてからパブリケーションを更新します。
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.name = スロットを作成
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.description = リモートのレプリケーションスロットを作成します。既存のスロットを使用する場合や、同じPostgreSQLクラスター内でレプリケーションする場合は無効にします。
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.copyData.name = データをコピー
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.copyData.description = レプリケーションの開始時に、パブリッシャーの既存データをコピーします。
