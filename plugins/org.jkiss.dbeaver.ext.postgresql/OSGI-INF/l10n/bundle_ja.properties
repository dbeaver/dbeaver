meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = 完全
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = より多くの領域を回収できる完全なVACUUMを選択しますが、実行に長時間かかり、テーブルを排他ロックします。\n新しいテーブルのコピーを書き込み、完了するまで古いコピーを解放しないため、追加のディスク領域も必要です。\nテーブル内の大量の領域を回収する必要がある場合にのみ使用してください。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = 凍結
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = タプルを積極的に凍結します。FREEZEの指定は、vacuum_freeze_min_ageとvacuum_freeze_table_ageを0にしてVACUUMを実行することに相当します。\nテーブルの書き換え時には常に積極的な凍結が行われるため、FULLを指定した場合、このオプションは不要です。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = 統計を更新
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = プランナーが最も効率的なクエリ実行方法を決定するために使用する統計を更新します。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = ページのスキップを無効化
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = 通常、VACUUMは可視性マップに基づいてページをスキップします。\nすべてのタプルが凍結済みのページは常にスキップ可能で、すべてのトランザクションから可視のページも、積極的なVACUUM以外ではスキップできます。\nまた、積極的なVACUUM以外では、他のセッションによる使用の終了を待たないよう、一部のページをスキップする場合があります。\nこのオプションはすべてのページスキップを無効にします。ハードウェアまたはソフトウェアの問題によるデータベース破損など、可視性マップの内容に疑いがある場合にのみ使用してください。\nPostgreSQL 9.6以降で使用できます。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = インデックスのクリーンアップ
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = VACUUMで不要なタプルを指すインデックス項目の削除を試みるかどうかを指定します。\n通常は有効にすることが望ましく、対象テーブルのvacuum_index_cleanupオプションが\nfalseに設定されていない限り\n既定で有効です。トランザクションIDの周回が迫っている場合など、\nVACUUMをできるだけ速く実行する必要があるときは、無効にすると役立つ場合があります。\nただし、定期的にクリーンアップしないと、テーブルの変更に伴ってインデックスに不要なタプルが蓄積し、\nテーブル自体にもクリーンアップ完了まで削除できない\n不要な行ポインターが蓄積するため、性能が低下する可能性があります。\nインデックスのないテーブルには効果がなく、FULLを指定した場合は無視されます。\nPostgreSQL 12以降で使用できます。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = 切り詰め
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = VACUUMでテーブル末尾の空ページの切り詰めを試み、\nそのディスク領域をOSに返すかどうかを指定します。\n通常は有効にすることが望ましく、対象テーブルのvacuum_truncateオプションが\nfalseに設定されていない限り既定で有効です。無効にすると、\n切り詰めに必要なACCESS EXCLUSIVEロックを回避できる場合があります。\nFULLを指定した場合は無視されます。\nPostgreSQL 12以降で使用できます。
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = ロック中の対象をスキップ
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = VACUUMでリレーションの処理を開始するとき、競合するロックの解放を待機しないようにします。\n待機せずに直ちにロックできないリレーションはスキップします。\nこのオプションを指定しても、リレーションのインデックスを開くときにVACUUMが待機する場合があります。\nまた、VACUUM ANALYZEは、パーティション、継承先テーブル、一部の外部テーブルからサンプル行を取得するときに待機する場合があります。\n通常、VACUUMは指定されたパーティションテーブルの全パーティションを処理しますが、\nこのオプションでは、パーティションテーブルに競合するロックがあると全パーティションをスキップします。\nPostgreSQL 12以降で使用できます。
