meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = يحدد التنظيف "الكامل" الذي قد يستعيد مساحة أكبر، لكنه يستغرق وقتًا أطول بكثير ويقفل الجدول حصريًا.\nتتطلب هذه الطريقة أيضًا مساحة قرص إضافية لأنها تكتب نسخة جديدة من الجدول ولا تحرر النسخة القديمة حتى اكتمال العملية.\nيجب استخدامها فقط عند الحاجة إلى استعادة مساحة كبيرة من داخل الجدول.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = تجميد
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = يحدد "تجميدًا" مكثّفًا للصفوف. يعادل تحديد FREEZE إجراء VACUUM مع تعيين المعلمتين vacuum_freeze_min_age وvacuum_freeze_table_age إلى صفر.\nيُجرى التجميد المكثّف دائمًا عند إعادة كتابة الجدول، لذا يكون هذا الخيار زائدًا عند تحديد FULL.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = محلّل
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = يحدّث الإحصاءات التي يستخدمها المخطط لتحديد أكثر طرق تنفيذ الاستعلام كفاءةً.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = تعطيل تخطي الصفحات
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = يتخطى VACUUM الصفحات عادةً استنادًا إلى خريطة الرؤية.\nيمكن دائمًا تخطي الصفحات التي يُعرف أن جميع صفوفها مجمّدة، ويمكن تخطي الصفحات التي يُعرف أن جميع صفوفها مرئية لكل المعاملات إلا عند إجراء تنظيف مكثّف.\nوقد تُتخطى بعض الصفحات أيضًا لتجنب انتظار انتهاء جلسات أخرى من استخدامها، إلا عند إجراء تنظيف مكثّف.\nيعطّل هذا الخيار جميع عمليات تخطي الصفحات، ويُفترض استخدامه فقط عند الشك في محتويات خريطة الرؤية، وهو أمر لا ينبغي أن يحدث إلا عند وجود مشكلة عتادية أو برمجية تسبب تلف قاعدة البيانات.\nمتاح منذ PostgreSQL 9.6.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = تنظيف الفهارس
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = يحدد أن يحاول VACUUM إزالة مدخلات الفهارس التي تشير إلى صفوف ميتة.\n وهذا هو السلوك المرغوب عادةً، وهو الافتراضي ما لم يُعيّن الخيار vacuum_index_cleanup\n إلى false\n للجدول المراد تنظيفه. قد يفيد تعيين هذا الخيار إلى false عند الضرورة\n لتشغيل التنظيف بأقصى سرعة ممكنة، مثل تجنب التفاف معرّفات المعاملات الوشيك.\n لكن عدم تنظيف الفهارس بانتظام قد يضعف الأداء، لأنه مع تعديل الجدول\n تتراكم الصفوف الميتة في الفهارس، ويتراكم في الجدول نفسه\n مؤشرات أسطر ميتة لا يمكن إزالتها حتى اكتمال تنظيف الفهارس.\n لا يؤثر هذا الخيار في الجداول التي ليس لها فهرس، ويُتجاهل عند استخدام FULL.\nمتاح منذ PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = اقتطاع
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = يحدد أن يحاول VACUUM اقتطاع الصفحات الفارغة في نهاية الجدول\n وإعادة مساحة القرص الخاصة بها إلى نظام التشغيل.\n وهذا هو السلوك المرغوب عادةً، وهو الافتراضي ما لم يُعيّن الخيار vacuum_truncate\n إلى false للجدول المراد تنظيفه. قد يفيد تعيين هذا الخيار إلى false\n لتجنب قفل ACCESS EXCLUSIVE على الجدول الذي تتطلبه عملية الاقتطاع.\n يُتجاهل هذا الخيار عند استخدام FULL.\nمتاح منذ PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = تخطي المقفول
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = يحدد ألا ينتظر VACUUM تحرير الأقفال المتعارضة عند بدء العمل على علاقة:\n إذا تعذر قفل العلاقة فورًا دون انتظار، تُتخطى العلاقة.\n لاحظ أنه حتى مع هذا الخيار، قد يظل VACUUM منتظرًا عند فتح فهارس العلاقة.\n وقد ينتظر VACUUM ANALYZE أيضًا عند أخذ صفوف العينة من الأقسام والجداول الفرعية بالوراثة وبعض أنواع الجداول الخارجية.\n وبينما يعالج VACUUM عادةً جميع أقسام الجداول المقسّمة المحددة،\n يؤدي هذا الخيار إلى تخطي جميع الأقسام إذا وُجد قفل متعارض على الجدول المقسّم.\nمتاح منذ PostgreSQL 12.
