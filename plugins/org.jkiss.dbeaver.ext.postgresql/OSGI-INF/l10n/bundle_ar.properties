meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.name=استبدال اتصال الناشر (اختياري)
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.description=هذا الحقل فارغ عمدًا: قد تحتوي سلسلة الاتصال الحالية على كلمة مرور، لذا لا تُحمّل. اتركه دون تغيير للاحتفاظ بالاتصال الحالي. لاستبداله، أدخل سلسلة اتصال PostgreSQL libpq كاملة واحفظ الاشتراك. ينفّذ الحفظ ALTER SUBSCRIPTION ... CONNECTION. تُحجب بيانات الاعتماد هنا وتُحذف من عارض DDL.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.name=المنشورات
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.description=أسماء المنشورات على الناشر، اسم واحد في كل سطر، دون علامات اقتباس SQL. بعد حفظ تغييرات اشتراك موجود، استخدم أدوات > تحديث المنشورات لمزامنة عضوية الجداول عندما تكون جداول المشترك جاهزة.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.name=فتحة النسخ المتماثل
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.description=فتحة النسخ المتماثل على الناشر. اتركها فارغة أثناء الإنشاء لاستخدام اسم الاشتراك. لا يؤدي تغيير اشتراك موجود إلى إنشاء فتحات بعيدة أو إسقاطها. امسحها فقط أثناء التعطيل لإزالة ارتباط الفتحة.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.name=مفعّل
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.description=تفعيل عامل النسخ المتماثل للاشتراك أو تعطيله. يحتفظ التعطيل بالاشتراك والفتحة البعيدة؛ وقد يزداد حجم WAL المحتفظ به أثناء توقف النسخ المتماثل.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.name=تنسيق ثنائي
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.description=طلب النقل الثنائي بدلًا من النصي. يجب أن تكون التنسيقات الثنائية لأنواع بيانات الناشر والمشترك متوافقة.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.name=البث
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.description=بث التغييرات من المعاملات الكبيرة قيد التنفيذ. يحدد تحرير هذه القيمة البث العادي أو يعطّله؛ ويُحتفظ بإعداد البث المتوازي الموجود إذا لم يتغير هذا الحقل.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.name=تثبيت متزامن
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.description=إعداد المتانة لعامل تطبيق النسخ المتماثل. يؤدي التعطيل إلى تحسين أداء التطبيق؛ وقد تقلّل الإعدادات الأقوى الأداء وتنتظر الخوادم الاحتياطية المتزامنة على المشترك.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.twoPhaseState.name=حالة المرحلتين
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.name=الاتصال بالناشر
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.description=الاتصال أثناء الإنشاء. عند تعطيله، يجب أيضًا تعطيل مفعّل وإنشاء فتحة ونسخ البيانات. لإكمال الإعداد، أنشئ فتحة على الناشر أو اربط فتحة موجودة، ثم فعّل الاشتراك وحدّث المنشورات.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.name=إنشاء فتحة
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.description=إنشاء فتحة نسخ متماثل بعيدة. عطّله عند استخدام فتحة موجودة أو النسخ المتماثل داخل عنقود PostgreSQL نفسه.
