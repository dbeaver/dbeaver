meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = 전체
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = "full" VACUUM을 선택합니다. 더 많은 공간을 회수할 수 있지만 훨씬 오래 걸리며 테이블을 독점적으로 잠급니다.\n또한 테이블의 새 복사본을 작성하고 작업 완료 전까지 기존 복사본을 해제하지 않으므로 추가 디스크 공간이 필요합니다.\n테이블 내부에서 상당한 공간을 회수해야 할 때만 사용해야 합니다.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = 동결
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = 튜플을 적극적으로 "동결"합니다. FREEZE를 지정하면 vacuum_freeze_min_age 및 vacuum_freeze_table_age 매개변수를 0으로 설정하여 VACUUM을 수행하는 것과 같습니다.\n테이블을 다시 작성할 때는 항상 적극적인 동결을 수행하므로 FULL을 지정한 경우 이 옵션은 불필요합니다.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = 분석 수행
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = 플래너가 가장 효율적인 쿼리 실행 방법을 결정하는 데 사용하는 통계를 갱신합니다.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = 페이지 건너뛰기 비활성화
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = 일반적으로 VACUUM은 가시성 맵을 기준으로 페이지를 건너뜁니다.\n모든 튜플이 동결된 것으로 알려진 페이지는 항상 건너뛸 수 있고, 모든 트랜잭션에서 모든 튜플이 보이는 것으로 알려진 페이지는 적극적인 VACUUM이 아닌 경우 건너뛸 수 있습니다.\n또한 적극적인 VACUUM이 아닌 경우 다른 세션의 페이지 사용이 끝날 때까지 기다리지 않기 위해 일부 페이지를 건너뛸 수 있습니다.\n이 옵션은 모든 페이지 건너뛰기를 비활성화하며, 가시성 맵의 내용이 의심스러울 때만 사용하도록 마련되었습니다. 이러한 상황은 하드웨어나 소프트웨어 문제로 데이터베이스가 손상된 경우에만 발생해야 합니다.\nPostgreSQL 9.6부터 지원됩니다.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = 인덱스 정리
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = VACUUM이 죽은 튜플을 가리키는 인덱스 항목을 제거하도록 지정합니다.\n 일반적으로 권장되는 동작이며, VACUUM 대상 테이블의 vacuum_index_cleanup 옵션이\n false로 설정되지 않았다면\n 기본값입니다. 이 옵션을 false로 설정하면 VACUUM을 최대한 빠르게 실행해야 할 때,\n 예를 들어 임박한 트랜잭션 ID 순환을 방지할 때 유용할 수 있습니다.\n 하지만 인덱스 정리를 정기적으로 수행하지 않으면 테이블이 수정될 때\n 인덱스에 죽은 튜플이 쌓이고 테이블 자체에도\n 인덱스 정리 전에는 제거할 수 없는 죽은 행 포인터가 쌓여 성능이 저하될 수 있습니다.\n 인덱스가 없는 테이블에는 효과가 없으며 FULL 옵션을 사용하면 무시됩니다.\nPostgreSQL 12부터 지원됩니다.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = 비우기
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = VACUUM이 테이블 끝의 빈 페이지를 잘라내어\n 해당 페이지의 디스크 공간을 운영 체제에 반환하도록 지정합니다.\n 일반적으로 권장되는 동작이며, VACUUM 대상 테이블의 vacuum_truncate 옵션이\n false로 설정되지 않았다면 기본값입니다. 이 옵션을 false로 설정하면\n 잘라내기에 필요한 ACCESS EXCLUSIVE 잠금을 피하는 데 유용할 수 있습니다.\n FULL 옵션을 사용하면 무시됩니다.\nPostgreSQL 12부터 지원됩니다.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = 잠긴 릴레이션 건너뛰기
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = VACUUM이 릴레이션 작업을 시작할 때 충돌하는 잠금이 해제될 때까지 기다리지 않도록 지정합니다.\n 기다리지 않고 즉시 잠글 수 없으면 해당 릴레이션을 건너뜁니다.\n 이 옵션을 사용해도 릴레이션의 인덱스를 열 때 VACUUM이 차단될 수 있습니다.\n 또한 VACUUM ANALYZE는 파티션, 상속된 하위 테이블 및 일부 외부 테이블에서 표본 행을 가져올 때 차단될 수 있습니다.\n 일반적으로 VACUUM은 지정한 파티션 테이블의 모든 파티션을 처리하지만\n 이 옵션을 사용하면 파티션 테이블에 충돌하는 잠금이 있을 때 모든 파티션을 건너뜁니다.\nPostgreSQL 12부터 지원됩니다.
