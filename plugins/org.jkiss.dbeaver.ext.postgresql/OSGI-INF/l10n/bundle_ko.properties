meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.description = 비운 테이블의 열이 소유한 시퀀스를 자동으로 재시작합니다.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.name = 연쇄 적용
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.description = 지정된 테이블 또는 CASCADE로 인해 그룹에 추가된 테이블을\n 외래 키로 참조하는 모든 테이블을 자동으로 비웁니다.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.name = 해당 테이블만
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.description = ONLY를 지정하지 않으면 해당 테이블과 모든 하위 테이블(있는 경우)을 비웁니다.
