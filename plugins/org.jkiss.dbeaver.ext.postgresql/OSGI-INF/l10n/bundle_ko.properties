meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.name = 별도 트랜잭션에서 실행
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.description = 별도 트랜잭션에서 도구를 실행합니다. 도구 실행 전에 활성 트랜잭션을 커밋하고, 도구가 성공적으로 실행된 후 커밋합니다.
