meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.name = 발행자 연결 교체(선택 사항)
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.description = 이 필드는 의도적으로 비어 있습니다. 현재 연결 문자열에는 비밀번호가 포함될 수 있으므로 로드하지 않습니다. 현재 연결을 유지하려면 그대로 두세요. 교체하려면 완전한 PostgreSQL libpq 연결 문자열을 입력하고 구독을 저장하세요. 저장하면 ALTER SUBSCRIPTION ... CONNECTION이 실행됩니다. 자격 증명은 여기에서 마스킹되며 DDL 뷰어에는 표시되지 않습니다.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.name = 발행
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.description = 발행자 측의 발행 이름을 SQL 따옴표 없이 한 줄에 하나씩 입력하세요. 기존 구독의 변경 사항을 저장한 후 구독자 테이블이 준비되면 도구 > 발행 새로 고침을 사용하여 테이블 구성을 동기화하세요.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.name = 복제 슬롯
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.description = 발행자 측의 복제 슬롯입니다. 생성 시 비워 두면 구독 이름을 사용합니다. 기존 구독을 변경해도 원격 슬롯을 생성하거나 삭제하지 않습니다. 슬롯 연결을 제거하려면 구독이 비활성화된 상태에서만 이 값을 비우세요.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.name = 활성화됨
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.description = 구독의 복제 작업자를 활성화하거나 비활성화합니다. 비활성화해도 구독과 원격 슬롯은 유지됩니다. 복제가 중지된 동안 보존되는 WAL이 늘어날 수 있습니다.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.name = 바이너리 형식
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.description = 텍스트 대신 바이너리 전송을 요청합니다. 발행자와 구독자의 데이터 유형은 바이너리 형식이 호환되어야 합니다.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.name = 스트리밍
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.description = 진행 중인 대규모 트랜잭션의 변경 사항을 스트리밍합니다. 이 값을 편집하면 일반 스트리밍을 선택하거나 비활성화합니다. 이 필드를 변경하지 않으면 기존 병렬 설정을 유지합니다.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.name = 동기 커밋
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.description = 복제 적용 작업자의 내구성 설정입니다. 끄면 적용 성능이 향상되며, 더 강한 설정은 성능을 저하시키고 구독자의 동기 대기 서버를 기다리게 할 수 있습니다.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.twoPhaseState.name = 2단계 상태
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.name = 발행자에 연결
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.description = 생성 중에 연결합니다. 비활성화하면 활성화, 슬롯 생성, 데이터 복사도 비활성화해야 합니다. 설정을 완료하려면 발행자 슬롯을 생성하거나 연결하고, 구독을 활성화한 다음 발행을 새로 고치세요.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.name = 슬롯 생성
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.description = 원격 복제 슬롯을 생성합니다. 기존 슬롯을 사용하거나 같은 PostgreSQL 클러스터 내에서 복제할 때는 비활성화하세요.
