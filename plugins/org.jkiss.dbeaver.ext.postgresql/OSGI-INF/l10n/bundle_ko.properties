meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.description = WITH DATA를 지정하거나 기본값으로 적용하면 원본 쿼리를 실행하여 새 데이터를 제공하고 구체화된 뷰를 스캔 가능한 상태로 유지합니다.\nWITH NO DATA를 지정하면 새 데이터를 생성하지 않고 구체화된 뷰를 스캔 불가능한 상태로 유지합니다.
