meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.name = Uruchom w osobnej transakcji
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.running.description = Uruchom narzędzie w osobnej transakcji. Zatwierdź aktywną transakcję przed uruchomieniem narzędzia i zatwierdź po jego pomyślnym wykonaniu
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.name = Restartuj tożsamość
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.restarting.description = Automatycznie restartuj sekwencje należące do kolumn czyszczonych tabel.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.name = Kaskadowo
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.cascading.description = Automatycznie wyczyść wszystkie tabele, które mają klucze obce odwołujące się do\n którejkolwiek z podanych tabel lub tabel dodanych do grupy w wyniku CASCADE.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.name = Tylko (ONLY)
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolTableTruncateSettings.only.description = Jeśli nie podano ONLY, czyszczona jest tabela i wszystkie jej tabele potomne (jeśli istnieją).
tasks.vacuum.table.node.name = Odkurz tabelę (VACUUM)
tasks.vacuum.table.node.description = Odkurz tabele (VACUUM)
tasks.vacuum.database.node.name = Odkurz bazę danych (VACUUM)
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = Pełny
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = Wybiera „pełne” odkurzanie, które odzyskuje więcej miejsca, ale trwa znacznie dłużej i blokuje tabelę na wyłączność.\nWymaga też dodatkowego miejsca na dysku, ponieważ zapisuje nową kopię tabeli i nie zwalnia starej do zakończenia operacji.\nNależy go używać tylko wtedy, gdy trzeba odzyskać dużo miejsca z tabeli.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = Zamrażanie (FREEZE)
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = Wybiera agresywne „zamrażanie” krotek. Podanie FREEZE odpowiada wykonaniu VACUUM z parametrami vacuum_freeze_min_age i vacuum_freeze_table_age ustawionymi na zero.\nAgresywne zamrażanie jest zawsze wykonywane przy przepisywaniu tabeli, więc ta opcja jest zbędna, gdy podano FULL.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = Analiza (ANALYZE)
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = Aktualizuje statystyki używane przez planistę do wyboru najwydajniejszego sposobu wykonania zapytania.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = Wyłącz pomijanie stron
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = Zwykle VACUUM pomija strony na podstawie mapy widoczności.\nStrony, w których wszystkie krotki są zamrożone, mogą być zawsze pomijane, a te, w których wszystkie krotki są widoczne dla wszystkich transakcji, mogą być pomijane z wyjątkiem agresywnego odkurzania.\nPonadto, z wyjątkiem agresywnego odkurzania, niektóre strony mogą być pomijane, aby nie czekać, aż inne sesje przestaną ich używać.\nTa opcja wyłącza całe pomijanie stron i jest przeznaczona tylko na wypadek, gdy zawartość mapy widoczności jest podejrzana, co powinno się zdarzyć tylko przy awarii sprzętu lub oprogramowania powodującej uszkodzenie bazy danych.\nDziała od PostgreSQL 9.6.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = Czyszczenie indeksów
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = Określa, że VACUUM ma próbować usuwać wpisy indeksów wskazujące na martwe krotki.\n Zwykle jest to pożądane i domyślne, chyba że dla odkurzanej tabeli opcję vacuum_index_cleanup\n ustawiono na false.\n Ustawienie tej opcji na false może być przydatne, gdy odkurzanie musi\n przebiec jak najszybciej, np. aby uniknąć zbliżającego się zawinięcia identyfikatorów transakcji.\n Jeśli jednak czyszczenie indeksów nie jest wykonywane regularnie, wydajność może spaść, ponieważ przy zmianach tabeli\n indeksy gromadzą martwe krotki, a sama tabela\n gromadzi martwe wskaźniki wierszy, których nie można usunąć do czasu wyczyszczenia indeksów.\n Ta opcja nie działa dla tabel bez indeksów i jest ignorowana przy opcji FULL.\nDziała od PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = Wyczyść
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = Określa, że VACUUM ma próbować obcinać puste strony na końcu tabeli\n i zwracać zwolnione miejsce na dysku systemowi operacyjnemu.\n Zwykle jest to pożądane i domyślne, chyba że dla odkurzanej tabeli opcję vacuum_truncate\n ustawiono na false. Ustawienie tej opcji na false\n może pomóc uniknąć blokady ACCESS EXCLUSIVE na tabeli, której wymaga obcinanie.\n Ta opcja jest ignorowana przy opcji FULL.\nDziała od PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = Pomijaj zablokowane
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = Określa, że VACUUM nie ma czekać na zwolnienie kolidujących blokad przy rozpoczynaniu pracy z relacją:\n jeśli relacji nie można zablokować od razu, zostaje pominięta.\n Nawet z tą opcją VACUUM może się zablokować przy otwieraniu indeksów relacji.\n Ponadto VACUUM ANALYZE może się zablokować przy pobieraniu próbek wierszy z partycji, tabel potomnych i niektórych typów tabel obcych.\n Choć VACUUM zwykle przetwarza wszystkie partycje podanych tabel partycjonowanych,\n ta opcja spowoduje pominięcie wszystkich partycji, jeśli na tabeli partycjonowanej jest kolidująca blokada.\nDziała od PostgreSQL 12.
