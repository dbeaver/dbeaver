meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.name = Z danymi
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.description = Jeśli podano WITH DATA (lub domyślnie), zapytanie źródłowe jest wykonywane w celu dostarczenia nowych danych, a widok zmaterializowany pozostaje w stanie umożliwiającym odczyt.\nJeśli podano WITH NO DATA, nowe dane nie są generowane, a widok zmaterializowany pozostaje w stanie uniemożliwiającym odczyt.
