meta.org.jkiss.dbeaver.ext.postgresql.model.PostgrePublication.tables.description = Zu veröffentlichende Tabellen. Leer lassen, um eine leere Publikation zu erstellen.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.name = Verbindung zum Herausgeber ersetzen (optional)
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.description = Dieses Feld ist absichtlich leer: Die aktuelle Verbindungszeichenfolge kann ein Passwort enthalten und wird nicht geladen. Lassen Sie das Feld unverändert, um die aktuelle Verbindung beizubehalten. Zum Ersetzen geben Sie eine vollständige PostgreSQL-libpq-Verbindungszeichenfolge ein und speichern Sie das Abonnement. Dabei wird ALTER SUBSCRIPTION ... CONNECTION ausgeführt. Zugangsdaten werden hier maskiert und in der DDL-Ansicht ausgelassen.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.name = Publikationen
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.description = Publikationsnamen auf dem Herausgeber, einer pro Zeile, ohne SQL-Anführungszeichen. Verwenden Sie nach dem Speichern von Änderungen an einem bestehenden Abonnement „Werkzeuge > Publikationen aktualisieren“, um die Tabellenzugehörigkeit abzugleichen, sobald die Tabellen auf dem Abonnenten bereit sind.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.name = Replikationsslot
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.description = Replikationsslot auf dem Herausgeber. Beim Erstellen leer lassen, um den Abonnementnamen zu verwenden. Das Ändern eines bestehenden Abonnements erstellt oder löscht keine entfernten Slots. Nur im deaktivierten Zustand leeren, um die Slot-Zuordnung aufzuheben.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.name = Aktiviert
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.description = Den Replikationsprozess des Abonnements aktivieren oder deaktivieren. Beim Deaktivieren bleiben das Abonnement und der entfernte Slot erhalten; zurückgehaltene WAL-Daten können bei gestoppter Replikation anwachsen.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.name = Binärformat
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.description = Binär- statt Textübertragung anfordern. Die Datentypen von Herausgeber und Abonnent müssen kompatible Binärformate besitzen.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.name = Streaming
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.description = Änderungen großer laufender Transaktionen streamen. Eine Änderung dieses Werts wählt gewöhnliches Streaming oder deaktiviert es; eine bestehende parallele Einstellung bleibt erhalten, solange dieses Feld unverändert bleibt.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.name = Synchroner Commit
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.description = Dauerhaftigkeitseinstellung für den Replikations-Übernahmeprozess. „Aus“ verbessert die Übernahmeleistung; stärkere Einstellungen können die Leistung verringern und auf synchrone Standby-Server des Abonnenten warten.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.twoPhaseState.name = Zweiphasenzustand
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.name = Mit Herausgeber verbinden
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.description = Beim Erstellen verbinden. Ist diese Option deaktiviert, müssen auch „Aktiviert“, „Slot erstellen“ und „Daten kopieren“ deaktiviert sein. Zum Abschließen der Einrichtung einen Slot auf dem Herausgeber erstellen oder zuordnen, das Abonnement aktivieren und anschließend die Publikationen aktualisieren.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.name = Slot erstellen
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.description = Einen entfernten Replikationsslot erstellen. Bei Verwendung eines bestehenden Slots oder Replikation innerhalb desselben PostgreSQL-Clusters deaktivieren.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.copyData.name = Daten kopieren
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.copyData.description = Vorhandene Daten des Herausgebers beim Start der Replikation kopieren.
