meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAttribute.intervalTypeField.description = Felder des Intervalltyps. Werden sowohl Felder als auch Nachkommastellen angegeben,\n müssen die Felder SECOND enthalten, da sich die Nachkommastellen nur auf Sekunden beziehen.
