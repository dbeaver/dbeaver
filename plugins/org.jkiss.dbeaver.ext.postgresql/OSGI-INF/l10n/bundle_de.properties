tasks.vacuum.table.node.name = Vacuum Tabelle
tasks.vacuum.table.node.description = Vacuum Tabelle(n)
tasks.vacuum.database.node.name = Vacuum Datenbank
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = Volles
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = Wählt "volles" Vakuum, das mehr Speicherplatz zurückgewinnen kann, aber viel länger dauert und die Tabelle exklusiv sperrt.\nDiese Methode benötigt auch zusätzlichen Festplattenspeicher, da bei dieser Methode eine neue Kopie der Tabelle erstellt wird und die alte Kopie erst nach Abschluss des Vorgangs freigegeben wird.\nNormalerweise sollte dies nur dann verwendet werden, wenn ein erheblicher Teil des Platzes innerhalb der Tabelle zurückgewonnen werden muss.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = Einfrieren
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = Wählt das aggressive "Einfrieren" von Tupeln. Die Angabe von FREEZE entspricht der Durchführung von VACUUM, wobei die Parameter vacuum_freeze_min_age und vacuum_freeze_table_age auf Null gesetzt sind.\nDas aggressive Einfrieren wird immer beim Neuschreiben der Tabelle durchgeführt, so dass diese Option bei Angabe von FULL redundant ist.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = Analysiert
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = Aktualisiert die Statistiken, die vom Planer verwendet werden, um die effizienteste Art der Ausführung einer Abfrage zu bestimmen.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = Überspringen von Seiten deaktivieren
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = Normalerweise überspringt VACUUM Seiten anhand der Sichtbarkeitskarte.\nSeiten, deren Tupel bekanntermaßen alle eingefroren sind, können immer übersprungen werden. Seiten, deren Tupel für alle Transaktionen sichtbar sind, können außer bei einer aggressiven Bereinigung übersprungen werden.\nAußer bei einer aggressiven Bereinigung können außerdem einige Seiten übersprungen werden, um nicht auf deren Freigabe durch andere Sitzungen warten zu müssen.\nDiese Option deaktiviert das Überspringen sämtlicher Seiten und sollte nur verwendet werden, wenn der Inhalt der Sichtbarkeitskarte als fehlerhaft gilt. Dies sollte nur bei Hardware- oder Softwareproblemen auftreten, die eine Datenbankbeschädigung verursachen.\nVerfügbar seit PostgreSQL 9.6.
