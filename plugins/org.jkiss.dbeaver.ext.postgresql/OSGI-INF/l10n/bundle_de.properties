meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = Indexbereinigung
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = Legt fest, dass VACUUM versuchen soll, Indexeinträge zu entfernen, die auf tote Tupel verweisen.\n Dies ist normalerweise erwünscht und der Standard, sofern die Option vacuum_index_cleanup\n für die zu bereinigende Tabelle nicht auf false\n gesetzt wurde. Der Wert false kann sinnvoll sein, wenn\n VACUUM möglichst schnell ausgeführt werden muss, etwa um einen unmittelbar drohenden Transaktions-ID-Überlauf zu vermeiden.\n Wird die Indexbereinigung jedoch nicht regelmäßig durchgeführt, kann die Leistung leiden, da sich bei Tabellenänderungen\n tote Tupel in Indizes und tote Zeilenzeiger in der Tabelle ansammeln,\n die erst nach Abschluss der Indexbereinigung entfernt werden können.\n Diese Option hat bei Tabellen ohne Index keine Wirkung und wird bei Verwendung der Option FULL ignoriert.\nVerfügbar seit PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = Leeren
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = Legt fest, dass VACUUM versuchen soll, leere Seiten am Tabellenende abzuschneiden\n und den Speicherplatz dieser Seiten an das Betriebssystem zurückzugeben.\n Dies ist normalerweise erwünscht und der Standard, sofern die Option vacuum_truncate\n für die zu bereinigende Tabelle nicht auf false gesetzt wurde. Der Wert false\n kann sinnvoll sein, um die für das Abschneiden erforderliche ACCESS EXCLUSIVE-Sperre auf der Tabelle zu vermeiden.\n Diese Option wird bei Verwendung der Option FULL ignoriert.\nVerfügbar seit PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = Gesperrte Objekte überspringen
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = Legt fest, dass VACUUM beim Beginn der Arbeit an einer Relation nicht auf die Freigabe konkurrierender Sperren wartet:\n Kann eine Relation nicht sofort ohne Wartezeit gesperrt werden, wird sie übersprungen.\n Auch mit dieser Option kann VACUUM beim Öffnen der Indizes der Relation weiterhin blockieren.\n Außerdem kann VACUUM ANALYZE beim Abrufen von Stichprobenzeilen aus Partitionen, erbenden Tabellen und bestimmten Fremdtabellentypen weiterhin blockieren.\n Während VACUUM normalerweise alle Partitionen angegebener partitionierter Tabellen verarbeitet,\n führt diese Option bei einer konkurrierenden Sperre auf der partitionierten Tabelle zum Überspringen aller Partitionen.\nVerfügbar seit PostgreSQL 12.
