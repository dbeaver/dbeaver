meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolMViewRefreshSettings.withData.description = Se si specifica WITH DATA (o è il valore predefinito), la query sottostante viene eseguita per fornire i nuovi dati e la vista materializzata rimane in uno stato che consente la scansione.\nSe si specifica WITH NO DATA, non vengono generati nuovi dati e la vista materializzata rimane in uno stato che non consente la scansione.
