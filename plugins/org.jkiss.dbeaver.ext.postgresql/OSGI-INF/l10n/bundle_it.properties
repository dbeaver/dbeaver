meta.org.jkiss.dbeaver.ext.postgresql.model.impls.redshift.RedshiftTableColumn.sortKey.description = Posizione della colonna nella chiave di ordinamento.\nSe la tabella usa una chiave di ordinamento composta, tutte le colonne che ne fanno parte hanno un valore positivo che indica la posizione nella chiave.\nSe la tabella usa una chiave di ordinamento interlacciata, ciascuna colonna che ne fa parte ha un valore alternativamente positivo o negativo, il cui valore assoluto indica la posizione nella chiave.\nSe il valore è 0, la colonna non fa parte di una chiave di ordinamento.
