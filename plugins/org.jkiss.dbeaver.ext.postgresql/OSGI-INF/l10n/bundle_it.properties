tasks.vacuum.database.node.name = Esegui VACUUM sul database
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.name = Completa
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.full.description = Seleziona il VACUUM "completo", che può recuperare più spazio ma richiede molto più tempo e blocca la tabella in modo esclusivo.\nQuesto metodo richiede anche spazio aggiuntivo su disco, poiché scrive una nuova copia della tabella e non rilascia quella precedente fino al completamento dell'operazione.\nUsarlo solo quando è necessario recuperare una quantità significativa di spazio all'interno della tabella.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.name = Congela
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.freeze.description = Seleziona il "congelamento" aggressivo delle tuple. Specificare FREEZE equivale a eseguire VACUUM con i parametri vacuum_freeze_min_age e vacuum_freeze_table_age impostati a zero.\nIl congelamento aggressivo viene sempre eseguito quando la tabella viene riscritta; questa opzione è quindi superflua se si specifica FULL.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.name = Analizzata
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.analyzed.description = Aggiorna le statistiche usate dal pianificatore per determinare il modo più efficiente di eseguire una query.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.name = Disabilita esclusione delle pagine
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.disableSkipping.description = Normalmente VACUUM salta le pagine in base alla mappa di visibilità.\nLe pagine in cui tutte le tuple sono note come congelate possono sempre essere saltate; quelle in cui tutte le tuple sono visibili a tutte le transazioni possono essere saltate tranne durante un VACUUM aggressivo.\nInoltre, salvo durante un VACUUM aggressivo, alcune pagine possono essere saltate per evitare di attendere che altre sessioni finiscano di usarle.\nQuesta opzione disabilita ogni esclusione di pagine e va usata solo se si sospetta che il contenuto della mappa di visibilità non sia corretto, situazione che dovrebbe verificarsi solo in presenza di problemi hardware o software che danneggiano il database.\nDisponibile da PostgreSQL 9.6.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.name = Pulizia degli indici
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.indexCleaning.description = Specifica che VACUUM deve tentare di rimuovere le voci degli indici che puntano a tuple morte.\n Questo è normalmente il comportamento desiderato e predefinito, salvo che l'opzione vacuum_index_cleanup\n sia stata impostata a false\n per la tabella su cui eseguire VACUUM. Impostarla a false può essere utile quando è necessario\n eseguire VACUUM il più rapidamente possibile, ad esempio per evitare l'imminente riciclo degli ID di transazione.\n Tuttavia, se la pulizia degli indici non viene eseguita regolarmente, le prestazioni possono risentirne: con le modifiche alla tabella,\n gli indici accumulano tuple morte e la tabella stessa\n accumula puntatori a righe morte che non possono essere rimossi prima del completamento della pulizia degli indici.\n Questa opzione non ha effetto sulle tabelle prive di indici ed è ignorata se si usa FULL.\nDisponibile da PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.name = Tronca
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.truncated.description = Specifica che VACUUM deve tentare di troncare le pagine vuote alla fine della tabella\n e consentire la restituzione al sistema operativo dello spazio su disco delle pagine troncate.\n Questo è normalmente il comportamento desiderato e predefinito, salvo che l'opzione vacuum_truncate\n sia stata impostata a false per la tabella su cui eseguire VACUUM. Impostarla a false\n può essere utile per evitare il blocco ACCESS EXCLUSIVE sulla tabella richiesto dal troncamento.\n Questa opzione è ignorata se si usa FULL.\nDisponibile da PostgreSQL 12.
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.name = Salta oggetti bloccati
meta.org.jkiss.dbeaver.ext.postgresql.tasks.PostgreToolBaseVacuumSettings.skipLocked.description = Specifica che VACUUM non deve attendere il rilascio di blocchi incompatibili all'inizio del lavoro su una relazione:\n se una relazione non può essere bloccata immediatamente senza attesa, viene saltata.\n Anche con questa opzione VACUUM può comunque bloccarsi all'apertura degli indici della relazione.\n Inoltre VACUUM ANALYZE può bloccarsi durante l'acquisizione di righe campione da partizioni, tabelle figlie per ereditarietà e alcuni tipi di tabelle esterne.\n Sebbene VACUUM normalmente elabori tutte le partizioni delle tabelle partizionate specificate,\n questa opzione fa saltare tutte le partizioni se esiste un blocco incompatibile sulla tabella partizionata.\nDisponibile da PostgreSQL 12.
