meta.org.jkiss.dbeaver.ext.postgresql.model.PostgrePublication.publishViaPartitionRoot.name = Pubblica tramite la radice delle partizioni
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgrePublication.publishViaPartitionRoot.description = Usa l'identità e lo schema della tabella radice partizionata anziché quelli delle singole partizioni.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgrePublication.tables.name = Tabelle
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgrePublication.tables.description = Tabelle da pubblicare. Lasciare vuoto per creare una pubblicazione vuota.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.name = Sostituisci connessione al pubblicatore (facoltativo)
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connectionInfo.description = Questo campo è intenzionalmente vuoto: la stringa di connessione corrente può contenere una password e non viene caricata. Lasciarlo invariato per mantenere la connessione corrente. Per sostituirla, inserire una stringa di connessione PostgreSQL libpq completa e salvare la sottoscrizione. Il salvataggio esegue ALTER SUBSCRIPTION ... CONNECTION. Le credenziali sono mascherate qui e omesse dal visualizzatore DDL.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.name = Pubblicazioni
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.publications.description = Nomi delle pubblicazioni sul pubblicatore, uno per riga, senza delimitazione SQL. Dopo aver salvato le modifiche a una sottoscrizione esistente, usare Strumenti > Aggiorna pubblicazioni per sincronizzare l'appartenenza delle tabelle quando le tabelle del sottoscrittore sono pronte.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.name = Slot di replica
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.slotName.description = Slot di replica sul pubblicatore. Lasciare vuoto durante la creazione per usare il nome della sottoscrizione. La modifica di una sottoscrizione esistente non crea né elimina slot remoti. Svuotare solo quando è disabilitata per rimuovere l'associazione allo slot.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.name = Abilitato
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.enabled.description = Abilita o disabilita il processo di replica della sottoscrizione. La disabilitazione mantiene la sottoscrizione e lo slot remoto; i WAL conservati possono aumentare mentre la replica è arrestata.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.name = Formato binario
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.binary.description = Richiedi il trasferimento binario anziché testuale. I tipi di dati del pubblicatore e del sottoscrittore devono avere formati binari compatibili.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.name = Trasmissione in flusso
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.streaming.description = Trasmetti in flusso le modifiche delle transazioni grandi in corso. La modifica di questo valore seleziona la trasmissione ordinaria o la disabilita; un'impostazione parallela esistente viene mantenuta se il campo non viene modificato.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.name = Commit sincrono
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.synchronousCommit.description = Impostazione di durabilità del processo di applicazione della replica. La disattivazione migliora le prestazioni di applicazione; impostazioni più forti possono ridurre le prestazioni e attendere le repliche sincrone del sottoscrittore.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.twoPhaseState.name = Stato a due fasi
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.name = Connetti al pubblicatore
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.connect.description = Connetti durante la creazione. Se disabilitato, devono essere disabilitati anche Abilitata, Crea slot e Copia dati. Per completare la configurazione, creare o associare uno slot sul pubblicatore, abilitare la sottoscrizione e aggiornare le pubblicazioni.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.name = Crea slot
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.createSlot.description = Crea uno slot di replica remoto. Disabilitare se si usa uno slot esistente o si replica all'interno dello stesso cluster PostgreSQL.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.copyData.name = Copia dati
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreSubscription.copyData.description = Copia i dati esistenti del pubblicatore all'avvio della replica.
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.canBackward.name = Supporta scansioni inverse
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.canBackward.description = Il metodo di accesso supporta le scansioni inverse?
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.handler.name = Gestore
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.handler.description = OID della funzione gestore che fornisce informazioni sul metodo di accesso
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.type.name = Tipo
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.type.description = Attualmente sempre i per indicare un metodo di accesso agli indici; altri valori potranno essere ammessi in futuro
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.canMultiCol.name = Supporta più colonne
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.canMultiCol.description = Il metodo di accesso supporta gli indici multicolonna?
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.canOrder.name = Supporta ordinamento
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.canOrder.description = Il metodo di accesso supporta scansioni ordinate per il valore della colonna indicizzata?
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.canOrderByOp.name = Supporta ordinamento per operatore
meta.org.jkiss.dbeaver.ext.postgresql.model.PostgreAccessMethod.canOrderByOp.description = Il metodo di accesso supporta scansioni ordinate per il risultato di un operatore sulla colonna indicizzata?
