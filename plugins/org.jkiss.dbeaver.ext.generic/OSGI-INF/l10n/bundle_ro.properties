driver.odbc.deprecation.reason = <form><p><span font="header">Driverul ODBC vechi este învechit</span><br/><br/>A fost eliminat din <b>Community Edition 23.1</b>.<br/><br/><span font="header">De ce a fost eliminat</span><br/></p><li>Utilizatorii DBeaver au întâmpinat numeroase probleme legate de drivere vechi la utilizarea driverului ODBC învechit, iar echipa DBeaver nu le-a putut remedia.</li><li>Acest driver ODBC se bazează pe versiunea Java 7, care este depășită.</li><li>Nu funcționează pe Linux și macOS, iar acest lucru nu poate fi îmbunătățit.</li><p><br/><span font="header">Pașii următori</span><br/><br/>Puteți utiliza driverul ODBC creat de echipa DBeaver în versiunea PRO sau puteți descărca driverul ODBC vechi pe propriul risc.<br/><br/><a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">Aflați mai multe despre driverul ODBC vechi, învechit</a></p></form>
not.available.title = Driver indisponibil
not.available.description = Acest driver nu este disponibil și nu poate fi utilizat
driver.mongodb.reason = <form><p><span font="header">Driverul MongoDB nu este disponibil în versiunea Community</span><br/><br/>Vă puteți conecta la MongoDB folosind produsele DBeaver PRO: edițiile Lite, Enterprise, Ultimate și Team.<br/><br/>În versiunile PRO utilizăm un driver MongoDB avansat, creat de echipa DBeaver pentru compatibilitate și performanță optime. Acesta permite explorarea colecțiilor MongoDB în modul grilă de date și utilizarea reprezentării JSON cu evidențiere și formatare.<br/><br/><a href="https://dbeaver.com/download/">Încercați DBeaver PRO</a></p><br/><br/>Puteți utiliza un driver JDBC MongoDB de la terți pe propriul risc. DBeaver nu poate garanta că astfel de drivere vor funcționa corect cu MongoDB sau că vor asigura un nivel acceptabil de suport pentru funcționalitățile bazei de date.</form>
driver.cassandra.reason = <form><p><span font="header">Driverul Cassandra nu este disponibil în versiunea Community</span><br/><br/>Vă puteți conecta la Cassandra folosind produsele DBeaver PRO: edițiile Lite, Enterprise, Ultimate și Team.<br/><br/>Versiunile PRO oferă explorarea schemelor Cassandra, vizualizarea datelor și executarea interogărilor CQL.<br/><br/><a href="https://dbeaver.com/download/">Încercați DBeaver PRO</a></p><br/><br/>Puteți utiliza un driver Cassandra de la terți pe propriul risc.</form>
driver.salesforce.reason = <form><p><span font="header">Driverul Salesforce nu este disponibil în versiunea Community</span><br/><br/>Vă puteți conecta la Salesforce folosind produsele DBeaver PRO: edițiile Lite, Enterprise, Ultimate și Team.<br/><br/>În versiunile PRO utilizăm un driver Salesforce avansat, creat de echipa DBeaver pentru compatibilitate și performanță optime. Driverul este conceput pentru funcționalitățile actuale ale platformei Salesforce și se concentrează exclusiv pe citirea datelor. Acesta permite utilizarea SOQL pentru interogarea datelor Salesforce.<br/><br/><a href="https://dbeaver.com/download/">Descărcați versiunea PRO</a></p><br/><br/>Alternativ, puteți descărca un driver JDBC de la terți. Totuși, nu recomandăm utilizarea acestuia din cauza funcționalităților limitate.</form>
driver.couchbase.reason = <form><p><span font="header">Driverul Couchbase nu este disponibil în versiunea Community</span><br/><br/>Vă puteți conecta la Couchbase folosind produsele DBeaver PRO: edițiile Lite, Enterprise, Ultimate și Team.<br/><br/>Versiunile PRO permit vizualizarea și editarea datelor din compartimentele Couchbase în format tabelar, lucrul direct cu documente JSON și utilizarea N1QL.<br/><br/><a href="https://dbeaver.com/download/">Descărcați versiunea PRO</a></p><br/><br/>Alternativ, puteți descărca un driver JDBC de la terți. Totuși, nu recomandăm utilizarea acestuia din cauza funcționalităților limitate.</form>
driver.redis.reason = <form><p><span font="header">Driverul Redis nu este disponibil în versiunea Community</span><br/><br/>Vă puteți conecta la Redis folosind produsele DBeaver PRO: edițiile Lite, Enterprise, Ultimate și Team.<br/><br/>Versiunile PRO oferă explorarea cheilor Redis, vizualizarea perechilor cheie-valoare și un shell de comenzi. Puteți executa interogări folosind comenzi Redis sau scripturi LUA.<br/><br/><a href="https://dbeaver.com/download/">Descărcați versiunea PRO</a></p><br/><br/>Alternativ, puteți descărca un driver JDBC de la terți. Totuși, nu recomandăm utilizarea acestuia din cauza funcționalităților limitate.</form>
driver.timestream.reason = <form><p><span font="header">Driverul Timestream nu este disponibil în versiunea Community</span><br/><br/>Vă puteți conecta la Timestream folosind produsele DBeaver PRO: edițiile Lite, Enterprise, Ultimate și Team.<br/><br/>Versiunile PRO oferă vizualizarea seriilor temporale și permit explorarea schemelor, tabelelor și coloanelor Timestream, precum și exportul datelor.<br/><br/><a href="https://dbeaver.com/download/">Descărcați versiunea PRO</a></p><br/><br/>Alternativ, puteți descărca un driver JDBC de la terți. Totuși, nu recomandăm utilizarea acestuia din cauza funcționalităților limitate.</form>
driver.neo4j.reason = <form><p><span font="header">Driverul Neo4j nu este disponibil în versiunea Community</span><br/><br/>Conectați-vă la Neo4j folosind produsele DBeaver PRO: edițiile Lite, Enterprise, Ultimate și Team.<br/><br/>Versiunile PRO permit vizualizarea documentelor Neo4j și interogarea acestora în limbajul Cypher.<br/><br/><a href="https://dbeaver.com/download/">Descărcați versiunea PRO</a></p><br/><br/>Alternativ, puteți descărca un driver JDBC de la terți, însă nu îl recomandăm din cauza funcționalităților limitate.</form>
