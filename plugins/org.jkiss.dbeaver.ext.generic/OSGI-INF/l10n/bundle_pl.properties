driver.odbc.deprecation.reason = <form><p><span font="header">Starszy sterownik ODBC jest przestarzały</span><br/><br/>Został usunięty w wersji <b>Community Edition 23.1</b>.<br/><br/><span font="header">Dlaczego został usunięty</span><br/></p><li>Użytkownicy DBeaver napotykali wiele problemów z przestarzałym sterownikiem ODBC związanych ze starymi sterownikami, których zespół DBeaver nie mógł naprawić.</li><li>Ten sterownik ODBC jest oparty na przestarzałej wersji Java 7.</li><li>Nie działa w systemach Linux i macOS i nie da się tego poprawić.</li><p><br/><span font="header">Dalsze kroki</span><br/><br/>Możesz użyć sterownika ODBC opracowanego przez zespół DBeaver w wersji PRO lub pobrać stary sterownik ODBC na własne ryzyko.<br/><br/><a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">Więcej o przestarzałym starszym sterowniku ODBC</a></p></form>
not.available.title = Niedostępny sterownik
not.available.description = Ten sterownik jest niedostępny i nie można go używać
driver.mongodb.reason = <form><p><span font="header">Sterownik MongoDB jest niedostępny w wersji Community</span><br/><br/>Z MongoDB możesz łączyć się za pomocą produktów DBeaver PRO: Lite, Enterprise, Ultimate i Team Edition.<br/><br/>W wersjach PRO używamy zaawansowanego sterownika MongoDB opracowanego przez zespół DBeaver, który zapewnia najlepszą zgodność i wydajność. Pozwala przeglądać kolekcje MongoDB w siatce danych i korzystać z reprezentacji JSON z podświetlaniem i formatowaniem.<br/><br/><a href="https://dbeaver.com/download/">Wypróbuj DBeaver PRO</a></p><br/><br/>Możesz użyć zewnętrznego sterownika JDBC MongoDB na własne ryzyko. DBeaver nie gwarantuje, że takie sterowniki będą poprawnie działać z MongoDB ani zapewnią akceptowalny poziom obsługi funkcji bazy danych.</form>
driver.cassandra.reason = <form><p><span font="header">Sterownik Cassandra jest niedostępny w wersji Community</span><br/><br/>Z Cassandrą możesz łączyć się za pomocą produktów DBeaver PRO: Lite, Enterprise, Ultimate i Team Edition.<br/><br/>Wersje PRO obsługują przeglądarkę schematów Cassandra, przeglądarkę danych i wykonywanie zapytań CQL.<br/><br/><a href="https://dbeaver.com/download/">Wypróbuj DBeaver PRO</a></p><br/><br/>Możesz użyć zewnętrznego sterownika Cassandra na własne ryzyko.</form>
driver.salesforce.reason = <form><p><span font="header">Sterownik Salesforce jest niedostępny w wersji Community</span><br/><br/>Z Salesforce możesz łączyć się za pomocą produktów DBeaver PRO: Lite, Enterprise, Ultimate i Team Edition.<br/><br/>W wersjach PRO używamy zaawansowanego sterownika Salesforce opracowanego przez zespół DBeaver, który zapewnia najlepszą zgodność i wydajność. Sterownik uwzględnia bieżące możliwości platformy Salesforce i skupia się wyłącznie na odczycie danych. Pozwala odpytywać dane Salesforce za pomocą SOQL.<br/><br/><a href="https://dbeaver.com/download/">Pobierz wersję PRO</a></p><br/><br/>Możesz też pobrać zewnętrzny sterownik JDBC, ale nie zalecamy tego ze względu na ograniczoną funkcjonalność.</form>
driver.couchbase.reason = <form><p><span font="header">Sterownik Couchbase jest niedostępny w wersji Community</span><br/><br/>Z Couchbase możesz łączyć się za pomocą produktów DBeaver PRO: Lite, Enterprise, Ultimate i Team Edition.<br/><br/>Wersje PRO pozwalają przeglądać i edytować dane w zasobnikach Couchbase w formie tabeli, pracować bezpośrednio z dokumentami JSON i używać N1QL.<br/><br/><a href="https://dbeaver.com/download/">Pobierz wersję PRO</a></p><br/><br/>Możesz też pobrać zewnętrzny sterownik JDBC, ale nie zalecamy tego ze względu na ograniczoną funkcjonalność.</form>
driver.redis.reason = <form><p><span font="header">Sterownik Redis jest niedostępny w wersji Community</span><br/><br/>Z Redis możesz łączyć się za pomocą produktów DBeaver PRO: Lite, Enterprise, Ultimate i Team Edition.<br/><br/>Wersje PRO obsługują przeglądarkę kluczy Redis, przeglądarkę klucz-wartość i powłokę poleceń. Zapytania można wykonywać poleceniami Redis lub skryptami LUA.<br/><br/><a href="https://dbeaver.com/download/">Pobierz wersję PRO</a></p><br/><br/>Możesz też pobrać zewnętrzny sterownik JDBC, ale nie zalecamy tego ze względu na ograniczoną funkcjonalność.</form>
driver.timestream.reason = <form><p><span font="header">Sterownik Timestream jest niedostępny w wersji Community</span><br/><br/>Z Timestream możesz łączyć się za pomocą produktów DBeaver PRO: Lite, Enterprise, Ultimate i Team Edition.<br/><br/>Wersje PRO obsługują przeglądarkę danych szeregów czasowych i pozwalają przeglądać schematy, tabele i kolumny Timestream oraz eksportować dane.<br/><br/><a href="https://dbeaver.com/download/">Pobierz wersję PRO</a></p><br/><br/>Możesz też pobrać zewnętrzny sterownik JDBC, ale nie zalecamy tego ze względu na ograniczoną funkcjonalność.</form>
driver.neo4j.reason = <form><p><span font="header">Sterownik Neo4j jest niedostępny w wersji Community</span><br/><br/>Z Neo4j możesz łączyć się za pomocą produktów DBeaver PRO: Lite, Enterprise, Ultimate i Team Edition.<br/><br/>Wersje PRO pozwalają przeglądać dokumenty Neo4j i odpytywać je językiem Cypher.<br/><br/><a href="https://dbeaver.com/download/">Pobierz wersję PRO</a></p><br/><br/>Możesz też pobrać zewnętrzny sterownik JDBC, ale nie zalecamy tego ze względu na ograniczoną funkcjonalność.</form>
