driver.neo4j.reason = <form><p>\
<span font="header">Il driver Neo4j non è disponibile nella versione Community</span><br/><br/>\
È possibile connettersi a Neo4j con i prodotti DBeaver PRO: Lite, Enterprise, Ultimate e Team Edition.<br/><br/>\
Le versioni PRO consentono di visualizzare i documenti Neo4j e interrogarli con il linguaggio Cypher.<br/><br/>\
