driver.odbc.deprecation.reason = <form><p>\
<span font="header">Il vecchio driver ODBC è deprecato</span><br/><br/>\
È stato rimosso nella <b>Community Edition 23.1</b>.<br/><br/>\
<span font="header">Motivi della rimozione</span><br/></p>\
<li>Gli utenti di DBeaver riscontravano numerosi problemi con il vecchio driver ODBC, legati a driver obsoleti, che il team di DBeaver non poteva risolvere.</li>\
<li>Questo driver ODBC si basa sull'obsoleta versione 7 di Java.</li>\
<li>Non funziona su Linux e macOS e non è possibile rimediare.</li><p><br/>\
<span font="header">Passaggi successivi</span><br/><br/>\
È possibile usare il driver ODBC creato dal team di DBeaver nella versione PRO oppure scaricare il vecchio driver ODBC a proprio rischio.<br/><br/>\
<a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">Ulteriori informazioni sul vecchio driver ODBC deprecato</a></p></form>
not.available.title = Driver non disponibile
not.available.description = Questo driver non è disponibile e non può essere utilizzato
driver.mongodb.reason = <form><p>\
<span font="header">Il driver MongoDB non è disponibile nella versione Community</span><br/><br/>\
È possibile connettersi a MongoDB con i prodotti DBeaver PRO: Lite, Enterprise, Ultimate e Team Edition.<br/><br/>\
Nelle versioni PRO usiamo un driver MongoDB avanzato, creato dal team di DBeaver per offrire compatibilità e prestazioni ottimali. Consente di esplorare le collezioni MongoDB in una griglia di dati e di usare la rappresentazione JSON con evidenziazione e formattazione.<br/><br/>\
<a href="https://dbeaver.com/download/">Prova DBeaver PRO</a></p><br/><br/>\
È possibile usare un driver JDBC MongoDB di terze parti a proprio rischio. DBeaver non può garantire che tali driver funzionino correttamente con MongoDB o offrano un supporto adeguato alle funzionalità del database.</form>
driver.cassandra.reason = <form><p>\
<span font="header">Il driver Cassandra non è disponibile nella versione Community</span><br/><br/>\
È possibile connettersi a Cassandra con i prodotti DBeaver PRO: Lite, Enterprise, Ultimate e Team Edition.<br/><br/>\
Le versioni PRO supportano l'esplorazione degli schemi Cassandra, la visualizzazione dei dati e l'esecuzione di query CQL.<br/><br/>\
<a href="https://dbeaver.com/download/">Prova DBeaver PRO</a></p><br/><br/>\
È possibile usare un driver Cassandra di terze parti a proprio rischio.</form>
driver.salesforce.reason = <form><p>\
<span font="header">Il driver Salesforce non è disponibile nella versione Community</span><br/><br/>\
È possibile connettersi a Salesforce con i prodotti DBeaver PRO: Lite, Enterprise, Ultimate e Team Edition.<br/><br/>\
Nelle versioni PRO usiamo un driver Salesforce avanzato, creato dal team di DBeaver per offrire compatibilità e prestazioni ottimali. Il driver è progettato per le funzionalità attuali della piattaforma Salesforce ed è dedicato esclusivamente alla lettura dei dati. Consente di usare SOQL per interrogare i dati Salesforce.<br/><br/>\
<a href="https://dbeaver.com/download/">Scarica la versione PRO</a></p><br/><br/>\
In alternativa è possibile scaricare il driver JDBC di terze parti. Tuttavia ne sconsigliamo l'uso a causa delle funzionalità limitate.</form>
driver.couchbase.reason = <form><p>\
<span font="header">Il driver Couchbase non è disponibile nella versione Community</span><br/><br/>\
È possibile connettersi a Couchbase con i prodotti DBeaver PRO: Lite, Enterprise, Ultimate e Team Edition.<br/><br/>\
Le versioni PRO consentono di visualizzare e modificare i dati nei bucket Couchbase in formato tabellare, lavorare direttamente con documenti JSON e usare N1QL.<br/><br/>\
<a href="https://dbeaver.com/download/">Scarica la versione PRO</a></p><br/><br/>\
In alternativa è possibile scaricare il driver JDBC di terze parti. Tuttavia ne sconsigliamo l'uso a causa delle funzionalità limitate.</form>
driver.redis.reason = <form><p>\
<span font="header">Il driver Redis non è disponibile nella versione Community</span><br/><br/>\
È possibile connettersi a Redis con i prodotti DBeaver PRO: Lite, Enterprise, Ultimate e Team Edition.<br/><br/>\
Le versioni PRO supportano l'esplorazione delle chiavi Redis, la visualizzazione delle coppie chiave-valore e una shell di comandi. È possibile eseguire query tramite comandi Redis o script LUA.<br/><br/>\
<a href="https://dbeaver.com/download/">Scarica la versione PRO</a></p><br/><br/>\
In alternativa è possibile scaricare il driver JDBC di terze parti. Tuttavia ne sconsigliamo l'uso a causa delle funzionalità limitate.</form>
