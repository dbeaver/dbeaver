driver.mongodb.reason=<form><p><span font="header">Драйвер MongoDB недоступен в версии Community</span><br/><br/>Подключиться к MongoDB можно с помощью продуктов DBeaver PRO: Lite, Enterprise, Ultimate и Team Editions.<br/><br/>В версиях PRO используется расширенный драйвер MongoDB, созданный командой DBeaver для обеспечения наилучшей совместимости и производительности. Он позволяет просматривать коллекции MongoDB в табличном режиме и использовать представление JSON с подсветкой и форматированием.<br/><br/><a href="https://dbeaver.com/download/">Попробуйте DBeaver PRO</a></p><br/><br/>Можно использовать сторонний JDBC-драйвер MongoDB на свой риск. DBeaver не гарантирует корректную работу таких драйверов с MongoDB или приемлемый уровень поддержки возможностей базы данных.</form>
driver.cassandra.reason=<form><p><span font="header">Драйвер Cassandra недоступен в версии Community</span><br/><br/>Подключиться к Cassandra можно с помощью продуктов DBeaver PRO: Lite, Enterprise, Ultimate и Team Editions.<br/><br/>Версии PRO поддерживают просмотр схем и данных Cassandra, а также выполнение запросов CQL.<br/><br/><a href="https://dbeaver.com/download/">Попробуйте DBeaver PRO</a></p><br/><br/>Можно использовать сторонний драйвер Cassandra на свой риск.</form>
driver.salesforce.reason=<form><p><span font="header">Драйвер Salesforce недоступен в версии Community</span><br/><br/>Подключиться к Salesforce можно с помощью продуктов DBeaver PRO: Lite, Enterprise, Ultimate и Team Editions.<br/><br/>В версиях PRO используется расширенный драйвер Salesforce, созданный командой DBeaver для обеспечения наилучшей совместимости и производительности. Драйвер учитывает текущие возможности платформы Salesforce и предназначен исключительно для чтения данных. Он позволяет запрашивать данные Salesforce с помощью SOQL.<br/><br/><a href="https://dbeaver.com/download/">Загрузить версию PRO</a></p><br/><br/>Также можно загрузить сторонний JDBC-драйвер, однако мы не рекомендуем его из-за ограниченной функциональности.</form>
driver.couchbase.reason=<form><p><span font="header">Драйвер Couchbase недоступен в версии Community</span><br/><br/>Подключиться к Couchbase можно с помощью продуктов DBeaver PRO: Lite, Enterprise, Ultimate и Team Editions.<br/><br/>Версии PRO позволяют просматривать и изменять данные в бакетах Couchbase в табличном формате, работать непосредственно с документами JSON и использовать N1QL.<br/><br/><a href="https://dbeaver.com/download/">Загрузить версию PRO</a></p><br/><br/>Также можно загрузить сторонний JDBC-драйвер, однако мы не рекомендуем его из-за ограниченной функциональности.</form>
driver.redis.reason=<form><p><span font="header">Драйвер Redis недоступен в версии Community</span><br/><br/>Подключиться к Redis можно с помощью продуктов DBeaver PRO: Lite, Enterprise, Ultimate и Team Editions.<br/><br/>Версии PRO поддерживают просмотр ключей Redis, просмотр пар ключ-значение и командную оболочку. Можно выполнять запросы с помощью команд Redis или скриптов LUA.<br/><br/><a href="https://dbeaver.com/download/">Загрузить версию PRO</a></p><br/><br/>Также можно загрузить сторонний JDBC-драйвер, однако мы не рекомендуем его из-за ограниченной функциональности.</form>
driver.timestream.reason=<form><p><span font="header">Драйвер Timestream недоступен в версии Community</span><br/><br/>Подключиться к Timestream можно с помощью продуктов DBeaver PRO: Lite, Enterprise, Ultimate и Team Editions.<br/><br/>Версии PRO поддерживают просмотр временных рядов, схем, таблиц и столбцов Timestream, а также экспорт данных.<br/><br/><a href="https://dbeaver.com/download/">Загрузить версию PRO</a></p><br/><br/>Также можно загрузить сторонний JDBC-драйвер, однако мы не рекомендуем его из-за ограниченной функциональности.</form>
driver.neo4j.reason=<form><p><span font="header">Драйвер Neo4j недоступен в версии Community</span><br/><br/>Подключитесь к Neo4j с помощью продуктов DBeaver PRO: Lite, Enterprise, Ultimate и Team Editions.<br/><br/>Версии PRO позволяют просматривать документы Neo4j и запрашивать их с помощью языка Cypher.<br/><br/><a href="https://dbeaver.com/download/">Загрузить версию PRO</a></p><br/><br/>Также можно загрузить сторонний JDBC-драйвер, но мы не рекомендуем его из-за ограниченной функциональности.</form>
