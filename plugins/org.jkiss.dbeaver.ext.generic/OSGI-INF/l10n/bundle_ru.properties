driver.odbc.deprecation.reason=<form><p><span font="header">Старый драйвер ODBC устарел</span><br/><br/>Он удалён в <b>Community Edition 23.1</b>.<br/><br/><span font="header">Почему он удалён</span><br/></p><li>Пользователи DBeaver сталкивались со множеством проблем устаревшего драйвера ODBC, связанных со старыми драйверами. Команда DBeaver не могла исправить эти проблемы.</li><li>Этот драйвер ODBC основан на устаревшей Java версии 7.</li><li>Он не работает в Linux и macOS, и исправить это невозможно.</li><p><br/><span font="header">Дальнейшие действия</span><br/><br/>Можно использовать драйвер ODBC, созданный командой DBeaver, в версии PRO или загрузить старый драйвер ODBC на свой риск.<br/><br/><a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">Подробнее об устаревшем драйвере ODBC</a></p></form>
