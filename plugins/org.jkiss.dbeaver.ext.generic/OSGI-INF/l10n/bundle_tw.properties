在 PRO 版本中，我們使用由 DBeaver 團隊開發的進階 Salesforce 驅動程式，以提供最佳相容性與效能。此驅動程式以目前 Salesforce 平台的功能為設計核心，專注於提供資料讀取功能，讓您可以使用 SOQL 查詢 Salesforce 資料。<br/><br/>\
