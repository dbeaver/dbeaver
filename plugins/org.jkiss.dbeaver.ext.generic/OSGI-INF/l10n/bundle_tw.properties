driver.odbc.deprecation.reason     = <form><p>\
<span font="header">舊版 ODBC 驅動程式已棄用</span><br/><br/>\
此驅動程式已在 <b>Community Edition 23.1</b> 中移除。<br/><br/>\
<span font="header">移除原因</span><br/></p>\
<li>DBeaver 使用者在使用過時的 ODBC 驅動程式時遇到許多與舊版驅動程式有關的問題，且 DBeaver 團隊無法修正這些問題。</li>\
<li>此 ODBC 驅動程式以已過時的 Java 7 版本為基礎。</li>\
<li>此驅動程式無法在 Linux 和 macOS 上運作，且無法改善。</li><p><br/>\
<span font="header">後續步驟</span><br/><br/>\
您可以使用 DBeaver 團隊在 PRO 版本中開發的 ODBC 驅動程式，或自行承擔風險下載舊版 ODBC 驅動程式。<br/><br/>\
<a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">深入瞭解已棄用的舊版 ODBC 驅動程式</a></p></form>
