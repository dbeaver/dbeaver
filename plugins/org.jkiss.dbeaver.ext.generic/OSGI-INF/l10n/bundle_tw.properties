driver.odbc.deprecation.reason     = <form><p>\
<span font="header">舊版 ODBC 驅動程式已棄用</span><br/><br/>\
此驅動程式已於 <b>Community Edition 23.1</b> 中移除。<br/><br/>\
<span font="header">移除原因</span><br/></p>\
<li>DBeaver 使用者在使用過時的 ODBC 驅動程式時遭遇許多問題，且這些問題無法由 DBeaver 團隊修復。</li>\
<li>此 ODBC 驅動程式基於已過時的 Java 版本 7。</li>\
<li>它無法在 Linux 和 macOS 上運作，且無法改善此問題。</li><p><br/>\
<span font="header">後續步驟</span><br/><br/>\
您可以使用 DBeaver 團隊在 PRO 版本中建立的 ODBC 驅動程式，或自行承擔風險下載舊版 ODBC 驅動程式。<br/><br/>\
<a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">深入了解已棄用的舊版 ODBC 驅動程式</a></p></form>
not.available.title                = 無法使用的驅動程式
not.available.description          = 此驅動程式無法使用
driver.mongodb.reason              = <form><p>\
<span font="header">MongoDB 驅動程式在社群版中不可用</span><br/><br/>\
您可以使用 DBeaver PRO 產品連線到 MongoDB：Lite、Enterprise、Ultimate 及 Team 版本。<br/><br/>\
在 PRO 版本中，我們使用由 DBeaver 團隊開發的進階 MongoDB 驅動程式，以提供最佳相容性與效能。它讓您可以在資料格模式中瀏覽 MongoDB 集合，並使用帶有語法醒目顯示與格式化的 JSON 表示。<br/><br/>\
<a href="https://dbeaver.com/download/">試用 DBeaver PRO</a></p><br/><br/>\
您可以自行承擔風險使用第三方 MongoDB JDBC 驅動程式。DBeaver 無法保證此類驅動程式能與 MongoDB 正常運作，或為資料庫功能提供可接受程度的支援。</form>
driver.cassandra.reason              = <form><p>\
<span font="header">Cassandra 驅動程式在社群版中不可用</span><br/><br/>\
您可以使用 DBeaver PRO 產品連線到 Cassandra：Lite、Enterprise、Ultimate 及 Team 版本。<br/><br/>\
PRO 版本支援 Cassandra 結構描述瀏覽器、資料檢視器及 CQL 查詢執行。<br/><br/>\
<a href="https://dbeaver.com/download/">試用 DBeaver PRO</a></p><br/><br/>\
您可以自行承擔風險使用第三方 Cassandra 驅動程式。</form>
driver.dynamodb.reason               = <form><p>\
<span font="header">DynamoDB 驅動程式在社群版中不可用</span><br/><br/>\
您可以使用 DBeaver PRO 產品連線到 DynamoDB：Enterprise、Ultimate 及 Team 版本。<br/><br/>\
在 PRO 版本中，您可以在資料表模式下檢視資料、以 JSON 格式編輯，並執行 JSON 和 SQL 查詢。<br/><br/>\
