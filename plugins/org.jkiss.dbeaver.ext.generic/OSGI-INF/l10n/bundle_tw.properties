driver.mongodb.reason = <form><p><span font="header">Community 版本不提供 MongoDB 驅動程式</span><br/><br/>您可使用 DBeaver PRO 產品的 Lite、Enterprise、Ultimate 及 Team 版本連線至 MongoDB。<br/><br/>PRO 版本使用 DBeaver 團隊開發的進階 MongoDB 驅動程式，提供最佳相容性及效能。您可在資料格線模式中瀏覽 MongoDB 集合，並使用支援醒目提示及格式化的 JSON 表示方式。<br/><br/><a href="https://dbeaver.com/download/">試用 DBeaver PRO</a></p><br/><br/>您可自行承擔風險使用第三方 MongoDB JDBC 驅動程式。DBeaver 無法保證這類驅動程式能與 MongoDB 正常運作，或對資料庫功能提供可接受的支援程度。</form>
driver.cassandra.reason = <form><p><span font="header">Community 版本不提供 Cassandra 驅動程式</span><br/><br/>您可使用 DBeaver PRO 產品的 Lite、Enterprise、Ultimate 及 Team 版本連線至 Cassandra。<br/><br/>PRO 版本支援 Cassandra 結構描述瀏覽器、資料檢視器及 CQL 查詢執行。<br/><br/><a href="https://dbeaver.com/download/">試用 DBeaver PRO</a></p><br/><br/>您可自行承擔風險使用第三方 Cassandra 驅動程式。</form>
driver.salesforce.reason = <form><p><span font="header">Community 版本不提供 Salesforce 驅動程式</span><br/><br/>您可使用 DBeaver PRO 產品的 Lite、Enterprise、Ultimate 及 Team 版本連線至 Salesforce。<br/><br/>PRO 版本使用 DBeaver 團隊開發的進階 Salesforce 驅動程式，提供最佳相容性及效能。此驅動程式依 Salesforce 平台目前的功能設計，專注於提供資料讀取功能。您可使用 SOQL 查詢 Salesforce 資料。<br/><br/><a href="https://dbeaver.com/download/">下載 PRO 版本</a></p><br/><br/>您也可以下載第三方 JDBC 驅動程式。不過，由於功能受限，我們不建議使用。</form>
driver.couchbase.reason = <form><p><span font="header">Community 版本不提供 Couchbase 驅動程式</span><br/><br/>您可使用 DBeaver PRO 產品的 Lite、Enterprise、Ultimate 及 Team 版本連線至 Couchbase。<br/><br/>PRO 版本讓您以表格格式檢視及編輯 Couchbase 儲存貯體中的資料、直接操作 JSON 文件，並使用 N1QL。<br/><br/><a href="https://dbeaver.com/download/">下載 PRO 版本</a></p><br/><br/>您也可以下載第三方 JDBC 驅動程式。不過，由於功能受限，我們不建議使用。</form>
driver.redis.reason = <form><p><span font="header">Community 版本不提供 Redis 驅動程式</span><br/><br/>您可使用 DBeaver PRO 產品的 Lite、Enterprise、Ultimate 及 Team 版本連線至 Redis。<br/><br/>PRO 版本支援 Redis 索引鍵瀏覽器、索引鍵值檢視器及命令 Shell。您可使用 Redis 命令或 LUA 指令碼執行查詢。<br/><br/><a href="https://dbeaver.com/download/">下載 PRO 版本</a></p><br/><br/>您也可以下載第三方 JDBC 驅動程式。不過，由於功能受限，我們不建議使用。</form>
driver.timestream.reason = <form><p><span font="header">Community 版本不提供 Timestream 驅動程式</span><br/><br/>您可使用 DBeaver PRO 產品的 Lite、Enterprise、Ultimate 及 Team 版本連線至 Timestream。<br/><br/>PRO 版本支援時間序列資料檢視器，讓您檢視 Timestream 結構描述、資料表、欄位，並匯出資料。<br/><br/><a href="https://dbeaver.com/download/">下載 PRO 版本</a></p><br/><br/>您也可以下載第三方 JDBC 驅動程式。不過，由於功能受限，我們不建議使用。</form>
driver.neo4j.reason = <form><p><span font="header">Community 版本不提供 Neo4j 驅動程式</span><br/><br/>您可使用 DBeaver PRO 產品的 Lite、Enterprise、Ultimate 及 Team 版本連線至 Neo4j。<br/><br/>PRO 版本讓您檢視 Neo4j 文件，並使用 Cypher 查詢語言查詢。<br/><br/><a href="https://dbeaver.com/download/">下載 PRO 版本</a></p><br/><br/>您也可以下載第三方 JDBC 驅動程式，但由於功能有限，我們不建議使用。</form>
