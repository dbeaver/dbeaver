driver.odbc.deprecation.reason = <form><p><span font="header">기존 ODBC 드라이버의 지원이 중단되었습니다</span><br/><br/><b>Community Edition 23.1</b>에서 제거되었습니다.<br/><br/><span font="header">제거된 이유</span><br/></p><li>오래된 ODBC 드라이버를 사용하면서 여러 문제가 발생했으며 DBeaver 팀에서 해결할 수 없었습니다.</li><li>이 ODBC 드라이버는 오래된 Java 버전 7을 기반으로 합니다.</li><li>Linux 및 macOS에서 작동하지 않으며 개선할 수 없습니다.</li><p><br/><span font="header">다음 단계</span><br/><br/>PRO 버전에서 DBeaver 팀이 만든 ODBC 드라이버를 사용하거나, 위험을 감수하고 기존 ODBC 드라이버를 다운로드할 수 있습니다.<br/><br/><a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">지원이 중단된 기존 ODBC 드라이버에 대해 자세히 알아보기</a></p></form>
not.available.title = 사용할 수 없는 드라이버
not.available.description = 이 드라이버는 제공되지 않아 사용할 수 없습니다
driver.mongodb.reason = <form><p><span font="header">Community 버전에서는 MongoDB 드라이버를 제공하지 않습니다</span><br/><br/>DBeaver PRO 제품인 Lite, Enterprise, Ultimate 및 Team Edition을 사용하여 MongoDB에 연결할 수 있습니다.<br/><br/>PRO 버전에서는 최상의 호환성과 성능을 제공하기 위해 DBeaver 팀이 개발한 고급 MongoDB 드라이버를 사용합니다. 데이터 그리드 모드에서 MongoDB 컬렉션을 탐색하고 강조 표시와 서식 지정을 지원하는 JSON 표현을 사용할 수 있습니다.<br/><br/><a href="https://dbeaver.com/download/">DBeaver PRO 사용해 보기</a></p><br/><br/>위험을 감수하고 타사 MongoDB JDBC 드라이버를 사용할 수 있습니다. DBeaver는 이러한 드라이버가 MongoDB에서 올바르게 작동하거나 데이터베이스 기능을 충분히 지원한다고 보장할 수 없습니다.</form>
driver.cassandra.reason = <form><p><span font="header">Community 버전에서는 Cassandra 드라이버를 제공하지 않습니다</span><br/><br/>DBeaver PRO 제품인 Lite, Enterprise, Ultimate 및 Team Edition을 사용하여 Cassandra에 연결할 수 있습니다.<br/><br/>PRO 버전은 Cassandra 스키마 탐색기, 데이터 뷰어 및 CQL 쿼리 실행을 지원합니다.<br/><br/><a href="https://dbeaver.com/download/">DBeaver PRO 사용해 보기</a></p><br/><br/>위험을 감수하고 타사 Cassandra 드라이버를 사용할 수 있습니다.</form>
driver.salesforce.reason = <form><p><span font="header">Community 버전에서는 Salesforce 드라이버를 제공하지 않습니다</span><br/><br/>DBeaver PRO 제품인 Lite, Enterprise, Ultimate 및 Team Edition을 사용하여 Salesforce에 연결할 수 있습니다.<br/><br/>PRO 버전에서는 최상의 호환성과 성능을 제공하기 위해 DBeaver 팀이 개발한 고급 Salesforce 드라이버를 사용합니다. 이 드라이버는 Salesforce 플랫폼의 현재 기능을 고려하여 데이터 읽기 기능에만 초점을 맞추어 설계되었습니다. SOQL을 사용하여 Salesforce 데이터를 조회할 수 있습니다.<br/><br/><a href="https://dbeaver.com/download/">PRO 버전 다운로드</a></p><br/><br/>타사 JDBC 드라이버를 다운로드할 수도 있습니다. 하지만 기능이 제한되어 있어 권장하지 않습니다.</form>
driver.couchbase.reason = <form><p><span font="header">Community 버전에서는 Couchbase 드라이버를 제공하지 않습니다</span><br/><br/>DBeaver PRO 제품인 Lite, Enterprise, Ultimate 및 Team Edition을 사용하여 Couchbase에 연결할 수 있습니다.<br/><br/>PRO 버전에서는 Couchbase 버킷의 데이터를 테이블 형식으로 조회하고 편집할 수 있으며, JSON 문서를 직접 다루고 N1QL을 사용할 수 있습니다.<br/><br/><a href="https://dbeaver.com/download/">PRO 버전 다운로드</a></p><br/><br/>타사 JDBC 드라이버를 다운로드할 수도 있습니다. 하지만 기능이 제한되어 있어 권장하지 않습니다.</form>
driver.redis.reason = <form><p><span font="header">Community 버전에서는 Redis 드라이버를 제공하지 않습니다</span><br/><br/>DBeaver PRO 제품인 Lite, Enterprise, Ultimate 및 Team Edition을 사용하여 Redis에 연결할 수 있습니다.<br/><br/>PRO 버전은 Redis 키 탐색기, 키-값 뷰어 및 명령 셸을 지원합니다. Redis 명령 또는 LUA 스크립트로 쿼리를 실행할 수 있습니다.<br/><br/><a href="https://dbeaver.com/download/">PRO 버전 다운로드</a></p><br/><br/>타사 JDBC 드라이버를 다운로드할 수도 있습니다. 하지만 기능이 제한되어 있어 권장하지 않습니다.</form>
driver.timestream.reason = <form><p><span font="header">Community 버전에서는 Timestream 드라이버를 제공하지 않습니다</span><br/><br/>DBeaver PRO 제품인 Lite, Enterprise, Ultimate 및 Team Edition을 사용하여 Timestream에 연결할 수 있습니다.<br/><br/>PRO 버전은 시계열 데이터 뷰어를 지원하며 Timestream 스키마, 테이블, 열을 조회하고 데이터를 내보낼 수 있습니다.<br/><br/><a href="https://dbeaver.com/download/">PRO 버전 다운로드</a></p><br/><br/>타사 JDBC 드라이버를 다운로드할 수도 있습니다. 하지만 기능이 제한되어 있어 권장하지 않습니다.</form>
driver.neo4j.reason = <form><p><span font="header">Community 버전에서는 Neo4j 드라이버를 제공하지 않습니다</span><br/><br/>DBeaver PRO 제품인 Lite, Enterprise, Ultimate 및 Team Edition을 사용하여 Neo4j에 연결할 수 있습니다.<br/><br/>PRO 버전에서는 Neo4j 문서를 조회하고 Cypher 쿼리 언어로 질의할 수 있습니다.<br/><br/><a href="https://dbeaver.com/download/">PRO 버전 다운로드</a></p><br/><br/>타사 JDBC 드라이버를 다운로드할 수도 있지만 기능이 제한되어 있어 권장하지 않습니다.</form>
