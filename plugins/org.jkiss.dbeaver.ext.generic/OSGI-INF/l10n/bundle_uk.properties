driver.mongodb.reason = <form><p><span font="header">Драйвер MongoDB недоступний у версії Community</span><br/><br/>Ви можете підключитися до MongoDB за допомогою продуктів DBeaver PRO: Lite, Enterprise, Ultimate і Team Editions.<br/><br/>У версіях PRO ми використовуємо вдосконалений драйвер MongoDB, створений командою DBeaver для найкращої сумісності та продуктивності. Він дає змогу переглядати колекції MongoDB у табличному режимі та використовувати подання JSON із підсвічуванням і форматуванням.<br/><br/><a href="https://dbeaver.com/download/">Спробувати DBeaver PRO</a></p><br/><br/>Ви можете використовувати сторонній драйвер JDBC MongoDB на власний ризик. DBeaver не може гарантувати належну роботу таких драйверів із MongoDB або прийнятний рівень підтримки функцій бази даних.</form>
driver.cassandra.reason = <form><p><span font="header">Драйвер Cassandra недоступний у версії Community</span><br/><br/>Ви можете підключитися до Cassandra за допомогою продуктів DBeaver PRO: Lite, Enterprise, Ultimate і Team Editions.<br/><br/>Версії PRO підтримують перегляд схем Cassandra, перегляд даних і виконання запитів CQL.<br/><br/><a href="https://dbeaver.com/download/">Спробувати DBeaver PRO</a></p><br/><br/>Ви можете використовувати сторонній драйвер Cassandra на власний ризик.</form>
driver.salesforce.reason = <form><p><span font="header">Драйвер Salesforce недоступний у версії Community</span><br/><br/>Ви можете підключитися до Salesforce за допомогою продуктів DBeaver PRO: Lite, Enterprise, Ultimate і Team Editions.<br/><br/>У версіях PRO ми використовуємо вдосконалений драйвер Salesforce, створений командою DBeaver для найкращої сумісності та продуктивності. Драйвер розроблено з урахуванням поточних можливостей платформи Salesforce та призначено виключно для читання даних. Він дає змогу використовувати SOQL для запитів до даних Salesforce.<br/><br/><a href="https://dbeaver.com/download/">Завантажити версію PRO</a></p><br/><br/>Також можна завантажити сторонній драйвер JDBC. Проте ми не рекомендуємо його використовувати через обмежені можливості.</form>
driver.couchbase.reason = <form><p><span font="header">Драйвер Couchbase недоступний у версії Community</span><br/><br/>Ви можете підключитися до Couchbase за допомогою продуктів DBeaver PRO: Lite, Enterprise, Ultimate і Team Editions.<br/><br/>Версії PRO дають змогу переглядати й редагувати дані в кошиках Couchbase у табличному форматі, працювати безпосередньо з документами JSON і використовувати N1QL.<br/><br/><a href="https://dbeaver.com/download/">Завантажити версію PRO</a></p><br/><br/>Також можна завантажити сторонній драйвер JDBC. Проте ми не рекомендуємо його використовувати через обмежені можливості.</form>
driver.redis.reason = <form><p><span font="header">Драйвер Redis недоступний у версії Community</span><br/><br/>Ви можете підключитися до Redis за допомогою продуктів DBeaver PRO: Lite, Enterprise, Ultimate і Team Editions.<br/><br/>Версії PRO підтримують перегляд ключів Redis, перегляд пар ключ-значення та командну оболонку. Ви можете виконувати запити за допомогою команд Redis або скриптів LUA.<br/><br/><a href="https://dbeaver.com/download/">Завантажити версію PRO</a></p><br/><br/>Також можна завантажити сторонній драйвер JDBC. Проте ми не рекомендуємо його використовувати через обмежені можливості.</form>
driver.timestream.reason = <form><p><span font="header">Драйвер Timestream недоступний у версії Community</span><br/><br/>Ви можете підключитися до Timestream за допомогою продуктів DBeaver PRO: Lite, Enterprise, Ultimate і Team Editions.<br/><br/>Версії PRO підтримують перегляд даних часових рядів і дають змогу переглядати схеми, таблиці та стовпці Timestream, а також експортувати дані.<br/><br/><a href="https://dbeaver.com/download/">Завантажити версію PRO</a></p><br/><br/>Також можна завантажити сторонній драйвер JDBC. Проте ми не рекомендуємо його використовувати через обмежені можливості.</form>
driver.neo4j.reason = <form><p><span font="header">Драйвер Neo4j недоступний у версії Community</span><br/><br/>Підключайтеся до Neo4j за допомогою продуктів DBeaver PRO: Lite, Enterprise, Ultimate і Team Editions.<br/><br/>Версії PRO дають змогу переглядати документи Neo4j і виконувати запити до них мовою Cypher.<br/><br/><a href="https://dbeaver.com/download/">Завантажити версію PRO</a></p><br/><br/>Також можна завантажити сторонній драйвер JDBC, проте ми не рекомендуємо його через обмежені можливості.</form>
