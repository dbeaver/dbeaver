driver.mongodb.reason = <form><p>\
<span font="header">برنامج تشغيل MongoDB غير متاح في إصدار Community</span><br/><br/>\
يمكنك الاتصال بـ MongoDB باستخدام منتجات DBeaver PRO: إصدارات Lite وEnterprise وUltimate وTeam.<br/><br/>\
نستخدم في إصدارات PRO برنامج تشغيل MongoDB متقدمًا أنشأه فريق DBeaver لتوفير أفضل توافق وأداء. يتيح لك تصفح مجموعات MongoDB في وضع شبكة البيانات واستخدام تمثيل JSON مع التمييز والتنسيق.<br/><br/>\
<a href="https://dbeaver.com/download/">جرّب DBeaver PRO</a></p><br/><br/>\
يمكنك استخدام برنامج تشغيل JDBC لـ MongoDB من جهة خارجية على مسؤوليتك الخاصة. لا يضمن DBeaver عمل هذه البرامج بشكل صحيح مع MongoDB أو توفير مستوى مقبول من الدعم لوظائف قاعدة البيانات.</form>
