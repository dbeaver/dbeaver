driver.odbc.deprecation.reason = <form><p>\
<span font="header">برنامج تشغيل ODBC القديم متقادم</span><br/><br/>\
أُزيل في <b>Community Edition 23.1</b>.<br/><br/>\
<span font="header">سبب الإزالة</span><br/></p>\
<li>واجه مستخدمو DBeaver مشكلات عديدة مع برنامج تشغيل ODBC المتقادم بسبب برامج التشغيل القديمة، ولم يتمكن فريق DBeaver من إصلاحها.</li>\
<li>يعتمد برنامج تشغيل ODBC هذا على الإصدار المتقادم Java 7.</li>\
<li>لا يعمل على Linux وmacOS، ولا يمكن تحسين ذلك.</li><p><br/>\
<span font="header">الخطوات التالية</span><br/><br/>\
يمكنك استخدام برنامج تشغيل ODBC الذي أنشأه فريق DBeaver في إصدار PRO، أو تنزيل برنامج تشغيل ODBC القديم على مسؤوليتك الخاصة.<br/><br/>\
<a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">معرفة المزيد عن برنامج تشغيل ODBC القديم المتقادم</a></p></form>
