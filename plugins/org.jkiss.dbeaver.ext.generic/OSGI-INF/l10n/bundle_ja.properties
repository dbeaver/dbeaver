driver.odbc.deprecation.reason = <form><p><span font="header">従来のODBCドライバーは廃止されました</span><br/><br/><b>Community Edition 23.1</b>で削除されました。<br/><br/><span font="header">削除の理由</span><br/></p><li>従来のODBCドライバーでは、古いドライバーに起因する問題が多数発生しており、DBeaverチームでは解決できませんでした。</li><li>このODBCドライバーは、サポートが終了したJava 7を基盤としています。</li><li>LinuxとmacOSでは動作せず、改善もできません。</li><p><br/><span font="header">今後の対応</span><br/><br/>PRO版ではDBeaverチームが開発したODBCドライバーを使用できます。または、自己責任で古いODBCドライバーをダウンロードできます。<br/><br/><a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">廃止された従来のODBCドライバーの詳細</a></p></form>
not.available.title = 利用できないドライバー
not.available.description = このドライバーは利用できず、使用できません。
driver.mongodb.reason = <form><p><span font="header">Community版ではMongoDBドライバーを利用できません</span><br/><br/>DBeaver PRO製品（Lite、Enterprise、Ultimate、Team Edition）を使用するとMongoDBに接続できます。<br/><br/>PRO版では、最適な互換性と性能を提供するため、DBeaverチームが開発した高機能なMongoDBドライバーを使用しています。MongoDBのコレクションをデータグリッド形式で参照し、強調表示や書式設定に対応したJSON表示を利用できます。<br/><br/><a href="https://dbeaver.com/download/">DBeaver PROを試す</a></p><br/><br/>サードパーティー製のMongoDB JDBCドライバーを自己責任で使用することもできます。ただし、そのようなドライバーがMongoDBで正常に動作することや、データベース機能に十分対応することをDBeaverは保証できません。</form>
driver.cassandra.reason = <form><p><span font="header">Community版ではCassandraドライバーを利用できません</span><br/><br/>DBeaver PRO製品（Lite、Enterprise、Ultimate、Team Edition）を使用するとCassandraに接続できます。<br/><br/>PRO版はCassandraのスキーマブラウザー、データビューアー、CQLクエリの実行に対応しています。<br/><br/><a href="https://dbeaver.com/download/">DBeaver PROを試す</a></p><br/><br/>サードパーティー製のCassandraドライバーを自己責任で使用することもできます。</form>
driver.salesforce.reason = <form><p><span font="header">Community版ではSalesforceドライバーを利用できません</span><br/><br/>DBeaver PRO製品（Lite、Enterprise、Ultimate、Team Edition）を使用するとSalesforceに接続できます。<br/><br/>PRO版では、最適な互換性と性能を提供するため、DBeaverチームが開発した高機能なSalesforceドライバーを使用しています。このドライバーはSalesforceプラットフォームの現在の機能を考慮して設計されており、データの読み取り専用です。SOQLを使用してSalesforceデータを照会できます。<br/><br/><a href="https://dbeaver.com/download/">PRO版をダウンロード</a></p><br/><br/>サードパーティー製のJDBCドライバーをダウンロードすることもできますが、機能が制限されるため推奨しません。</form>
driver.couchbase.reason = <form><p><span font="header">Community版ではCouchbaseドライバーを利用できません</span><br/><br/>DBeaver PRO製品（Lite、Enterprise、Ultimate、Team Edition）を使用するとCouchbaseに接続できます。<br/><br/>PRO版では、Couchbaseバケット内のデータをテーブル形式で表示、編集し、JSONドキュメントを直接操作したり、N1QLを使用したりできます。<br/><br/><a href="https://dbeaver.com/download/">PRO版をダウンロード</a></p><br/><br/>サードパーティー製のJDBCドライバーをダウンロードすることもできますが、機能が制限されるため推奨しません。</form>
driver.redis.reason = <form><p><span font="header">Community版ではRedisドライバーを利用できません</span><br/><br/>DBeaver PRO製品（Lite、Enterprise、Ultimate、Team Edition）を使用するとRedisに接続できます。<br/><br/>PRO版はRedisのキーブラウザー、キーと値のビューアー、コマンドシェルに対応しています。RedisコマンドやLUAスクリプトでクエリを実行できます。<br/><br/><a href="https://dbeaver.com/download/">PRO版をダウンロード</a></p><br/><br/>サードパーティー製のJDBCドライバーをダウンロードすることもできますが、機能が制限されるため推奨しません。</form>
driver.timestream.reason = <form><p><span font="header">Community版ではTimestreamドライバーを利用できません</span><br/><br/>DBeaver PRO製品（Lite、Enterprise、Ultimate、Team Edition）を使用するとTimestreamに接続できます。<br/><br/>PRO版は時系列データビューアーに対応しており、Timestreamのスキーマ、テーブル、列の表示やデータのエクスポートができます。<br/><br/><a href="https://dbeaver.com/download/">PRO版をダウンロード</a></p><br/><br/>サードパーティー製のJDBCドライバーをダウンロードすることもできますが、機能が制限されるため推奨しません。</form>
driver.neo4j.reason = <form><p><span font="header">Community版ではNeo4jドライバーを利用できません</span><br/><br/>DBeaver PRO製品（Lite、Enterprise、Ultimate、Team Edition）を使用してNeo4jに接続できます。<br/><br/>PRO版ではNeo4jドキュメントを表示し、Cypherクエリ言語で照会できます。<br/><br/><a href="https://dbeaver.com/download/">PRO版をダウンロード</a></p><br/><br/>サードパーティー製のJDBCドライバーをダウンロードすることもできますが、機能が制限されるため推奨しません。</form>
