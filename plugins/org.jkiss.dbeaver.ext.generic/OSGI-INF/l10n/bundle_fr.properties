driver.odbc.deprecation.reason = <form><p><span font="header">L'ancien pilote ODBC est obsolète</span><br/><br/>Il a été supprimé dans <b>Community Edition 23.1</b>.<br/><br/><span font="header">Raisons de sa suppression</span><br/></p><li>Les utilisateurs de DBeaver rencontraient de nombreux problèmes liés aux anciens pilotes avec ce pilote ODBC dépassé, que l'équipe DBeaver ne pouvait pas corriger.</li><li>Ce pilote ODBC repose sur la version obsolète Java 7.</li><li>Il ne fonctionne pas sous Linux et macOS, sans possibilité d'amélioration.</li><p><br/><span font="header">Étapes suivantes</span><br/><br/>Vous pouvez utiliser le pilote ODBC créé par l'équipe DBeaver dans la version PRO ou télécharger l'ancien pilote ODBC à vos risques et périls.<br/><br/><a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">En savoir plus sur l'ancien pilote ODBC obsolète</a></p></form>
not.available.title = Pilote indisponible
not.available.description = Ce pilote est indisponible et ne peut pas être utilisé
driver.mongodb.reason = <form><p><span font="header">Le pilote MongoDB n'est pas disponible dans la version Community</span><br/><br/>Vous pouvez vous connecter à MongoDB avec les produits DBeaver PRO : Lite, Enterprise, Ultimate et Team Editions.<br/><br/>Dans les versions PRO, nous utilisons un pilote MongoDB avancé créé par l'équipe DBeaver pour offrir une compatibilité et des performances optimales. Il permet de parcourir les collections MongoDB dans une grille de données et d'utiliser une représentation JSON avec coloration et mise en forme.<br/><br/><a href="https://dbeaver.com/download/">Essayer DBeaver PRO</a></p><br/><br/>Vous pouvez utiliser un pilote JDBC MongoDB tiers à vos risques et périls. DBeaver ne peut garantir que ces pilotes fonctionnent correctement avec MongoDB ni qu'ils assurent une prise en charge acceptable des fonctionnalités de la base de données.</form>
driver.cassandra.reason = <form><p><span font="header">Le pilote Cassandra n'est pas disponible dans la version Community</span><br/><br/>Vous pouvez vous connecter à Cassandra avec les produits DBeaver PRO : Lite, Enterprise, Ultimate et Team Editions.<br/><br/>Les versions PRO prennent en charge l'exploration des schémas Cassandra, la visualisation des données et l'exécution de requêtes CQL.<br/><br/><a href="https://dbeaver.com/download/">Essayer DBeaver PRO</a></p><br/><br/>Vous pouvez utiliser un pilote Cassandra tiers à vos risques et périls.</form>
driver.salesforce.reason = <form><p><span font="header">Le pilote Salesforce n'est pas disponible dans la version Community</span><br/><br/>Vous pouvez vous connecter à Salesforce avec les produits DBeaver PRO : Lite, Enterprise, Ultimate et Team Editions.<br/><br/>Dans les versions PRO, nous utilisons un pilote Salesforce avancé créé par l'équipe DBeaver pour offrir une compatibilité et des performances optimales. Ce pilote est conçu pour les fonctionnalités actuelles de la plateforme Salesforce et fournit uniquement un accès en lecture aux données. Il permet d'interroger les données Salesforce avec SOQL.<br/><br/><a href="https://dbeaver.com/download/">Télécharger la version PRO</a></p><br/><br/>Vous pouvez également télécharger le pilote JDBC tiers. Toutefois, nous déconseillons son utilisation en raison de ses fonctionnalités limitées.</form>
driver.couchbase.reason = <form><p><span font="header">Le pilote Couchbase n'est pas disponible dans la version Community</span><br/><br/>Vous pouvez vous connecter à Couchbase avec les produits DBeaver PRO : Lite, Enterprise, Ultimate et Team Editions.<br/><br/>Les versions PRO permettent d'afficher et de modifier les données des compartiments Couchbase sous forme de tableau, de travailler directement sur les documents JSON et d'utiliser N1QL.<br/><br/><a href="https://dbeaver.com/download/">Télécharger la version PRO</a></p><br/><br/>Vous pouvez également télécharger le pilote JDBC tiers. Toutefois, nous déconseillons son utilisation en raison de ses fonctionnalités limitées.</form>
driver.redis.reason = <form><p><span font="header">Le pilote Redis n'est pas disponible dans la version Community</span><br/><br/>Vous pouvez vous connecter à Redis avec les produits DBeaver PRO : Lite, Enterprise, Ultimate et Team Editions.<br/><br/>Les versions PRO prennent en charge l'exploration des clés Redis, la visualisation des paires clé-valeur et un interpréteur de commandes. Vous pouvez exécuter des requêtes avec des commandes Redis ou des scripts LUA.<br/><br/><a href="https://dbeaver.com/download/">Télécharger la version PRO</a></p><br/><br/>Vous pouvez également télécharger le pilote JDBC tiers. Toutefois, nous déconseillons son utilisation en raison de ses fonctionnalités limitées.</form>
driver.timestream.reason = <form><p><span font="header">Le pilote Timestream n'est pas disponible dans la version Community</span><br/><br/>Vous pouvez vous connecter à Timestream avec les produits DBeaver PRO : Lite, Enterprise, Ultimate et Team Editions.<br/><br/>Les versions PRO prennent en charge la visualisation des séries temporelles et permettent de consulter les schémas, tables et colonnes Timestream, ainsi que d'exporter les données.<br/><br/><a href="https://dbeaver.com/download/">Télécharger la version PRO</a></p><br/><br/>Vous pouvez également télécharger le pilote JDBC tiers. Toutefois, nous déconseillons son utilisation en raison de ses fonctionnalités limitées.</form>
driver.neo4j.reason = <form><p><span font="header">Le pilote Neo4j n'est pas disponible dans la version Community</span><br/><br/>Connectez-vous à Neo4j avec les produits DBeaver PRO : Lite, Enterprise, Ultimate et Team Editions.<br/><br/>Les versions PRO permettent de consulter les documents Neo4j et de les interroger avec le langage Cypher.<br/><br/><a href="https://dbeaver.com/download/">Télécharger la version PRO</a></p><br/><br/>Vous pouvez également télécharger un pilote JDBC tiers, mais nous le déconseillons en raison de ses fonctionnalités limitées.</form>
