driver.odbc.deprecation.reason = <form><p><span font="header">Der bisherige ODBC-Treiber ist veraltet</span><br/><br/>Er wurde in der <b>Community Edition 23.1</b> entfernt.<br/><br/><span font="header">Gründe für die Entfernung</span><br/></p><li>Bei der Verwendung des veralteten ODBC-Treibers mit alten Treibern traten zahlreiche Probleme auf, die das DBeaver-Team nicht beheben konnte.</li><li>Dieser ODBC-Treiber basiert auf der veralteten Java-Version 7.</li><li>Er funktioniert nicht unter Linux und macOS. Dies lässt sich nicht verbessern.</li><p><br/><span font="header">Weitere Schritte</span><br/><br/>Sie können den vom DBeaver-Team entwickelten ODBC-Treiber in der PRO-Version verwenden oder den alten ODBC-Treiber auf eigenes Risiko herunterladen.<br/><br/><a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">Mehr über den veralteten ODBC-Treiber erfahren</a></p></form>
not.available.title = Nicht verfügbarer Treiber
not.available.description = Dieser Treiber ist nicht verfügbar und kann nicht verwendet werden
driver.mongodb.reason = <form><p><span font="header">Der MongoDB-Treiber ist in der Community-Version nicht verfügbar</span><br/><br/>Sie können sich mit den DBeaver-PRO-Produkten Lite, Enterprise, Ultimate und Team Editions mit MongoDB verbinden.<br/><br/>In den PRO-Versionen verwenden wir einen vom DBeaver-Team entwickelten erweiterten MongoDB-Treiber für bestmögliche Kompatibilität und Leistung. Er ermöglicht das Durchsuchen von MongoDB-Sammlungen im Datenraster und eine JSON-Darstellung mit Hervorhebung und Formatierung.<br/><br/><a href="https://dbeaver.com/download/">DBeaver PRO ausprobieren</a></p><br/><br/>Sie können einen MongoDB-JDBC-Treiber eines Drittanbieters auf eigenes Risiko verwenden. DBeaver kann weder dessen ordnungsgemäße Funktion mit MongoDB noch eine angemessene Unterstützung der Datenbankfunktionen garantieren.</form>
driver.cassandra.reason = <form><p><span font="header">Der Cassandra-Treiber ist in der Community-Version nicht verfügbar</span><br/><br/>Sie können sich mit den DBeaver-PRO-Produkten Lite, Enterprise, Ultimate und Team Editions mit Cassandra verbinden.<br/><br/>Die PRO-Versionen unterstützen einen Cassandra-Schemabrowser, die Datenansicht und die Ausführung von CQL-Abfragen.<br/><br/><a href="https://dbeaver.com/download/">DBeaver PRO ausprobieren</a></p><br/><br/>Sie können einen Cassandra-Treiber eines Drittanbieters auf eigenes Risiko verwenden.</form>
driver.salesforce.reason = <form><p><span font="header">Der Salesforce-Treiber ist in der Community-Version nicht verfügbar</span><br/><br/>Sie können sich mit den DBeaver-PRO-Produkten Lite, Enterprise, Ultimate und Team Editions mit Salesforce verbinden.<br/><br/>In den PRO-Versionen verwenden wir einen vom DBeaver-Team entwickelten erweiterten Salesforce-Treiber für bestmögliche Kompatibilität und Leistung. Der Treiber ist auf die aktuelle Funktionalität der Salesforce-Plattform ausgerichtet und bietet ausschließlich lesenden Zugriff auf Daten. Er ermöglicht die Verwendung von SOQL zum Abfragen von Salesforce-Daten.<br/><br/><a href="https://dbeaver.com/download/">PRO-Version herunterladen</a></p><br/><br/>Alternativ können Sie einen JDBC-Treiber eines Drittanbieters herunterladen. Aufgrund des eingeschränkten Funktionsumfangs empfehlen wir dies jedoch nicht.</form>
driver.couchbase.reason = <form><p><span font="header">Der Couchbase-Treiber ist in der Community-Version nicht verfügbar</span><br/><br/>Sie können sich mit den DBeaver-PRO-Produkten Lite, Enterprise, Ultimate und Team Editions mit Couchbase verbinden.<br/><br/>Die PRO-Versionen ermöglichen das Anzeigen und Bearbeiten von Daten in Couchbase-Buckets im Tabellenformat, die direkte Arbeit mit JSON-Dokumenten und die Verwendung von N1QL.<br/><br/><a href="https://dbeaver.com/download/">PRO-Version herunterladen</a></p><br/><br/>Alternativ können Sie einen JDBC-Treiber eines Drittanbieters herunterladen. Aufgrund des eingeschränkten Funktionsumfangs empfehlen wir dies jedoch nicht.</form>
driver.redis.reason = <form><p><span font="header">Der Redis-Treiber ist in der Community-Version nicht verfügbar</span><br/><br/>Sie können sich mit den DBeaver-PRO-Produkten Lite, Enterprise, Ultimate und Team Editions mit Redis verbinden.<br/><br/>Die PRO-Versionen unterstützen den Redis-Schlüsselbrowser, eine Schlüssel-Wert-Ansicht und eine Befehlsshell. Sie können Abfragen mit Redis-Befehlen oder LUA-Skripten ausführen.<br/><br/><a href="https://dbeaver.com/download/">PRO-Version herunterladen</a></p><br/><br/>Alternativ können Sie einen JDBC-Treiber eines Drittanbieters herunterladen. Aufgrund des eingeschränkten Funktionsumfangs empfehlen wir dies jedoch nicht.</form>
driver.timestream.reason = <form><p><span font="header">Der Timestream-Treiber ist in der Community-Version nicht verfügbar</span><br/><br/>Sie können sich mit den DBeaver-PRO-Produkten Lite, Enterprise, Ultimate und Team Editions mit Timestream verbinden.<br/><br/>Die PRO-Versionen unterstützen die Anzeige von Zeitreihendaten und ermöglichen das Anzeigen von Timestream-Schemata, -Tabellen und -Spalten sowie den Datenexport.<br/><br/><a href="https://dbeaver.com/download/">PRO-Version herunterladen</a></p><br/><br/>Alternativ können Sie einen JDBC-Treiber eines Drittanbieters herunterladen. Aufgrund des eingeschränkten Funktionsumfangs empfehlen wir dies jedoch nicht.</form>
driver.neo4j.reason = <form><p><span font="header">Der Neo4j-Treiber ist in der Community-Version nicht verfügbar</span><br/><br/>Verbinden Sie sich mit den DBeaver-PRO-Produkten Lite, Enterprise, Ultimate und Team Editions mit Neo4j.<br/><br/>Mit den PRO-Versionen können Sie Neo4j-Dokumente anzeigen und mit der Abfragesprache Cypher abfragen.<br/><br/><a href="https://dbeaver.com/download/">PRO-Version herunterladen</a></p><br/><br/>Alternativ können Sie einen JDBC-Treiber eines Drittanbieters herunterladen. Aufgrund des eingeschränkten Funktionsumfangs empfehlen wir dies jedoch nicht.</form>
