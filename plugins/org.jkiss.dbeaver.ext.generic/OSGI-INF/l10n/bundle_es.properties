driver.odbc.deprecation.reason = <form><p>\
<span font="header">El controlador ODBC antiguo está obsoleto</span><br/><br/>\
Se eliminó en <b>Community Edition 23.1</b>.<br/><br/>\
<span font="header">Motivos de su eliminación</span><br/></p>\
<li>Los usuarios de DBeaver encontraron numerosos problemas con el controlador ODBC antiguo relacionados con controladores desactualizados, y el equipo de DBeaver no podía solucionarlos.</li>\
<li>Este controlador ODBC se basa en la versión obsoleta de Java 7.</li>\
<li>No funciona en Linux ni macOS, y esto no se puede mejorar.</li><p><br/>\
<span font="header">Próximos pasos</span><br/><br/>\
Puede utilizar el controlador ODBC creado por el equipo de DBeaver en la versión PRO o descargar el controlador ODBC antiguo bajo su propia responsabilidad.<br/><br/>\
<a href="https://dbeaver.com/docs/dbeaver/Deprecated-legacy-ODBC-driver/">Más información sobre el controlador ODBC antiguo obsoleto</a></p></form>
