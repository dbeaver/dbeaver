driver.mongodb.reason = <form><p>\
<span font="header">El controlador de MongoDB no está disponible en la versión Community</span><br/><br/>\
Puede conectarse a MongoDB mediante los productos DBeaver PRO: Lite, Enterprise, Ultimate y Team Editions.<br/><br/>\
En las versiones PRO utilizamos un controlador avanzado de MongoDB creado por el equipo de DBeaver para ofrecer la mejor compatibilidad y rendimiento. Permite explorar las colecciones de MongoDB en una cuadrícula de datos y utilizar una representación JSON con resaltado y formato.<br/><br/>\
<a href="https://dbeaver.com/download/">Pruebe DBeaver PRO</a></p><br/><br/>\
Puede utilizar un controlador JDBC de MongoDB de terceros bajo su propia responsabilidad. DBeaver no puede garantizar que estos controladores funcionen correctamente con MongoDB ni que ofrezcan un nivel de compatibilidad aceptable con las funciones de la base de datos.</form>
driver.cassandra.reason = <form><p>\
<span font="header">El controlador de Cassandra no está disponible en la versión Community</span><br/><br/>\
Puede conectarse a Cassandra mediante los productos DBeaver PRO: Lite, Enterprise, Ultimate y Team Editions.<br/><br/>\
Las versiones PRO incluyen un navegador de esquemas de Cassandra, un visor de datos y ejecución de consultas CQL.<br/><br/>\
<a href="https://dbeaver.com/download/">Pruebe DBeaver PRO</a></p><br/><br/>\
Puede utilizar un controlador de Cassandra de terceros bajo su propia responsabilidad.</form>
driver.salesforce.reason = <form><p>\
<span font="header">El controlador de Salesforce no está disponible en la versión Community</span><br/><br/>\
Puede conectarse a Salesforce mediante los productos DBeaver PRO: Lite, Enterprise, Ultimate y Team Editions.<br/><br/>\
En las versiones PRO utilizamos un controlador avanzado de Salesforce creado por el equipo de DBeaver para ofrecer la mejor compatibilidad y rendimiento. El controlador está diseñado teniendo en cuenta las funciones actuales de la plataforma Salesforce y se centra exclusivamente en la lectura de datos. Permite utilizar SOQL para consultar datos de Salesforce.<br/><br/>\
<a href="https://dbeaver.com/download/">Descargar la versión PRO</a></p><br/><br/>\
También puede descargar un controlador JDBC de terceros. Sin embargo, no lo recomendamos debido a sus funciones limitadas.</form>
driver.couchbase.reason = <form><p>\
<span font="header">El controlador de Couchbase no está disponible en la versión Community</span><br/><br/>\
Puede conectarse a Couchbase mediante los productos DBeaver PRO: Lite, Enterprise, Ultimate y Team Editions.<br/><br/>\
Las versiones PRO permiten ver y editar datos de los buckets de Couchbase en formato de tabla, trabajar directamente con documentos JSON y utilizar N1QL.<br/><br/>\
<a href="https://dbeaver.com/download/">Descargar la versión PRO</a></p><br/><br/>\
También puede descargar un controlador JDBC de terceros. Sin embargo, no lo recomendamos debido a sus funciones limitadas.</form>
driver.redis.reason = <form><p>\
<span font="header">El controlador de Redis no está disponible en la versión Community</span><br/><br/>\
Puede conectarse a Redis mediante los productos DBeaver PRO: Lite, Enterprise, Ultimate y Team Editions.<br/><br/>\
Las versiones PRO incluyen un navegador de claves de Redis, un visor de claves y valores y una consola de comandos. Puede ejecutar consultas mediante comandos de Redis o scripts LUA.<br/><br/>\
<a href="https://dbeaver.com/download/">Descargar la versión PRO</a></p><br/><br/>\
También puede descargar un controlador JDBC de terceros. Sin embargo, no lo recomendamos debido a sus funciones limitadas.</form>
