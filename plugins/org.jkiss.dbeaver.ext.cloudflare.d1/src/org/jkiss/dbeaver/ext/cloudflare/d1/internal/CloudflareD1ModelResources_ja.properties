task_administration = Cloudflare D1 の管理
value_none = なし
error_cancelled = D1 の操作はキャンセルされました。変更操作を再試行する前に、データベースの状態を更新してください。
error_timeout = D1 のリクエストがタイムアウトしました。変更操作を再試行する前に、データベースの状態を更新してください。
error_authentication = Cloudflare が認証を拒否しました (HTTP 401)。アカウント ID と API トークンを確認してください。
error_permission = Cloudflare がアクセスを拒否しました。API トークンのデータベーススコープと、D1 Read または D1 Write 権限を確認してください。
error_not_found = D1 データベースが見つかりません。データベース一覧を更新し、選択した UUID を確認してください。
error_rate_limit = Cloudflare のリクエストレート制限に達しました (HTTP 429)。しばらく待ってから再試行してください。
error_request = D1 のリクエストに失敗しました。接続、選択したデータベース、操作のパラメーターを確認してください。
