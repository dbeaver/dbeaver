task_administration = Адміністрування Cloudflare D1
value_none = немає
error_cancelled = Операцію D1 скасовано. Оновіть стан бази даних, перш ніж повторювати операцію зміни.
error_timeout = Час очікування запиту D1 вичерпано. Оновіть стан бази даних, перш ніж повторювати операцію зміни.
error_authentication = Cloudflare відхилив автентифікацію (HTTP 401). Перевірте ID облікового запису та токен API.
error_permission = Cloudflare відмовив у доступі. Перевірте область доступу токена API до баз даних і дозволи D1 Read або D1 Write.
error_not_found = Базу даних D1 не знайдено. Оновіть список баз даних і перевірте вибраний UUID.
error_rate_limit = Cloudflare обмежив частоту запитів (HTTP 429). Зачекайте перед повторною спробою.
error_request = Не вдалося виконати запит D1. Перевірте з’єднання, вибрану базу даних і параметри операції.
