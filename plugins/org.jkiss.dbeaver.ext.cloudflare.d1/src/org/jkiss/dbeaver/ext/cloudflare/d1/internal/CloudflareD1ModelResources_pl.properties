task_administration = Administracja Cloudflare D1
value_none = brak
error_cancelled = Operacja D1 została anulowana. Odśwież stan bazy danych przed ponowieniem operacji modyfikującej dane.
error_timeout = Przekroczono limit czasu żądania D1. Odśwież stan bazy danych przed ponowieniem operacji modyfikującej dane.
error_authentication = Cloudflare odrzucił uwierzytelnienie (HTTP 401). Sprawdź ID konta i token API.
error_permission = Cloudflare odmówił dostępu. Sprawdź zakres baz danych tokenu API i uprawnienia D1 Read lub D1 Write.
error_not_found = Nie znaleziono bazy danych D1. Odśwież listę baz danych i sprawdź wybrany UUID.
error_rate_limit = Cloudflare ograniczył częstotliwość żądań (HTTP 429). Poczekaj przed ponowieniem próby.
error_request = Żądanie D1 nie powiodło się. Sprawdź łączność, wybraną bazę danych i parametry operacji.
