task_administration=Administration de Cloudflare D1
value_none=aucun
error_cancelled=L'opération D1 a été annulée. Actualisez l'état de la base de données avant de réessayer une modification.
error_timeout=Le délai de la requête D1 a expiré. Actualisez l'état de la base de données avant de réessayer une modification.
error_authentication=Cloudflare a refusé l'authentification (HTTP 401). Vérifiez l'identifiant du compte et le jeton d'API.
error_permission=Cloudflare a refusé l'accès. Vérifiez la portée du jeton d'API pour la base de données et les autorisations D1 Read ou D1 Write.
error_not_found=La base de données D1 est introuvable. Actualisez la liste des bases de données et vérifiez l'UUID sélectionné.
error_rate_limit=Cloudflare a limité le débit des requêtes (HTTP 429). Patientez avant de réessayer.
error_request=La requête D1 a échoué. Vérifiez la connectivité, la base de données sélectionnée et les paramètres de l'opération.
