task_administration = Amministrazione di Cloudflare D1
value_none = nessuno
error_cancelled = L'operazione D1 è stata annullata. Aggiornare lo stato del database prima di riprovare una modifica.
error_timeout = La richiesta D1 è scaduta. Aggiornare lo stato del database prima di riprovare una modifica.
error_authentication = Cloudflare ha rifiutato l'autenticazione (HTTP 401). Verificare l'ID account e il token API.
error_permission = Cloudflare ha negato l'accesso. Verificare l'ambito dei database del token API e le autorizzazioni D1 Read o D1 Write.
error_not_found = Il database D1 non è stato trovato. Aggiornare l'elenco dei database e verificare l'UUID selezionato.
error_rate_limit = Cloudflare ha limitato la frequenza delle richieste (HTTP 429). Attendere prima di riprovare.
error_request = La richiesta D1 non è riuscita. Verificare la connettività, il database selezionato e i parametri dell'operazione.
