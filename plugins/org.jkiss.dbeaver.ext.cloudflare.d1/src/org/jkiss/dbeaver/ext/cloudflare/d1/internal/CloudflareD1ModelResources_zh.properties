task_administration = Cloudflare D1 管理
value_none = 无
error_cancelled = D1 操作已取消。重试修改操作前，请先刷新数据库状态。
error_timeout = D1 请求超时。重试修改操作前，请先刷新数据库状态。
error_authentication = Cloudflare 拒绝了身份验证（HTTP 401）。请检查帐户 ID 和 API 令牌。
error_permission = Cloudflare 拒绝访问。请检查 API 令牌的数据库作用域以及 D1 Read 或 D1 Write 权限。
error_not_found = 找不到 D1 数据库。请刷新数据库列表并检查选中的 UUID。
error_rate_limit = Cloudflare 对请求进行了速率限制（HTTP 429）。请稍后重试。
error_request = D1 请求失败。请检查网络连接、选中的数据库和操作参数。
