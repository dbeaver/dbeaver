task_administration = Cloudflare-D1-Verwaltung
value_none = keine
error_cancelled = Der D1-Vorgang wurde abgebrochen. Aktualisieren Sie den Datenbankzustand, bevor Sie eine Änderung erneut versuchen.
error_timeout = Zeitüberschreitung bei der D1-Anfrage. Aktualisieren Sie den Datenbankzustand, bevor Sie eine Änderung erneut versuchen.
error_authentication = Cloudflare hat die Authentifizierung abgelehnt (HTTP 401). Prüfen Sie die Konto-ID und das API-Token.
error_permission = Cloudflare hat den Zugriff verweigert. Prüfen Sie den Datenbank-Geltungsbereich des API-Tokens und die Berechtigungen D1 Read oder D1 Write.
error_not_found = Die D1-Datenbank wurde nicht gefunden. Aktualisieren Sie die Datenbankliste und prüfen Sie die ausgewählte UUID.
error_rate_limit = Cloudflare hat die Anfragerate begrenzt (HTTP 429). Warten Sie vor einem erneuten Versuch.
error_request = Die D1-Anfrage ist fehlgeschlagen. Prüfen Sie die Verbindung, die ausgewählte Datenbank und die Vorgangsparameter.
