task_administration = Cloudflare D1 管理
value_none = 無
error_cancelled = D1 操作已取消。重試修改操作前，請重新整理資料庫狀態。
error_timeout = D1 要求逾時。重試修改操作前，請重新整理資料庫狀態。
error_authentication = Cloudflare 拒絕驗證 (HTTP 401)。請檢查帳戶 ID 及 API 權杖。
error_permission = Cloudflare 拒絕存取。請檢查 API 權杖的資料庫範圍，以及 D1 Read 或 D1 Write 權限。
error_not_found = 找不到 D1 資料庫。請重新整理資料庫清單，並檢查選取的 UUID。
error_rate_limit = Cloudflare 限制了要求頻率 (HTTP 429)。請稍候再試。
error_request = D1 要求失敗。請檢查連線、選取的資料庫及操作參數。
