task_administration = Cloudflare D1 관리
value_none = 없음
error_cancelled = D1 작업이 취소되었습니다. 데이터를 변경하는 작업을 다시 시도하기 전에 데이터베이스 상태를 새로 고치세요.
error_timeout = D1 요청 시간이 초과되었습니다. 데이터를 변경하는 작업을 다시 시도하기 전에 데이터베이스 상태를 새로 고치세요.
error_authentication = Cloudflare에서 인증을 거부했습니다 (HTTP 401). 계정 ID와 API 토큰을 확인하세요.
error_permission = Cloudflare에서 접근을 거부했습니다. API 토큰의 데이터베이스 범위와 D1 Read 또는 D1 Write 권한을 확인하세요.
error_not_found = D1 데이터베이스를 찾을 수 없습니다. 데이터베이스 목록을 새로 고치고 선택한 UUID를 확인하세요.
error_rate_limit = Cloudflare에서 요청 빈도를 제한했습니다 (HTTP 429). 잠시 후 다시 시도하세요.
error_request = D1 요청에 실패했습니다. 연결 상태, 선택한 데이터베이스 및 작업 매개변수를 확인하세요.
