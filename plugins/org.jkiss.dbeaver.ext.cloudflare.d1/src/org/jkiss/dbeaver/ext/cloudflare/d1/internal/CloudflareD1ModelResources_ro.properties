task_administration = Administrare Cloudflare D1
value_none = niciunul
error_cancelled = Operația D1 a fost anulată. Reîmprospătați starea bazei de date înainte de a reîncerca o modificare.
error_timeout = Solicitarea D1 a expirat. Reîmprospătați starea bazei de date înainte de a reîncerca o modificare.
error_authentication = Cloudflare a respins autentificarea (HTTP 401). Verificați ID-ul contului și tokenul API.
error_permission = Cloudflare a refuzat accesul. Verificați domeniul de baze de date al tokenului API și permisiunile D1 Read sau D1 Write.
error_not_found = Baza de date D1 nu a fost găsită. Reîmprospătați lista bazelor de date și verificați UUID-ul selectat.
error_rate_limit = Cloudflare a limitat frecvența solicitărilor (HTTP 429). Așteptați înainte de a reîncerca.
error_request = Solicitarea D1 a eșuat. Verificați conectivitatea, baza de date selectată și parametrii operației.
