task_administration = Administración de Cloudflare D1
value_none = ninguno
error_cancelled = Se canceló la operación de D1. Actualice el estado de la base de datos antes de reintentar una modificación.
error_timeout = Se agotó el tiempo de espera de la solicitud de D1. Actualice el estado de la base de datos antes de reintentar una modificación.
error_authentication = Cloudflare rechazó la autenticación (HTTP 401). Compruebe el ID de cuenta y el token de API.
error_permission = Cloudflare denegó el acceso. Compruebe el ámbito de bases de datos del token de API y los permisos D1 Read o D1 Write.
error_not_found = No se encontró la base de datos de D1. Actualice la lista de bases de datos y compruebe el UUID seleccionado.
error_rate_limit = Cloudflare limitó la frecuencia de solicitudes (HTTP 429). Espere antes de volver a intentarlo.
error_request = Falló la solicitud de D1. Compruebe la conectividad, la base de datos seleccionada y los parámetros de la operación.
