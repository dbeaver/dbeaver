task_administration = Administração do Cloudflare D1
value_none = nenhum
error_cancelled = A operação do D1 foi cancelada. Atualize o estado do banco de dados antes de tentar uma alteração novamente.
error_timeout = O tempo limite da solicitação do D1 foi excedido. Atualize o estado do banco de dados antes de tentar uma alteração novamente.
error_authentication = O Cloudflare rejeitou a autenticação (HTTP 401). Verifique o ID da conta e o token da API.
error_permission = O Cloudflare negou o acesso. Verifique o escopo de bancos de dados do token da API e as permissões D1 Read ou D1 Write.
error_not_found = O banco de dados D1 não foi encontrado. Atualize a lista de bancos de dados e verifique o UUID selecionado.
error_rate_limit = O Cloudflare limitou a taxa da solicitação (HTTP 429). Aguarde antes de tentar novamente.
error_request = A solicitação do D1 falhou. Verifique a conectividade, o banco de dados selecionado e os parâmetros da operação.
