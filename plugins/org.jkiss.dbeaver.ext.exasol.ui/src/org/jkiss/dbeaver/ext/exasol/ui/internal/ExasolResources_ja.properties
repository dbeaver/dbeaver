connection_page_checkbox_legacy_encrypt_tip = Exasol が提供する 7.1 ドライバーで作成した接続は、データベースのバージョンにかかわらず、まず Exasol への TLS 接続を試みます。\nこのため、証明書が適切に設定されていない場合、7.1 ドライバーでいずれのバージョンのデータベースに接続する場合も対応が必要です。エラーメッセージのフィンガープリントをドライバープロパティー `fingerprint` にコピーして再接続するか、従来の暗号化 (このオプション) を使用してください。\nデータベースが TLS を完全にサポートしていない場合 (6.2.15 未満および 7.0.10 未満)、ドライバーは ChaCha20 で再接続します。
