connection_page_checkbox_legacy_encrypt_tip = Wszystkie połączenia tworzone sterownikami Exasol 7.1 najpierw próbują nawiązać połączenie TLS z Exasol, niezależnie od wersji bazy danych.\nOznacza to, że użycie sterownika 7.1 z dowolną wersją bazy wymaga dodatkowych kroków, jeśli nie masz prawidłowo skonfigurowanych certyfikatów. Możesz skopiować odcisk z komunikatu błędu do właściwości sterownika `fingerprint` i połączyć ponownie lub użyć starszego szyfrowania (ta opcja).\nJeśli baza danych nie obsługuje w pełni TLS (wersje < 6.2.15 i < 7.0.10), sterownik połączy się ponownie z użyciem ChaCha20.
