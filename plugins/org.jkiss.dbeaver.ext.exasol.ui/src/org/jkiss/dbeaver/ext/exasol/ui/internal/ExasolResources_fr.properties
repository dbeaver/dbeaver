connection_page_checkbox_legacy_encrypt_tip=Toutes les connexions créées avec les pilotes 7.1 fournis par Exasol tentent d'abord d'établir une connexion TLS à Exasol, quelle que soit la version de la base de données.\nCela signifie que l'utilisation d'un pilote 7.1 avec n'importe quelle version de base de données nécessite une intervention si les certificats ne sont pas correctement configurés. Vous pouvez copier l'empreinte figurant dans le message d'erreur dans la propriété de pilote `fingerprint`, puis vous reconnecter, ou utiliser l'ancien chiffrement (cette option).\nSi la base de données ne prend pas entièrement en charge TLS (versions < 6.2.15 et < 7.0.10), le pilote se reconnectera avec ChaCha20.
