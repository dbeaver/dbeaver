connection_page_checkbox_legacy_encrypt_tip = Alle Verbindungen mit den von Exasol bereitgestellten Treibern der Version 7.1 versuchen unabhängig von der Datenbankversion zunächst, eine TLS-Verbindung zu Exasol herzustellen.\nWenn Sie keine ordnungsgemäß konfigurierten Zertifikate haben, müssen Sie daher bei Verwendung eines 7.1-Treibers für jede Datenbankversion Maßnahmen zum Verbindungsaufbau ergreifen. Sie können den Fingerabdruck aus der Fehlermeldung in die Treibereigenschaft `fingerprint` kopieren und erneut verbinden oder die ältere Verschlüsselung verwenden (diese Option).\nWenn die Datenbank TLS nicht vollständig unterstützt (Versionen < 6.2.15 und < 7.0.10), stellt der Treiber die Verbindung mit ChaCha20 erneut her.
