connection_page_checkbox_legacy_encrypt_tip = Tutte le connessioni create con i driver 7.1 forniti da Exasol tentano prima di stabilire connessioni TLS a Exasol, indipendentemente dalla versione del database.\nUsando un driver 7.1 per connettersi a qualsiasi versione del database, se i certificati non sono configurati correttamente è necessario intervenire. È possibile copiare l'impronta dal messaggio di errore nella proprietà del driver `fingerprint` e riconnettersi, oppure usare la cifratura precedente (questa opzione).\nSe il database non supporta completamente TLS (versioni < 6.2.15 e < 7.0.10), il driver si riconnetterà con ChaCha20.
