connection_page_checkbox_legacy_encrypt_tip = Todas as conexões criadas com os drivers 7.1 fornecidos pelo Exasol tentarão estabelecer conexões TLS com o Exasol primeiro, independentemente da versão do banco de dados.\nIsso significa que usar um driver 7.1 para conectar a qualquer versão do banco de dados exige uma ação sua caso os certificados não estejam configurados corretamente. Você pode copiar a impressão digital da mensagem de erro para a propriedade `fingerprint` do driver e reconectar ou usar a criptografia legada (esta opção).\nSe o banco de dados não oferecer suporte completo a TLS (versões < 6.2.15 e < 7.0.10), o driver reconectará usando ChaCha20.
