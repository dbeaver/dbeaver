connection_page_checkbox_legacy_encrypt_tip = Exasol에서 제공하는 7.1 드라이버로 만든 모든 연결은 데이터베이스 버전에 관계없이 먼저 Exasol에 TLS 연결을 시도합니다.\n따라서 인증서가 올바르게 구성되지 않은 경우 7.1 드라이버로 어떤 버전의 데이터베이스에 연결하든 추가 조치가 필요합니다. 오류 메시지의 지문을 `fingerprint` 드라이버 속성에 복사하고 다시 연결하거나 기존 암호화 (이 옵션)를 사용할 수 있습니다.\n데이터베이스가 TLS를 완전히 지원하지 않으면 (6.2.15 미만 및 7.0.10 미만 버전) 드라이버는 ChaCha20으로 다시 연결합니다.
