connection_page_checkbox_legacy_encrypt_tip = 使用 Exasol 提供的 7.1 驅動程式建立的所有連線，無論資料庫版本為何，都會先嘗試以 TLS 連線至 Exasol。\n這表示使用 7.1 驅動程式連線至任何版本的資料庫時，若未正確設定憑證，您就需要採取額外措施才能連線。您可以將錯誤訊息中的指紋複製到 `fingerprint` 驅動程式屬性並重新連線，或使用舊版加密（此選項）。\n若資料庫未完全支援 TLS（版本 < 6.2.15 及 < 7.0.10），驅動程式會改以 ChaCha20 重新連線。
