connection_page_checkbox_legacy_encrypt_tip = Todas las conexiones creadas con los controladores 7.1 de Exasol intentarán primero establecer conexiones TLS con Exasol, independientemente de la versión de la base de datos.\nEsto significa que, al usar un controlador 7.1 para conectarse a cualquier versión de base de datos, debe tomar medidas si los certificados no están configurados correctamente. Puede copiar la huella del mensaje de error a la propiedad `fingerprint` del controlador y volver a conectarse, o usar el cifrado heredado (esta opción).\nSi la base de datos no admite TLS por completo (versiones < 6.2.15 y < 7.0.10), el controlador volverá a conectarse con ChaCha20.
