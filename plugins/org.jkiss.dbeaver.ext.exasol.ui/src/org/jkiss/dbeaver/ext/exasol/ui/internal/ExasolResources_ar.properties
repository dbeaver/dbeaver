connection_page_checkbox_legacy_encrypt_tip=تحاول جميع الاتصالات المنشأة باستخدام برامج تشغيل Exasol 7.1 إنشاء اتصالات TLS مع Exasol أولًا، بصرف النظر عن إصدار قاعدة البيانات.\nيعني ذلك أن استخدام برنامج تشغيل 7.1 للاتصال بأي إصدار لقاعدة البيانات يتطلب إجراءً منك إذا لم تكن الشهادات مكوّنة بصورة صحيحة. يمكنك نسخ البصمة من رسالة الخطأ إلى خاصية برنامج التشغيل `fingerprint` وإعادة الاتصال، أو استخدام التشفير القديم (هذا الخيار).\nإذا لم تدعم قاعدة البيانات TLS بالكامل (الإصدارات < 6.2.15 و< 7.0.10)، فسيعيد برنامج التشغيل الاتصال باستخدام ChaCha20.
