dialog_connection_database = 데이터베이스
dialog_connection_host = 호스트
dialog_connection_jdbc_url = JDBC URL
dialog_connection_port = 포트
dialog_connection_settings_group = Tibero
dialog_connection_tibero_properties = Tibero 속성
dialog_connection_tibero_properties_description = Tibero 연결 속성
dialog_controlgroup_content = 컨텐츠
dialog_controlgroup_navigator = 내비게이터
dialog_controlgroup_source_editor = 소스 편집기
edit_checkbox_compile_package_after_save = 저장 후 패키지 컴파일
edit_checkbox_compile_package_after_save_description = 패키지 편집기에서 소스를 저장한 후 Tibero 패키지 명세/본문을 컴파일합니다.
edit_checkbox_hide_empty_schemas = 빈 스키마 숨기기
edit_checkbox_hide_empty_schemas_description = 데이터베이스 내비게이터에서 객체가 없는 스키마를 숨깁니다.
edit_checkbox_read_column_comments = 컬럼 주석 읽기
edit_checkbox_read_column_comments_description = 테이블 컬럼을 로드할 때 Tibero 카탈로그 뷰에서 컬럼 주석을 읽습니다.
edit_checkbox_recompile_body_on_spec_save = 명세 저장 시 패키지 본문 재컴파일
edit_checkbox_recompile_body_on_spec_save_description = 패키지 명세를 저장할 때 ALTER PACKAGE ... COMPILE BODY도 실행하여 본문을 VALID 상태로 되돌립니다.
edit_checkbox_show_only_one_schema = 접속 사용자 스키마만 표시
edit_checkbox_show_only_one_schema_description = 데이터베이스 내비게이터에서 접속 사용자에 해당하는 스키마만 표시합니다.
edit_checkbox_show_schema_index_table_description = 스키마 인덱스에 테이블 이름 표시
edit_checkbox_show_schema_index_table_description_description = 스키마 수준 인덱스 폴더에서 소유 테이블 이름을 내비게이터 객체 설명으로 표시합니다.
edit_checkbox_show_schema_table_description = 테이블 설명 표시
edit_checkbox_show_schema_table_description_description = 스키마 수준 테이블/뷰 폴더에서 테이블/뷰 주석을 내비게이터 객체 설명으로 표시합니다.
edit_checkbox_show_schema_trigger_table_description = 스키마 트리거에 테이블 이름 표시
edit_checkbox_show_schema_trigger_table_description_description = 스키마 수준 테이블 트리거 폴더에서 소유 테이블 이름을 내비게이터 객체 설명으로 표시합니다.
