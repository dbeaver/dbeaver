apiVersion: v1
kind: Pod
metadata:
  labels:
    app: jenkins-slave
  namespace: 'jenkins'
spec:
  containers:
  - name: 'jnlp'
    image: '192.168.4.143/jenkins/centos7.0-compile:dbeaver'
    imagePullPolicy: 'Always'
    command:
    - 'bash'
    args:
    - '/usr/bin/jenkins-slave'
    resources:
      requests:
        memory: '16000Mi'
        cpu: 4
      limits:
        memory: '32000Mi'
        cpu: 8
    tty: true
    volumeMounts:
    - mountPath: "/var/lib/jenkins/k8s_machine.info"
      name: "volume-0"
      readOnly: false
    - mountPath: "/var/lib/jenkins/k8s_machine.log"
      name: "volume-1"
      readOnly: false
    - mountPath: "/usr/bin/kubectl"
      name: "volume-2"
      readOnly: false
    - mountPath: "/var/lib/jenkins/workspace/tpc-h"
      name: "volume-3"
      readOnly: true
    - mountPath: "/data/ci_project_backup"
      name: "volume-4"
      readOnly: false
    - mountPath: "/data/corefiles"
      name: "volume-5"
      readOnly: false
    - mountPath: "/dev/shm"
      name: "volume-6"
      readOnly: false
    - mountPath: "/var/lib/jenkins/.kube/config"
      name: "volume-7"
      readOnly: false
    workingDir: "/var/lib/jenkins"
  dnsPolicy: "Default"
  hostNetwork: false
  nodeSelector:
    nodetype6: "jjfa"
  restartPolicy: "Never"
  serviceAccountName: "jenkins"
  volumes:
  - hostPath:
      path: "/var/lib/jenkins/k8s_machine.info"
    name: "volume-0"
  - hostPath:
      path: "/usr/bin/kubectl"
    name: "volume-2"
  - hostPath:
      path: "/var/lib/jenkins/k8s_machine.log"
    name: "volume-1"
  - hostPath:
      path: "/var/lib/jenkins/.kube/config"
    name: "volume-7"
  - hostPath:
      path: "/data/ci_project_backup"
    name: "volume-4"
  - hostPath:
      path: "/ssd_data/tpc-h"
    name: "volume-3"
  - emptyDir:
      medium: "Memory"
    name: "volume-6"
  - hostPath:
      path: "/data/corefiles"
    name: "volume-5"
