name: dbeaver-ce
summary: Universal Database Manager and SQL Client
description: |
  Free multi-platform database tool for developers, SQL programmers, database administrators and analysts. Supports all popular databases: MySQL PostgreSQL, MariaDB, SQLite, Oracle, DB2, SQL Server, Sybase, MS Access, Teradata, Firebird, Derby, etc.
grade: stable
adopt-info: dbeaver-ce

base: core22
confinement: classic
architectures:
- build-on: [amd64]
  build-for: [amd64]
- build-on: [amd64]
  build-for: [arm64]

apps:
  dbeaver-ce:
    command: usr/share/dbeaver-ce/dbeaver
    common-id: dbeaver
    desktop: usr/share/applications/dbeaver-ce.desktop
    environment:
      _JAVA_OPTIONS: -Duser.home=$SNAP_USER_DATA 
      # Fixes occasional crashes on various WMs
      NO_AT_BRIDGE: 1

parts:
  dbeaver-ce:
    source: 
      - on amd64 to amd64: dbeaver-ce-latest-linux-x86_64.deb
      - on amd64 to arm64: dbeaver-ce-latest-linux-aarch64.deb
    plugin: dump
    build-packages:
      - ca-certificates
      - ca-certificates-java
      - libgtk-3-dev
    stage-packages:
      - libxss1
      - libgconf-2-4
      - libcurl4
      - xdg-utils
      - ibus-gtk3
      - libibus-1.0-5
      - libwebkit2gtk-4.0-37
      - libgtk-3-0
    override-pull: |
      snapcraftctl pull
      # Removes NO_AT_BRIDGE=1 from the source .desktop file; it's set for the snap app itself
      sed -i.bak -e 's|env NO_AT_BRIDGE=1 ||g' $SNAPCRAFT_PART_SRC/usr/share/applications/dbeaver-ce.desktop
    override-build: |
      set -e
      snapcraftctl build
      # The DEB version includes the hotfix part, which is not an OSGi bundle version component.
      case "$SNAPCRAFT_TARGET_ARCH" in
        amd64) DEB_ARCH=x86_64 ;;
        arm64) DEB_ARCH=aarch64 ;;
        *) echo "Unsupported architecture: $SNAPCRAFT_TARGET_ARCH" >&2; exit 1 ;;
      esac
      VERSION=$(dpkg-deb --field "$SNAPCRAFT_PROJECT_DIR/dbeaver-ce-latest-linux-$DEB_ARCH.deb" Version)
      snapcraftctl set-version "$VERSION"
      LD_BIND_NOW=1
    override-prime: |
      snapcraftctl prime
      rm -vf usr/lib/jvm/java-*/lib/security/blacklisted.certs

