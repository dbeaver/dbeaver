[libdefaults]
    default_realm = AD7065.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    rdns = false
    dns_canonicalize_hostname = false
    udp_preference_limit = 1

[realms]
    AD7065.TEST = {
        kdc = dc.ad7065.test
        admin_server = dc.ad7065.test
    }

[domain_realm]
    .ad7065.test = AD7065.TEST
    ad7065.test = AD7065.TEST
