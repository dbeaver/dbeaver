services:
  dc:
    build:
      context: .
      dockerfile: Dockerfile.dc
    hostname: dc.ad7065.test
    environment:
      LAB_ADMIN_PASSWORD: ${LAB_ADMIN_PASSWORD:?Run ./lab.sh up first}
      LAB_SERVICE_PASSWORD: ${LAB_SERVICE_PASSWORD:?}
      LAB_USER_PASSWORD: ${LAB_USER_PASSWORD:?}
    volumes:
      - dc-data:/var/lib/samba
      - dc-config:/etc/samba
      - sql-secrets:/lab-secrets
      - ./bootstrap-domain.sh:/lab/bootstrap-domain.sh:ro
    networks:
      domain:
        ipv4_address: 172.30.70.10
        aliases: [dc.ad7065.test, ad7065.test, AD7065]
    healthcheck:
      test: [CMD-SHELL, "samba-tool domain info 127.0.0.1 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  sql:
    build:
      context: .
      dockerfile: Dockerfile.sql
    platform: linux/amd64
    hostname: sql.ad7065.test
    mem_limit: 3g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      LAB_USER_PASSWORD: ${LAB_USER_PASSWORD:?}
    ports:
      - 127.0.0.1:17065:1433
    dns: [172.30.70.10]
    dns_search: [ad7065.test]
    extra_hosts:
      - dc.ad7065.test:172.30.70.10
      - sql.ad7065.test:172.30.70.20
    volumes:
      - sql-data:/var/opt/mssql
      - sql-secrets:/var/opt/mssql/secrets:ro
      - ./mssql.conf:/var/opt/mssql/mssql.conf:ro
      - ./krb5.conf:/etc/krb5.conf:ro
      - ./bootstrap.sql:/lab/bootstrap.sql:ro
      - ./check-access.sh:/lab/check-access.sh:ro
    networks:
      domain:
        ipv4_address: 172.30.70.20
        aliases: [sql.ad7065.test]
    healthcheck:
      test: [CMD-SHELL, "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 40

networks:
  domain:
    ipam:
      config:
        - subnet: 172.30.70.0/24

volumes:
  dc-data:
  dc-config:
  sql-data:
  sql-secrets:
